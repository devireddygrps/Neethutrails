<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Admin Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding-bottom:30px;
}

header{
    background:#ff5722;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:5px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.info{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.info input{
    width:100%;
    padding:11px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
}

.order{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

.table{
    font-size:20px;
    font-weight:bold;
}

.order-id{
    font-size:12px;
    color:#777;
    margin-top:5px;
    word-break:break-all;
}

.total{
    font-size:18px;
    font-weight:bold;
    color:#ff5722;
}

.customer{
    background:#f8f9fa;
    border:1px solid #eee;
    padding:12px;
    border-radius:9px;
    margin-top:12px;
}

.customer-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:8px;
}

.customer-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    font-size:14px;
}

.customer-label{
    color:#777;
}

.customer-value{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.badges{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin:12px 0;
}

.badge{
    padding:6px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
}

.badge.alert{
    background:#ffe0b2;
    color:#e65100;
}

.badge.cash{
    background:#fff3e0;
    color:#e65100;
}

.badge.upi{
    background:#e3f2fd;
    color:#1565c0;
}

.badge.paid{
    background:#dcedc8;
    color:#33691e;
}

.badge.customer{
    background:#e3f2fd;
    color:#1565c0;
}

.item{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:bold;
}

.item-detail{
    font-size:14px;
    color:#666;
    margin-top:4px;
}

.instruction{
    background:#fff8f4;
    padding:7px;
    border-radius:6px;
    font-size:13px;
    margin-top:5px;
}

select,
button{
    width:100%;
    padding:11px;
    border-radius:8px;
    font-size:15px;
}

select{
    border:1px solid #ddd;
    background:white;
    margin-top:8px;
}

button{
    border:none;
    background:#ff5722;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button.secondary{
    background:#333;
}

button.green{
    background:#388e3c;
}

button.blue{
    background:#1976d2;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.bill{
    background:#f7f7f7;
    border:1px dashed #bbb;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.bill-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin:6px 0;
}

.payment-request{
    margin-top:12px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
}

.cash-request{
    background:#fff3e0;
    color:#e65100;
    border:1px solid #ffcc80;
}

.upi-request{
    background:#e3f2fd;
    color:#1565c0;
    border:1px solid #90caf9;
}

.paid-box{
    margin-top:12px;
    padding:14px;
    border-radius:10px;
    background:#e8f5e9;
    color:#2e7d32;
    text-align:center;
    font-weight:bold;
}

.loading,
.empty,
.error{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

.error{
    color:#c62828;
}

.small{
    font-size:12px;
    color:#777;
    margin-top:8px;
}

.status-text{
    display:inline-block;
    margin-top:8px;
    padding:5px 9px;
    background:#eee;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h1 id="restaurantName">
Admin Orders
</h1>

<p>
Orders + Customer Details
</p>

</header>


<div class="container">


<div class="info">

<label>
<b>Restaurant ID</b>
</label>

<input
    id="restaurantId"
    type="text"
    placeholder="Enter restaurant ID"
>

<button onclick="loadOrders()">
Load Orders
</button>

<button
    class="secondary"
    onclick="location.reload()"
>
Refresh
</button>

</div>


<div id="ordersContainer">

<div class="empty">
Enter Restaurant ID and load orders.
</div>

</div>


</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    query,
    orderBy
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* ==========================================
   ELEMENTS
========================================== */

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


const restaurantName =
    document.getElementById(
        "restaurantName"
    );


const restaurantInput =
    document.getElementById(
        "restaurantId"
    );


/* ==========================================
   VARIABLES
========================================== */

let currentRestaurantId = "";

let orders = [];


/* ==========================================
   URL
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const urlRestaurantId =
    params.get(
        "restaurantId"
    );


if(urlRestaurantId){

    restaurantInput.value =
        urlRestaurantId;

}


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            ordersContainer.innerHTML = `

                <div class="error">

                    ❌ Admin login required.

                    <br><br>

                    Please login with the
                    restaurant owner's account.

                </div>

            `;

            return;
        }


        if(!restaurantInput.value){

            restaurantInput.value =
                user.uid;

        }


        currentRestaurantId =
            restaurantInput.value.trim();


        await loadRestaurant();

    }
);


/* ==========================================
   LOAD ORDERS
========================================== */

window.loadOrders =
async function(){

    const user =
        auth.currentUser;


    if(!user){

        alert(
            "Please login first."
        );

        return;
    }


    currentRestaurantId =
        restaurantInput.value.trim();


    if(!currentRestaurantId){

        alert(
            "Enter restaurant ID."
        );

        return;
    }


    if(
        user.uid !==
        currentRestaurantId
    ){

        ordersContainer.innerHTML = `

            <div class="error">

                ❌ Access denied.

                <br><br>

                Login with the restaurant
                owner's account.

            </div>

        `;

        return;
    }


    ordersContainer.innerHTML = `

        <div class="loading">

            ⏳ Loading orders...

        </div>

    `;


    try{

        await loadRestaurant();


        const ordersRef =
            collection(
                db,
                "restaurants",
                currentRestaurantId,
                "orders"
            );


        let snapshot;


        try{

            const orderedQuery =
                query(
                    ordersRef,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            snapshot =
                await getDocs(
                    orderedQuery
                );

        }
        catch(error){

            console.warn(
                "Ordered query failed:",
                error
            );


            snapshot =
                await getDocs(
                    ordersRef
                );

        }


        orders = [];


        snapshot.forEach(
            orderDoc => {

                orders.push({

                    id:
                        orderDoc.id,

                    ...orderDoc.data()

                });

            }
        );


        orders.sort(
            (a,b) => {

                const aTime =
                    getTimestampMillis(
                        a.createdAt
                    );


                const bTime =
                    getTimestampMillis(
                        b.createdAt
                    );


                return bTime - aTime;

            }
        );


        renderOrders();

    }
    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="error">

                ❌ Unable to load orders.

                <br><br>

                ${escapeHTML(
                    error.code || ""
                )}

                <br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

};


/* ==========================================
   RESTAURANT
========================================== */

async function loadRestaurant(){

    try{

        if(!currentRestaurantId){

            currentRestaurantId =
                restaurantInput.value.trim();

        }


        if(!currentRestaurantId){

            return;
        }


        const ref =
            doc(
                db,
                "restaurants",
                currentRestaurantId
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            const data =
                snap.data();


            restaurantName.textContent =
                data.restaurantName ||
                data.name ||
                "Admin Orders";

        }

    }
    catch(error){

        console.error(
            "RESTAURANT ERROR:",
            error
        );

    }

}


/* ==========================================
   RENDER
========================================== */

function renderOrders(){

    ordersContainer.innerHTML = "";


    if(orders.length === 0){

        ordersContainer.innerHTML = `

            <div class="empty">

                🍽️ No orders found.

            </div>

        `;

        return;
    }


    orders.forEach(
        order => {

            ordersContainer.appendChild(
                createOrderCard(order)
            );

        }
    );

}


/* ==========================================
   ORDER CARD
========================================== */

function createOrderCard(order){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order";


    const status =
        order.status ||
        "received";


    const paymentStatus =
        order.paymentStatus ||
        "unpaid";


    const paymentMethod =
        order.paymentMethod ||
        "";


    const customerName =
        order.customerName ||
        "Customer";


    const customerMobile =
        order.customerMobile ||
        order.customerPhone ||
        "";


    const customerUid =
        order.customerUid ||
        "";


    const waiterRequested =
        order.waiterRequested === true ||
        order.waiterCalled === true;


    const billRequested =
        order.billRequested === true;


    const billGenerated =
        order.billGenerated === true ||
        order.billStatus === "generated";


    const cashPaymentRequested =
        order.cashPaymentRequested === true;


    const upiPaymentRequested =
        order.upiPaymentRequested === true;


    const createdText =
        formatDate(
            order.createdAt
        );


    let itemsHTML = "";


    (
        order.items || []
    ).forEach(
        item => {

            const qty =
                Number(
                    item.quantity || 0
                );


            const price =
                Number(
                    item.price || 0
                );


            const lineTotal =
                qty * price;


            itemsHTML += `

                <div class="item">

                    <div class="item-name">

                        ${escapeHTML(
                            item.name ||
                            item.foodName ||
                            "Item"
                        )}

                        × ${qty}

                    </div>


                    <div class="item-detail">

                        ₹${price.toFixed(2)}
                        each —
                        ₹${lineTotal.toFixed(2)}

                    </div>


                    ${
                        item.instruction
                        ?
                        `

                        <div class="instruction">

                            📝
                            ${escapeHTML(
                                item.instruction
                            )}

                        </div>

                        `
                        :
                        ""
                    }

                </div>

            `;

        }
    );


    /* ========================================
       PAYMENT REQUEST HTML
    ======================================== */

    let paymentRequestHTML = "";


    if(
        cashPaymentRequested &&
        paymentStatus !== "paid"
    ){

        paymentRequestHTML = `

            <div class="payment-request cash-request">

                💵 CASH PAYMENT REQUESTED

                <br>

                <span style="
                    font-size:13px;
                    font-weight:normal;
                ">

                    Customer is waiting for
                    waiter to collect cash.

                </span>

                <button
                    class="green cash-complete"
                >

                    ✓ Mark Cash Payment Received

                </button>

            </div>

        `;

    }


    if(
        upiPaymentRequested &&
        paymentStatus !== "paid"
    ){

        paymentRequestHTML += `

            <div class="payment-request upi-request">

                📱 UPI PAYMENT REQUESTED

                <br>

                <span style="
                    font-size:13px;
                    font-weight:normal;
                ">

                    Verify the UPI payment
                    before confirming.

                </span>

            </div>

        `;

    }


    if(paymentStatus === "paid"){

        paymentRequestHTML += `

            <div class="paid-box">

                ✅ PAYMENT COMPLETED

                <br>

                <span style="
                    font-size:13px;
                    font-weight:normal;
                ">

                    Method:
                    ${escapeHTML(
                        paymentMethod ||
                        "Not specified"
                    )}

                </span>

            </div>

        `;

    }


    /* ========================================
       CARD
    ======================================== */

    card.innerHTML = `

        <div class="order-head">

            <div>

                <div class="table">

                    🪑 Table
                    ${escapeHTML(
                        order.table || "-"
                    )}

                </div>


                <div class="order-id">

                    Order ID:
                    ${escapeHTML(
                        order.id
                    )}

                </div>


                <div class="small">

                    ${createdText}

                </div>

            </div>


            <div class="total">

                ₹${Number(
                    order.total || 0
                ).toFixed(2)}

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="customer">

            <div class="customer-title">

                👤 Customer Details

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Name
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerName
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Mobile
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerMobile ||
                        "Not available"
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Customer ID
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerUid ||
                        "Not available"
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Table
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        order.table || "-"
                    )}

                </span>

            </div>

        </div>


        <!-- BADGES -->

        <div class="badges">

            <span class="badge customer">

                👤 ${escapeHTML(
                    customerName
                )}

            </span>


            <span class="badge">

                Status:
                ${escapeHTML(
                    status
                )}

            </span>


            ${
                waiterRequested
                ?
                `

                <span class="badge alert">

                    🔔 Waiter Requested

                </span>

                `
                :
                ""
            }


            ${
                billRequested
                ?
                `

                <span class="badge alert">

                    🧾 Bill Requested

                </span>

                `
                :
                ""
            }


            ${
                billGenerated
                ?
                `

                <span class="badge">

                    🧾 Bill Generated

                </span>

                `
                :
                ""
            }


            ${
                cashPaymentRequested
                ?
                `

                <span class="badge cash">

                    💵 Cash Requested

                </span>

                `
                :
                ""
            }


            ${
                upiPaymentRequested
                ?
                `

                <span class="badge upi">

                    📱 UPI Requested

                </span>

                `
                :
                ""
            }


            ${
                paymentStatus === "paid"
                ?
                `

                <span class="badge paid">

                    ✓ PAID

                </span>

                `
                :
                ""
            }

        </div>


        <!-- ITEMS -->

        <div>

            ${
                itemsHTML ||
                "<div class='item-detail'>No items</div>"
            }

        </div>


        <!-- STATUS -->

        <label>

            <b>
                Order Status
            </b>

        </label>


        <select class="status-select">

            <option value="received">
                Received
            </option>

            <option value="accepted">
                Accepted
            </option>

            <option value="preparing">
                Preparing
            </option>

            <option value="ready">
                Ready
            </option>

            <option value="served">
                Served
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>


        <button class="status-save">

            Update Status

        </button>


        ${
            waiterRequested
            ?
            `

            <button class="secondary waiter-done">

                ✓ Mark Waiter Request Done

            </button>

            `
            :
            ""
        }


        ${
            billRequested &&
            !billGenerated
            ?
            `

            <button class="green generate-bill">

                🧾 Generate Bill

            </button>

            `
            :
            ""
        }


        ${
            billGenerated
            ?
            `

            <div class="bill">

                <b>
                    🧾 Generated Bill
                </b>


                <div class="bill-row">

                    <span>
                        Order Total
                    </span>

                    <b>
                        ₹${Number(
                            order.total || 0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Bill Total
                    </span>

                    <b>
                        ₹${Number(
                            order.billTotal ||
                            order.total ||
                            0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Payment Method
                    </span>

                    <b>

                        ${escapeHTML(
                            paymentMethod ||
                            "Not selected"
                        )}

                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Payment Status
                    </span>

                    <b>

                        ${escapeHTML(
                            paymentStatus
                        )}

                    </b>

                </div>

            </div>

            `
            :
            ""
        }


        ${paymentRequestHTML}


        ${
            billGenerated &&
            paymentStatus !== "paid" &&
            !cashPaymentRequested
            ?
            `

            <select class="payment-select">

                <option value="">
                    Select payment method
                </option>

                <option value="cash">
                    Cash
                </option>

                <option value="upi">
                    UPI
                </option>

            </select>


            <button class="green confirm-payment">

                ✓ Confirm Payment Received

            </button>

            `
            :
            ""
        }

    `;


    /* ========================================
       STATUS SELECT
    ======================================== */

    const statusSelect =
        card.querySelector(
            ".status-select"
        );


    statusSelect.value =
        status;


    const statusSave =
        card.querySelector(
            ".status-save"
        );


    statusSave.onclick =
    async () => {

        await updateOrder(
            order.id,
            {

                status:
                    statusSelect.value,

                updatedAt:
                    serverTimestamp()

            }
        );

    };


    /* ========================================
       WAITER
    ======================================== */

    const waiterButton =
        card.querySelector(
            ".waiter-done"
        );


    if(waiterButton){

        waiterButton.onclick =
        async () => {

            await updateOrder(
                order.id,
                {

                    waiterRequested:
                        false,

                    waiterCalled:
                        false,

                    waiterHandled:
                        true,

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       GENERATE BILL
    ======================================== */

    const billButton =
        card.querySelector(
            ".generate-bill"
        );


    if(billButton){

        billButton.onclick =
        async () => {

            const confirmed =
                confirm(
                    "Generate bill for Table " +
                    (order.table || "") +
                    "?"
                );


            if(!confirmed){

                return;
            }


            await updateOrder(
                order.id,
                {

                    billGenerated:
                        true,

                    billStatus:
                        "generated",

                    billTotal:
                        Number(
                            order.total || 0
                        ),

                    billSubtotal:
                        Number(
                            order.total || 0
                        ),

                    billGeneratedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       CASH PAYMENT
    ======================================== */

    const cashComplete =
        card.querySelector(
            ".cash-complete"
        );


    if(cashComplete){

        cashComplete.onclick =
        async () => {

            const confirmed =
                confirm(
                    "Confirm that the cash payment has been received?"
                );


            if(!confirmed){

                return;
            }


            await updateOrder(
                order.id,
                {

                    paymentMethod:
                        "cash",

                    paymentStatus:
                        "paid",

                    cashPaymentRequested:
                        false,

                    cashPaymentCompleted:
                        true,

                    paidAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       PAYMENT
    ======================================== */

    const paymentButton =
        card.querySelector(
            ".confirm-payment"
        );


    if(paymentButton){

        paymentButton.onclick =
        async () => {

            const paymentSelect =
                card.querySelector(
                    ".payment-select"
                );


            const method =
                paymentSelect.value;


            if(!method){

                alert(
                    "Please select Cash or UPI."
                );

                return;
            }


            const confirmed =
                confirm(
                    "Confirm " +
                    method.toUpperCase() +
                    " payment received?"
                );


            if(!confirmed){

                return;
            }


            await updateOrder(
                order.id,
                {

                    paymentMethod:
                        method,

                    paymentStatus:
                        "paid",

                    paidAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    return card;

}


/* ==========================================
   UPDATE ORDER
========================================== */

async function updateOrder(
    orderId,
    data
){

    try{

        const user =
            auth.currentUser;


        if(!user){

            alert(
                "Please login first."
            );

            return;
        }


        if(
            user.uid !==
            currentRestaurantId
        ){

            alert(
                "Access denied."
            );

            return;
        }


        await updateDoc(

            doc(
                db,
                "restaurants",
                currentRestaurantId,
                "orders",
                orderId
            ),

            data

        );


        await loadOrders();

    }
    catch(error){

        console.error(
            "UPDATE ERROR:",
            error
        );


        alert(
            "❌ Update failed.\n\n" +
            error.code +
            "\n\n" +
            error.message
        );

    }

}


/* ==========================================
   TIMESTAMP
========================================== */

function getTimestampMillis(value){

    if(!value){

        return 0;
    }


    if(
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();
    }


    if(
        typeof value.toDate ===
        "function"
    ){

        return value.toDate().getTime();
    }


    if(
        value.seconds !== undefined
    ){

        return Number(
            value.seconds
        ) * 1000;
    }


    if(value instanceof Date){

        return value.getTime();
    }


    if(typeof value === "string"){

        const parsed =
            Date.parse(value);


        return Number.isNaN(parsed)
            ? 0
            : parsed;

    }


    return 0;

}


/* ==========================================
   DATE
========================================== */

function formatDate(timestamp){

    const millis =
        getTimestampMillis(
            timestamp
        );


    if(!millis){

        return "Time unavailable";
    }


    try{

        return new Date(
            millis
        ).toLocaleString();

    }
    catch(error){

        return "Time unavailable";

    }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
