<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding-bottom:40px;
}

header{
    background:#ff5722;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:5px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.info{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.info input{
    width:100%;
    padding:11px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
}

.order{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order.cash-alert{
    border:3px solid #ff9800;
    box-shadow:0 0 15px rgba(255,152,0,.35);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

.table{
    font-size:20px;
    font-weight:bold;
}

.order-id{
    font-size:12px;
    color:#777;
    margin-top:5px;
    word-break:break-all;
}

.total{
    font-size:18px;
    font-weight:bold;
    color:#ff5722;
}

.customer-box{
    margin-top:12px;
    padding:12px;
    background:#f8f8f8;
    border-radius:9px;
}

.customer-box h4{
    margin-bottom:7px;
}

.customer-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    font-size:14px;
}

.customer-row span:first-child{
    color:#777;
}

.item{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:bold;
}

.item-detail{
    font-size:14px;
    color:#666;
    margin-top:4px;
}

.instruction{
    background:#fff8f4;
    padding:7px;
    border-radius:6px;
    font-size:13px;
    margin-top:5px;
}

.badges{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin:12px 0;
}

.badge{
    padding:7px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
}

.badge.alert{
    background:#ffe0b2;
    color:#e65100;
}

.badge.cash{
    background:#fff3cd;
    color:#856404;
    border:1px solid #ffca28;
}

.badge.paid{
    background:#dcedc8;
    color:#33691e;
}

.badge.upi{
    background:#e3f2fd;
    color:#1565c0;
}

select,
button{
    width:100%;
    padding:11px;
    border-radius:8px;
    font-size:15px;
}

select{
    border:1px solid #ddd;
    background:white;
    margin-top:8px;
}

button{
    border:none;
    background:#ff5722;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button.secondary{
    background:#333;
}

button.green{
    background:#388e3c;
}

button.blue{
    background:#1976d2;
}

button.orange{
    background:#ef6c00;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.cash-request-box{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:#fff3cd;
    border:2px solid #ffb300;
    color:#7a5200;
}

.cash-request-box h3{
    margin-bottom:7px;
}

.bill{
    background:#f7f7f7;
    border:1px dashed #bbb;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.bill-row{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
}

.loading,
.empty,
.error{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

.error{
    color:#c62828;
}

.notification{
    position:fixed;
    top:20px;
    right:20px;
    width:340px;
    max-width:calc(100% - 40px);
    background:white;
    border-left:6px solid #ff9800;
    border-radius:10px;
    padding:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.25);
    z-index:9999;
    animation:slideIn .3s ease;
}

.notification h3{
    color:#e65100;
    margin-bottom:6px;
}

.notification button{
    margin-top:10px;
}

@keyframes slideIn{
    from{
        transform:translateX(120%);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

.small{
    font-size:12px;
    color:#777;
    margin-top:8px;
}

.online{
    display:inline-block;
    background:#4caf50;
    color:white;
    padding:5px 9px;
    border-radius:15px;
    font-size:12px;
    margin-top:8px;
}

</style>

</head>

<body>

<header>

<h1 id="restaurantName">
Admin Orders
</h1>

<p>
Real-Time Order Management
</p>

<div class="online">
● Live Updates Enabled
</div>

</header>


<div class="container">


<div class="info">

<label>
<b>Restaurant ID</b>
</label>

<input
    id="restaurantId"
    type="text"
    placeholder="Enter restaurant ID"
>

<button onclick="loadOrders()">
Load Orders
</button>

<button
    class="secondary"
    onclick="location.reload()"
>
Refresh
</button>

</div>


<div id="ordersContainer">

<div class="empty">
Enter Restaurant ID and load orders.
</div>

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getFirestore,
    collection,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    query,
    orderBy,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* =====================================================
   ELEMENTS
===================================================== */

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );

const restaurantName =
    document.getElementById(
        "restaurantName"
    );

const restaurantInput =
    document.getElementById(
        "restaurantId"
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentRestaurantId = "";

let orders = [];

let unsubscribeOrders = null;

let previousCashRequests = new Set();


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlRestaurantId =
    params.get("restaurantId");


if(urlRestaurantId){

    restaurantInput.value =
        urlRestaurantId;

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            ordersContainer.innerHTML = `

                <div class="error">

                    ❌ Admin login required.

                    <br><br>

                    Please login with the
                    restaurant owner's account.

                </div>

            `;

            return;

        }


        if(!restaurantInput.value){

            restaurantInput.value =
                user.uid;

        }


        currentRestaurantId =
            restaurantInput.value.trim();


        await loadRestaurant();

    }
);


/* =====================================================
   LOAD ORDERS BUTTON
===================================================== */

window.loadOrders =
    loadOrders;


/* =====================================================
   LOAD RESTAURANT
===================================================== */

async function loadRestaurant(){

    try{

        if(!currentRestaurantId){

            currentRestaurantId =
                restaurantInput.value.trim();

        }


        const ref =
            doc(
                db,
                "restaurants",
                currentRestaurantId
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            const data =
                snap.data();


            restaurantName.textContent =
                data.restaurantName ||
                data.name ||
                "Admin Orders";

        }

    }
    catch(error){

        console.error(
            "Restaurant error:",
            error
        );

    }

}


/* =====================================================
   LOAD ORDERS - REAL TIME
===================================================== */

async function loadOrders(){

    const user =
        auth.currentUser;


    if(!user){

        alert(
            "Please login first."
        );

        return;

    }


    currentRestaurantId =
        restaurantInput.value.trim();


    if(!currentRestaurantId){

        alert(
            "Enter restaurant ID."
        );

        return;

    }


    if(
        user.uid !==
        currentRestaurantId
    ){

        ordersContainer.innerHTML = `

            <div class="error">

                ❌ Access denied.

                <br><br>

                Login with the restaurant
                owner's account.

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML = `

        <div class="loading">

            ⏳ Connecting to live orders...

        </div>

    `;


    await loadRestaurant();


    /* ---------------------------------------------
       REMOVE OLD LISTENER
    --------------------------------------------- */

    if(unsubscribeOrders){

        unsubscribeOrders();

        unsubscribeOrders =
            null;

    }


    previousCashRequests =
        new Set();


    /* ---------------------------------------------
       ORDERS COLLECTION
    --------------------------------------------- */

    const ordersRef =
        collection(
            db,
            "restaurants",
            currentRestaurantId,
            "orders"
        );


    let ordersQuery;


    try{

        ordersQuery =
            query(
                ordersRef,
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

    }
    catch(error){

        ordersQuery =
            ordersRef;

    }


    /* =================================================
       REAL-TIME LISTENER
    ================================================= */

    unsubscribeOrders =
        onSnapshot(

            ordersQuery,

            function(snapshot){

                const newOrders = [];


                snapshot.forEach(
                    function(orderDoc){

                        newOrders.push({

                            id:
                                orderDoc.id,

                            ...orderDoc.data()

                        });

                    }
                );


                orders =
                    newOrders;


                /*
                 * Check for new cash requests
                 */

                checkForCashRequests(
                    orders
                );


                renderOrders();

            },


            function(error){

                console.error(
                    "Real-time listener error:",
                    error
                );


                ordersContainer.innerHTML = `

                    <div class="error">

                        ❌ Unable to listen
                        for live orders.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        );

}


/* =====================================================
   CHECK CASH PAYMENT REQUESTS
===================================================== */

function checkForCashRequests(
    currentOrders
){

    currentOrders.forEach(
        function(order){

            const isCashRequest =
                order.paymentMethod === "cash" &&
                order.paymentStatus ===
                    "payment_selected" &&
                order.cashPaymentRequested === true;


            if(!isCashRequest){

                return;

            }


            /*
             * First page load:
             * remember existing requests
             * without showing alerts.
             */

            if(
                previousCashRequests.size === 0
            ){

                previousCashRequests.add(
                    order.id
                );

                return;

            }


            /*
             * New cash request
             */

            if(
                !previousCashRequests.has(
                    order.id
                )
            ){

                previousCashRequests.add(
                    order.id
                );


                showCashNotification(
                    order
                );

            }

        }
    );

}


/* =====================================================
   CASH NOTIFICATION
===================================================== */

function showCashNotification(
    order
){

    const table =
        order.table ||
        "-";


    const amount =
        Number(
            order.billTotal ??
            order.finalTotal ??
            order.total ??
            0
        );


    const customerName =
        order.customerName ||
        order.customer?.name ||
        "Customer";


    /*
     * Browser notification
     */

    try{

        if(
            "Notification"
            in window
        ){

            if(
                Notification.permission ===
                "granted"
            ){

                new Notification(
                    "💵 Cash Payment Requested",
                    {

                        body:
                            "Table " +
                            table +
                            " - " +
                            customerName +
                            " - ₹" +
                            amount.toFixed(2),

                        tag:
                            "cash-" +
                            order.id

                    }
                );

            }

        }

    }
    catch(error){

        console.warn(
            "Browser notification failed:",
            error
        );

    }


    /*
     * In-page notification
     */

    const old =
        document.getElementById(
            "cashNotification"
        );


    if(old){

        old.remove();

    }


    const notification =
        document.createElement(
            "div"
        );


    notification.id =
        "cashNotification";


    notification.className =
        "notification";


    notification.innerHTML = `

        <h3>
            💵 CASH PAYMENT REQUEST
        </h3>

        <div>

            <b>
                Table ${escapeHTML(
                    String(table)
                )}
            </b>

        </div>

        <div style="margin-top:5px">

            Customer:
            <b>
                ${escapeHTML(
                    customerName
                )}
            </b>

        </div>

        <div style="margin-top:5px">

            Amount:
            <b>
                ₹${amount.toFixed(2)}
            </b>

        </div>

        <button
            class="orange"
            onclick="closeCashNotification()"
        >

            OK - Go Collect Cash

        </button>

    `;


    document.body.appendChild(
        notification
    );


    /*
     * Sound
     */

    playNotificationSound();

}


window.closeCashNotification =
    function(){

        const notification =
            document.getElementById(
                "cashNotification"
            );


        if(notification){

            notification.remove();

        }

    };


/* =====================================================
   NOTIFICATION SOUND
===================================================== */

function playNotificationSound(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.frequency.value =
            800;


        gain.gain.value =
            0.15;


        oscillator.start();


        setTimeout(
            function(){

                oscillator.stop();

                context.close();

            },
            500
        );

    }
    catch(error){

        console.warn(
            "Sound notification failed:",
            error
        );

    }

}


/* =====================================================
   REQUEST NOTIFICATION PERMISSION
===================================================== */

async function requestNotificationPermission(){

    try{

        if(
            "Notification"
            in window
        ){

            if(
                Notification.permission ===
                "default"
            ){

                await Notification.requestPermission();

            }

        }

    }
    catch(error){

        console.warn(error);

    }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

    ordersContainer.innerHTML = "";


    if(
        orders.length === 0
    ){

        ordersContainer.innerHTML = `

            <div class="empty">

                🍽️ No orders found.

            </div>

        `;

        return;

    }


    orders.forEach(
        function(order){

            ordersContainer.appendChild(
                createOrderCard(order)
            );

        }
    );

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(
    order
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order";


    const status =
        order.status ||
        "received";


    const paymentStatus =
        order.paymentStatus ||
        "unpaid";


    const paymentMethod =
        order.paymentMethod ||
        "";


    const waiterRequested =
        order.waiterRequested === true ||
        order.waiterCalled === true;


    const billRequested =
        order.billRequested === true;


    const billGenerated =
        order.billStatus ===
            "generated" ||
        order.billGenerated === true ||
        Number(
            order.billTotal || 0
        ) > 0;


    const cashRequested =
        order.cashPaymentRequested ===
            true &&
        paymentMethod === "cash" &&
        paymentStatus ===
            "payment_selected";


    if(cashRequested){

        card.classList.add(
            "cash-alert"
        );

    }


    const createdText =
        formatDate(
            order.createdAt
        );


    let itemsHTML = "";


    (
        Array.isArray(order.items)
        ?
        order.items
        :
        []
    ).forEach(
        function(item){

            const qty =
                Number(
                    item.quantity || 0
                );


            const price =
                Number(
                    item.price || 0
                );


            const lineTotal =
                qty * price;


            itemsHTML += `

                <div class="item">

                    <div class="item-name">

                        ${escapeHTML(
                            item.name ||
                            item.foodName ||
                            "Item"
                        )}

                        × ${qty}

                    </div>


                    <div class="item-detail">

                        ₹${price.toFixed(2)}
                        each —
                        ₹${lineTotal.toFixed(2)}

                    </div>


                    ${
                        item.instruction
                        ?
                        `

                        <div class="instruction">

                            📝
                            ${escapeHTML(
                                item.instruction
                            )}

                        </div>

                        `
                        :
                        ""
                    }

                </div>

            `;

        }
    );


    /*
     * Customer information
     */

    const customerName =
        order.customerName ||
        order.customer?.name ||
        order.userName ||
        "Not available";


    const customerEmail =
        order.customerEmail ||
        order.customer?.email ||
        order.userEmail ||
        "Not available";


    const customerPhone =
        order.customerPhone ||
        order.customer?.phone ||
        order.userPhone ||
        "Not available";


    const customerUid =
        order.customerUid ||
        order.userId ||
        order.customer?.uid ||
        "Not available";


    /*
     * Main card
     */

    card.innerHTML = `

        <div class="order-head">

            <div>

                <div class="table">

                    🪑 Table
                    ${escapeHTML(
                        String(
                            order.table || "-"
                        )
                    )}

                </div>


                <div class="order-id">

                    Order ID:
                    ${escapeHTML(
                        order.id
                    )}

                </div>


                <div class="small">

                    ${escapeHTML(
                        createdText
                    )}

                </div>

            </div>


            <div class="total">

                ₹${Number(
                    order.total || 0
                ).toFixed(2)}

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="customer-box">

            <h4>
                👤 Customer Details
            </h4>


            <div class="customer-row">

                <span>Name</span>

                <b>
                    ${escapeHTML(
                        customerName
                    )}
                </b>

            </div>


            <div class="customer-row">

                <span>Email</span>

                <b>
                    ${escapeHTML(
                        customerEmail
                    )}
                </b>

            </div>


            <div class="customer-row">

                <span>Phone</span>

                <b>
                    ${escapeHTML(
                        customerPhone
                    )}
                </b>

            </div>


            <div class="customer-row">

                <span>Customer UID</span>

                <b style="
                    word-break:break-all;
                    text-align:right;
                ">

                    ${escapeHTML(
                        customerUid
                    )}

                </b>

            </div>

        </div>


        <!-- BADGES -->

        <div class="badges">

            <span class="badge">

                ${escapeHTML(
                    status
                )}

            </span>


            ${
                waiterRequested
                ?
                `

                <span class="badge alert">

                    🔔 Waiter Requested

                </span>

                `
                :
                ""
            }


            ${
                billRequested
                ?
                `

                <span class="badge alert">

                    🧾 Bill Requested

                </span>

                `
                :
                ""
            }


            ${
                billGenerated
                ?
                `

                <span class="badge">

                    🧾 Bill Generated

                </span>

                `
                :
                ""
            }


            ${
                cashRequested
                ?
                `

                <span class="badge cash">

                    💵 CASH PAYMENT REQUESTED

                </span>

                `
                :
                ""
            }


            ${
                paymentMethod === "upi"
                &&
                paymentStatus ===
                    "payment_selected"
                ?
                `

                <span class="badge upi">

                    📱 UPI Payment Selected

                </span>

                `
                :
                ""
            }


            ${
                paymentStatus === "paid"
                ?
                `

                <span class="badge paid">

                    ✓ PAID

                </span>

                `
                :
                ""
            }

        </div>


        <!-- CASH REQUEST -->

        ${
            cashRequested
            ?
            `

            <div class="cash-request-box">

                <h3>
                    💵 Customer is Waiting for Cash Collection
                </h3>


                <div>

                    Table:
                    <b>
                        ${escapeHTML(
                            String(
                                order.table || "-"
                            )
                        )}
                    </b>

                </div>


                <div style="margin-top:5px">

                    Customer:
                    <b>
                        ${escapeHTML(
                            customerName
                        )}
                    </b>

                </div>


                <div style="margin-top:5px">

                    Amount to collect:

                    <b>
                        ₹${Number(
                            order.billTotal ??
                            order.finalTotal ??
                            order.total ??
                            0
                        ).toFixed(2)}
                    </b>

                </div>


                <button
                    class="green cash-collected"
                >

                    ✓ Cash Collected

                </button>

            </div>

            `
            :
            ""
        }


        <!-- ITEMS -->

        <div style="margin-top:10px">

            ${

                itemsHTML ||

                "<div class='item-detail'>No items</div>"

            }

        </div>


        <!-- STATUS -->

        <label>

            <b>
                Order Status
            </b>

        </label>


        <select class="status-select">

            <option value="received">
                Received
            </option>

            <option value="accepted">
                Accepted
            </option>

            <option value="preparing">
                Preparing
            </option>

            <option value="ready">
                Ready
            </option>

            <option value="served">
                Served
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>


        <button class="status-save">

            Update Status

        </button>


        ${
            waiterRequested
            ?

            `

            <button class="secondary waiter-done">

                ✓ Mark Waiter Request Done

            </button>

            `

            :

            ""

        }


        ${
            billRequested &&
            !billGenerated
            ?

            `

            <button class="green generate-bill">

                🧾 Generate Bill

            </button>

            `

            :

            ""

        }


        ${
            billGenerated
            ?

            `

            <div class="bill">

                <b>
                    Generated Bill
                </b>


                <div class="bill-row">

                    <span>
                        Order Total
                    </span>

                    <b>
                        ₹${Number(
                            order.total || 0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Bill Total
                    </span>

                    <b>
                        ₹${Number(
                            order.billTotal ||
                            order.total ||
                            0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Payment
                    </span>

                    <b>

                        ${
                            paymentMethod === "cash"
                            ?
                            "💵 Cash"
                            :
                            paymentMethod === "upi"
                            ?
                            "📱 UPI"
                            :
                            "Not selected"
                        }

                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Status
                    </span>

                    <b>

                        ${escapeHTML(
                            paymentStatus
                        )}

                    </b>

                </div>

            </div>

            `

            :

            ""

        }


        ${
            billGenerated &&
            paymentStatus !== "paid" &&
            !cashRequested
            ?

            `

            <div style="margin-top:12px">

                <select class="payment-select">

                    <option value="">

                        Select payment method

                    </option>

                    <option value="cash">

                        Cash

                    </option>

                    <option value="upi">

                        UPI

                    </option>

                </select>


                <button class="green confirm-payment">

                    ✓ Confirm Payment Received

                </button>

            </div>

            `

            :

            ""

        }

    `;


    /* =================================================
       STATUS
    ================================================= */

    const statusSelect =
        card.querySelector(
            ".status-select"
        );


    statusSelect.value =
        status;


    card.querySelector(
        ".status-save"
    ).onclick =
        async function(){

            await updateOrder(
                order.id,
                {

                    status:
                        statusSelect.value,

                    updatedAt:
                        serverTimestamp()

                }
            );

        };


    /* =================================================
       WAITER DONE
    ================================================= */

    const waiterButton =
        card.querySelector(
            ".waiter-done"
        );


    if(waiterButton){

        waiterButton.onclick =
            async function(){

                await updateOrder(
                    order.id,
                    {

                        waiterRequested:
                            false,

                        waiterCalled:
                            false,

                        waiterHandled:
                            true,

                        updatedAt:
                            serverTimestamp()

                    }
                );

            };

    }


    /* =================================================
       GENERATE BILL
    ================================================= */

    const billButton =
        card.querySelector(
            ".generate-bill"
        );


    if(billButton){

        billButton.onclick =
            async function(){

                const confirmed =
                    confirm(
                        "Generate bill for Table " +
                        (
                            order.table ||
                            ""
                        ) +
                        "?"
                    );


                if(!confirmed){

                    return;

                }


                const total =
                    Number(
                        order.total || 0
                    );


                await updateOrder(
                    order.id,
                    {

                        billStatus:
                            "generated",

                        billGenerated:
                            true,

                        billTotal:
                            total,

                        billSubtotal:
                            total,

                        billGeneratedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            };

    }


    /* =================================================
       CASH COLLECTED
    ================================================= */

    const cashCollectedButton =
        card.querySelector(
            ".cash-collected"
        );


    if(cashCollectedButton){

        cashCollectedButton.onclick =
            async function(){

                const amount =
                    Number(
                        order.billTotal ??
                        order.finalTotal ??
                        order.total ??
                        0
                    );


                const confirmed =
                    confirm(

                        "Confirm that you collected ₹" +
                        amount.toFixed(2) +
                        " cash from Table " +
                        (
                            order.table ||
                            "-"
                        ) +
                        "?"

                    );


                if(!confirmed){

                    return;

                }


                cashCollectedButton.disabled =
                    true;


                cashCollectedButton.textContent =
                    "⏳ Saving...";


                await updateOrder(
                    order.id,
                    {

                        paymentMethod:
                            "cash",

                        paymentStatus:
                            "paid",

                        cashPaymentRequested:
                            false,

                        cashPaymentCollected:
                            true,

                        cashCollectedAt:
                            serverTimestamp(),

                        paidAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            };

    }


    /* =================================================
       MANUAL PAYMENT
    ================================================= */

    const paymentButton =
        card.querySelector(
            ".confirm-payment"
        );


    if(paymentButton){

        paymentButton.onclick =
            async function(){

                const paymentSelect =
                    card.querySelector(
                        ".payment-select"
                    );


                const method =
                    paymentSelect.value;


                if(!method){

                    alert(
                        "Please select Cash or UPI."
                    );

                    return;

                }


                const confirmed =
                    confirm(

                        "Confirm " +
                        method.toUpperCase() +
                        " payment received?"

                    );


                if(!confirmed){

                    return;

                }


                await updateOrder(
                    order.id,
                    {

                        paymentMethod:
                            method,

                        paymentStatus:
                            "paid",

                        paidAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            };

    }


    return card;

}


/* =====================================================
   UPDATE ORDER
===================================================== */

async function updateOrder(
    orderId,
    data
){

    try{

        await updateDoc(

            doc(
                db,
                "restaurants",
                currentRestaurantId,
                "orders",
                orderId
            ),

            data

        );

    }
    catch(error){

        console.error(
            "Update error:",
            error
        );


        alert(

            "❌ Update failed.\n\n" +
            error.message

        );

    }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    timestamp
){

    if(!timestamp){

        return "Time unavailable";

    }


    try{

        const date =
            timestamp.toDate
            ?
            timestamp.toDate()
            :
            new Date(timestamp);


        return date.toLocaleString();

    }
    catch(error){

        return "Time unavailable";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   REQUEST BROWSER NOTIFICATION PERMISSION
===================================================== */

document.addEventListener(
    "click",
    function(){

        requestNotificationPermission();

    },
    {
        once:true
    }
);

</script>
