<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding-bottom:30px;
}

header{
    background:#ff5722;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin-bottom:5px;
}

header p{
    font-size:14px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.info{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.info input{
    width:100%;
    padding:11px;
    margin-top:7px;
    border:1px solid #ddd;
    border-radius:8px;
}

button,
select{
    width:100%;
    padding:11px;
    border-radius:8px;
    font-size:15px;
}

button{
    border:none;
    background:#ff5722;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button.secondary{
    background:#333;
}

button.green{
    background:#388e3c;
}

button.red{
    background:#d32f2f;
}

button.cash-button{
    background:#e65100;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.order{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order.cash-alert-order{
    border:3px solid #ff9800;
    box-shadow:
        0 0 0 3px rgba(255,152,0,.12),
        0 4px 18px rgba(255,152,0,.25);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
}

.table{
    font-size:20px;
    font-weight:bold;
}

.order-id{
    font-size:12px;
    color:#777;
    margin-top:5px;
    word-break:break-all;
}

.total{
    font-size:18px;
    font-weight:bold;
    color:#ff5722;
}

.customer{
    background:#f8f9fa;
    border:1px solid #eee;
    padding:12px;
    border-radius:9px;
    margin-top:12px;
}

.customer-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:8px;
}

.customer-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    font-size:14px;
}

.customer-label{
    color:#777;
}

.customer-value{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.badges{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin:12px 0;
}

.badge{
    padding:6px 9px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    background:#eee;
}

.badge.alert{
    background:#ffe0b2;
    color:#e65100;
}

.badge.cash{
    background:#ff9800;
    color:white;
    animation:pulse 1.2s infinite;
}

.badge.paid{
    background:#dcedc8;
    color:#33691e;
}

.badge.customer{
    background:#e3f2fd;
    color:#1565c0;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}

.cash-alert{
    background:#fff3e0;
    border:2px solid #ff9800;
    color:#e65100;
    padding:16px;
    border-radius:10px;
    margin-top:14px;
    text-align:center;
}

.cash-alert-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

.cash-alert-text{
    font-size:14px;
    line-height:1.5;
}

.item{
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.item:last-child{
    border-bottom:none;
}

.item-name{
    font-weight:bold;
}

.item-detail{
    font-size:14px;
    color:#666;
    margin-top:4px;
}

.instruction{
    background:#fff8f4;
    padding:7px;
    border-radius:6px;
    font-size:13px;
    margin-top:5px;
}

select{
    border:1px solid #ddd;
    background:white;
    margin-top:8px;
}

.bill{
    background:#f7f7f7;
    border:1px dashed #bbb;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.bill-row{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
    gap:10px;
}

.loading,
.empty,
.error{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    color:#777;
}

.error{
    color:#c62828;
}

.small{
    font-size:12px;
    color:#777;
    margin-top:8px;
}

.top-alert{
    display:none;
    background:#d32f2f;
    color:white;
    padding:16px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(211,47,47,.3);
}

.top-alert.show{
    display:block;
}

.top-alert-title{
    font-size:20px;
    margin-bottom:6px;
}

</style>

</head>

<body>

<header>

<h1 id="restaurantName">
Admin Orders
</h1>

<p>
Orders + Customer Details
</p>

</header>


<div class="container">

<div
id="cashTopAlert"
class="top-alert"
>

<div class="top-alert-title">
🔔 CASH PAYMENT REQUEST
</div>

<div id="cashTopAlertText">
A customer is waiting for cash collection.
</div>

</div>


<div class="info">

<label>
<b>Restaurant ID</b>
</label>

<input
id="restaurantId"
type="text"
placeholder="Enter restaurant ID"
>

<button
onclick="loadOrders()"
>
Load Orders
</button>

<button
class="secondary"
onclick="manualRefresh()"
>
Refresh
</button>

</div>


<div id="ordersContainer">

<div class="empty">
Enter Restaurant ID and load orders.
</div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig={

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"

};


const app=
    initializeApp(
        firebaseConfig
    );

const db=
    getFirestore(app);

const auth=
    getAuth(app);


const ordersContainer=
    document.getElementById(
        "ordersContainer"
    );

const restaurantName=
    document.getElementById(
        "restaurantName"
    );

const restaurantInput=
    document.getElementById(
        "restaurantId"
    );

const cashTopAlert=
    document.getElementById(
        "cashTopAlert"
    );

const cashTopAlertText=
    document.getElementById(
        "cashTopAlertText"
    );


let currentRestaurantId="";

let orders=[];

let unsubscribeOrders=null;

let previousCashRequests=new Set();


/* ==========================================
   URL
========================================== */

const params=
    new URLSearchParams(
        window.location.search
    );

const urlRestaurantId=
    params.get(
        "restaurantId"
    );


if(urlRestaurantId){

    restaurantInput.value=
        urlRestaurantId;

}


/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    async user=>{

        if(!user){

            ordersContainer.innerHTML=`

                <div class="error">

                    ❌ Admin login required.

                    <br><br>

                    Please login with
                    the restaurant owner's account.

                </div>

            `;

            return;

        }


        if(!restaurantInput.value){

            restaurantInput.value=
                user.uid;

        }


        currentRestaurantId=
            restaurantInput.value.trim();


        await loadRestaurant();

        startRealtimeOrders();

    }
);


/* ==========================================
   LOAD ORDERS BUTTON
========================================== */

window.loadOrders=
async function(){

    const user=
        auth.currentUser;


    if(!user){

        alert(
            "Please login first."
        );

        return;

    }


    currentRestaurantId=
        restaurantInput.value.trim();


    if(!currentRestaurantId){

        alert(
            "Enter restaurant ID."
        );

        return;

    }


    if(
        user.uid !==
        currentRestaurantId
    ){

        ordersContainer.innerHTML=`

            <div class="error">

                ❌ Access denied.

                <br><br>

                Login with the restaurant
                owner's account.

            </div>

        `;

        return;

    }


    await loadRestaurant();

    startRealtimeOrders();

};


/* ==========================================
   START REALTIME ORDERS
========================================== */

function startRealtimeOrders(){

    if(!currentRestaurantId){

        return;

    }


    if(unsubscribeOrders){

        unsubscribeOrders();

        unsubscribeOrders=null;

    }


    ordersContainer.innerHTML=`

        <div class="loading">

            ⏳ Connecting to live orders...

        </div>

    `;


    const ordersRef=
        collection(
            db,
            "restaurants",
            currentRestaurantId,
            "orders"
        );


    unsubscribeOrders=
        onSnapshot(
            ordersRef,

            snapshot=>{

                orders=[];


                snapshot.forEach(
                    orderDoc=>{

                        orders.push({

                            id:
                                orderDoc.id,

                            ...orderDoc.data()

                        });

                    }
                );


                orders.sort(
                    (a,b)=>{

                        return (
                            getTimestamp(
                                b.createdAt
                            )
                            -
                            getTimestamp(
                                a.createdAt
                            )
                        );

                    }
                );


                checkCashRequests();

                renderOrders();

            },

            error=>{

                console.error(
                    "Realtime order error:",
                    error
                );


                ordersContainer.innerHTML=`

                    <div class="error">

                        ❌ Unable to listen to orders.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }
        );

}


/* ==========================================
   CASH REQUEST DETECTION
========================================== */

function checkCashRequests(){

    const cashOrders=
        orders.filter(
            order=>

                order.cashPaymentRequested===true &&

                order.paymentStatus!=="paid" &&

                order.paymentMethod==="cash"

        );


    if(cashOrders.length===0){

        cashTopAlert.classList.remove(
            "show"
        );

        previousCashRequests.clear();

        return;

    }


    const newRequests=[];


    cashOrders.forEach(
        order=>{

            if(
                !previousCashRequests.has(
                    order.id
                )
            ){

                newRequests.push(
                    order
                );

            }

        }
    );


    cashOrders.forEach(
        order=>{

            previousCashRequests.add(
                order.id
            );

        }
    );


    const first=
        cashOrders[0];


    cashTopAlertText.textContent=
        cashOrders.length===1
        ?
        "Table "+
        (first.table||"-")+
        " — "+
        (first.customerName||"Customer")+
        " is waiting for cash collection."
        :
        cashOrders.length+
        " customers are waiting for cash collection.";


    cashTopAlert.classList.add(
        "show"
    );


    /*
     Browser alert only for NEW
     requests received while page
     is already open.
    */

    if(newRequests.length){

        const request=
            newRequests[0];


        setTimeout(
            ()=>{

                alert(
                    "🔔 CASH PAYMENT REQUEST\n\n"+
                    "Table: "+
                    (request.table||"-")+
                    "\n"+
                    "Customer: "+
                    (request.customerName||"Customer")+
                    "\n"+
                    "Amount: ₹"+
                    Number(
                        request.billTotal||
                        request.total||
                        0
                    )+
                    "\n\n"+
                    "Please collect the cash."
                );

            },
            100
        );

    }

}


/* ==========================================
   MANUAL REFRESH
========================================== */

window.manualRefresh=
function(){

    if(!currentRestaurantId){

        alert(
            "Restaurant ID is missing."
        );

        return;

    }


    startRealtimeOrders();

};


/* ==========================================
   RESTAURANT
========================================== */

async function loadRestaurant(){

    try{

        const ref=
            doc(
                db,
                "restaurants",
                currentRestaurantId
            );


        const snap=
            await getDoc(
                ref
            );


        if(snap.exists()){

            const data=
                snap.data();


            restaurantName.textContent=
                data.restaurantName ||
                data.name ||
                "Admin Orders";

        }

    }
    catch(error){

        console.error(
            "Restaurant error:",
            error
        );

    }

}


/* ==========================================
   RENDER ORDERS
========================================== */

function renderOrders(){

    ordersContainer.innerHTML="";


    if(orders.length===0){

        ordersContainer.innerHTML=`

            <div class="empty">

                🍽️ No orders found.

            </div>

        `;

        return;

    }


    orders.forEach(
        order=>{

            ordersContainer.appendChild(
                createOrderCard(
                    order
                )
            );

        }
    );

}


/* ==========================================
   ORDER CARD
========================================== */

function createOrderCard(order){

    const card=
        document.createElement(
            "div"
        );


    card.className=
        "order";


    const status=
        order.status ||
        "received";


    const paymentStatus=
        order.paymentStatus ||
        "unpaid";


    const paymentMethod=
        order.paymentMethod ||
        "";


    const customerName=
        order.customerName ||
        "Customer";


    const customerMobile=
        order.customerMobile ||
        order.customerPhone ||
        "";


    const customerUid=
        order.customerUid ||
        "";


    const waiterRequested=
        order.waiterRequested===true ||
        order.waiterCalled===true;


    const billRequested=
        order.billRequested===true;


    const billGenerated=
        order.billStatus==="generated" ||
        order.billGenerated===true;


    const cashRequested=
        order.cashPaymentRequested===true &&
        paymentStatus!=="paid" &&
        paymentMethod==="cash";


    const createdText=
        formatDate(
            order.createdAt
        );


    if(cashRequested){

        card.classList.add(
            "cash-alert-order"
        );

    }


    let itemsHTML="";


    (
        order.items ||
        []
    ).forEach(
        item=>{

            const qty=
                Number(
                    item.quantity||0
                );


            const price=
                Number(
                    item.price||0
                );


            const lineTotal=
                qty*price;


            itemsHTML+=`

                <div class="item">

                    <div class="item-name">

                        ${escapeHTML(
                            item.name ||
                            "Item"
                        )}

                        × ${qty}

                    </div>


                    <div class="item-detail">

                        ₹${price.toFixed(2)}
                        each —
                        ₹${lineTotal.toFixed(2)}

                    </div>


                    ${
                        item.instruction
                        ?
                        `

                        <div class="instruction">

                            📝
                            ${escapeHTML(
                                item.instruction
                            )}

                        </div>

                        `
                        :
                        ""
                    }

                </div>

            `;

        }
    );


    card.innerHTML=`

        <!-- ORDER HEADER -->

        <div class="order-head">

            <div>

                <div class="table">

                    🪑 Table
                    ${escapeHTML(
                        order.table||"-"
                    )}

                </div>


                <div class="order-id">

                    Order ID:
                    ${escapeHTML(
                        order.id
                    )}

                </div>


                <div class="small">

                    ${createdText}

                </div>

            </div>


            <div class="total">

                ₹${Number(
                    order.total||0
                ).toFixed(2)}

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="customer">

            <div class="customer-title">

                👤 Customer Details

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Name
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerName
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Mobile
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerMobile ||
                        "Not available"
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Customer ID
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        customerUid ||
                        "Not available"
                    )}

                </span>

            </div>


            <div class="customer-row">

                <span class="customer-label">
                    Table
                </span>

                <span class="customer-value">

                    ${escapeHTML(
                        order.table||"-"
                    )}

                </span>

            </div>

        </div>


        <!-- BADGES -->

        <div class="badges">

            <span class="badge customer">

                👤 ${escapeHTML(
                    customerName
                )}

            </span>


            <span class="badge">

                ${escapeHTML(
                    status
                )}

            </span>


            ${
                waiterRequested
                ?
                `

                <span class="badge alert">

                    🔔 Waiter Requested

                </span>

                `
                :
                ""
            }


            ${
                billRequested
                ?
                `

                <span class="badge alert">

                    🧾 Bill Requested

                </span>

                `
                :
                ""
            }


            ${
                billGenerated
                ?
                `

                <span class="badge">

                    🧾 Bill Generated

                </span>

                `
                :
                ""
            }


            ${
                cashRequested
                ?
                `

                <span class="badge cash">

                    💵 CASH COLLECTION NEEDED

                </span>

                `
                :
                ""
            }


            ${
                paymentStatus==="paid"
                ?
                `

                <span class="badge paid">

                    ✓ PAID

                </span>

                `
                :
                ""
            }

        </div>


        ${
            cashRequested
            ?
            `

            <div class="cash-alert">

                <div class="cash-alert-title">

                    🔔 CASH COLLECTION REQUEST

                </div>


                <div class="cash-alert-text">

                    Customer at
                    <strong>
                    Table ${escapeHTML(
                        order.table||"-"
                    )}
                    </strong>

                    selected cash payment.

                    <br><br>

                    Amount to collect:

                    <strong>
                    ₹${Number(
                        order.billTotal||
                        order.total||
                        0
                    ).toFixed(2)}
                    </strong>

                    <br><br>

                    Customer:
                    <strong>
                    ${escapeHTML(
                        customerName
                    )}
                    </strong>

                </div>


                <button
                    class="cash-button cash-collected"
                >

                    💵 Cash Collected — Mark Paid

                </button>

            </div>

            `
            :
            ""
        }


        <!-- ITEMS -->

        <div>

            ${
                itemsHTML ||
                "<div class='item-detail'>No items</div>"
            }

        </div>


        <br>


        <!-- ORDER STATUS -->

        <label>

            <b>
                Order Status
            </b>

        </label>


        <select class="status-select">

            <option value="received">
                Received
            </option>

            <option value="preparing">
                Preparing
            </option>

            <option value="ready">
                Ready
            </option>

            <option value="served">
                Served
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>


        <button class="status-save">

            Update Status

        </button>


        ${
            waiterRequested
            ?
            `

            <button
                class="secondary waiter-done"
            >

                ✓ Mark Waiter Request Done

            </button>

            `
            :
            ""
        }


        ${
            billRequested &&
            !billGenerated
            ?
            `

            <button
                class="green generate-bill"
            >

                🧾 Generate Bill

            </button>

            `
            :
            ""
        }


        ${
            billGenerated
            ?
            `

            <div class="bill">

                <b>
                    Generated Bill
                </b>


                <div class="bill-row">

                    <span>
                        Order Total
                    </span>

                    <b>
                        ₹${Number(
                            order.total||0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Bill Total
                    </span>

                    <b>
                        ₹${Number(
                            order.billTotal||
                            order.total||
                            0
                        ).toFixed(2)}
                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Payment
                    </span>

                    <b>

                        ${escapeHTML(
                            paymentMethod ||
                            "Not selected"
                        )}

                    </b>

                </div>


                <div class="bill-row">

                    <span>
                        Status
                    </span>

                    <b>

                        ${escapeHTML(
                            paymentStatus
                        )}

                    </b>

                </div>

            </div>

            `
            :
            ""
        }


        ${
            billGenerated &&
            paymentStatus!=="paid" &&
            !cashRequested
            ?
            `

            <select class="payment-select">

                <option value="">
                    Select payment method
                </option>

                <option value="cash">
                    Cash
                </option>

                <option value="upi">
                    UPI
                </option>

            </select>


            <button
                class="green confirm-payment"
            >

                ✓ Confirm Payment Received

            </button>

            `
            :
            ""
        }

    `;


    /* ========================================
       STATUS
    ======================================== */

    const statusSelect=
        card.querySelector(
            ".status-select"
        );


    statusSelect.value=
        status;


    card
        .querySelector(
            ".status-save"
        )
        .onclick=
        async()=>{

            await updateOrder(
                order.id,
                {

                    status:
                        statusSelect.value,

                    updatedAt:
                        serverTimestamp()

                }
            );

        };


    /* ========================================
       WAITER
    ======================================== */

    const waiterButton=
        card.querySelector(
            ".waiter-done"
        );


    if(waiterButton){

        waiterButton.onclick=
        async()=>{

            await updateOrder(
                order.id,
                {

                    waiterRequested:
                        false,

                    waiterCalled:
                        false,

                    waiterHandled:
                        true,

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       BILL
    ======================================== */

    const billButton=
        card.querySelector(
            ".generate-bill"
        );


    if(billButton){

        billButton.onclick=
        async()=>{

            const confirmBill=
                confirm(
                    "Generate bill for Table "+
                    (order.table||"")+
                    "?"
                );


            if(!confirmBill){

                return;

            }


            await updateOrder(
                order.id,
                {

                    billStatus:
                        "generated",

                    billGenerated:
                        true,

                    billTotal:
                        Number(
                            order.total||0
                        ),

                    billSubtotal:
                        Number(
                            order.total||0
                        ),

                    billGeneratedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       CASH COLLECTED
    ======================================== */

    const cashCollectedButton=
        card.querySelector(
            ".cash-collected"
        );


    if(cashCollectedButton){

        cashCollectedButton.onclick=
        async()=>{

            const amount=
                Number(
                    order.billTotal||
                    order.total||
                    0
                );


            const confirmCash=
                confirm(
                    "Confirm cash received?\n\n"+
                    "Table: "+
                    (order.table||"-")+
                    "\n"+
                    "Customer: "+
                    customerName+
                    "\n"+
                    "Amount: ₹"+
                    amount.toFixed(2)
                );


            if(!confirmCash){

                return;

            }


            cashCollectedButton.disabled=
                true;

            cashCollectedButton.textContent=
                "⏳ Saving...";


            await updateOrder(
                order.id,
                {

                    paymentMethod:
                        "cash",

                    paymentStatus:
                        "paid",

                    paidAt:
                        serverTimestamp(),

                    cashPaymentRequested:
                        false,

                    cashPaymentCollected:
                        true,

                    cashPaymentCollectedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    /* ========================================
       NORMAL PAYMENT
    ======================================== */

    const paymentButton=
        card.querySelector(
            ".confirm-payment"
        );


    if(paymentButton){

        paymentButton.onclick=
        async()=>{

            const paymentSelect=
                card.querySelector(
                    ".payment-select"
                );


            const method=
                paymentSelect.value;


            if(!method){

                alert(
                    "Please select Cash or UPI."
                );

                return;

            }


            const confirmPayment=
                confirm(
                    "Confirm "+
                    method.toUpperCase()+
                    " payment received?"
                );


            if(!confirmPayment){

                return;

            }


            await updateOrder(
                order.id,
                {

                    paymentMethod:
                        method,

                    paymentStatus:
                        "paid",

                    paidAt:
                        serverTimestamp(),

                    cashPaymentRequested:
                        false,

                    updatedAt:
                        serverTimestamp()

                }
            );

        };

    }


    return card;

}


/* ==========================================
   UPDATE ORDER
========================================== */

async function updateOrder(
    orderId,
    data
){

    try{

        await updateDoc(

            doc(
                db,
                "restaurants",
                currentRestaurantId,
                "orders",
                orderId
            ),

            data

        );

    }
    catch(error){

        console.error(
            "Update error:",
            error
        );


        alert(
            "❌ Update failed.\n\n"+
            error.message
        );

    }

}


/* ==========================================
   TIMESTAMP
========================================== */

function getTimestamp(value){

    if(!value){

        return 0;

    }


    if(
        typeof value.toMillis==="function"
    ){

        return value.toMillis();

    }


    if(
        value.seconds!==undefined
    ){

        return Number(
            value.seconds
        )*1000;

    }


    return 0;

}


/* ==========================================
   DATE
========================================== */

function formatDate(timestamp){

    if(!timestamp){

        return "Time unavailable";

    }


    try{

        const date=
            timestamp.toDate
            ?
            timestamp.toDate()
            :
            new Date(timestamp);


        return date.toLocaleString();

    }
    catch(error){

        return "Time unavailable";

    }

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
