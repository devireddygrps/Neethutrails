<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#ff5722;
    margin-bottom:10px;
}

p{
    color:gray;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#ff5722;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e64a19;
}

#otpSection{
    display:none;
}
</style>

</head>
<body>

<div class="container">

<h2>Restaurant Login</h2>

<p>Login using your mobile number</p>

<div id="mobileSection">

    <input type="tel" id="mobile" placeholder="Enter Mobile Number">

    <div id="recaptcha-container"></div>

    <button id="sendBtn">
        Send OTP
    </button>

</div>

<div id="otpSection">

<input type="text"
id="otp"
placeholder="Enter OTP">

<button onclick="verifyOTP()">
Verify OTP
</button>

</div>

</div>
<script type="module" src="./firebase.js">
</script>
</body>
</html>
