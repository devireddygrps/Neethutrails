<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #ff5722;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #ff5722;

            box-shadow:
                0 0 0 2px rgba(255, 87, 34, 0.12);
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 15px;

            background: #ff5722;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #otpSection {
            display: none;
        }

        #recaptcha-container {
            margin-top: 15px;

            display: flex;
            justify-content: center;
        }

        .back-button {
            background: #555;
        }

        .back-button:hover {
            background: #333;
        }

        .message {
            margin-top: 15px;

            font-size: 14px;

            color: #777;

            min-height: 20px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #999;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         LOGIN HEADER
    ================================================== -->

    <div class="logo">
        🍽️
    </div>

    <h2>
        Restaurant Login
    </h2>

    <p class="subtitle">
        Login using your registered mobile number
    </p>


    <!-- =================================================
         MOBILE SECTION
    ================================================== -->

    <div id="mobileSection">

        <input
            type="tel"
            id="mobile"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter 10-digit mobile number"
            autocomplete="tel"
        >


        <!-- Firebase reCAPTCHA -->

        <div id="recaptcha-container"></div>


        <button
            id="sendBtn"
            type="button"
        >
            Send OTP
        </button>


        <div
            id="mobileMessage"
            class="message"
        ></div>

    </div>


    <!-- =================================================
         OTP SECTION
    ================================================== -->

    <div id="otpSection">

        <p
            id="otpInfo"
            class="subtitle"
        >
            Enter the OTP sent to your mobile number.
        </p>


        <input
            type="text"
            id="otp"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 6-digit OTP"
            autocomplete="one-time-code"
        >


        <button
            id="verifyBtn"
            type="button"
        >
            Verify OTP
        </button>


        <button
            id="backBtn"
            type="button"
            class="back-button"
        >
            Change Mobile Number
        </button>


        <div
            id="otpMessage"
            class="message"
        ></div>

    </div>


    <div class="footer">
        Restaurant Management System
    </div>


</div>


<!-- =====================================================
     FIREBASE JS
====================================================== -->

<script
    type="module"
    src="./firebase.js">
</script>


</body>

</html>
