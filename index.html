<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);

            text-align: center;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h2 {
            color: #ff5722;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #ff5722;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #ff5722;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .secondary {
            background: #444;
        }

        .secondary:hover {
            background: #222;
        }

        #otpSection {
            display: none;
        }

        #recaptcha-container {
            margin-top: 15px;

            display: flex;

            justify-content: center;
        }

        .message {
            margin-top: 15px;

            font-size: 14px;

            min-height: 20px;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🍽️
    </div>


    <h2>
        Restaurant Login
    </h2>


    <p class="subtitle">
        Login using your mobile number
    </p>


    <!-- =========================================
         MOBILE SECTION
    ========================================== -->

    <div id="mobileSection">

        <input
            id="mobile"
            type="tel"
            maxlength="10"
            inputmode="numeric"
            placeholder="Enter 10-digit mobile number"
        >


        <div id="recaptcha-container"></div>


        <!-- IMPORTANT:
             onclick directly calls JavaScript
        -->

        <button
            id="sendBtn"
            type="button"
            onclick="sendOTP()"
        >
            Send OTP
        </button>


        <div
            id="mobileMessage"
            class="message"
        ></div>

    </div>


    <!-- =========================================
         OTP SECTION
    ========================================== -->

    <div id="otpSection">

        <p
            id="otpInfo"
            class="subtitle"
        >
            Enter the OTP sent to your mobile.
        </p>


        <input
            id="otp"
            type="text"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 6-digit OTP"
        >


        <button
            type="button"
            onclick="verifyOTP()"
        >
            Verify OTP
        </button>


        <button
            type="button"
            class="secondary"
            onclick="changeMobile()"
        >
            Change Mobile Number
        </button>


        <div
            id="otpMessage"
            class="message"
        ></div>

    </div>


</div>


<script
    type="module"
    src="./firebase.js">
</script>


</body>

</html>
