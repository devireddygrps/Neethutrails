<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Menu</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .menu-list {
            display: grid;
            gap: 15px;
        }

        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .menu-item h3 {
            margin-bottom: 7px;
            color: #333;
        }

        .category {
            color: #ff5722;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .availability {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .available {
            background: #d4edda;
            color: #155724;
        }

        .unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-btn {
            background: #2196f3;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .toggle-btn {
            background: #555;
            color: white;
        }

        .back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <div class="header">

        <h2>🍽️ Manage Menu</h2>

        <p>Your Restaurant Menu</p>

    </div>


    <div class="container">

        <div
            id="status"
            class="status"
        >
            Loading menu...
        </div>


        <div
            id="menuList"
            class="menu-list"
        >
        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>

    </div>


    <script type="module">

        /* ================================
           FIREBASE IMPORTS
        ================================= */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            getDoc,
            updateDoc,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* ================================
           FIREBASE CONFIGURATION
        ================================= */

        const firebaseConfig = {

            apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* ================================
           INITIALIZE FIREBASE
        ================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        let currentUser = null;


        /* ================================
           CHECK LOGIN
        ================================= */

        onAuthStateChanged(auth, async (user) => {

            if (user) {

                currentUser = user;

                document.getElementById(
                    "status"
                ).textContent =
                    "Loading your menu...";


                await loadMenu();

            }

            else {

                alert(
                    "Please login first."
                );


                window.location.href =
                    "index.html";

            }

        });


        /* ================================
           LOAD MENU
        ================================= */

        async function loadMenu() {

            if (!currentUser) {
                return;
            }


            const restaurantId =
                currentUser.uid;


            const menuCollection =
                collection(
                    db,
                    "restaurants",
                    restaurantId,
                    "menu"
                );


            try {

                const snapshot =
                    await getDocs(
                        menuCollection
                    );


                const menuList =
                    document.getElementById(
                        "menuList"
                    );


                menuList.innerHTML = "";


                /* No menu items */

                if (snapshot.empty) {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "No menu items found.";


                    menuList.innerHTML = `

                        <div class="empty">

                            <h3>
                                🍽️ Your menu is empty
                            </h3>

                            <p>
                                Add your first menu item.
                            </p>

                        </div>

                    `;

                    return;

                }


                /* Show number of items */

                document.getElementById(
                    "status"
                ).textContent =
                    `${snapshot.size} menu item(s)`;


                /* Display every menu item */

                snapshot.forEach((menuDoc) => {

                    const item =
                        menuDoc.data();


                    const itemId =
                        menuDoc.id;


                    const availabilityClass =
                        item.availability === "available"
                        ? "available"
                        : "unavailable";


                    const availabilityText =
                        item.availability === "available"
                        ? "🟢 Available"
                        : "🔴 Unavailable";


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "menu-item";


                    card.innerHTML = `

                        <h3>
                            ${escapeHTML(
                                item.foodName || ""
                            )}
                        </h3>


                        <div class="category">
                            ${escapeHTML(
                                item.category || ""
                            )}
                        </div>


                        <div class="description">
                            ${escapeHTML(
                                item.description ||
                                "No description"
                            )}
                        </div>


                        <div class="price">
                            ₹${Number(
                                item.price || 0
                            ).toFixed(2)}
                        </div>


                        <div
                            class="availability ${availabilityClass}"
                        >
                            ${availabilityText}
                        </div>


                        <div class="buttons">


                            <button
                                class="edit-btn"
                                onclick="editItem('${itemId}')"
                            >
                                ✏️ Edit
                            </button>


                            <button
                                class="toggle-btn"
                                onclick="toggleAvailability(
                                    '${itemId}',
                                    '${item.availability}'
                                )"
                            >
                                🔄 Toggle
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteItem('${itemId}')"
                            >
                                🗑️ Delete
                            </button>


                        </div>

                    `;


                    menuList.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Error loading menu:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "Error loading menu.";


                alert(
                    "Error loading menu:\n\n" +
                    error.message
                );

            }

        }


        /* ================================
           EDIT MENU ITEM
        ================================= */

        window.editItem = async function (itemId) {

            if (!currentUser) {

                alert(
                    "Please login first."
                );

                return;

            }


            const restaurantId =
                currentUser.uid;


            const itemRef =
                doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "menu",
                    itemId
                );


            try {

                /* Get existing item */

                const itemSnapshot =
                    await getDoc(
                        itemRef
                    );


                if (!itemSnapshot.exists()) {

                    alert(
                        "Menu item not found."
                    );

                    return;

                }


                const item =
                    itemSnapshot.data();


                /* Food name */

                const foodName =
                    prompt(
                        "Food Name:",
                        item.foodName || ""
                    );


                if (foodName === null) {
                    return;
                }


                /* Category */

                const category =
                    prompt(
                        "Category:",
                        item.category || ""
                    );


                if (category === null) {
                    return;
                }


                /* Description */

                const description =
                    prompt(
                        "Description:",
                        item.description || ""
                    );


                if (description === null) {
                    return;
                }


                /* Price */

                const price =
                    prompt(
                        "Price (₹):",
                        item.price || ""
                    );


                if (price === null) {
                    return;
                }


                /* Validation */

                if (
                    foodName.trim() === ""
                ) {

                    alert(
                        "Food name cannot be empty."
                    );

                    return;

                }


                if (
                    price === "" ||
                    Number(price) < 0 ||
                    isNaN(Number(price))
                ) {

                    alert(
                        "Please enter a valid price."
                    );

                    return;

                }


                /* Update Firestore */

                await updateDoc(
                    itemRef,
                    {

                        foodName:
                            foodName.trim(),

                        category:
                            category.trim(),

                        description:
                            description.trim(),

                        price:
                            Number(price)

                    }
                );


                alert(
                    "✅ Menu item updated successfully!"
                );


                /* Refresh menu */

                await loadMenu();

            }

            catch (error) {

                console.error(
                    "Edit Error:",
                    error
                );


                alert(
                    "❌ Could not update menu item:\n\n" +
                    error.message
                );

            }

        };


        /* ================================
           TOGGLE AVAILABILITY
        ================================= */

        window.toggleAvailability =
            async function (
                itemId,
                currentAvailability
            ) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const newAvailability =
                    currentAvailability === "available"
                    ? "unavailable"
                    : "available";


                const itemRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "menu",
                        itemId
                    );


                try {

                    await updateDoc(
                        itemRef,
                        {

                            availability:
                                newAvailability

                        }
                    );


                    await loadMenu();

                }

                catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "Could not update availability:\n\n" +
                        error.message
                    );

                }

            };


        /* ================================
           DELETE MENU ITEM
        ================================= */

        window.deleteItem =
            async function (itemId) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const confirmDelete =
                    confirm(
                        "Are you sure you want to delete this menu item?"
                    );


                if (!confirmDelete) {
                    return;
                }


                const itemRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "menu",
                        itemId
                    );


                try {

                    await deleteDoc(
                        itemRef
                    );


                    alert(
                        "Menu item deleted."
                    );


                    await loadMenu();

                }

                catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "Could not delete item:\n\n" +
                        error.message
                    );

                }

            };


        /* ================================
           SECURITY
           Prevent HTML injection
        ================================= */

        function escapeHTML(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ================================
           BACK TO DASHBOARD
        ================================= */

        window.goBack = function () {

            window.location.href =
                "dashboard.html";

        };

    </script>

</body>

</html>
