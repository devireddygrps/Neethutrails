<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Orders</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .order-number {
            font-size: 19px;
            font-weight: bold;
            color: #333;
        }

        .table-number {
            background: #ff5722;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .items {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .item-name {
            font-weight: bold;
        }

        .item-quantity {
            color: #666;
        }

        .instructions {
            background: #fff8e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .instructions strong {
            display: block;
            margin-bottom: 5px;
        }

        .total {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .new {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #cce5ff;
            color: #004085;
        }

        .preparing {
            background: #e2d9f3;
            color: #4a235a;
        }

        .ready {
            background: #d4edda;
            color: #155724;
        }

        .completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 130px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .accept-btn {
            background: #2196f3;
        }

        .prepare-btn {
            background: #9c27b0;
        }

        .ready-btn {
            background: #4caf50;
        }

        .complete-btn {
            background: #00897b;
        }

        .cancel-btn {
            background: #f44336;
        }

        .back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <div class="header">

        <h2>📦 View Orders</h2>

        <p>Restaurant Order Management</p>

    </div>


    <div class="container">

        <div
            id="status"
            class="status"
        >
            Loading orders...
        </div>


        <div
            id="ordersList"
            class="orders-list"
        >
        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>

    </div>


    <script type="module">

        /* ================================
           FIREBASE IMPORTS
        ================================= */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* ================================
           FIREBASE CONFIGURATION
        ================================= */

        const firebaseConfig = {

            apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* ================================
           INITIALIZE FIREBASE
        ================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        let currentUser = null;


        /* ================================
           CHECK LOGIN
        ================================= */

        onAuthStateChanged(auth, async (user) => {

            if (user) {

                currentUser = user;

                await loadOrders();

            }

            else {

                alert(
                    "Please login first."
                );

                window.location.href =
                    "index.html";

            }

        });


        /* ================================
           LOAD ORDERS
        ================================= */

        async function loadOrders() {

            if (!currentUser) {
                return;
            }


            const restaurantId =
                currentUser.uid;


            const ordersCollection =
                collection(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders"
                );


            try {

                const ordersQuery =
                    query(
                        ordersCollection,
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );


                const snapshot =
                    await getDocs(
                        ordersQuery
                    );


                const ordersList =
                    document.getElementById(
                        "ordersList"
                    );


                ordersList.innerHTML = "";


                if (snapshot.empty) {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "No orders yet.";


                    ordersList.innerHTML = `

                        <div class="empty">

                            <h3>
                                📦 No Orders Yet
                            </h3>

                            <p>
                                Customer orders will appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                document.getElementById(
                    "status"
                ).textContent =
                    `${snapshot.size} order(s)`;


                snapshot.forEach((orderDoc) => {

                    const order =
                        orderDoc.data();


                    const orderId =
                        orderDoc.id;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";


                    const status =
                        order.status ||
                        "new";


                    const statusClass =
                        getStatusClass(
                            status
                        );


                    const items =
                        Array.isArray(
                            order.items
                        )
                        ? order.items
                        : [];


                    let itemsHTML = "";


                    items.forEach((item) => {

                        itemsHTML += `

                            <div class="item-row">

                                <div>

                                    <span class="item-name">
                                        ${escapeHTML(
                                            item.name ||
                                            item.foodName ||
                                            ""
                                        )}
                                    </span>

                                    <span class="item-quantity">
                                        × ${Number(
                                            item.quantity || 1
                                        )}
                                    </span>

                                </div>

                                <div>
                                    ₹${(
                                        Number(
                                            item.price || 0
                                        ) *
                                        Number(
                                            item.quantity || 1
                                        )
                                    ).toFixed(2)}
                                </div>

                            </div>

                        `;

                    });


                    card.innerHTML = `

                        <div class="order-header">

                            <div class="order-number">
                                📦 Order #${escapeHTML(
                                    order.orderNumber ||
                                    orderId.substring(0, 6)
                                )}
                            </div>

                            <div class="table-number">
                                🪑 Table ${
                                    escapeHTML(
                                        String(
                                            order.tableNumber ||
                                            "N/A"
                                        )
                                    )
                                }
                            </div>

                        </div>


                        <div
                            class="status-badge ${statusClass}"
                        >
                            ${getStatusText(status)}
                        </div>


                        <div class="items">

                            ${
                                itemsHTML ||
                                "<p>No items found.</p>"
                            }

                        </div>


                        ${
                            order.instructions
                            ? `

                                <div class="instructions">

                                    <strong>
                                        📝 Customer Instructions
                                    </strong>

                                    ${escapeHTML(
                                        order.instructions
                                    )}

                                </div>

                            `
                            : ""
                        }


                        <div class="total">

                            Total:
                            ₹${Number(
                                order.total || 0
                            ).toFixed(2)}

                        </div>


                        <div class="action-buttons">

                            ${
                                status === "new"
                                ? `

                                    <button
                                        class="accept-btn"
                                        onclick="updateOrderStatus(
                                            '${orderId}',
                                            'accepted'
                                        )"
                                    >
                                        ✅ Accept
                                    </button>

                                    <button
                                        class="cancel-btn"
                                        onclick="updateOrderStatus(
                                            '${orderId}',
                                            'cancelled'
                                        )"
                                    >
                                        ❌ Cancel
                                    </button>

                                `
                                : ""
                            }


                            ${
                                status === "accepted"
                                ? `

                                    <button
                                        class="prepare-btn"
                                        onclick="updateOrderStatus(
                                            '${orderId}',
                                            'preparing'
                                        )"
                                    >
                                        👨‍🍳 Start Preparing
                                    </button>

                                `
                                : ""
                            }


                            ${
                                status === "preparing"
                                ? `

                                    <button
                                        class="ready-btn"
                                        onclick="updateOrderStatus(
                                            '${orderId}',
                                            'ready'
                                        )"
                                    >
                                        🍽️ Mark Ready
                                    </button>

                                `
                                : ""
                            }


                            ${
                                status === "ready"
                                ? `

                                    <button
                                        class="complete-btn"
                                        onclick="updateOrderStatus(
                                            '${orderId}',
                                            'completed'
                                        )"
                                    >
                                        ✅ Complete Order
                                    </button>

                                `
                                : ""
                            }

                        </div>

                    `;


                    ordersList.appendChild(card);

                });

            }

            catch (error) {

                console.error(
                    "Error loading orders:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "Error loading orders.";


                alert(
                    "Error loading orders:\n\n" +
                    error.message
                );

            }

        }


        /* ================================
           UPDATE ORDER STATUS
        ================================= */

        window.updateOrderStatus =
            async function (
                orderId,
                newStatus
            ) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders",
                        orderId
                    );


                try {

                    await updateDoc(
                        orderRef,
                        {

                            status:
                                newStatus

                        }
                    );


                    await loadOrders();

                }

                catch (error) {

                    console.error(
                        "Status update error:",
                        error
                    );


                    alert(
                        "Could not update order:\n\n" +
                        error.message
                    );

                }

            };


        /* ================================
           STATUS HELPERS
        ================================= */

        function getStatusClass(status) {

            if (
                status === "accepted"
            ) {
                return "accepted";
            }

            if (
                status === "preparing"
            ) {
                return "preparing";
            }

            if (
                status === "ready"
            ) {
                return "ready";
            }

            if (
                status === "completed"
            ) {
                return "completed";
            }

            if (
                status === "cancelled"
            ) {
                return "cancelled";
            }

            return "new";

        }


        function getStatusText(status) {

            if (
                status === "accepted"
            ) {
                return "🔵 Accepted";
            }

            if (
                status === "preparing"
            ) {
                return "👨‍🍳 Preparing";
            }

            if (
                status === "ready"
            ) {
                return "🟢 Ready";
            }

            if (
                status === "completed"
            ) {
                return "✅ Completed";
            }

            if (
                status === "cancelled"
            ) {
                return "❌ Cancelled";
            }

            return "🆕 New Order";

        }


        /* ================================
           SECURITY
        ================================= */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ================================
           BACK TO DASHBOARD
        ================================= */

        window.goBack = function () {

            window.location.href =
                "dashboard.html";

        };

    </script>

</body>

</html>
