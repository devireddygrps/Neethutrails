<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .cash-payment-alert {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .waiter-alert {
            background: #ffebee;
            color: #b71c1c;
            border: 2px solid #ef5350;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .waiter-alert small {
            display: block;
            margin-top: 7px;
            color: #7f1d1d;
            font-weight: normal;
        }

        .waiter-clear-btn {
            margin-top: 8px;
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            background: #c62828;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .cash-payment-alert small {
            display: block;
            margin-top: 6px;
            color: #8d4b00;
            font-weight: normal;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .order-number {
            font-size: 19px;
            font-weight: bold;
            color: #333;
        }

        .table-number {
            background: #ff5722;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .items {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .item-name {
            font-weight: bold;
        }

        .item-quantity {
            color: #666;
        }

        .instructions {
            background: #fff8e1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .instructions strong {
            display: block;
            margin-bottom: 5px;
        }

        .summary {
            background: #fafafa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #555;
        }

        .summary-row.discount {
            color: #2e7d32;
        }

        .summary-row.total {
            border-top: 1px solid #ddd;
            margin-top: 6px;
            padding-top: 10px;
            color: #222;
            font-size: 19px;
            font-weight: bold;
        }

        .status-badge,
        .payment-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .new {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #cce5ff;
            color: #004085;
        }

        .preparing {
            background: #e2d9f3;
            color: #4a235a;
        }

        .ready {
            background: #d4edda;
            color: #155724;
        }

        .completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .payment-pending {
            background: #fff3cd;
            color: #856404;
        }

        .payment-paid {
            background: #d4edda;
            color: #155724;
        }

        .payment-unavailable {
            background: #eeeeee;
            color: #555;
        }

        .prep-timer {
            background: #f3e5f5;
            color: #4a235a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .prep-timer small {
            display: block;
            margin-top: 4px;
            font-weight: normal;
        }

        .payment-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .payment-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .payment-tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .payment-tab {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #555;
            cursor: pointer;
            font-weight: bold;
        }

        .payment-tab.active {
            background: #ff5722;
            color: white;
            border-color: #ff5722;
        }

        .payment-method-panel {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
        }

        .cash-paid-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cash-paid-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 130px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .accept-btn {
            background: #2196f3;
        }

        .prepare-btn {
            background: #9c27b0;
        }

        .ready-btn {
            background: #4caf50;
        }

        .complete-btn {
            background: #00897b;
        }

        .cancel-btn {
            background: #f44336;
        }

        .back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        .error-box {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef5350;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>📦 View Orders</h2>
        <p>Restaurant Order Management</p>
    </div>

    <div class="container">

        <div id="status" class="status">
            Loading orders...
        </div>

        <div id="waiterAlerts"></div>

        <div id="cashPaymentAlerts" style="margin-bottom:18px;"></div>

        <div id="ordersList" class="orders-list"></div>

        <button class="back-btn" onclick="goBack()">
            ← Back to Dashboard
        </button>

    </div>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =========================================
           FIREBASE CONFIGURATION
        ========================================= */

        const firebaseConfig = {
            apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",
            authDomain: "restaurant-qr-ordering-fdf9b.firebaseapp.com",
            projectId: "restaurant-qr-ordering-fdf9b",
            storageBucket: "restaurant-qr-ordering-fdf9b.firebasestorage.app",
            messagingSenderId: "907571024375",
            appId: "1:907571024375:web:796894f82f2cae4d7b9ef2",
            measurementId: "G-G3Q89BDFF9"
        };


        /* =========================================
           INITIALIZE FIREBASE
        ========================================= */

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let waiterIntervalStarted = false;
        let cashIntervalStarted = false;


        /* =========================================
           AUTHENTICATION
        ========================================= */

        onAuthStateChanged(auth, async (user) => {

            if (user) {

                currentUser = user;

                console.log("Admin logged in:");
                console.log("UID:", currentUser.uid);
                console.log("Email:", currentUser.email);

                await loadOrders();
                await checkWaiterRequests();
                await checkCashPaymentRequests();

                if (!waiterIntervalStarted) {

                    waiterIntervalStarted = true;

                    setInterval(
                        checkWaiterRequests,
                        3000
                    );
                }

                if (!cashIntervalStarted) {

                    cashIntervalStarted = true;

                    setInterval(
                        checkCashPaymentRequests,
                        3000
                    );
                }

            } else {

                alert("Please login first.");

                window.location.href = "index.html";
            }

        });


        /* =========================================
           CHECK WAITER REQUESTS
        ========================================= */

        async function checkWaiterRequests() {

            if (!currentUser) {
                return;
            }

            try {

                const ordersCollection = collection(
                    db,
                    "restaurants",
                    currentUser.uid,
                    "orders"
                );

                const snapshot =
                    await getDocs(ordersCollection);

                const requests = [];

                snapshot.forEach((orderDoc) => {

                    const order = orderDoc.data();

                    if (order.waiterCalled === true) {

                        requests.push({

                            id: orderDoc.id,

                            table:
                                order.table ||
                                order.tableNumber ||
                                "N/A",

                            order:
                                order.orderNumber ||
                                orderDoc.id.substring(0, 6)

                        });

                    }

                });


                const alertBox =
                    document.getElementById(
                        "waiterAlerts"
                    );

                if (!alertBox) {
                    return;
                }


                if (!requests.length) {

                    alertBox.innerHTML = "";

                    return;
                }


                alertBox.innerHTML = `

                    <div class="waiter-alert">

                        🔔 ${requests.length}
                        Waiter Request${requests.length > 1 ? "s" : ""}

                        ${requests.map((request) => `

                            <small>

                                🪑 Table
                                ${escapeHTML(
                                    String(request.table)
                                )}

                                —

                                Order #
                                ${escapeHTML(
                                    String(request.order)
                                )}

                                <button
                                    class="waiter-clear-btn"
                                    onclick="clearWaiterRequest('${request.id}')"
                                >

                                    ✅ Acknowledge / Clear

                                </button>

                            </small>

                        `).join("")}

                    </div>

                `;

            } catch (error) {

                console.error(
                    "Waiter request check error:",
                    error
                );

            }

        }


        /* =========================================
           CLEAR WAITER REQUEST
        ========================================= */

        window.clearWaiterRequest =
            async function(orderId) {

                if (!currentUser) {

                    alert("Please login first.");

                    return;
                }


                const confirmed = confirm(
                    "Confirm that the waiter has attended this table?"
                );


                if (!confirmed) {
                    return;
                }


                try {

                    const orderRef = doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders",
                        orderId
                    );


                    await updateDoc(
                        orderRef,
                        {
                            waiterCalled: false,
                            waiterAcknowledgedAt:
                                serverTimestamp(),
                            updatedAt:
                                serverTimestamp()
                        }
                    );


                    await checkWaiterRequests();

                    await loadOrders();

                } catch (error) {

                    console.error(
                        "Clear waiter request error:",
                        error
                    );

                    alert(
                        "Could not clear waiter request:\n\n" +
                        error.message
                    );

                }

            };


        /* =========================================
           CHECK CASH PAYMENT REQUESTS
        ========================================= */

        async function checkCashPaymentRequests() {

            if (!currentUser) {
                return;
            }

            try {

                const ordersCollection =
                    collection(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders"
                    );


                const snapshot =
                    await getDocs(ordersCollection);


                const requests = [];


                snapshot.forEach((orderDoc) => {

                    const order =
                        orderDoc.data();


                    if (
                        order.cashPaymentRequested === true &&
                        order.paymentStatus !== "paid"
                    ) {

                        requests.push({

                            table:
                                order.tableNumber ||
                                order.table ||
                                "N/A",

                            order:
                                order.orderNumber ||
                                orderDoc.id.substring(0, 6),

                            amount:
                                Number(
                                    order.billTotal ??
                                    order.finalTotal ??
                                    order.total ??
                                    0
                                )

                        });

                    }

                });


                const alertBox =
                    document.getElementById(
                        "cashPaymentAlerts"
                    );


                if (!alertBox) {
                    return;
                }


                if (!requests.length) {

                    alertBox.innerHTML = "";

                    return;
                }


                alertBox.innerHTML = `

                    <div class="cash-payment-alert">

                        🔔 ${requests.length}
                        Cash Payment Request${requests.length > 1 ? "s" : ""}

                        ${requests.map((request) => `

                            <small>

                                💵 Table
                                ${escapeHTML(
                                    String(request.table)
                                )}

                                —

                                Order #
                                ${escapeHTML(
                                    String(request.order)
                                )}

                                —

                                Customer requested cash
                                collection of
                                ₹${request.amount.toFixed(2)}.

                                Please send a waiter
                                to the table.

                            </small>

                        `).join("")}

                    </div>

                `;

            } catch (error) {

                console.error(
                    "Cash payment request check error:",
                    error
                );

            }

        }


        /* =========================================
           LOAD ORDERS
        ========================================= */

        async function loadOrders() {

            if (!currentUser) {

                console.warn(
                    "loadOrders called without user."
                );

                return;
            }


            const restaurantId =
                currentUser.uid;


            console.log(
                "================================"
            );

            console.log(
                "LOADING ORDERS"
            );

            console.log(
                "Admin UID:",
                restaurantId
            );

            console.log(
                "Collection:",
                "restaurants/" +
                restaurantId +
                "/orders"
            );

            console.log(
                "================================"
            );


            const ordersList =
                document.getElementById(
                    "ordersList"
                );

            const statusElement =
                document.getElementById(
                    "status"
                );


            if (!ordersList || !statusElement) {

                console.error(
                    "Orders page elements not found."
                );

                return;
            }


            statusElement.textContent =
                "Loading orders...";


            ordersList.innerHTML = "";


            try {

                const ordersCollection =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders"
                    );


                /*
                 * We intentionally do NOT use
                 * orderBy().
                 *
                 * This avoids Firestore index problems.
                 */

                const snapshot =
                    await getDocs(
                        ordersCollection
                    );


                console.log(
                    "Orders found:",
                    snapshot.size
                );


                if (snapshot.empty) {

                    statusElement.textContent =
                        "No orders yet.";


                    ordersList.innerHTML = `

                        <div class="empty">

                            <h3>
                                📦 No Orders Yet
                            </h3>

                            <p>
                                Customer orders will
                                appear here.
                            </p>

                        </div>

                    `;

                    return;
                }


                const orders = [];


                snapshot.forEach(
                    (orderDoc) => {

                        orders.push({

                            id:
                                orderDoc.id,

                            ...orderDoc.data()

                        });

                    }
                );


                /*
                 * Sort newest orders first.
                 */

                orders.sort(
                    (a, b) => {

                        const aTime =
                            getTimestampMillis(
                                a.createdAt
                            );

                        const bTime =
                            getTimestampMillis(
                                b.createdAt
                            );

                        return bTime - aTime;

                    }
                );


                statusElement.textContent =
                    `${orders.length} order(s)`;


                /*
                 * Render orders.
                 */

                orders.forEach(
                    (order) => {

                        renderOrder(
                            order,
                            ordersList
                        );

                    }
                );


                startPreparationTimers();


            } catch (error) {

                console.error(
                    "🔥 ERROR LOADING ORDERS:",
                    error
                );


                console.error(
                    "Error code:",
                    error.code
                );


                console.error(
                    "Error message:",
                    error.message
                );


                statusElement.innerHTML = `

                    <div class="error-box">

                        ❌ Unable to load orders.

                        <br><br>

                        <strong>
                            Firebase error:
                        </strong>

                        <br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* =========================================
           RENDER SINGLE ORDER
        ========================================= */

        function renderOrder(
            order,
            ordersList
        ) {

            const orderId =
                order.id;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            /*
             * Preparation timer data.
             */

            if (
                order.preparingStartedAt
            ) {

                const preparingMillis =
                    getTimestampMillis(
                        order.preparingStartedAt
                    );


                if (preparingMillis) {

                    card.dataset.preparingStartedAt =
                        preparingMillis;

                }

            }


            const status =
                order.status ||
                "new";


            const statusClass =
                getStatusClass(
                    status
                );


            const items =
                Array.isArray(
                    order.items
                )
                    ?
                order.items
                    :
                [];


            let itemsHTML = "";


            items.forEach(
                (item) => {

                    const quantity =
                        Number(
                            item.quantity || 1
                        );


                    const price =
                        Number(
                            item.price || 0
                        );


                    itemsHTML += `

                        <div class="item-row">

                            <div>

                                <span class="item-name">

                                    ${escapeHTML(
                                        item.name ||
                                        item.foodName ||
                                        ""
                                    )}

                                </span>

                                <span class="item-quantity">

                                    × ${quantity}

                                </span>

                            </div>

                            <div>

                                ₹${(
                                    price *
                                    quantity
                                ).toFixed(2)}

                            </div>

                        </div>

                    `;

                }
            );


            const subtotal =
                Number(
                    order.subtotal ??
                    order.total ??
                    0
                );


            const discountAmount =
                Number(
                    order.discountAmount ||
                    0
                );


            const discountPercent =
                Number(
                    order.discountPercent ||
                    0
                );


            const finalTotal =
                Number(
                    order.finalTotal ??
                    order.total ??
                    Math.max(
                        0,
                        subtotal -
                        discountAmount
                    )
                );


            const paymentStatus =
                order.paymentStatus ||
                "pending";


            /*
             * Notifications.
             */

            let notificationHTML =
                "";


            if (
                order.waiterCalled === true
            ) {

                notificationHTML += `

                    <div style="
                        background:#fff3cd;
                        color:#856404;
                        padding:14px;
                        border-radius:10px;
                        margin-bottom:12px;
                        font-weight:bold;
                        border:1px solid #ffe08a;
                    ">

                        🔔 WAITER REQUEST

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Customer at Table
                            ${escapeHTML(
                                String(
                                    order.table ||
                                    order.tableNumber ||
                                    "N/A"
                                )
                            )}
                            has called a waiter.

                        </small>

                    </div>

                `;

            }


            if (
                order.billRequested === true &&
                !order.billGenerated
            ) {

                notificationHTML += `

                    <div style="
                        background:#e3f2fd;
                        color:#1565c0;
                        padding:14px;
                        border-radius:10px;
                        margin-bottom:12px;
                        font-weight:bold;
                        border:1px solid #90caf9;
                    ">

                        🧾 BILL REQUEST

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Customer has requested
                            the bill.

                        </small>

                    </div>

                `;

            }


            if (
                order.cashPaymentRequested === true &&
                paymentStatus !== "paid"
            ) {

                notificationHTML += `

                    <div style="
                        background:#fff3e0;
                        color:#e65100;
                        padding:14px;
                        border-radius:10px;
                        margin-bottom:12px;
                        font-weight:bold;
                        border:1px solid #ffcc80;
                    ">

                        💵 CASH PAYMENT REQUEST

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Customer is ready
                            to pay cash.

                        </small>

                    </div>

                `;

            }


            /*
             * Main order card.
             */

            card.innerHTML = `

                ${notificationHTML}


                <div class="order-header">

                    <div class="order-number">

                        Order #
                        ${escapeHTML(
                            order.orderNumber ||
                            orderId.substring(0, 6)
                        )}

                    </div>


                    <div class="table-number">

                        🪑 Table
                        ${escapeHTML(
                            String(
                                order.table ||
                                order.tableNumber ||
                                "N/A"
                            )
                        )}

                    </div>

                </div>


                <div class="status-badge ${statusClass}">

                    ${getStatusText(
                        status
                    )}

                </div>


                ${
                    status === "preparing" &&
                    order.preparingStartedAt
                    ?
                    `

                    <div class="prep-timer">

                        ⏱️ Preparation Time

                        <span
                            id="prepTimer-${escapeHTML(
                                orderId
                            )}"
                        >
                            — 0m 00s
                        </span>

                        <small>
                            Time since preparation started.
                        </small>

                    </div>

                    `
                    :
                    ""
                }


                <div class="items">

                    ${
                        itemsHTML ||
                        "<p>No items found.</p>"
                    }

                </div>


                <div class="summary">

                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span>
                            ₹${subtotal.toFixed(2)}
                        </span>

                    </div>


                    ${
                        discountAmount > 0

                        ?

                        `

                        <div class="summary-row discount">

                            <span>

                                Discount

                                ${
                                    discountPercent > 0
                                    ?
                                    `(${discountPercent}%)`
                                    :
                                    ""
                                }

                            </span>

                            <span>

                                -₹${discountAmount.toFixed(2)}

                            </span>

                        </div>

                        `

                        :

                        ""

                    }


                    <div class="summary-row total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹${finalTotal.toFixed(2)}
                        </span>

                    </div>

                </div>


                <div class="payment-badge ${
                    getPaymentClass(
                        paymentStatus,
                        status
                    )
                }">

                    ${
                        getPaymentText(
                            paymentStatus,
                            status
                        )
                    }

                </div>


                ${
                    order.billGenerated

                    ?

                    `

                    <div class="payment-info">

                        <strong>
                            🧾 Bill Generated
                        </strong>

                        Customer can now
                        view the bill and pay.

                    </div>

                    `

                    :

                    ""

                }


                ${
                    status === "completed" &&
                    order.billRequested &&
                    !order.billGenerated

                    ?

                    `

                    <div style="
                        margin-bottom:12px;
                    ">

                        <button
                            class="complete-btn"
                            style="width:100%;"
                            onclick="generateBill('${orderId}')"
                        >

                            🧾 Generate Bill

                        </button>

                    </div>

                    `

                    :

                    ""

                }


                <div class="action-buttons">


                    ${
                        status === "new"

                        ?

                        `

                        <button
                            class="accept-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'accepted'
                            )"
                        >

                            ✅ Accept

                        </button>


                        <button
                            class="cancel-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'cancelled'
                            )"
                        >

                            ❌ Cancel

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        status === "accepted"

                        ?

                        `

                        <button
                            class="prepare-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'preparing'
                            )"
                        >

                            👨‍🍳 Start Preparing

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        status === "preparing"

                        ?

                        `

                        <button
                            class="ready-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'ready'
                            )"
                        >

                            🍽️ Mark Ready

                        </button>

                        `

                        :

                        ""

                    }


                    ${
                        status === "ready"

                        ?

                        `

                        <button
                            class="complete-btn"
                            onclick="updateOrderStatus(
                                '${orderId}',
                                'completed'
                            )"
                        >

                            ✅ Complete Order

                        </button>

                        `

                        :

                        ""

                    }


                </div>

            `;


            ordersList.appendChild(
                card
            );

        }


        /* =========================================
           GENERATE BILL
        ========================================= */

        window.generateBill =
            async function(orderId) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;
                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders",
                        orderId
                    );


                try {

                    const ordersSnapshot =
                        await getDocs(
                            collection(
                                db,
                                "restaurants",
                                currentUser.uid,
                                "orders"
                            )
                        );


                    let orderData =
                        null;


                    ordersSnapshot.forEach(
                        (snap) => {

                            if (
                                snap.id === orderId
                            ) {

                                orderData =
                                    snap.data();

                            }

                        }
                    );


                    if (!orderData) {

                        alert(
                            "Order not found."
                        );

                        return;
                    }


                    if (
                        orderData.status !==
                        "completed"
                    ) {

                        alert(
                            "The order must be Delivered before generating the bill."
                        );

                        return;
                    }


                    if (
                        !orderData.billRequested
                    ) {

                        alert(
                            "The customer has not requested the bill yet."
                        );

                        return;
                    }


                    const subtotal =
                        Number(
                            orderData.subtotal ??
                            orderData.total ??
                            0
                        );


                    const discountAmount =
                        Number(
                            orderData.discountAmount ||
                            0
                        );


                    const finalTotal =
                        Number(
                            orderData.finalTotal ??
                            orderData.total ??
                            Math.max(
                                0,
                                subtotal -
                                discountAmount
                            )
                        );


                    await updateDoc(
                        orderRef,
                        {

                            billGenerated:
                                true,

                            billGeneratedAt:
                                serverTimestamp(),

                            billSubtotal:
                                subtotal,

                            billDiscountAmount:
                                discountAmount,

                            billTotal:
                                finalTotal

                        }
                    );


                    await loadOrders();


                } catch (error) {

                    console.error(
                        "Bill generation error:",
                        error
                    );


                    alert(
                        "Could not generate bill:\n\n" +
                        error.message
                    );

                }

            };


        /* =========================================
           UPDATE ORDER STATUS
        ========================================= */

        window.updateOrderStatus =
            async function(
                orderId,
                newStatus
            ) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;
                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders",
                        orderId
                    );


                try {

                    const updateData = {

                        status:
                            newStatus

                    };


                    /*
                     * START PREPARING
                     */

                    if (
                        newStatus ===
                        "preparing"
                    ) {

                        updateData.preparingStartedAt =
                            serverTimestamp();

                    }


                    /*
                     * MARK READY
                     */

                    if (
                        newStatus ===
                        "ready"
                    ) {

                        const existingOrders =
                            await getDocs(
                                collection(
                                    db,
                                    "restaurants",
                                    currentUser.uid,
                                    "orders"
                                )
                            );


                        let startMillis =
                            null;


                        existingOrders.forEach(
                            (snap) => {

                                if (
                                    snap.id ===
                                    orderId
                                ) {

                                    const data =
                                        snap.data();


                                    if (
                                        data.preparingStartedAt
                                    ) {

                                        startMillis =
                                            getTimestampMillis(
                                                data.preparingStartedAt
                                            );

                                    }

                                }

                            }
                        );


                        if (startMillis) {

                            const minutes =
                                (
                                    Date.now() -
                                    startMillis
                                ) / 60000;


                            updateData.preparationTimeMinutes =
                                Math.max(
                                    0,
                                    Number(
                                        minutes.toFixed(
                                            1
                                        )
                                    )
                                );


                            updateData.readyAt =
                                serverTimestamp();

                        }

                    }


                    /*
                     * COMPLETED
                     */

                    if (
                        newStatus ===
                        "completed"
                    ) {

                        updateData.deliveredAt =
                            serverTimestamp();

                    }


                    await updateDoc(
                        orderRef,
                        updateData
                    );


                    await loadOrders();


                } catch (error) {

                    console.error(
                        "Status update error:",
                        error
                    );


                    alert(
                        "Could not update order:\n\n" +
                        error.message
                    );

                }

            };


        /* =========================================
           PREPARATION TIMERS
        ========================================= */

        function startPreparationTimers() {

            document
                .querySelectorAll(
                    "[id^='prepTimer-']"
                )
                .forEach(
                    (element) => {

                        const card =
                            element.closest(
                                ".order-card"
                            );


                        const startedAt =
                            card &&
                            card.dataset
                                .preparingStartedAt
                                ?
                            Number(
                                card.dataset
                                    .preparingStartedAt
                            )
                                :
                            null;


                        if (!startedAt) {
                            return;
                        }


                        const updateTimer =
                            () => {

                                const elapsed =
                                    Math.max(
                                        0,
                                        Date.now() -
                                        startedAt
                                    );


                                const totalSeconds =
                                    Math.floor(
                                        elapsed /
                                        1000
                                    );


                                const minutes =
                                    Math.floor(
                                        totalSeconds /
                                        60
                                    );


                                const seconds =
                                    totalSeconds %
                                    60;


                                element.textContent =
                                    ` — ${minutes}m ${String(
                                        seconds
                                    ).padStart(
                                        2,
                                        "0"
                                    )}s`;

                            };


                        updateTimer();


                        setInterval(
                            updateTimer,
                            1000
                        );

                    }
                );

        }


        /* =========================================
           PAYMENT TAB
        ========================================= */

        window.showPaymentTab =
            function(
                orderId,
                method
            ) {

                const cashPanel =
                    document.getElementById(
                        "cash-panel-" +
                        orderId
                    );


                const upiPanel =
                    document.getElementById(
                        "upi-panel-" +
                        orderId
                    );


                const cashTab =
                    document.getElementById(
                        "cash-tab-" +
                        orderId
                    );


                const upiTab =
                    document.getElementById(
                        "upi-tab-" +
                        orderId
                    );


                if (
                    !cashPanel ||
                    !upiPanel ||
                    !cashTab ||
                    !upiTab
                ) {

                    return;
                }


                if (
                    method === "upi"
                ) {

                    cashPanel.style.display =
                        "none";

                    upiPanel.style.display =
                        "block";

                    cashTab.classList.remove(
                        "active"
                    );

                    upiTab.classList.add(
                        "active"
                    );

                } else {

                    cashPanel.style.display =
                        "block";

                    upiPanel.style.display =
                        "none";

                    cashTab.classList.add(
                        "active"
                    );

                    upiTab.classList.remove(
                        "active"
                    );

                }

            };


        /* =========================================
           MARK CASH PAYMENT DONE
        ========================================= */

        window.markCashPaymentDone =
            async function(orderId) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );

                    return;
                }


                const confirmed =
                    confirm(
                        "Confirm that the customer has paid the full bill in cash?"
                    );


                if (!confirmed) {
                    return;
                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders",
                        orderId
                    );


                try {

                    await updateDoc(
                        orderRef,
                        {

                            paymentStatus:
                                "paid",

                            paymentMethod:
                                "cash",

                            paidAt:
                                serverTimestamp(),

                            cashPaymentRequested:
                                false,

                            cashPaymentCollected:
                                true,

                            waiterCalled:
                                false,

                            cashPaymentCollectedAt:
                                serverTimestamp()

                        }
                    );


                    alert(
                        "✅ Cash payment marked as paid."
                    );


                    await loadOrders();


                } catch (error) {

                    console.error(
                        "Cash payment update error:",
                        error
                    );


                    alert(
                        "Could not mark cash payment as paid:\n\n" +
                        error.message
                    );

                }

            };


        /* =========================================
           STATUS HELPERS
        ========================================= */

        function getStatusClass(
            status
        ) {

            if (
                status === "accepted"
            ) {

                return "accepted";

            }


            if (
                status === "preparing"
            ) {

                return "preparing";

            }


            if (
                status === "ready"
            ) {

                return "ready";

            }


            if (
                status === "completed"
            ) {

                return "completed";

            }


            if (
                status === "cancelled"
            ) {

                return "cancelled";

            }


            return "new";

        }


        function getStatusText(
            status
        ) {

            if (
                status === "accepted"
            ) {

                return "🔵 Accepted";

            }


            if (
                status === "preparing"
            ) {

                return "👨‍🍳 Preparing";

            }


            if (
                status === "ready"
            ) {

                return "🟢 Ready";

            }


            if (
                status === "completed"
            ) {

                return "🚚 Delivered";

            }


            if (
                status === "cancelled"
            ) {

                return "❌ Cancelled";

            }


            return "🆕 New Order";

        }


        function getPaymentClass(
            paymentStatus,
            orderStatus
        ) {

            if (
                paymentStatus === "paid"
            ) {

                return "payment-paid";

            }


            if (
                orderStatus === "completed"
            ) {

                return "payment-pending";

            }


            return "payment-unavailable";

        }


        function getPaymentText(
            paymentStatus,
            orderStatus
        ) {

            if (
                paymentStatus === "paid"
            ) {

                return "✅ Payment Paid";

            }


            if (
                orderStatus === "completed"
            ) {

                return "⏳ Payment Pending";

            }


            return "🔒 Payment Not Available Yet";

        }


        /* =========================================
           FIREBASE TIMESTAMP HELPER
        ========================================= */

        function getTimestampMillis(
            value
        ) {

            if (!value) {
                return 0;
            }


            if (
                typeof value.toMillis ===
                "function"
            ) {

                return value.toMillis();

            }


            if (
                value.seconds !== undefined
            ) {

                return (
                    Number(value.seconds) *
                    1000
                );

            }


            if (
                value instanceof Date
            ) {

                return value.getTime();

            }


            if (
                typeof value === "string"
            ) {

                const parsed =
                    Date.parse(value);

                return Number.isNaN(parsed)
                    ? 0
                    : parsed;

            }


            return 0;

        }


        /* =========================================
           HTML ESCAPE
        ========================================= */

        function escapeHTML(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================
           BACK TO DASHBOARD
        ========================================= */

        window.goBack =
            function() {

                window.location.href =
                    "dashboard.html";

            };

    </script>
