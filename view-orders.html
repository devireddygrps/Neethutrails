<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Orders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
.header{background:#ff5722;color:white;padding:18px;text-align:center}
.header h2{margin-bottom:5px}
.container{max-width:900px;margin:25px auto;padding:20px}
.status{text-align:center;color:#666;margin-bottom:20px}
.orders-list{display:grid;gap:18px}
.order-card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:10px}
.order-number{font-size:19px;font-weight:bold;color:#333}
.table-number{background:#ff5722;color:white;padding:6px 10px;border-radius:15px;font-size:13px}
.items{border-top:1px solid #eee;border-bottom:1px solid #eee;padding:12px 0;margin-bottom:12px}
.item-row{display:flex;justify-content:space-between;padding:7px 0}
.item-name{font-weight:bold}.item-quantity{color:#666}
.instructions{background:#fff8e1;padding:12px;border-radius:8px;margin-bottom:12px}
.instructions strong{display:block;margin-bottom:5px}
.total{font-size:19px;font-weight:bold;margin-bottom:15px}
.status-badge,.bill-requested-badge{display:inline-block;padding:7px 12px;border-radius:15px;font-size:13px;font-weight:bold;margin-bottom:12px}
.new{background:#fff3cd;color:#856404}.accepted{background:#cce5ff;color:#004085}
.preparing{background:#e2d9f3;color:#4a235a}.ready{background:#d4edda;color:#155724}
.completed{background:#d1ecf1;color:#0c5460}.cancelled{background:#f8d7da;color:#721c24}
.bill-requested-badge{background:#fff0c2;color:#8a5a00}
.action-buttons{display:flex;gap:10px;flex-wrap:wrap}
.action-buttons button{flex:1;min-width:130px;padding:10px;border:none;border-radius:7px;color:white;cursor:pointer;font-size:14px}
.accept-btn{background:#2196f3}.prepare-btn{background:#9c27b0}.ready-btn{background:#4caf50}
.complete-btn{background:#00897b}.cancel-btn{background:#f44336}.bill-btn{background:#ff9800}
.back-btn{width:100%;margin-top:20px;padding:13px;background:#333;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.empty{background:white;padding:35px;text-align:center;border-radius:12px;color:#666}
.bill-box{margin:15px 0;padding:15px;border:2px solid #ff9800;border-radius:10px;background:#fffaf2}
.bill-box h3{margin-bottom:12px}.bill-row{display:flex;justify-content:space-between;padding:6px 0}
.bill-total{font-size:18px;font-weight:bold;border-top:1px solid #ddd;margin-top:8px;padding-top:10px}
@media(max-width:600px){
.container{padding:15px}.order-header{align-items:flex-start;flex-direction:column}
.action-buttons{flex-direction:column}.action-buttons button{width:100%}
}
</style>
</head>
<body>

<div class="header">
<h2>📦 View Orders</h2>
<p>Restaurant Order Management</p>
</div>

<div class="container">
<div id="status" class="status">Loading orders...</div>
<div id="ordersList" class="orders-list"></div>
<button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
    getFirestore, collection, getDocs, doc, updateDoc,
    query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",
    authDomain:"restaurant-qr-ordering-fdf9b.firebaseapp.com",
    projectId:"restaurant-qr-ordering-fdf9b",
    storageBucket:"restaurant-qr-ordering-fdf9b.firebasestorage.app",
    messagingSenderId:"907571024375",
    appId:"1:907571024375:web:796894f82f2cae4d7b9ef2",
    measurementId:"G-G3Q89BDFF9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentUser=null;

onAuthStateChanged(auth,async user=>{
    if(user){
        currentUser=user;
        await loadOrders();
    }else{
        alert("Please login first.");
        window.location.href="index.html";
    }
});

async function loadOrders(){
    if(!currentUser)return;

    const restaurantId=currentUser.uid;
    const ordersCollection=collection(db,"restaurants",restaurantId,"orders");

    try{
        const ordersQuery=query(ordersCollection,orderBy("createdAt","desc"));
        const snapshot=await getDocs(ordersQuery);
        const ordersList=document.getElementById("ordersList");
        ordersList.innerHTML="";

        if(snapshot.empty){
            document.getElementById("status").textContent="No orders yet.";
            ordersList.innerHTML=`<div class="empty">
                <h3>📦 No Orders Yet</h3>
                <p>Customer orders will appear here.</p>
            </div>`;
            return;
        }

        document.getElementById("status").textContent=`${snapshot.size} order(s)`;

        snapshot.forEach(orderDoc=>{
            const order=orderDoc.data();
            const orderId=orderDoc.id;
            const card=document.createElement("div");
            card.className="order-card";

            const status=order.status||"new";
            const items=Array.isArray(order.items)?order.items:[];

            let itemsHTML="";
            items.forEach(item=>{
                const qty=Number(item.quantity||1);
                const price=Number(item.price||0);
                itemsHTML+=`<div class="item-row">
                    <div>
                        <span class="item-name">${escapeHTML(item.name||item.foodName||"")}</span>
                        <span class="item-quantity"> × ${qty}</span>
                    </div>
                    <div>₹${(price*qty).toFixed(2)}</div>
                </div>`;
            });

            const billRequested=order.billRequested===true;
            const billGenerated=order.billGenerated===true;

            const subtotal=Number(order.billSubtotal ?? order.subtotal ?? order.total ?? 0);
            const discount=Number(order.billDiscountAmount ?? order.discountAmount ?? 0);
            const billTotal=Number(
                order.billTotal ??
                order.finalTotal ??
                Math.max(0,subtotal-discount)
            );

            card.innerHTML=`
                <div class="order-header">
                    <div class="order-number">📦 Order #${escapeHTML(order.orderNumber||orderId.substring(0,6))}</div>
                    <div class="table-number">🪑 Table ${escapeHTML(String(order.tableNumber||"N/A"))}</div>
                </div>

                <div class="status-badge ${getStatusClass(status)}">${getStatusText(status)}</div>

                ${billRequested ? `
                    <div class="bill-requested-badge">
                        🧾 Customer has requested the bill
                    </div>
                ` : ""}

                <div class="items">${itemsHTML||"<p>No items found.</p>"}</div>

                ${order.instructions ? `
                    <div class="instructions">
                        <strong>📝 Customer Instructions</strong>
                        ${escapeHTML(order.instructions)}
                    </div>
                ` : ""}

                <div class="total">Order Total: ₹${Number(order.total||0).toFixed(2)}</div>

                ${billGenerated ? `
                    <div class="bill-box">
                        <h3>🧾 Generated Bill</h3>
                        <div class="bill-row"><span>Subtotal</span><strong>₹${subtotal.toFixed(2)}</strong></div>
                        <div class="bill-row"><span>Discount</span><strong>- ₹${discount.toFixed(2)}</strong></div>
                        <div class="bill-row bill-total"><span>Final Amount</span><strong>₹${billTotal.toFixed(2)}</strong></div>
                        <p style="margin-top:10px;color:#16803c;font-weight:bold;">✅ Bill is available to customer</p>
                    </div>
                ` : ""}

                <div class="action-buttons">
                    ${status==="new" ? `
                        <button class="accept-btn" onclick="updateOrderStatus('${orderId}','accepted')">✅ Accept</button>
                        <button class="cancel-btn" onclick="updateOrderStatus('${orderId}','cancelled')">❌ Cancel</button>
                    ` : ""}

                    ${status==="accepted" ? `
                        <button class="prepare-btn" onclick="updateOrderStatus('${orderId}','preparing')">👨‍🍳 Start Preparing</button>
                    ` : ""}

                    ${status==="preparing" ? `
                        <button class="ready-btn" onclick="updateOrderStatus('${orderId}','ready')">🍽️ Mark Ready</button>
                    ` : ""}

                    ${status==="ready" ? `
                        <button class="complete-btn" onclick="updateOrderStatus('${orderId}','completed')">✅ Mark Delivered</button>
                    ` : ""}

                    ${billRequested && !billGenerated ? `
                        <button class="bill-btn" onclick="generateBill('${orderId}')">🧾 Generate Bill</button>
                    ` : ""}
                </div>
            `;

            ordersList.appendChild(card);
        });
    }catch(error){
        console.error("Error loading orders:",error);
        document.getElementById("status").textContent="Error loading orders.";
        alert("Error loading orders:\\n\\n"+error.message);
    }
}

window.updateOrderStatus=async function(orderId,newStatus){
    if(!currentUser){alert("Please login first.");return;}

    const orderRef=doc(db,"restaurants",currentUser.uid,"orders",orderId);

    try{
        await updateDoc(orderRef,{status:newStatus});
        await loadOrders();
    }catch(error){
        console.error("Status update error:",error);
        alert("Could not update order:\\n\\n"+error.message);
    }
};

/* =========================================
   GENERATE BILL
   Appears only after customer requests bill.
   ========================================= */
window.generateBill=async function(orderId){
    if(!currentUser){alert("Please login first.");return;}

    const discountInput=prompt("Enter discount amount in ₹:", "0");

    if(discountInput===null)return;

    const discount=Number(discountInput);

    if(!Number.isFinite(discount)||discount<0){
        alert("Please enter a valid discount amount.");
        return;
    }

    const orderRef=doc(
        db,
        "restaurants",
        currentUser.uid,
        "orders",
        orderId
    );

    try{
        const orderSnap=await getDocs(
            query(
                collection(db,"restaurants",currentUser.uid,"orders"),
                orderBy("createdAt","desc")
            )
        );

        let orderData=null;
        orderSnap.forEach(d=>{
            if(d.id===orderId)orderData=d.data();
        });

        if(!orderData){
            alert("Order not found.");
            return;
        }

        const subtotal=Number(
            orderData.subtotal ??
            orderData.total ??
            0
        );

        const safeDiscount=Math.min(discount,subtotal);
        const finalTotal=Math.max(0,subtotal-safeDiscount);

        await updateDoc(orderRef,{
            billGenerated:true,
            billSubtotal:subtotal,
            billDiscountAmount:safeDiscount,
            billTotal:finalTotal,
            finalTotal:finalTotal,
            billGeneratedAt:serverTimestamp()
        });

        alert("Bill generated successfully.");
        await loadOrders();

    }catch(error){
        console.error("Generate bill error:",error);
        alert("Could not generate bill:\\n\\n"+error.message);
    }
};

function getStatusClass(status){
    if(status==="accepted")return"accepted";
    if(status==="preparing")return"preparing";
    if(status==="ready")return"ready";
    if(status==="completed")return"completed";
    if(status==="cancelled")return"cancelled";
    return"new";
}

function getStatusText(status){
    if(status==="accepted")return"🔵 Accepted";
    if(status==="preparing")return"👨‍🍳 Preparing";
    if(status==="ready")return"🟢 Ready";
    if(status==="completed")return"🚚 Delivered";
    if(status==="cancelled")return"❌ Cancelled";
    return"🆕 New Order";
}

function escapeHTML(value){
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

window.goBack=function(){
    window.location.href="dashboard.html";
};
</script>
</body>
</html>
