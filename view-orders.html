<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Orders</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding-bottom: 30px;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .cash-payment-alert {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc80;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .waiter-alert {
            background: #ffebee;
            color: #b71c1c;
            border: 2px solid #ef5350;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .waiter-alert small,
        .cash-payment-alert small {
            display: block;
            margin-top: 7px;
            font-weight: normal;
        }

        .waiter-alert small {
            color: #7f1d1d;
        }

        .cash-payment-alert small {
            color: #8d4b00;
        }

        .waiter-clear-btn {
            margin-top: 8px;
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            background: #c62828;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .order-number {
            font-size: 19px;
            font-weight: bold;
            color: #333;
        }

        .table-number {
            background: #ff5722;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        .items {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .item-name {
            font-weight: bold;
        }

        .item-quantity {
            color: #666;
        }

        .summary {
            background: #fafafa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: #555;
        }

        .summary-row.discount {
            color: #2e7d32;
        }

        .summary-row.total {
            border-top: 1px solid #ddd;
            margin-top: 6px;
            padding-top: 10px;
            color: #222;
            font-size: 19px;
            font-weight: bold;
        }

        .status-badge,
        .payment-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .new {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #cce5ff;
            color: #004085;
        }

        .preparing {
            background: #e2d9f3;
            color: #4a235a;
        }

        .ready {
            background: #d4edda;
            color: #155724;
        }

        .completed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .payment-pending {
            background: #fff3cd;
            color: #856404;
        }

        .payment-paid {
            background: #d4edda;
            color: #155724;
        }

        .payment-selected {
            background: #e3f2fd;
            color: #1565c0;
        }

        .payment-unavailable {
            background: #eeeeee;
            color: #555;
        }

        .prep-timer {
            background: #f3e5f5;
            color: #4a235a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .prep-timer small {
            display: block;
            margin-top: 4px;
            font-weight: normal;
        }

        .payment-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .payment-info strong {
            display: block;
            margin-bottom: 6px;
        }

        .bill-request-box {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .generate-bill-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-bill-btn:hover {
            background: #e64a19;
        }

        .generate-bill-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .bill-generated-box {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #81c784;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .bill-amount {
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #ff5722;
        }

        .payment-tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .payment-tab {
            flex: 1;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #555;
            cursor: pointer;
            font-weight: bold;
        }

        .payment-tab.active {
            background: #ff5722;
            color: white;
            border-color: #ff5722;
        }

        .payment-method-panel {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-top: 8px;
        }

        .cash-paid-btn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cash-paid-btn:hover {
            background: #388e3c;
        }

        .cash-paid-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 130px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .accept-btn {
            background: #2196f3;
        }

        .prepare-btn {
            background: #9c27b0;
        }

        .ready-btn {
            background: #4caf50;
        }

        .complete-btn {
            background: #00897b;
        }

        .cancel-btn {
            background: #f44336;
        }

        .back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        .error-box {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef5350;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .order-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons button {
                width: 100%;
            }

            .payment-tabs {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h2>
            📦 View Orders
        </h2>

        <p>
            Restaurant Order Management
        </p>

    </div>


    <div class="container">

        <div
            id="status"
            class="status"
        >
            Loading orders...
        </div>


        <div id="waiterAlerts"></div>


        <div id="cashPaymentAlerts"></div>


        <div
            id="ordersList"
            class="orders-list"
        ></div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>

    </div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


let currentUser = null;

let waiterIntervalStarted = false;

let cashIntervalStarted = false;

let ordersIntervalStarted = false;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {

        if (!user) {

            alert(
                "Please login first."
            );

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        console.log(
            "Admin logged in:",
            currentUser.uid
        );


        await loadOrders();

        await checkWaiterRequests();

        await checkCashPaymentRequests();


        /*
         * Keep admin page updated automatically.
         */

        if (
            !ordersIntervalStarted
        ) {

            ordersIntervalStarted =
                true;


            setInterval(
                loadOrders,
                3000
            );

        }


        if (
            !waiterIntervalStarted
        ) {

            waiterIntervalStarted =
                true;


            setInterval(
                checkWaiterRequests,
                3000
            );

        }


        if (
            !cashIntervalStarted
        ) {

            cashIntervalStarted =
                true;


            setInterval(
                checkCashPaymentRequests,
                3000
            );

        }

    }
);


/* =====================================================
   CHECK WAITER REQUESTS
===================================================== */

async function checkWaiterRequests() {

    if (!currentUser) {
        return;
    }


    try {

        const ordersCollection =
            collection(
                db,
                "restaurants",
                currentUser.uid,
                "orders"
            );


        const snapshot =
            await getDocs(
                ordersCollection
            );


        const requests = [];


        snapshot.forEach(
            function(orderDoc) {

                const order =
                    orderDoc.data();


                if (
                    order.waiterCalled === true
                ) {

                    requests.push({

                        id:
                            orderDoc.id,

                        table:
                            order.table ||
                            order.tableNumber ||
                            "N/A",

                        order:
                            order.orderNumber ||
                            orderDoc.id.substring(
                                0,
                                6
                            )

                    });

                }

            }
        );


        const alertBox =
            document.getElementById(
                "waiterAlerts"
            );


        if (!alertBox) {
            return;
        }


        if (!requests.length) {

            alertBox.innerHTML =
                "";

            return;

        }


        alertBox.innerHTML = `

            <div class="waiter-alert">

                🔔 ${requests.length}
                Waiter Request
                ${requests.length > 1 ? "s" : ""}

                ${requests.map(
                    function(request) {

                        return `

                            <small>

                                🪑 Table
                                ${escapeHTML(
                                    String(
                                        request.table
                                    )
                                )}

                                —

                                Order #
                                ${escapeHTML(
                                    String(
                                        request.order
                                    )
                                )}

                                <br>

                                <button
                                    class="waiter-clear-btn"
                                    onclick="
                                        clearWaiterRequest(
                                            '${escapeHTML(
                                                request.id
                                            )}'
                                        )
                                    "
                                >

                                    ✅
                                    Acknowledge / Clear

                                </button>

                            </small>

                        `;

                    }
                ).join("")}

            </div>

        `;

    }
    catch(error) {

        console.error(
            "Waiter request error:",
            error
        );

    }

}


/* =====================================================
   CLEAR WAITER REQUEST
===================================================== */

window.clearWaiterRequest =
    async function(orderId) {

        if (!currentUser) {

            alert(
                "Please login first."
            );

            return;

        }


        const confirmed =
            confirm(
                "Confirm that the waiter has attended this table?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const orderRef =
                doc(
                    db,
                    "restaurants",
                    currentUser.uid,
                    "orders",
                    orderId
                );


            await updateDoc(
                orderRef,
                {

                    waiterCalled:
                        false,

                    waiterAcknowledgedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


            await checkWaiterRequests();

            await loadOrders();

        }
        catch(error) {

            console.error(
                "Clear waiter error:",
                error
            );


            alert(
                "Could not clear waiter request:\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   CHECK CASH PAYMENT REQUESTS
===================================================== */

async function checkCashPaymentRequests() {

    if (!currentUser) {
        return;
    }


    try {

        const ordersCollection =
            collection(
                db,
                "restaurants",
                currentUser.uid,
                "orders"
            );


        const snapshot =
            await getDocs(
                ordersCollection
            );


        const requests = [];


        snapshot.forEach(
            function(orderDoc) {

                const order =
                    orderDoc.data();


                if (
                    order.cashPaymentRequested === true &&
                    order.paymentStatus !== "paid"
                ) {

                    requests.push({

                        id:
                            orderDoc.id,

                        table:
                            order.tableNumber ||
                            order.table ||
                            "N/A",

                        order:
                            order.orderNumber ||
                            orderDoc.id.substring(
                                0,
                                6
                            ),

                        amount:
                            Number(
                                order.billTotal ??
                                order.finalTotal ??
                                order.total ??
                                0
                            )

                    });

                }

            }
        );


        const alertBox =
            document.getElementById(
                "cashPaymentAlerts"
            );


        if (!alertBox) {
            return;
        }


        if (!requests.length) {

            alertBox.innerHTML =
                "";

            return;

        }


        alertBox.innerHTML = `

            <div class="cash-payment-alert">

                🔔 ${requests.length}
                Cash Payment Request
                ${requests.length > 1 ? "s" : ""}

                ${requests.map(
                    function(request) {

                        return `

                            <small>

                                💵 Table
                                ${escapeHTML(
                                    String(
                                        request.table
                                    )
                                )}

                                —

                                Order #
                                ${escapeHTML(
                                    String(
                                        request.order
                                    )
                                )}

                                —

                                Amount:
                                ₹${request.amount.toFixed(2)}

                                <br>

                                Customer requested
                                cash payment.

                            </small>

                        `;

                    }
                ).join("")}

            </div>

        `;

    }
    catch(error) {

        console.error(
            "Cash payment check error:",
            error
        );

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    if (!currentUser) {
        return;
    }


    const ordersList =
        document.getElementById(
            "ordersList"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    if (!ordersList || !statusElement) {
        return;
    }


    try {

        const ordersCollection =
            collection(
                db,
                "restaurants",
                currentUser.uid,
                "orders"
            );


        const snapshot =
            await getDocs(
                ordersCollection
            );


        if (snapshot.empty) {

            statusElement.textContent =
                "No orders yet.";


            ordersList.innerHTML = `

                <div class="empty">

                    <h3>
                        📦 No Orders Yet
                    </h3>

                    <p>
                        Customer orders will
                        appear here.
                    </p>

                </div>

            `;

            return;

        }


        const orders = [];


        snapshot.forEach(
            function(orderDoc) {

                orders.push({

                    id:
                        orderDoc.id,

                    ...orderDoc.data()

                });

            }
        );


        orders.sort(
            function(a, b) {

                return (
                    getTimestampMillis(
                        b.createdAt
                    ) -
                    getTimestampMillis(
                        a.createdAt
                    )
                );

            }
        );


        statusElement.textContent =
            `${orders.length} order(s)`;


        ordersList.innerHTML =
            "";


        orders.forEach(
            function(order) {

                renderOrder(
                    order,
                    ordersList
                );

            }
        );


    }
    catch(error) {

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        statusElement.innerHTML = `

            <div class="error-box">

                ❌ Unable to load orders.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   CHECK BILL GENERATED
===================================================== */

function isBillGenerated(order) {

    return (
        order.billGenerated === true ||
        order.billStatus === "generated"
    );

}


/* =====================================================
   RENDER ORDER
===================================================== */

function renderOrder(
    order,
    ordersList
) {

    const orderId =
        order.id;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    const status =
        order.status ||
        "new";


    const items =
        Array.isArray(order.items)
        ?
        order.items
        :
        [];


    let itemsHTML =
        "";


    items.forEach(
        function(item) {

            const quantity =
                Number(
                    item.quantity || 1
                );


            const price =
                Number(
                    item.price || 0
                );


            itemsHTML += `

                <div class="item-row">

                    <div>

                        <span class="item-name">

                            ${escapeHTML(
                                item.name ||
                                item.foodName ||
                                ""
                            )}

                        </span>

                        <span class="item-quantity">

                            × ${quantity}

                        </span>

                    </div>

                    <div>

                        ₹${(
                            price *
                            quantity
                        ).toFixed(2)}

                    </div>

                </div>

            `;

        }
    );


    const subtotal =
        Number(
            order.subtotal ??
            order.total ??
            0
        );


    const discountAmount =
        Number(
            order.discountAmount ||
            0
        );


    const discountPercent =
        Number(
            order.discountPercent ||
            0
        );


    const finalTotal =
        Number(
            order.finalTotal ??
            order.total ??
            Math.max(
                0,
                subtotal -
                discountAmount
            )
        );


    const billTotal =
        Number(
            order.billTotal ??
            finalTotal
        );


    const paymentStatus =
        order.paymentStatus ||
        "pending";


    const billGenerated =
        isBillGenerated(
            order
        );


    /*
     * Notification area.
     */

    let notificationHTML =
        "";


    if (
        order.waiterCalled === true
    ) {

        notificationHTML += `

            <div style="
                background:#fff3cd;
                color:#856404;
                padding:14px;
                border-radius:10px;
                margin-bottom:12px;
                font-weight:bold;
                border:1px solid #ffe08a;
            ">

                🔔 WAITER REQUEST

                <br>

                <small style="
                    font-weight:normal;
                ">

                    Customer at Table
                    ${escapeHTML(
                        String(
                            order.table ||
                            order.tableNumber ||
                            "N/A"
                        )
                    )}
                    has called a waiter.

                </small>

            </div>

        `;

    }


    /*
     * IMPORTANT:
     *
     * Bill request is now independent
     * of order status.
     *
     * So Generate Bill appears whenever
     * customer requested the bill.
     */

    if (
        order.billRequested === true &&
        !billGenerated
    ) {

        notificationHTML += `

            <div class="bill-request-box">

                <strong>

                    🧾 BILL REQUESTED

                </strong>

                <br>

                <span style="
                    display:block;
                    margin-top:6px;
                    font-weight:normal;
                ">

                    Customer has requested
                    the bill.

                </span>

            </div>

        `;

    }


    if (
        order.cashPaymentRequested === true &&
        paymentStatus !== "paid"
    ) {

        notificationHTML += `

            <div style="
                background:#fff3e0;
                color:#e65100;
                padding:14px;
                border-radius:10px;
                margin-bottom:12px;
                font-weight:bold;
                border:1px solid #ffcc80;
            ">

                💵 CASH PAYMENT REQUEST

                <br>

                <small style="
                    font-weight:normal;
                ">

                    Customer is ready
                    to pay cash.

                </small>

            </div>

        `;

    }


    /*
     * Bill controls.
     */

    let billHTML =
        "";


    if (
        order.billRequested === true &&
        !billGenerated
    ) {

        billHTML = `

            <div class="bill-request-box">

                <strong>
                    🧾 Customer Requested Bill
                </strong>

                <p style="
                    margin-top:7px;
                    margin-bottom:12px;
                    font-weight:normal;
                ">

                    Click the button below to
                    generate and send the bill
                    to the customer.

                </p>


                <button
                    id="generate-btn-${escapeHTML(
                        orderId
                    )}"
                    class="generate-bill-btn"
                    onclick="
                        generateBill(
                            '${escapeHTML(
                                orderId
                            )}'
                        )
                    "
                >

                    🧾 Generate Bill

                </button>

            </div>

        `;

    }


    /*
     * Generated bill + payment section.
     */

    if (billGenerated) {

        billHTML = `

            <div class="bill-generated-box">

                <strong>

                    ✅ BILL GENERATED

                </strong>

                <div class="bill-amount">

                    ₹${billTotal.toFixed(2)}

                </div>

                <div style="
                    margin-top:6px;
                    color:#555;
                    font-size:14px;
                ">

                    Customer can now see
                    the bill.

                </div>

            </div>


            <div class="payment-info">

                <strong>
                    💳 Payment
                </strong>


                ${
                    paymentStatus === "paid"

                    ?

                    `

                    <div style="
                        margin-top:10px;
                        background:#e8f5e9;
                        color:#2e7d32;
                        padding:13px;
                        border-radius:8px;
                        font-weight:bold;
                        text-align:center;
                    ">

                        ✅ PAYMENT COMPLETED

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Method:
                            ${
                                order.paymentMethod === "upi"
                                ?
                                "UPI"
                                :
                                "Cash"
                            }

                        </small>

                    </div>

                    `

                    :

                    `

                    <div style="
                        color:#777;
                        font-size:14px;
                    ">

                        Customer has not completed
                        payment yet.

                    </div>


                    <div class="payment-tabs">

                        <button
                            id="cash-tab-${escapeHTML(
                                orderId
                            )}"
                            class="payment-tab active"
                            onclick="
                                showPaymentTab(
                                    '${escapeHTML(
                                        orderId
                                    )}',
                                    'cash'
                                )
                            "
                        >

                            💵 Cash

                        </button>


                        <button
                            id="upi-tab-${escapeHTML(
                                orderId
                            )}"
                            class="payment-tab"
                            onclick="
                                showPaymentTab(
                                    '${escapeHTML(
                                        orderId
                                    )}',
                                    'upi'
                                )
                            "
                        >

                            📱 UPI

                        </button>

                    </div>


                    <div
                        id="cash-panel-${escapeHTML(
                            orderId
                        )}"
                        class="payment-method-panel"
                    >

                        <strong>
                            💵 Cash Payment
                        </strong>

                        <p style="
                            margin-top:7px;
                            color:#666;
                            font-size:14px;
                        ">

                            If customer gives cash,
                            confirm that you received
                            the full bill amount.

                        </p>


                        <button
                            class="cash-paid-btn"
                            onclick="
                                markCashPaymentDone(
                                    '${escapeHTML(
                                        orderId
                                    )}'
                                )
                            "
                        >

                            ✅ Mark Cash Payment Done

                        </button>

                    </div>


                    <div
                        id="upi-panel-${escapeHTML(
                            orderId
                        )}"
                        class="payment-method-panel"
                        style="display:none;"
                    >

                        <strong>
                            📱 UPI Payment
                        </strong>

                        <p style="
                            margin-top:7px;
                            color:#666;
                            font-size:14px;
                        ">

                            ${
                                order.paymentMethod === "upi"
                                ?
                                "Customer selected UPI payment."
                                :
                                "Customer can select UPI from the customer page."
                            }

                        </p>

                    </div>

                    `

                }

            </div>

        `;

    }


    /*
     * Main card.
     */

    card.innerHTML = `

        ${notificationHTML}


        <div class="order-header">

            <div class="order-number">

                Order #
                ${escapeHTML(
                    order.orderNumber ||
                    orderId.substring(
                        0,
                        6
                    )
                )}

            </div>


            <div class="table-number">

                🪑 Table
                ${escapeHTML(
                    String(
                        order.table ||
                        order.tableNumber ||
                        "N/A"
                    )
                )}

            </div>

        </div>


        <div class="status-badge ${
            getStatusClass(
                status
            )
        }">

            ${getStatusText(
                status
            )}

        </div>


        <div class="items">

            ${
                itemsHTML ||
                "<p>No items found.</p>"
            }

        </div>


        <div class="summary">

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span>
                    ₹${subtotal.toFixed(2)}
                </span>

            </div>


            ${
                discountAmount > 0

                ?

                `

                <div class="summary-row discount">

                    <span>

                        Discount

                        ${
                            discountPercent > 0
                            ?
                            `(${discountPercent}%)`
                            :
                            ""
                        }

                    </span>

                    <span>

                        -₹${discountAmount.toFixed(2)}

                    </span>

                </div>

                `

                :

                ""

            }


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <span>
                    ₹${finalTotal.toFixed(2)}
                </span>

            </div>

        </div>


        <div class="payment-badge ${
            getPaymentClass(
                paymentStatus,
                status
            )
        }">

            ${
                getPaymentText(
                    paymentStatus,
                    status
                )
            }

        </div>


        ${billHTML}


        <div class="action-buttons">


            ${
                status === "new"

                ?

                `

                <button
                    class="accept-btn"
                    onclick="
                        updateOrderStatus(
                            '${escapeHTML(
                                orderId
                            )}',
                            'accepted'
                        )
                    "
                >

                    ✅ Accept

                </button>


                <button
                    class="cancel-btn"
                    onclick="
                        updateOrderStatus(
                            '${escapeHTML(
                                orderId
                            )}',
                            'cancelled'
                        )
                    "
                >

                    ❌ Cancel

                </button>

                `

                :

                ""

            }


            ${
                status === "accepted"

                ?

                `

                <button
                    class="prepare-btn"
                    onclick="
                        updateOrderStatus(
                            '${escapeHTML(
                                orderId
                            )}',
                            'preparing'
                        )
                    "
                >

                    👨‍🍳 Start Preparing

                </button>

                `

                :

                ""

            }


            ${
                status === "preparing"

                ?

                `

                <button
                    class="ready-btn"
                    onclick="
                        updateOrderStatus(
                            '${escapeHTML(
                                orderId
                            )}',
                            'ready'
                        )
                    "
                >

                    🍽️ Mark Ready

                </button>

                `

                :

                ""

            }


            ${
                status === "ready"

                ?

                `

                <button
                    class="complete-btn"
                    onclick="
                        updateOrderStatus(
                            '${escapeHTML(
                                orderId
                            )}',
                            'completed'
                        )
                    "
                >

                    ✅ Complete Order

                </button>

                `

                :

                ""

            }


        </div>

    `;


    ordersList.appendChild(
        card
    );

}


/* =====================================================
   GENERATE BILL
===================================================== */

window.generateBill =
    async function(orderId) {

        if (!currentUser) {

            alert(
                "Please login first."
            );

            return;

        }


        const button =
            document.getElementById(
                "generate-btn-" +
                orderId
            );


        if (button) {

            button.disabled =
                true;

            button.textContent =
                "⏳ Generating Bill...";

        }


        try {

            const orderRef =
                doc(
                    db,
                    "restaurants",
                    currentUser.uid,
                    "orders",
                    orderId
                );


            const ordersSnapshot =
                await getDocs(
                    collection(
                        db,
                        "restaurants",
                        currentUser.uid,
                        "orders"
                    )
                );


            let orderData =
                null;


            ordersSnapshot.forEach(
                function(snap) {

                    if (
                        snap.id ===
                        orderId
                    ) {

                        orderData =
                            snap.data();

                    }

                }
            );


            if (!orderData) {

                alert(
                    "Order not found."
                );

                return;

            }


            /*
             * Customer MUST have requested bill.
             */

            if (
                orderData.billRequested !==
                true
            ) {

                alert(
                    "The customer has not requested the bill yet."
                );

                return;

            }


            /*
             * Do not generate twice.
             */

            if (
                isBillGenerated(
                    orderData
                )
            ) {

                alert(
                    "Bill has already been generated."
                );

                await loadOrders();

                return;

            }


            const subtotal =
                Number(
                    orderData.subtotal ??
                    orderData.total ??
                    0
                );


            const discountAmount =
                Number(
                    orderData.discountAmount ||
                    0
                );


            const finalTotal =
                Number(
                    orderData.finalTotal ??
                    orderData.total ??
                    Math.max(
                        0,
                        subtotal -
                        discountAmount
                    )
                );


            /*
             * IMPORTANT:
             *
             * We save BOTH:
             *
             * billGenerated = true
             *
             * billStatus = "generated"
             *
             * because your customer page
             * checks billStatus.
             */

            await updateDoc(
                orderRef,
                {

                    billGenerated:
                        true,

                    billStatus:
                        "generated",

                    billGeneratedAt:
                        serverTimestamp(),

                    billSubtotal:
                        subtotal,

                    billDiscountAmount:
                        discountAmount,

                    billTotal:
                        finalTotal,

                    paymentStatus:
                        orderData.paymentStatus ||
                        "pending",

                    updatedAt:
                        serverTimestamp()

                }
            );


            alert(
                "✅ Bill generated successfully.\n\n" +
                "The customer can now see the bill."
            );


            await loadOrders();

        }
        catch(error) {

            console.error(
                "Bill generation error:",
                error
            );


            alert(
                "Could not generate bill:\n\n" +
                error.message
            );


            if (button) {

                button.disabled =
                    false;

                button.textContent =
                    "🧾 Generate Bill";

            }

        }

    };


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

window.updateOrderStatus =
    async function(
        orderId,
        newStatus
    ) {

        if (!currentUser) {

            alert(
                "Please login first."
            );

            return;

        }


        const orderRef =
            doc(
                db,
                "restaurants",
                currentUser.uid,
                "orders",
                orderId
            );


        try {

            const updateData = {

                status:
                    newStatus,

                updatedAt:
                    serverTimestamp()

            };


            if (
                newStatus ===
                "preparing"
            ) {

                updateData.preparingStartedAt =
                    serverTimestamp();

            }


            if (
                newStatus ===
                "ready"
            ) {

                updateData.readyAt =
                    serverTimestamp();


                const existingOrders =
                    await getDocs(
                        collection(
                            db,
                            "restaurants",
                            currentUser.uid,
                            "orders"
                        )
                    );


                let startMillis =
                    null;


                existingOrders.forEach(
                    function(snap) {

                        if (
                            snap.id ===
                            orderId
                        ) {

                            const data =
                                snap.data();


                            if (
                                data.preparingStartedAt
                            ) {

                                startMillis =
                                    getTimestampMillis(
                                        data.preparingStartedAt
                                    );

                            }

                        }

                    }
                );


                if (startMillis) {

                    const minutes =
                        (
                            Date.now() -
                            startMillis
                        ) /
                        60000;


                    updateData.preparationTimeMinutes =
                        Number(
                            minutes.toFixed(
                                1
                            )
                        );

                }

            }


            if (
                newStatus ===
                "completed"
            ) {

                updateData.deliveredAt =
                    serverTimestamp();

            }


            await updateDoc(
                orderRef,
                updateData
            );


            await loadOrders();

        }
        catch(error) {

            console.error(
                "Status update error:",
                error
            );


            alert(
                "Could not update order:\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   PAYMENT TAB
===================================================== */

window.showPaymentTab =
    function(
        orderId,
        method
    ) {

        const cashPanel =
            document.getElementById(
                "cash-panel-" +
                orderId
            );


        const upiPanel =
            document.getElementById(
                "upi-panel-" +
                orderId
            );


        const cashTab =
            document.getElementById(
                "cash-tab-" +
                orderId
            );


        const upiTab =
            document.getElementById(
                "upi-tab-" +
                orderId
            );


        if (
            !cashPanel ||
            !upiPanel ||
            !cashTab ||
            !upiTab
        ) {

            return;

        }


        if (
            method ===
            "upi"
        ) {

            cashPanel.style.display =
                "none";

            upiPanel.style.display =
                "block";

            cashTab.classList.remove(
                "active"
            );

            upiTab.classList.add(
                "active"
            );

        }
        else {

            cashPanel.style.display =
                "block";

            upiPanel.style.display =
                "none";

            cashTab.classList.add(
                "active"
            );

            upiTab.classList.remove(
                "active"
            );

        }

    };


/* =====================================================
   MARK CASH PAYMENT DONE
===================================================== */

window.markCashPaymentDone =
    async function(orderId) {

        if (!currentUser) {

            alert(
                "Please login first."
            );

            return;

        }


        const confirmed =
            confirm(
                "Confirm that the customer has paid the full bill in cash?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const orderRef =
                doc(
                    db,
                    "restaurants",
                    currentUser.uid,
                    "orders",
                    orderId
                );


            await updateDoc(
                orderRef,
                {

                    paymentStatus:
                        "paid",

                    paymentMethod:
                        "cash",

                    paidAt:
                        serverTimestamp(),

                    cashPaymentRequested:
                        false,

                    cashPaymentCollected:
                        true,

                    cashPaymentCollectedAt:
                        serverTimestamp(),

                    waiterCalled:
                        false,

                    updatedAt:
                        serverTimestamp()

                }
            );


            alert(
                "✅ Cash payment marked as paid."
            );


            await loadOrders();

            await checkCashPaymentRequests();

        }
        catch(error) {

            console.error(
                "Cash payment error:",
                error
            );


            alert(
                "Could not mark cash payment as paid:\n\n" +
                error.message
            );

        }

    };


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
) {

    if (
        status ===
        "accepted"
    ) {

        return "accepted";

    }


    if (
        status ===
        "preparing"
    ) {

        return "preparing";

    }


    if (
        status ===
        "ready"
    ) {

        return "ready";

    }


    if (
        status ===
        "completed"
    ) {

        return "completed";

    }


    if (
        status ===
        "cancelled"
    ) {

        return "cancelled";

    }


    return "new";

}


/* =====================================================
   STATUS TEXT
===================================================== */

function getStatusText(
    status
) {

    if (
        status ===
        "accepted"
    ) {

        return "🔵 Accepted";

    }


    if (
        status ===
        "preparing"
    ) {

        return "👨‍🍳 Preparing";

    }


    if (
        status ===
        "ready"
    ) {

        return "🟢 Ready";

    }


    if (
        status ===
        "completed"
    ) {

        return "🚚 Delivered";

    }


    if (
        status ===
        "cancelled"
    ) {

        return "❌ Cancelled";

    }


    return "🆕 New Order";

}


/* =====================================================
   PAYMENT CLASS
===================================================== */

function getPaymentClass(
    paymentStatus,
    orderStatus
) {

    if (
        paymentStatus ===
        "paid"
    ) {

        return "payment-paid";

    }


    if (
        paymentStatus ===
        "payment_selected"
    ) {

        return "payment-selected";

    }


    if (
        orderStatus ===
        "completed"
    ) {

        return "payment-pending";

    }


    return "payment-unavailable";

}


/* =====================================================
   PAYMENT TEXT
===================================================== */

function getPaymentText(
    paymentStatus,
    orderStatus
) {

    if (
        paymentStatus ===
        "paid"
    ) {

        return "✅ Payment Paid";

    }


    if (
        paymentStatus ===
        "payment_selected"
    ) {

        return "💳 Payment Method Selected";

    }


    if (
        orderStatus ===
        "completed"
    ) {

        return "⏳ Payment Pending";

    }


    return "🔒 Payment Not Available Yet";

}


/* =====================================================
   TIMESTAMP
===================================================== */

function getTimestampMillis(
    value
) {

    if (!value) {
        return 0;
    }


    if (
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    if (
        value.seconds !==
        undefined
    ) {

        return (
            Number(
                value.seconds
            ) *
            1000
        );

    }


    if (
        value instanceof Date
    ) {

        return value.getTime();

    }


    if (
        typeof value ===
        "string"
    ) {

        const parsed =
            Date.parse(
                value
            );


        return Number.isNaN(
            parsed
        )
        ?
        0
        :
        parsed;

    }


    return 0;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   BACK
===================================================== */

window.goBack =

        window.location.href =
            "dashboard.html";

    };
