<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Status - Restaurant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding-bottom:30px;
}

header{
background:#ff5722;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin-bottom:5px;
}

header p{
font-size:14px;
}

.container{
max-width:600px;
margin:auto;
padding:15px;
}

.table-info,
.order-card,
.action-card,
.bill-card{
background:white;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-info{
text-align:center;
font-weight:bold;
color:#ff5722;
}

.order-title{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

.order-id{
color:#777;
font-size:13px;
word-break:break-all;
}

.status-box{
margin-top:15px;
padding:16px;
border-radius:10px;
background:#fff3e0;
color:#e65100;
text-align:center;
font-size:18px;
font-weight:bold;
}

.status-message{
text-align:center;
color:#777;
margin-top:10px;
font-size:14px;
}

.action-card h3,
.bill-card h3{
margin-bottom:12px;
}

.action-btn{
width:100%;
padding:14px;
border:none;
border-radius:9px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.waiter-btn{
background:#ff5722;
}

.bill-btn{
background:#333;
}

.action-btn:disabled{
background:#aaa;

}

.requested{

}

.bill-status{
padding:13px;
border-radius:8px;

text-align:center;

.bill-generated{

font-weight:bold;
}

.bill-requested{
background:#fff3e0;
color:#e65100;
font-weight:bold;
}

.bill-total{
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;

.bill-price{
color:#ff5722;
}

.bill-breakdown{
background:#fafafa;

padding:12px;
margin-top:15px;

.bill-row{

justify-content:space-between;
padding:6px 0;

.bill-row.discount{

}

.bill-items{

background:white;
border:1px solid #eee;
border-radius:10px;

}

.bill-item-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:9px 0;
border-bottom:1px solid #eee;
}

.bill-item-row:last-child{
border-bottom:none;
}

.bill-item-name{
font-weight:bold;
color:#333;
}

.bill-item-quantity{
color:#777;
font-size:13px;
}

.bill-item-price{
font-weight:bold;

}

.bill-print-actions{
display:flex;
gap:10px;
margin-top:15px;

.bill-print-btn,

padding:13px;

border-radius:9px;
color:white;
font-size:15px;

background:#1976d2;
}

.bill-pdf-btn{
background:#6a1b9a;
}

margin-top:15px;

background:#fafafa;
border-radius:9px;

gap:10px;

/* PAYMENT */

.payment-box{

}

.payment-title{
font-size:17px;
font-weight:bold;

}

.payment-help{
color:#777;
font-size:14px;
margin-bottom:10px;
}

.payment-tabs{
display:flex;
gap:8px;
margin-top:12px;
}

.payment-tab{
flex:1;
padding:13px 8px;
border:2px solid #ddd;
border-radius:9px;
background:white;
color:#555;
font-weight:bold;
cursor:pointer;
}

.payment-tab.active{
background:#ff5722;
border-color:#ff5722;

}

.payment-panel{
margin-top:12px;
padding:15px;
border-radius:10px;
background:#f8f8f8;
border:1px solid #eee;
}

.payment-action-btn{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#ff5722;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.payment-selected{
margin-top:15px;
padding:16px;
border-radius:9px;
background:#fff3cd;
color:#856404;
text-align:center;
font-weight:bold;
}

.payment-paid{
margin-top:15px;
padding:16px;
border-radius:9px;
background:#e8f5e9;
color:#2e7d32;
text-align:center;
font-weight:bold;

}

/* CASH */

.cash-request-panel{
cursor:pointer;
text-align:center;
transition:.2s;
}

.cash-request-panel:hover{

box-shadow:0 3px 10px rgba(255,87,34,.15);
}

.cash-icon{
font-size:48px;
margin-bottom:10px;
}

.cash-title{
display:block;
font-size:20px;
font-weight:bold;
}

.cash-description{
color:#777;
font-size:14px;
margin-top:8px;
}

.cash-request-button{
margin-top:15px;
padding:13px;
background:#fff3e0;
color:#e65100;
border-radius:8px;
font-weight:bold;
}

.cash-requested-box{
margin-top:15px;
padding:16px;
background:#fff3e0;
color:#e65100;
border-radius:10px;
text-align:center;
font-weight:bold;
}

/* UPI */

.upi-box{
text-align:center;
}

.upi-amount{
margin-top:15px;
padding:14px;
border-radius:9px;
background:#fff3e0;
color:#e65100;
text-align:center;
font-size:14px;
}

.upi-amount strong{
display:block;
font-size:26px;
margin-top:5px;
color:#ff5722;
}

.upi-qr{
width:230px;
height:230px;
margin:18px auto;
padding:10px;
background:white;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;

.upi-qr img{

.upi-details{

color:#555;

margin-top:12px;
color:#777;

line-height:1.5;

.hidden{

.loading,
.error,
.empty{

border-radius:12px;
padding:25px;

.loading,
.empty{

.error{

.back-btn{

.container{

</style>

</head>

<body>

<header>

<h1 id="restaurantName">
Restaurant
</h1>

<p>
Order Status
</p>

</header>


<div class="container">

<div
id="tableInfo"
class="table-info"
>
Loading table...
</div>

<div id="statusContainer">

<div class="loading">
Loading order...
</div>

</div>

</div>


<div
id="printBillContainer"
style="display:none;"
></div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
setDoc,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig={

apiKey:
"AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

authDomain:
"restaurant-qr-ordering-fdf9b.firebaseapp.com",

projectId:
"restaurant-qr-ordering-fdf9b",

storageBucket:
"restaurant-qr-ordering-fdf9b.firebasestorage.app",

messagingSenderId:
"907571024375",

appId:
"1:907571024375:web:796894f82f2cae4d7b9ef2",

measurementId:
"G-G3Q89BDFF9"

};


const app=
initializeApp(
firebaseConfig
);

const db=
getFirestore(app);

const auth=
getAuth(app);


/* ==========================================
   URL PARAMETERS
========================================== */

const params=
new URLSearchParams(
window.location.search
);


const restaurantId=
params.get("restaurantId");


const table=
params.get("table");


const orderId=
params.get("orderId") ||
localStorage.getItem(
"currentOrderId"
);


/* ==========================================
   ELEMENTS
========================================== */

const restaurantName=
document.getElementById(
"restaurantName"
);

const tableInfo=
document.getElementById(
"tableInfo"
);

const statusContainer=
document.getElementById(
"statusContainer"
);


/* ==========================================
   VARIABLES
========================================== */

let currentUser=null;

let orderData=null;

let currentUPILink="";

let restaurantPaymentData=null;


/* ==========================================
   VALIDATE
========================================== */

if(
!restaurantId ||
!table ||
!orderId
){

statusContainer.innerHTML=`

<div class="error">

❌ Order information is missing.

<br><br>

Please open your order status
from the order confirmation page.

<button
class="back-btn"
onclick="goBackToMenu()"
>
← Back to Menu
</button>

</div>

`;

}
else{

tableInfo.textContent=
"🪑 Table "+table;

loadRestaurant();

waitForLogin();

}


/* ==========================================
   RESTAURANT
========================================== */

async function loadRestaurant(){

try{

const ref=
doc(
db,
"restaurants",
restaurantId
);

const snap=
await getDoc(ref);


if(snap.exists()){

const data=
snap.data();

restaurantPaymentData=data;

restaurantName.textContent=
data.restaurantName ||
data.name ||
"Restaurant";

}

}
catch(error){

console.error(
"Restaurant load error:",
error
);

}

}


/* ==========================================
   AUTH
========================================== */

function waitForLogin(){

onAuthStateChanged(
auth,
function(user){

if(!user){

statusContainer.innerHTML=`

<div class="error">

❌ Please login to view
your order status.

</div>

`;

return;

}

currentUser=user;

loadOrder();

}
);

}


/* ==========================================
   LOAD ORDER REALTIME
========================================== */

function loadOrder(){

const orderRef=
doc(
db,
"restaurants",
restaurantId,
"orders",
orderId
);


onSnapshot(
orderRef,

function(snapshot){

if(!snapshot.exists()){

statusContainer.innerHTML=`

<div class="error">

❌ Order not found.

</div>

`;

return;

}


orderData=
snapshot.data();


/*
IMPORTANT:
Customer can only view
their own order.
*/

if(
orderData.customerUid &&
currentUser &&
orderData.customerUid !==
currentUser.uid
){

statusContainer.innerHTML=`

<div class="error">

❌ You are not authorized
to view this order.

</div>

`;

return;

}


/*
IMPORTANT:
As soon as the restaurant/payment flow marks
this order as PAID, save a copy into the
logged-in customer's order history.

The history document uses the SAME orderId,
so repeated realtime snapshots will update the
same history document instead of creating duplicates.
*/
if(orderData.paymentStatus === "paid"){
    savePaidOrderToHistory();
}


renderOrder();

},

function(error){

console.error(
"Order listener error:",
error
);


statusContainer.innerHTML=`

<div class="error">

❌ Unable to load order.

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

}

);

}


/* ==========================================
   SAVE PAID ORDER TO CUSTOMER HISTORY
========================================== */

let historySaveInProgress=false;
let historySavedForPaidOrder=false;

async function savePaidOrderToHistory(){

    if(!currentUser || !orderData || !restaurantId || !orderId){
        return;
    }

    if(orderData.paymentStatus !== "paid"){
        return;
    }

    if(historySaveInProgress || historySavedForPaidOrder){
        return;
    }

    historySaveInProgress=true;

    try{

        const customerUid = currentUser.uid;

        const historyRef = doc(
            db,
            "restaurants",
            restaurantId,
            "customers",
            customerUid,
            "orderHistory",
            orderId
        );

        /*
        Save the complete order so the History page can
        display the same items, totals and payment details.
        The extra history fields make it clear that this
        copy is a completed/paid order.
        */
        const existingHistory = await getDoc(historyRef);

        const historyData = {
            ...orderData,
            orderId: orderId,
            restaurantId: restaurantId,
            customerUid: customerUid,
            table: table,
            paymentStatus: "paid",
            historyType: "completed_order",
            historySavedAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };

        /*
        completedAt is created only the first time the paid
        order is copied to history. This prevents every realtime
        snapshot from changing the original completion time.
        */
        if(!existingHistory.exists()){
            historyData.completedAt = serverTimestamp();
        }

        await setDoc(
            historyRef,
            historyData,
            { merge:true }
        );

        historySavedForPaidOrder=true;

        console.log(
            "✅ Paid order saved to customer history:",
            orderId
        );

    }
    catch(error){

        console.error(
            "❌ Unable to save paid order to customer history:",
            error
        );

        /*
        Do not block the customer's Order Status page if
        the history write fails. The error will be visible
        in the browser console for Firestore-rule debugging.
        */

    }
    finally{
        historySaveInProgress=false;
    }

}


/* ==========================================
   RENDER ORDER
========================================== */

function renderOrder(){

const status=
orderData.status ||
"received";


const statusInfo=
getStatusInfo(status);


const waiterCalled=
orderData.waiterCalled===true;


const waiterRequested=
orderData.waiterRequested===true;


const billRequested=
orderData.billRequested===true;


const billGenerated=
orderData.billGenerated===true ||
orderData.billStatus==="generated";


statusContainer.innerHTML=`

<div class="order-card">

<div class="order-title">
📋 Order Status
</div>


<div class="order-id">

Order ID:
${escapeHTML(orderId)}

</div>


<div class="status-box">

${statusInfo.icon}
${statusInfo.text}

</div>


<div class="status-message">

${statusInfo.message}

</div>

</div>


<div class="action-card">

<h3>
👨‍🍳 Need Assistance?
</h3>


<p style="
color:#777;
font-size:14px;
">

Call a waiter whenever you need
assistance at your table.

</p>


<button
id="waiterBtn"
class="action-btn waiter-btn
${
waiterCalled ||
waiterRequested
?"requested":""
}"
${
waiterCalled ||
waiterRequested
?"disabled":""
}
onclick="callWaiter()"
>

${
waiterCalled ||
waiterRequested
?
"✅ Waiter Requested"
:
"🔔 Call Waiter"
}

</button>

</div>


<div class="action-card">

<h3>
🧾 Bill
</h3>


<p style="
color:#777;
font-size:14px;
">

When you are ready to pay,
request your bill.

</p>


<button
id="billBtn"
class="action-btn bill-btn
${billRequested?"requested":""}"
${billRequested?"disabled":""}
onclick="requestBill()"
>

${
billRequested
?
"✅ Bill Requested"
:
"🧾 Request Bill"
}

</button>

</div>


${
billGenerated
?
renderGeneratedBill()
:
`

<div class="bill-card">

<h3>
💳 Payment
</h3>


<div class="bill-status
${billRequested?"bill-requested":""}"
>

${
billRequested
?
"⏳ Bill requested. Waiting for restaurant..."
:
"⏳ Bill has not been requested yet."
}

</div>

</div>

`
}


<button
class="back-btn"
onclick="goBackToMenu()"
>

← Back to Menu

</button>

`;

}


/* ==========================================
   GENERATED BILL
========================================== */

function renderGeneratedBill(){

const subtotal=
Number(
orderData.billSubtotal ??
orderData.subtotal ??
orderData.total ??
0
);


const discount=
Number(
orderData.billDiscountAmount ??
orderData.discountAmount ??
0
);


const total=
Number(
orderData.billTotal ??
orderData.finalTotal ??
orderData.total ??
Math.max(
0,
subtotal-discount
)
);


const paymentStatus=
orderData.paymentStatus ||
"unpaid";


const paymentMethod=
orderData.paymentMethod ||
"";


const cashRequested=
orderData.cashPaymentRequested===true;


const upiRequested=
orderData.upiPaymentRequested===true;


const items=
Array.isArray(orderData.items)
?
orderData.items
:
[];


let paymentSection="";


/* ==========================================
   PAID
========================================== */

if(
paymentStatus==="paid"
){

paymentSection=`

<div class="payment-paid">

✅ Payment Completed

<br>

<small
style="font-weight:normal;"
>

Payment method:

${
paymentMethod==="cash"
?
"💵 Cash"
:
paymentMethod==="upi"
?
"📱 UPI"
:
"Payment"
}

</small>

</div>

`;

}


/* ==========================================
   CASH REQUESTED
========================================== */

else if(
paymentStatus==="payment_selected" &&
paymentMethod==="cash"
){

paymentSection=`

<div class="cash-requested-box">

💵 Cash Payment Requested

<br>

<small
style="font-weight:normal;"
>

🔔 The waiter has been notified.

<br>

Please keep the cash ready.
The waiter will come to your table
to collect it.

</small>

</div>

`;

}


/* ==========================================
   UPI SELECTED
========================================== */

else if(
paymentStatus==="payment_selected" &&
paymentMethod==="upi"
){

paymentSection=`

<div class="payment-selected">

📱 UPI Payment Selected

<br>

<small
style="font-weight:normal;"
>

Complete the UPI payment
and tap "I Have Paid".

</small>

</div>

`;

}


/* ==========================================
   PAYMENT CHOICE
========================================== */

else{

paymentSection=`

<div class="payment-box">

<div class="payment-title">

💳 Choose Payment Method

</div>


<div class="payment-help">

Tap a payment method below.

</div>


<div class="payment-tabs">

<button
id="cashTab"
class="payment-tab active"
onclick="showPaymentPanel('cash')"
>

💵 Cash

</button>


<button
id="upiTab"
class="payment-tab"
onclick="showPaymentPanel('upi')"
>

📱 UPI

</button>

</div>


<!-- CASH -->

<div
id="cashPanel"
class="payment-panel cash-request-panel"
onclick="selectPayment('cash')"
>

<div class="cash-icon">
💵
</div>


<strong class="cash-title">

Pay by Cash

</strong>


<p class="cash-description">

Tap here and a waiter will be
notified to collect your cash.

</p>


<div class="cash-request-button">

🔔 Tap to Request Cash Collection

</div>

</div>


<!-- UPI -->

<div
id="upiPanel"
class="payment-panel upi-box"
style="display:none;"
>

<strong>

📱 Pay by UPI

</strong>


<p style="
color:#777;
font-size:14px;
margin-top:6px;
">

Scan the QR code using any UPI app.

</p>


<div class="upi-amount">

Amount to Pay

<strong>

₹${total.toFixed(2)}

</strong>

</div>


<div
id="upiQRCode"
class="upi-qr"
>

Loading QR...

</div>


<div
id="upiDetails"
class="upi-details"
>

Loading UPI details...

</div>


<button

📱 Open UPI App

<button

✅ I Have Paid

<p class="upi-note">

After completing the payment,
tap <strong>"I Have Paid"</strong>.

<br><br>

The restaurant will manually verify
the payment.

</p>

</div>

</div>

`;

}


/* ==========================================
   BILL ITEMS
========================================== */

let itemsHTML="";


if(items.length){

items.forEach(
item=>{

const name=
item.name ||
item.foodName ||
"Item";


const quantity=
Number(
item.quantity||1
);


const price=
Number(
item.price||0
);


const lineTotal=
price*quantity;


itemsHTML+=`

<div class="bill-item-row">

<div>

<div class="bill-item-name">

${escapeHTML(name)}

</div>


<div class="bill-item-quantity">

₹${price.toFixed(2)}
×
${quantity}

</div>

</div>


<div class="bill-item-price">

₹${lineTotal.toFixed(2)}

</div>

</div>

`;

});

}
else{

itemsHTML=`

<div style="
text-align:center;
color:#777;
padding:10px;
">

No item details available.

</div>

`;

}


/* ==========================================
   BILL DATE
========================================== */

const generatedAt=
getTimestampMillis(

/* ==========================================
   LOAD UPI
========================================== */

async function loadUPIPayment(total){

const qrContainer=
document.getElementById(
"upiQRCode"
);


const detailsContainer=
document.getElementById(
"upiDetails"
);


if(
!qrContainer ||
!detailsContainer
){

return;

}


try{

const restaurantRef=
doc(
db,
"restaurants",
restaurantId
);


const snapshot=
await getDoc(
restaurantRef
);


if(
!snapshot.exists()
){

detailsContainer.innerHTML=`

<strong>
❌ Restaurant payment settings not found.
</strong>

`;

return;

}


const restaurant=
snapshot.data();


const upiName=
String(
restaurant.upiName ||
restaurant.merchantName ||
restaurant.restaurantName ||
restaurant.name ||
"Restaurant"
).trim();


const upiId=
String(
restaurant.upiId ||
restaurant.upi ||
restaurant.merchantUpiId ||
restaurant.paymentUpiId ||
restaurant.paytmUpiId ||
restaurant.businessUpiId ||
""
).trim();


if(!upiId){

detailsContainer.innerHTML=`

<strong>
❌ UPI ID not configured.
</strong>

`;

return;

}


const amount=
Number(total);


currentUPILink=
"upi://pay"+
"?pa="+
encodeURIComponent(upiId)+
"&pn="+
encodeURIComponent(upiName)+
"&am="+
encodeURIComponent(
amount.toFixed(2)
)+
"&cu=INR"+
"&tn="+
encodeURIComponent(
"Order "+orderId
);


qrContainer.innerHTML="";


if(
typeof QRCode==="undefined"
){

qrContainer.textContent=
"QR code unavailable.";

return;

}


new QRCode(
qrContainer,
{

text:
currentUPILink,

width:
210,

height:
210,

colorDark:
"#000000",

colorLight:
"#ffffff",

correctLevel:
QRCode.CorrectLevel.M

}
);


detailsContainer.innerHTML=`

<strong>

${escapeHTML(upiName)}

</strong>

<br>

UPI ID:

<strong>

${escapeHTML(upiId)}

</strong>

<br>

Amount:

<strong>

₹${amount.toFixed(2)}

</strong>

`;

}
catch(error){

console.error(
"UPI load error:",
error
);

detailsContainer.innerHTML=`

❌ Unable to load UPI details.

`;

}

}

paymentMethod
paymentStatus

updatedAt

For UPI:
paymentMethod
paymentStatus
upiPaymentRequested
upiPaymentRequestedAt
updatedAt

If your rules do not include the

unauthorized field.
*/

doc(

);

method,

"payment_selected",

true;

updateData.cashPaymentRequestedAt=

if(method==="upi"){

doc(

"restaurants",
restaurantId
);

restaurantRef
);

restaurantSnapshot.data();

String(
restaurant.upiId ||
restaurant.upi ||

restaurant.paytmUpiId ||
restaurant.businessUpiId ||
""
).trim();

);

return;

}


updateData.upiPaymentRequested=
true;

updateData.upiPaymentRequestedAt=
serverTimestamp();

await updateDoc(
orderRef,
updateData
);


if(method==="cash"){

);

catch(error){

console.error(
"Payment selection error:",
error
);

error.message
);

}

};

/* ==========================================
   TIMESTAMP
========================================== */

function getTimestampMillis(value){

if(!value){

return 0;

}


if(
typeof value.toMillis==="function"
){

return value.toMillis();

}


if(
value.seconds!==undefined
){

return Number(
value.seconds
)*1000;

}


if(
value instanceof Date
){

return value.getTime();

}


if(
typeof value==="string"
){

const parsed=
Date.parse(value);


return Number.isNaN(parsed)
?
0
:
parsed;

}


return 0;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
