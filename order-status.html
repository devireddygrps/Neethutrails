<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Status - Restaurant</title>


    <!-- =====================================================
         QR CODE LIBRARY
    ====================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
            padding-bottom: 30px;
        }


        header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        header h1 {
            margin-bottom: 5px;
        }


        header p {
            font-size: 14px;
        }


        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }


        .table-info,
        .order-card,
        .action-card,
        .bill-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }


        .table-info {
            text-align: center;
            font-weight: bold;
            color: #ff5722;
        }


        .order-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }


        .order-id {
            color: #777;
            font-size: 13px;
            word-break: break-all;
        }


        .status-box {
            margin-top: 15px;
            padding: 16px;
            border-radius: 10px;
            background: #fff3e0;
            color: #e65100;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }


        .status-message {
            text-align: center;
            color: #777;
            margin-top: 10px;
            font-size: 14px;
        }


        .action-card h3,
        .bill-card h3 {
            margin-bottom: 12px;
        }


        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }


        .waiter-btn {
            background: #ff5722;
        }


        .bill-btn {
            background: #333;
        }


        .action-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }


        .requested {
            background: #43a047 !important;
        }


        .bill-status {
            padding: 13px;
            border-radius: 8px;
            background: #f5f5f5;
            text-align: center;
            color: #555;
        }


        .bill-generated {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }


        .bill-requested {
            background: #fff3e0;
            color: #e65100;
            font-weight: bold;
        }


        .bill-total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }


        .bill-price {
            color: #ff5722;
        }


        .bill-breakdown {
            background: #fafafa;
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
        }


        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            color: #555;
        }


        .bill-row.discount {
            color: #2e7d32;
        }


        /* =====================================================
           BILL ITEMS
        ====================================================== */

        .bill-items {
            margin-top: 15px;
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
        }


        .bill-item-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }


        .bill-item-row:last-child {
            border-bottom: none;
        }


        .bill-item-name {
            font-weight: bold;
            color: #333;
        }


        .bill-item-quantity {
            color: #777;
            font-size: 13px;
        }


        .bill-item-price {
            font-weight: bold;
            white-space: nowrap;
        }


        /* =====================================================
           PRINT
        ====================================================== */

        .bill-print-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }


        .bill-print-btn,
        .bill-pdf-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }


        .bill-print-btn {
            background: #1976d2;
        }


        .bill-pdf-btn {
            background: #6a1b9a;
        }


        .bill-print-btn:hover {
            background: #1565c0;
        }


        .bill-pdf-btn:hover {
            background: #4a148c;
        }


        /* =====================================================
           BILL META
        ====================================================== */

        .bill-meta {
            margin-top: 15px;
            padding: 12px;
            background: #fafafa;
            border-radius: 9px;
            font-size: 14px;
            color: #555;
        }


        .bill-meta-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 5px 0;
        }


        .bill-meta-row strong {
            color: #333;
        }


        /* =====================================================
           PAYMENT
        ====================================================== */

        .payment-box {
            margin-top: 18px;
        }


        .payment-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }


        .payment-help {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }


        .payment-tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }


        .payment-tab {
            flex: 1;
            padding: 13px 8px;
            border: 2px solid #ddd;
            border-radius: 9px;
            background: white;
            color: #555;
            font-weight: bold;
            cursor: pointer;
        }


        .payment-tab.active {
            background: #ff5722;
            border-color: #ff5722;
            color: white;
        }


        .payment-panel {
            margin-top: 12px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f8f8;
            border: 1px solid #eee;
        }


        .payment-action-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff5722;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }


        .payment-selected {
            margin-top: 15px;
            padding: 14px;
            border-radius: 9px;
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-weight: bold;
        }


        .payment-paid {
            margin-top: 15px;
            padding: 16px;
            border-radius: 9px;
            background: #e8f5e9;
            color: #2e7d32;
            text-align: center;
            font-weight: bold;
            font-size: 17px;
        }


        /* =====================================================
           UPI
        ====================================================== */

        .upi-box {
            text-align: center;
        }


        .upi-amount {
            margin-top: 15px;
            padding: 14px;
            border-radius: 9px;
            background: #fff3e0;
            color: #e65100;
            text-align: center;
            font-size: 14px;
        }


        .upi-amount strong {
            display: block;
            font-size: 26px;
            margin-top: 5px;
            color: #ff5722;
        }


        .upi-qr {
            width: 230px;
            height: 230px;
            margin: 18px auto;
            padding: 10px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }


        .upi-qr img {
            max-width: 100%;
            max-height: 100%;
        }


        .upi-details {
            text-align: center;
            padding: 14px;
            background: white;
            border-radius: 8px;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }


        .upi-note {
            margin-top: 12px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }


        /* =====================================================
           GENERAL
        ====================================================== */

        .hidden {
            display: none;
        }


        .loading,
        .error,
        .empty {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }


        .loading,
        .empty {
            color: #777;
        }


        .error {
            color: #c62828;
        }


        .back-btn {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }


        /* =====================================================
           PRINT ONLY
        ====================================================== */

        .print-bill {
            display: none;
        }


        @media print {

            body {
                background: white;
                padding: 0;
            }


            body > * {
                display: none !important;
            }


            #printBillContainer {
                display: block !important;
            }


            .print-bill {
                display: block;
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
                padding: 30px;
                color: #111;
                background: white;
            }


            .print-header {
                text-align: center;
                border-bottom: 2px solid #222;
                padding-bottom: 15px;
                margin-bottom: 20px;
            }


            .print-header h1 {
                font-size: 28px;
                margin-bottom: 5px;
            }


            .print-header p {
                color: #555;
                font-size: 14px;
            }


            .print-info {
                margin-bottom: 20px;
            }


            .print-info-row {
                display: flex;
                justify-content: space-between;
                padding: 5px 0;
                font-size: 14px;
            }


            .print-items {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px;
            }


            .print-items th,
            .print-items td {
                border-bottom: 1px solid #ddd;
                padding: 9px 5px;
                text-align: left;
            }


            .print-items th:last-child,
            .print-items td:last-child {
                text-align: right;
            }


            .print-summary {
                width: 100%;
                margin-top: 20px;
            }


            .print-summary-row {
                display: flex;
                justify-content: space-between;
                padding: 6px 0;
            }


            .print-summary-total {
                border-top: 2px solid #222;
                margin-top: 8px;
                padding-top: 10px;
                font-size: 20px;
                font-weight: bold;
            }


            .print-payment {
                margin-top: 25px;
                padding: 12px;
                border: 1px solid #ccc;
                text-align: center;
            }


            .print-footer {
                margin-top: 35px;
                text-align: center;
                color: #555;
                font-size: 13px;
                border-top: 1px solid #ddd;
                padding-top: 15px;
            }

        }


        @media (max-width: 500px) {

            .bill-print-actions {
                flex-direction: column;
            }


            .bill-item-row {
                align-items: flex-start;
            }


            .upi-qr {
                width: 220px;
                height: 220px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1 id="restaurantName">
            Restaurant
        </h1>

        <p>
            Order Status
        </p>

    </header>


    <div class="container">


        <!-- TABLE -->

        <div
            id="tableInfo"
            class="table-info"
        >
            Loading table...
        </div>


        <!-- STATUS -->

        <div id="statusContainer">

            <div class="loading">
                Loading order...
            </div>

        </div>


    </div>


    <!-- =====================================================
         PRINT BILL CONTAINER
    ====================================================== -->

    <div
        id="printBillContainer"
        style="display:none;"
    ></div>


    <script type="module">


        /* =====================================================
           FIREBASE IMPORTS
        ====================================================== */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc,
            onSnapshot,
            serverTimestamp
        }
        from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        import {
            getAuth,
            onAuthStateChanged
        }
        from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        /* =====================================================
           FIREBASE CONFIG
        ====================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================================
           INITIALIZE FIREBASE
        ====================================================== */

        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        const auth =
            getAuth(app);


        /* =====================================================
           URL PARAMETERS
        ====================================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const restaurantId =
            params.get("restaurantId");


        const table =
            params.get("table");


        const orderId =
            params.get("orderId") ||
            localStorage.getItem(
                "currentOrderId"
            );


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const restaurantName =
            document.getElementById(
                "restaurantName"
            );


        const tableInfo =
            document.getElementById(
                "tableInfo"
            );


        const statusContainer =
            document.getElementById(
                "statusContainer"
            );


        /* =====================================================
           GLOBAL VARIABLES
        ====================================================== */

        let currentUser = null;

        let orderData = null;

        let currentUPILink = "";

        let restaurantPaymentData = null;


        /* =====================================================
           CHECK PARAMETERS
        ====================================================== */

        if (
            !restaurantId ||
            !table ||
            !orderId
        ) {

            statusContainer.innerHTML = `

                <div class="error">

                    ❌ Order information is missing.

                    <br><br>

                    Please open your order status
                    from the order confirmation page.

                    <button
                        class="back-btn"
                        onclick="goBackToMenu()"
                    >
                        ← Back to Menu
                    </button>

                </div>

            `;

        }
        else {

            tableInfo.textContent =
                "🪑 Table " + table;


            loadRestaurant();


            waitForLogin();

        }


        /* =====================================================
           LOAD RESTAURANT
        ====================================================== */

        async function loadRestaurant() {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const snapshot =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    snapshot.exists()
                ) {

                    const data =
                        snapshot.data();


                    restaurantPaymentData =
                        data;


                    restaurantName.textContent =
                        data.restaurantName ||
                        data.name ||
                        "Restaurant";

                }

            }
            catch(error) {

                console.error(
                    "Restaurant loading error:",
                    error
                );

            }

        }


        /* =====================================================
           WAIT FOR LOGIN
        ====================================================== */

        function waitForLogin() {

            onAuthStateChanged(
                auth,
                function(user) {

                    if (!user) {

                        statusContainer.innerHTML = `

                            <div class="error">

                                ❌ Please login to view
                                your order status.

                            </div>

                        `;

                        return;

                    }


                    currentUser =
                        user;


                    loadOrder();

                }
            );

        }


        /* =====================================================
           LOAD ORDER REAL TIME
        ====================================================== */

        function loadOrder() {

            const orderRef =
                doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders",
                    orderId
                );


            onSnapshot(
                orderRef,

                function(snapshot) {

                    if (
                        !snapshot.exists()
                    ) {

                        statusContainer.innerHTML = `

                            <div class="error">

                                ❌ Order not found.

                            </div>

                        `;

                        return;

                    }


                    orderData =
                        snapshot.data();


                    if (
                        orderData.customerUid &&
                        currentUser &&
                        orderData.customerUid !==
                        currentUser.uid
                    ) {

                        statusContainer.innerHTML = `

                            <div class="error">

                                ❌ You are not authorized
                                to view this order.

                            </div>

                        `;

                        return;

                    }


                    renderOrder();

                },


                function(error) {

                    console.error(
                        "Order listener error:",
                        error
                    );


                    statusContainer.innerHTML = `

                        <div class="error">

                            ❌ Unable to load order.

                            <br><br>

                            ${escapeHTML(
                                error.message
                            )}

                        </div>

                    `;

                }
            );

        }


        /* =====================================================
           RENDER ORDER
        ====================================================== */

        function renderOrder() {

            const status =
                orderData.status ||
                "received";


            const statusInfo =
                getStatusInfo(
                    status
                );


            const waiterCalled =
                orderData.waiterCalled === true;


            const billRequested =
                orderData.billRequested === true;


            const billGenerated =
                orderData.billGenerated === true ||
                orderData.billStatus === "generated";


            statusContainer.innerHTML = `

                <div class="order-card">

                    <div class="order-title">
                        📋 Order Status
                    </div>


                    <div class="order-id">

                        Order ID:
                        ${escapeHTML(orderId)}

                    </div>


                    <div class="status-box">

                        ${statusInfo.icon}
                        ${statusInfo.text}

                    </div>


                    <div class="status-message">

                        ${statusInfo.message}

                    </div>

                </div>


                <div class="action-card">

                    <h3>
                        👨‍🍳 Need Assistance?
                    </h3>


                    <p style="
                        color:#777;
                        font-size:14px;
                    ">

                        Call a waiter whenever you need
                        assistance at your table.

                    </p>


                    <button
                        id="waiterBtn"
                        class="action-btn waiter-btn
                        ${waiterCalled ? "requested" : ""}"
                        ${waiterCalled ? "disabled" : ""}
                        onclick="callWaiter()"
                    >

                        ${
                            waiterCalled
                            ?
                            "✅ Waiter Requested"
                            :
                            "🔔 Call Waiter"
                        }

                    </button>

                </div>


                <div class="action-card">

                    <h3>
                        🧾 Bill
                    </h3>


                    <p style="
                        color:#777;
                        font-size:14px;
                    ">

                        When you are ready to pay,
                        request your bill.

                    </p>


                    <button
                        id="billBtn"
                        class="action-btn bill-btn
                        ${billRequested ? "requested" : ""}"
                        ${billRequested ? "disabled" : ""}
                        onclick="requestBill()"
                    >

                        ${
                            billRequested
                            ?
                            "✅ Bill Requested"
                            :
                            "🧾 Request Bill"
                        }

                    </button>

                </div>


                ${
                    billGenerated
                    ?
                    renderGeneratedBill()
                    :
                    `

                    <div class="bill-card">

                        <h3>
                            💳 Payment
                        </h3>


                        <div class="
                            bill-status
                            ${billRequested
                                ? "bill-requested"
                                : ""}
                        ">

                            ${
                                billRequested
                                ?
                                "⏳ Bill requested. Waiting for restaurant..."
                                :
                                "⏳ Bill has not been requested yet."
                            }

                        </div>

                    </div>

                    `
                }


                <button
                    class="back-btn"
                    onclick="goBackToMenu()"
                >

                    ← Back to Menu

                </button>

            `;

        }


        /* =====================================================
           GENERATED BILL
        ====================================================== */

        function renderGeneratedBill() {

            const subtotal =
                Number(
                    orderData.billSubtotal ??
                    orderData.subtotal ??
                    orderData.total ??
                    0
                );


            const discount =
                Number(
                    orderData.billDiscountAmount ??
                    orderData.discountAmount ??
                    0
                );


            const total =
                Number(
                    orderData.billTotal ??
                    orderData.finalTotal ??
                    orderData.total ??
                    Math.max(
                        0,
                        subtotal - discount
                    )
                );


            const paymentStatus =
                orderData.paymentStatus ||
                "unpaid";


            const paymentMethod =
                orderData.paymentMethod ||
                "";


            const items =
                Array.isArray(
                    orderData.items
                )
                ?
                orderData.items
                :
                [];


            let paymentSection = "";


            /* =================================================
               PAID
            ================================================== */

            if (
                paymentStatus === "paid"
            ) {

                paymentSection = `

                    <div class="payment-paid">

                        ✅ Payment Completed

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Payment method:

                            ${
                                paymentMethod === "cash"
                                ?
                                "💵 Cash"
                                :
                                paymentMethod === "upi"
                                ?
                                "📱 UPI"
                                :
                                "Payment"
                            }

                        </small>

                    </div>

                `;

            }


            /* =================================================
               CASH SELECTED
            ================================================== */

            else if (
                paymentStatus === "payment_selected" &&
                paymentMethod === "cash"
            ) {

                paymentSection = `

                    <div class="payment-selected">

                        💵 Cash Payment Selected

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Please wait for the restaurant
                            to collect and confirm your payment.

                        </small>

                    </div>

                `;

            }


            /* =================================================
               UPI SELECTED
            ================================================== */

            else if (
                paymentStatus === "payment_selected" &&
                paymentMethod === "upi"
            ) {

                paymentSection = `

                    <div class="payment-selected">

                        📱 UPI Payment Selected

                        <br>

                        <small style="
                            font-weight:normal;
                        ">

                            Your UPI payment selection has
                            been recorded.

                            <br>

                            The restaurant will manually
                            verify the payment.

                        </small>

                    </div>

                `;

            }


            /* =================================================
               PAYMENT NOT SELECTED
            ================================================== */

            else {

                paymentSection = `

                    <div class="payment-box">

                        <div class="payment-title">

                            💳 Choose Payment Method

                        </div>


                        <div class="payment-help">

                            Select how you want to pay.

                        </div>


                        <div class="payment-tabs">

                            <button
                                id="cashTab"
                                class="payment-tab active"
                                onclick="showPaymentPanel('cash')"
                            >

                                💵 Cash

        /* =====================================================
           LOAD UPI PAYMENT FROM ADMIN PANEL
        ====================================================== */

        async function loadUPIPayment(total) {

            const qrContainer =
                document.getElementById(
                    "upiQRCode"
                );


            const detailsContainer =
                document.getElementById(
                    "upiDetails"
                );


            if (
                !qrContainer ||
                !detailsContainer
            ) {

                return;

            }


            /* ---------------------------------------------
               LOADING
            --------------------------------------------- */

            qrContainer.innerHTML = `

                <div style="
                    color:#777;
                    text-align:center;
                    font-size:14px;
                ">

                    Loading QR...

                </div>

            `;


            detailsContainer.innerHTML = `

                Loading UPI details...

            `;


            try {

                /* -----------------------------------------
                   LOAD RESTAURANT DOCUMENT
                ------------------------------------------ */

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnapshot =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    !restaurantSnapshot.exists()
                ) {

                    qrContainer.innerHTML = `

                        <div style="
                            color:#c62828;
                            font-weight:bold;
                            text-align:center;
                            padding:15px;
                        ">

                            ❌ Restaurant not found.

                        </div>

                    `;


                    detailsContainer.innerHTML = `

                        Unable to load restaurant
                        payment settings.

                    `;


                    return;

                }


                /* -----------------------------------------
                   RESTAURANT DATA
                ------------------------------------------ */

                const restaurant =
                    restaurantSnapshot.data();


                restaurantPaymentData =
                    restaurant;


                console.log(
                    "Restaurant data:",
                    restaurant
                );


                /* -----------------------------------------
                   RESTAURANT NAME
                ------------------------------------------ */

                const upiName =
                    String(
                        restaurant.upiName ||
                        restaurant.merchantName ||
                        restaurant.restaurantName ||
                        restaurant.name ||
                        "Restaurant"
                    ).trim();


                /* -----------------------------------------
                   UPI ID

                   The first field is the expected
                   Admin Panel field.

                   Others are supported as fallback.
                ------------------------------------------ */

                const upiId =
                    String(
                        restaurant.upiId ||
                        restaurant.upi ||
                        restaurant.merchantUpiId ||
                        restaurant.paymentUpiId ||
                        restaurant.paytmUpiId ||
                        restaurant.businessUpiId ||
                        ""
                    ).trim();


                console.log(
                    "UPI Name:",
                    upiName
                );


                console.log(
                    "UPI ID:",
                    upiId
                );


                /* -----------------------------------------
                   CHECK UPI ID
                ------------------------------------------ */

                if (!upiId) {

                    qrContainer.innerHTML = `

                        <div style="
                            color:#c62828;
                            font-weight:bold;
                            text-align:center;
                            padding:15px;
                        ">

                            ❌ UPI ID not configured.

                        </div>

                    `;


                    detailsContainer.innerHTML = `

                        <strong>
                            UPI payment is not configured.
                        </strong>

                        <br><br>

                        Please add the Paytm Business
                        UPI ID in the Admin Panel.

                    `;


                    return;

                }


                /* -----------------------------------------
                   CHECK AMOUNT
                ------------------------------------------ */

                const amount =
                    Number(total);


                if (
                    !Number.isFinite(amount) ||
                    amount <= 0
                ) {

                    qrContainer.innerHTML = `

                        <div style="
                            color:#c62828;
                            font-weight:bold;
                            text-align:center;
                            padding:15px;
                        ">

                            ❌ Invalid payment amount.

                        </div>

                    `;


                    detailsContainer.innerHTML =
                        "Unable to create UPI payment QR.";


                    return;

                }


                /* -----------------------------------------
                   CREATE UPI LINK
                ------------------------------------------ */

                currentUPILink =
                    "upi://pay" +
                    "?pa=" +
                    encodeURIComponent(
                        upiId
                    ) +
                    "&pn=" +
                    encodeURIComponent(
                        upiName
                    ) +
                    "&am=" +
                    encodeURIComponent(
                        amount.toFixed(2)
                    ) +
                    "&cu=INR" +
                    "&tn=" +
                    encodeURIComponent(
                        "Order " + orderId
                    );


                console.log(
                    "Generated UPI Link:",
                    currentUPILink
                );


                /* -----------------------------------------
                   CLEAR QR
                ------------------------------------------ */

                qrContainer.innerHTML = "";


                /* -----------------------------------------
                   CHECK QR LIBRARY
                ------------------------------------------ */

                if (
                    typeof QRCode === "undefined"
                ) {

                    qrContainer.innerHTML = `

                        <div style="
                            color:#c62828;
                            font-weight:bold;
                            text-align:center;
                            padding:15px;
                        ">

                            ❌ QR library could not
                            be loaded.

                        </div>

                    `;


                    detailsContainer.innerHTML = `

                        Please check your internet
                        connection and reload the page.

                    `;


                    return;

                }


                /* -----------------------------------------
                   GENERATE QR
                ------------------------------------------ */

                new QRCode(
                    qrContainer,
                    {

                        text:
                            currentUPILink,

                        width:
                            210,

                        height:
                            210,

                        colorDark:
                            "#000000",

                        colorLight:
                            "#ffffff",

                        correctLevel:
                            QRCode.CorrectLevel.M

                    }
                );


                /* -----------------------------------------
                   SHOW ACTUAL ADMIN PANEL DETAILS
                ------------------------------------------ */

                detailsContainer.innerHTML = `

                    <strong style="
                        font-size:18px;
                        color:#444;
                    ">

                        ${escapeHTML(upiName)}

                    </strong>


                    <br>


                    <span style="
                        display:block;
                        margin-top:8px;
                        color:#555;
                    ">

                        UPI ID:

                    </span>


                    <strong style="
                        display:block;
                        margin-top:3px;
                        color:#222;
                        word-break:break-all;
                    ">

                        ${escapeHTML(upiId)}

                    </strong>


                    <div style="
                        margin-top:8px;
                        color:#555;
                    ">

                        Amount:

                        <strong>
                            ₹${amount.toFixed(2)}
                        </strong>

                    </div>

                `;


                console.log(
                    "✅ UPI QR generated successfully"
                );

            }
            catch(error) {

                console.error(
                    "UPI loading error:",
                    error
                );


                qrContainer.innerHTML = `

                    <div style="
                        color:#c62828;
                        text-align:center;
                        padding:15px;
                        font-weight:bold;
                    ">

                        ❌ Unable to generate QR.

                    </div>

                `;


                detailsContainer.innerHTML = `

                    Unable to load payment details.

                    <br><br>

                    <small>
                        ${escapeHTML(
                            error.message
                        )}
                    </small>

                `;

            }

        }

                        "active"
                    );


                    upiTab.classList.add(
                        "active"
                    );


                    /*
                     * Generate QR again when
                     * UPI tab is opened.
                     */

                    const total =
                        Number(
                            orderData?.billTotal ??
                            orderData?.finalTotal ??
                            orderData?.billSubtotal ??
                            orderData?.total ??
                            0
                        );


                    if (total > 0) {

                        loadUPIPayment(total);

                    }

                }
                else {

                    cashPanel.style.display =
                        "block";


                    upiPanel.style.display =
                        "none";


                    cashTab.classList.add(
                        "active"
                    );


                    upiTab.classList.remove(
                        "active"
                    );

                }

            };


        /* =====================================================
           SELECT PAYMENT
        ====================================================== */

        window.selectPayment =
            async function(method) {

                if (!currentUser) {

                    alert(
                        "Please login first."
                    );


                    return;

                }


                if (!orderData) {
                    return;
                }


                const billGenerated =
                    orderData.billGenerated === true ||
                    orderData.billStatus === "generated";


                if (!billGenerated) {

                    alert(
                        "The bill has not been generated yet."
                    );


                    return;

                }


                if (
                    orderData.paymentStatus ===
                    "paid"
                ) {

                    return;

                }


                /* -----------------------------------------
                   FOR UPI VERIFY THAT UPI EXISTS
                ------------------------------------------ */

                if (
                    method === "upi"
                ) {

                    try {

                        const restaurantRef =
                            doc(
                                db,
                                "restaurants",
                                restaurantId
                            );


                        const restaurantSnapshot =
                            await getDoc(
                                restaurantRef
                            );


                        if (
                            !restaurantSnapshot.exists()
                        ) {

                            alert(
                                "Restaurant payment settings not found."
                            );


                            return;

                        }


                        const restaurant =
                            restaurantSnapshot.data();


                        const upiId =
                            String(
                                restaurant.upiId ||
                                restaurant.upi ||
                                restaurant.merchantUpiId ||
                                restaurant.paymentUpiId ||
                                restaurant.paytmUpiId ||
                                restaurant.businessUpiId ||
                                ""
                            ).trim();


                        if (!upiId) {

                            alert(
                                "UPI ID is not configured in the Admin Panel."
                            );


                            return;

                        }

                    }
                    catch(error) {

                        console.error(
                            "UPI validation error:",
                            error
                        );


                        alert(
                            "Unable to verify UPI settings."
                        );


                        return;

                    }

                }


                const methodName =
                    method === "upi"
                    ?
                    "UPI"
                    :
                    "Cash";


                const confirmed =
                    confirm(
                        "Select " +
                        methodName +
                        " as your payment method?"
                    );


                if (!confirmed) {
                    return;
                }


                try {

                    const orderRef =
                        doc(
                            db,
                            "restaurants",
                            restaurantId,
                            "orders",
                            orderId
                        );


                    const updateData = {

                        paymentMethod:
                            method,

                        paymentStatus:
                            "payment_selected",

                        paymentSelectedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    };


                    if (
                        method === "cash"
                    ) {

                        updateData.cashPaymentRequested =
                            true;


                        updateData.cashPaymentRequestedAt =
                            serverTimestamp();

                    }


                    if (
                        method === "upi"
                    ) {

                        updateData.upiPaymentRequested =
                            true;


                        updateData.upiPaymentRequestedAt =
                            serverTimestamp();

                    }


                    await updateDoc(
                        orderRef,
                        updateData
                    );


                    alert(
                        "✅ " +
                        methodName +
                        " selected.\n\n" +
                        (
                            method === "cash"
                            ?
                            "Please wait for the waiter to collect your cash."
                            :
                            "Please complete the UPI payment and tap 'I Have Paid'."
                        )
                    );

                }
                catch(error) {

                    console.error(
                        "Payment selection error:",
                        error
                    );


                    alert(
                        "❌ Unable to select payment method.\n\n" +
                        error.message
                    );

                }

            };


        /* =====================================================
           BACK TO MENU
        ====================================================== */

        window.goBackToMenu =
            function() {

                window.location.href =
                    "customer-menu.html" +
                    "?restaurantId=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&table=" +
                    encodeURIComponent(
                        table
                    );

            };


        /* =====================================================
           STATUS INFORMATION
        ====================================================== */

        function getStatusInfo(status) {

            switch(status) {

                case "new":

                case "received":

                    return {

                        icon:
                            "📥",

                        text:
                            "Order Received",

                        message:
                            "Your order has been received by the restaurant."

                    };


                case "accepted":

                    return {

                        icon:
                            "✅",

                        text:
                            "Order Accepted",

                        message:
                            "The restaurant has accepted your order."

                    };


                case "preparing":

                    return {

                        icon:
                            "👨‍🍳",

                        text:
                            "Preparing",

                        message:
                            "The kitchen is preparing your order."

                    };


                case "ready":

                    return {

                        icon:
                            "🍽️",

                        text:
                            "Ready",

                        message:
                            "Your order is ready."

                    };


                case "served":

                    return {

                        icon:
                            "✅",

                        text:
                            "Served",

                        message:
                            "Your order has been served."

                    };


                case "completed":

                    return {

                        icon:
                            "🎉",

                        text:
                            "Completed",

                        message:
                            "Your order is completed."

                    };


                case "cancelled":

                    return {

                        icon:
                            "❌",

                        text:
                            "Cancelled",

                        message:
                            "This order has been cancelled."

                    };


                default:

                    return {

                        icon:
                            "📋",

                        text:
                            String(status),

                        message:
                            "Your order status has been updated."

                    };

            }

        }


        /* =====================================================
           FIREBASE TIMESTAMP HELPER
        ====================================================== */

        function getTimestampMillis(value) {

            if (!value) {
                return 0;
            }


            if (
                typeof value.toMillis ===
                "function"
            ) {

                return value.toMillis();

            }


            if (
                value.seconds !== undefined
            ) {

                return (
                    Number(value.seconds) *
                    1000
                );

            }


            if (
                value instanceof Date
            ) {

                return value.getTime();

            }


            if (
                typeof value === "string"
            ) {

                const parsed =
                    Date.parse(value);


                return Number.isNaN(parsed)
                    ?
                    0
                    :
                    parsed;

            }


            return 0;

        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(value) {

            return String(value)

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }


    </script>
