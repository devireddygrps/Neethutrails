<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Status - Restaurant</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding-bottom:30px;
}

header{
background:#ff5722;
color:white;
padding:20px;
text-align:center;
}

header h1{
margin-bottom:5px;
}

header p{
font-size:14px;
}

.container{
max-width:600px;
margin:auto;
padding:15px;
}

.table-info,
.order-card,
.action-card,
.bill-card{
background:white;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-info{
text-align:center;
font-weight:bold;
color:#ff5722;
}

.order-title{
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

.order-id{
color:#777;
font-size:13px;
word-break:break-all;
}

.status-box{
margin-top:15px;
padding:16px;
border-radius:10px;
background:#fff3e0;
color:#e65100;
text-align:center;
font-size:18px;
font-weight:bold;
}

.status-message{
text-align:center;
color:#777;
margin-top:10px;
font-size:14px;
}

.action-card h3,
.bill-card h3{
margin-bottom:12px;
}

.action-btn{
width:100%;
padding:14px;
border:none;
border-radius:9px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.waiter-btn{
background:#ff5722;
}

.bill-btn{
background:#333;
}

.action-btn:disabled{
background:#aaa;
cursor:not-allowed;
}

.requested{
background:#43a047 !important;
}

.bill-status{
padding:13px;
border-radius:8px;
background:#f5f5f5;
text-align:center;
color:#555;
}

.bill-generated{
background:#e8f5e9;
color:#2e7d32;
font-weight:bold;
}

.bill-requested{
background:#fff3e0;
color:#e65100;
font-weight:bold;
}

.bill-total{
margin-top:15px;
padding-top:15px;
border-top:1px solid #ddd;
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
}

.bill-price{
color:#ff5722;
}

.bill-breakdown{
background:#fafafa;
border-radius:10px;
padding:12px;
margin-top:15px;
}

.bill-row{
display:flex;
justify-content:space-between;
padding:6px 0;
color:#555;
}

.bill-row.discount{
color:#2e7d32;
}

.bill-items{
margin-top:15px;
background:white;
border:1px solid #eee;
border-radius:10px;
padding:12px;
}

.bill-item-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:9px 0;
border-bottom:1px solid #eee;
}

.bill-item-row:last-child{
border-bottom:none;
}

.bill-item-name{
font-weight:bold;
color:#333;
}

.bill-item-quantity{
color:#777;
font-size:13px;
}

.bill-item-price{
font-weight:bold;
white-space:nowrap;
}

.bill-print-actions{
display:flex;
gap:10px;
margin-top:15px;
}

.bill-print-btn,
.bill-pdf-btn{
flex:1;
padding:13px;
border:none;
border-radius:9px;
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.bill-print-btn{
background:#1976d2;
}

.bill-pdf-btn{
background:#6a1b9a;
}

.bill-meta{
margin-top:15px;
padding:12px;
background:#fafafa;
border-radius:9px;
font-size:14px;
color:#555;
}

.bill-meta-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:5px 0;
}

.bill-meta-row strong{
color:#333;
}

/* PAYMENT */

.payment-box{
margin-top:18px;
}

.payment-title{
font-size:17px;
font-weight:bold;
margin-bottom:8px;
}

.payment-help{
color:#777;
font-size:14px;
margin-bottom:10px;
}

.payment-tabs{
display:flex;
gap:8px;
margin-top:12px;
}

.payment-tab{
flex:1;
padding:13px 8px;
border:2px solid #ddd;
border-radius:9px;
background:white;
color:#555;
font-weight:bold;
cursor:pointer;
}

.payment-tab.active{
background:#ff5722;
border-color:#ff5722;
color:white;
}

.payment-panel{
margin-top:12px;
padding:15px;
border-radius:10px;
background:#f8f8f8;
border:1px solid #eee;
}

.payment-action-btn{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#ff5722;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.payment-selected{
margin-top:15px;
padding:16px;
border-radius:9px;
background:#fff3cd;
color:#856404;
text-align:center;
font-weight:bold;
}

.payment-paid{
margin-top:15px;
padding:16px;
border-radius:9px;
background:#e8f5e9;
color:#2e7d32;
text-align:center;
font-weight:bold;
font-size:17px;
}

/* CASH */

.cash-request-panel{
cursor:pointer;
text-align:center;
transition:.2s;
}

.cash-request-panel:hover{
border-color:#ff5722;
box-shadow:0 3px 10px rgba(255,87,34,.15);
}

.cash-icon{
font-size:48px;
margin-bottom:10px;
}

.cash-title{
display:block;
font-size:20px;
font-weight:bold;
}

.cash-description{
color:#777;
font-size:14px;
margin-top:8px;
}

.cash-request-button{
margin-top:15px;
padding:13px;
background:#fff3e0;
color:#e65100;
border-radius:8px;
font-weight:bold;
}

.cash-requested-box{
margin-top:15px;
padding:16px;
background:#fff3e0;
color:#e65100;
border-radius:10px;
text-align:center;
font-weight:bold;
}

/* UPI */

.upi-box{
text-align:center;
}

.upi-amount{
margin-top:15px;
padding:14px;
border-radius:9px;
background:#fff3e0;
color:#e65100;
text-align:center;
font-size:14px;
}

.upi-amount strong{
display:block;
font-size:26px;
margin-top:5px;
color:#ff5722;
}

.upi-qr{
width:230px;
height:230px;
margin:18px auto;
padding:10px;
background:white;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #ddd;
}

.upi-qr img{
max-width:100%;
max-height:100%;
}

.upi-details{
text-align:center;
padding:14px;
background:white;
border-radius:8px;
color:#555;
font-size:14px;
line-height:1.6;
}

.upi-note{
margin-top:12px;
color:#777;
font-size:12px;
line-height:1.5;
}

.hidden{
display:none;
}

.loading,
.error,
.empty{
background:white;
border-radius:12px;
padding:25px;
text-align:center;
}

.loading,
.empty{
color:#777;
}

.error{
color:#c62828;
}

.back-btn{
width:100%;
margin-top:10px;
padding:13px;
border:none;
border-radius:9px;
background:#333;
color:white;
font-size:16px;
cursor:pointer;
}

.print-bill{
display:none;
}

@media(max-width:500px){

.bill-print-actions{
flex-direction:column;
}

.upi-qr{
width:220px;
height:220px;
}

}

</style>

</head>

<body>

<header>

<h1 id="restaurantName">
Restaurant
</h1>

<p>
Order Status
</p>

</header>


<div class="container">

<div
id="tableInfo"
class="table-info"
>
Loading table...
</div>


<div id="statusContainer">

<div class="loading">
Loading order...
</div>

</div>

</div>


<div
id="printBillContainer"
style="display:none;"
></div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getFirestore,
doc,
getDoc,
updateDoc,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig={

apiKey:
"AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

authDomain:
"restaurant-qr-ordering-fdf9b.firebaseapp.com",

projectId:
"restaurant-qr-ordering-fdf9b",

storageBucket:
"restaurant-qr-ordering-fdf9b.firebasestorage.app",

messagingSenderId:
"907571024375",

appId:
"1:907571024375:web:796894f82f2cae4d7b9ef2",

measurementId:
"G-G3Q89BDFF9"

};


const app=
initializeApp(firebaseConfig);

const db=
getFirestore(app);

const auth=
getAuth(app);


/* =========================================================
   URL
========================================================= */

const params=
new URLSearchParams(
window.location.search
);


const restaurantId=
params.get("restaurantId");


const table=
params.get("table");


const orderId=
params.get("orderId") ||
localStorage.getItem("currentOrderId");


/* =========================================================
   ELEMENTS
========================================================= */

const restaurantName=
document.getElementById(
"restaurantName"
);


const tableInfo=
document.getElementById(
"tableInfo"
);


const statusContainer=
document.getElementById(
"statusContainer"
);


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser=null;

let orderData=null;

let currentUPILink="";

let restaurantPaymentData=null;


/* =========================================================
   INITIAL CHECK
========================================================= */

if(
!restaurantId ||
!table ||
!orderId
){

statusContainer.innerHTML=`

<div class="error">

❌ Order information is missing.

<br><br>

Please open your order status
from the order confirmation page.

<button
class="back-btn"
onclick="goBackToMenu()"
>
← Back to Menu
</button>

</div>

`;

}
else{

tableInfo.textContent=
"🪑 Table "+table;

loadRestaurant();

waitForLogin();

}


/* =========================================================
   RESTAURANT
========================================================= */

async function loadRestaurant(){

try{

const ref=
doc(
db,
"restaurants",
restaurantId
);


const snap=
await getDoc(ref);


if(snap.exists()){

const data=
snap.data();

restaurantPaymentData=
data;


restaurantName.textContent=
data.restaurantName ||
data.name ||
"Restaurant";

}

}
catch(error){

console.error(
"Restaurant error:",
error
);

}

}


/* =========================================================
   LOGIN
========================================================= */

function waitForLogin(){

onAuthStateChanged(
auth,
function(user){

if(!user){

statusContainer.innerHTML=`

<div class="error">

❌ Please login to view
your order status.

</div>

`;

return;

}


currentUser=
user;


loadOrder();

}
);

}


/* =========================================================
   ORDER REALTIME
========================================================= */

function loadOrder(){

const orderRef=
doc(
db,
"restaurants",
restaurantId,
"orders",
orderId
);


onSnapshot(
orderRef,
function(snapshot){

if(!snapshot.exists()){

statusContainer.innerHTML=`

<div class="error">

❌ Order not found.

</div>

`;

return;

}


orderData=
snapshot.data();


/*
   SECURITY CHECK
*/

if(
orderData.customerUid &&
currentUser &&
orderData.customerUid !==
currentUser.uid
){

statusContainer.innerHTML=`

<div class="error">

❌ You are not authorized
to view this order.

</div>

`;

return;

}


renderOrder();

},
function(error){

console.error(
"Order listener error:",
error
);


statusContainer.innerHTML=`

<div class="error">

❌ Unable to load order.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}
);

}


/* =========================================================
   RENDER ORDER
========================================================= */

function renderOrder(){

const status=
orderData.status ||
"received";


const statusInfo=
getStatusInfo(status);


const waiterCalled=
orderData.waiterCalled===true;


const billRequested=
orderData.billRequested===true;


const billGenerated=
orderData.billGenerated===true ||
orderData.billStatus==="generated";


statusContainer.innerHTML=`

<div class="order-card">

<div class="order-title">
📋 Order Status
</div>


<div class="order-id">

Order ID:
${escapeHTML(orderId)}

</div>


<div class="status-box">

${statusInfo.icon}

${statusInfo.text}

</div>


<div class="status-message">

${statusInfo.message}

</div>

</div>


<div class="action-card">

<h3>
👨‍🍳 Need Assistance?
</h3>


<p
style="
color:#777;
font-size:14px;
"
>

Call a waiter whenever you need
assistance at your table.

</p>


<button
id="waiterBtn"
class="action-btn waiter-btn
${waiterCalled?"requested":""}"
${waiterCalled?"disabled":""}
onclick="callWaiter()"
>

${
waiterCalled
?
"✅ Waiter Requested"
:
"🔔 Call Waiter"
}

</button>

</div>


<div class="action-card">

<h3>
🧾 Bill
</h3>


<p
style="
color:#777;
font-size:14px;
"
>

When you are ready to pay,
request your bill.

</p>


<button
id="billBtn"
class="action-btn bill-btn
${billRequested?"requested":""}"
${billRequested?"disabled":""}
onclick="requestBill()"
>

${
billRequested
?
"✅ Bill Requested"
:
"🧾 Request Bill"
}

</button>

</div>


${
billGenerated
?
renderGeneratedBill()
:
`

<div class="bill-card">

<h3>
💳 Payment
</h3>


<div class="bill-status
${billRequested?"bill-requested":""}">

${
billRequested
?
"⏳ Bill requested. Waiting for restaurant..."
:
"⏳ Bill has not been requested yet."
}

</div>

</div>

`
}


<button
class="back-btn"
onclick="goBackToMenu()"
>

← Back to Menu

</button>

`;

}


/* =========================================================
   GENERATED BILL
========================================================= */

function renderGeneratedBill(){

const subtotal=
Number(
orderData.billSubtotal ??
orderData.subtotal ??
orderData.total ??
0
);


const discount=
Number(
orderData.billDiscountAmount ??
orderData.discountAmount ??
0
);


const total=
Number(
orderData.billTotal ??
orderData.finalTotal ??
orderData.total ??
Math.max(
0,
subtotal-discount
)
);


const paymentStatus=
orderData.paymentStatus ||
"unpaid";


const paymentMethod=
orderData.paymentMethod ||
"";


const cashRequested=
orderData.cashPaymentRequested===true;


const cashCompleted=
orderData.cashPaymentCompleted===true;


const items=
Array.isArray(orderData.items)
?
orderData.items
:
[];


let paymentSection="";


/* =========================================================
   PAID
========================================================= */

if(
paymentStatus==="paid"
){

paymentSection=`

<div class="payment-paid">

✅ Payment Completed

<br>

<small
style="
font-weight:normal;
"
>

Payment method:

${
paymentMethod==="cash"
?
"💵 Cash"
:
paymentMethod==="upi"
?
"📱 UPI"
:
"Payment"
}

</small>

</div>

`;

}


/* =========================================================
   CASH REQUESTED
========================================================= */

else if(
paymentMethod==="cash" &&
cashRequested
){

paymentSection=`

<div class="cash-requested-box">

💵 Cash Collection Requested

<br><br>

<small
style="
font-weight:normal;
"
>

🔔 The restaurant has received
your cash collection request.

<br><br>

Please keep

<strong>
₹${total.toFixed(2)}
</strong>

ready.

<br>

A waiter will come to your table
to collect the cash.

</small>

</div>

`;

}


/* =========================================================
   UPI SELECTED
========================================================= */

else if(
paymentStatus==="payment_selected" &&
paymentMethod==="upi"
){

paymentSection=`

<div class="payment-selected">

📱 UPI Payment Selected

<br>

<small
style="
font-weight:normal;
"
>

Please complete your UPI payment
and tap "I Have Paid".

</small>

</div>

`;

}


/* =========================================================
   PAYMENT CHOICE
========================================================= */

else{

paymentSection=`

<div class="payment-box">

<div class="payment-title">

💳 Choose Payment Method

</div>


<div class="payment-help">

Tap a payment method below.

</div>


<div class="payment-tabs">

<button
id="cashTab"
class="payment-tab active"
onclick="showPaymentPanel('cash')"
>

💵 Cash

</button>


<button
id="upiTab"
class="payment-tab"
onclick="showPaymentPanel('upi')"
>

📱 UPI

</button>

</div>


<!-- CASH -->

<div
id="cashPanel"
class="payment-panel cash-request-panel"
onclick="selectPayment('cash')"
>

<div class="cash-icon">
💵
</div>


<strong class="cash-title">

Pay by Cash

</strong>


<p class="cash-description">

Tap here and a waiter will be
notified to collect your cash.

</p>


<div class="cash-request-button">

🔔 Request Cash Collection

</div>

</div>


<!-- UPI -->

<div
id="upiPanel"
class="payment-panel upi-box"
style="display:none;"
>

<strong>

📱 Pay by UPI

</strong>


<p
style="
color:#777;
font-size:14px;
margin-top:6px;
"
>

Scan the QR code using any UPI app.

</p>


<div class="upi-amount">

Amount to Pay

<strong>

₹${total.toFixed(2)}

</strong>

</div>


<div
id="upiQRCode"
class="upi-qr"
>

Loading QR...

</div>


<div
id="upiDetails"
class="upi-details"
>

Loading UPI details...

</div>


<button
class="payment-action-btn"
onclick="openUPIApp()"
>

📱 Open UPI App

</button>


<button
class="payment-action-btn"
style="background:#2e7d32;"
onclick="selectPayment('upi')"
>

✅ I Have Paid

</button>


<p class="upi-note">

After completing the payment,
tap <strong>"I Have Paid"</strong>.

<br><br>

The restaurant will manually verify
the payment.

</p>

</div>

</div>

`;

}


/* =========================================================
   BILL ITEMS
========================================================= */

let itemsHTML="";


if(items.length){

items.forEach(
item=>{

const name=
item.name ||
item.foodName ||
"Item";


const quantity=
Number(
item.quantity || 1
);


const price=
Number(
item.price || 0
);


const lineTotal=
price * quantity;


itemsHTML+=`

<div class="bill-item-row">

<div>

<div class="bill-item-name">

${escapeHTML(name)}

</div>


<div class="bill-item-quantity">

₹${price.toFixed(2)}
×
${quantity}

</div>

</div>


<div class="bill-item-price">

₹${lineTotal.toFixed(2)}

</div>

</div>

`;

}
);

}
else{

itemsHTML=`

<div
style="
text-align:center;
color:#777;
padding:10px;
"
>

No item details available.

</div>

`;

}


/* =========================================================
   BILL DATE
========================================================= */

const generatedAt=
getTimestampMillis(
orderData.billGeneratedAt
);


const billDate=
generatedAt
?
new Date(
generatedAt
).toLocaleString()
:
new Date().toLocaleString();


/* =========================================================
   PAYMENT TEXT
========================================================= */

let paymentText=
"Payment Pending";


if(
paymentStatus==="paid"
){

paymentText=
paymentMethod==="cash"
?
"Paid - Cash"
:
paymentMethod==="upi"
?
"Paid - UPI"
:
"Paid";

}
else if(
paymentStatus==="payment_selected"
){

paymentText=
paymentMethod==="cash"
?
"Cash Collection Requested"
:
"UPI Selected";

}


/* =========================================================
   BILL HTML
========================================================= */

const billHTML=`

<div class="bill-card">

<h3>
🧾 Your Bill
</h3>


<div class="bill-status bill-generated">

✅ Bill Generated

</div>


<div class="bill-meta">

<div class="bill-meta-row">

<strong>
Restaurant
</strong>

<span>

${escapeHTML(
restaurantName.textContent ||
"Restaurant"
)}

</span>

</div>


<div class="bill-meta-row">

<strong>
Table
</strong>

<span>

🪑
${escapeHTML(String(table))}

</span>

</div>


<div class="bill-meta-row">

<strong>
Order ID
</strong>

<span>

${escapeHTML(orderId)}

</span>

</div>


<div class="bill-meta-row">

<strong>
Bill Generated
</strong>

<span>

${escapeHTML(billDate)}

</span>

</div>

</div>


<div class="bill-items">

${itemsHTML}

</div>


<div class="bill-breakdown">

<div class="bill-row">

<span>
Subtotal
</span>

<span>

₹${subtotal.toFixed(2)}

</span>

</div>


${
discount>0
?
`

<div class="bill-row discount">

<span>
Discount
</span>

<span>

-₹${discount.toFixed(2)}

</span>

</div>

`
:
""
}


<div class="bill-total">

<span>
Total
</span>

<span class="bill-price">

₹${total.toFixed(2)}

</span>

</div>

</div>


<div
style="
margin-top:15px;
padding:12px;
border-radius:9px;
background:#f5f5f5;
text-align:center;
color:#555;
"
>

/* =========================================================
   UPI
========================================================= */

async function loadUPIPayment(total){

const qrContainer=
document.getElementById(
"upiQRCode"
);


const detailsContainer=
document.getElementById(
"upiDetails"
);


if(
!qrContainer ||
!detailsContainer
){

return;

}


try{

const restaurantRef=
doc(
db,
"restaurants",
restaurantId
);


const snapshot=
await getDoc(
restaurantRef
);


if(!snapshot.exists()){

return;

}


const restaurant=
snapshot.data();


const upiName=
String(
restaurant.upiName ||
restaurant.merchantName ||
restaurant.restaurantName ||
restaurant.name ||
"Restaurant"
).trim();


const upiId=
String(
restaurant.upiId ||
restaurant.upi ||
restaurant.merchantUpiId ||
restaurant.paymentUpiId ||
restaurant.paytmUpiId ||
restaurant.businessUpiId ||
""
).trim();


if(!upiId){

detailsContainer.innerHTML=`

<strong>

❌ UPI ID not configured.

</strong>

`;

return;

}


const amount=
Number(total);


currentUPILink=
"upi://pay"+
"?pa="+
encodeURIComponent(upiId)+
"&pn="+
encodeURIComponent(upiName)+
"&am="+
encodeURIComponent(
amount.toFixed(2)
)+
"&cu=INR"+
"&tn="+
encodeURIComponent(
"Order "+orderId
);


qrContainer.innerHTML="";


if(
typeof QRCode==="undefined"
){

return;

}


new QRCode(
qrContainer,
{
text:currentUPILink,
width:210,
height:210,
colorDark:"#000000",
colorLight:"#ffffff",
correctLevel:
QRCode.CorrectLevel.M
}
);


detailsContainer.innerHTML=`

<strong>

${escapeHTML(upiName)}

</strong>

<br>

UPI ID:

<strong>

${escapeHTML(upiId)}

</strong>

<br>

Amount:

<strong>

₹${amount.toFixed(2)}

</strong>

`;

}
catch(error){

console.error(
"UPI error:",
error
);

}

}

window.showPaymentPanel=

document.getElementById(
"cashPanel"

"upiPanel"
);


const cashTab=
document.getElementById(
"cashTab"
);


const upiTab=
document.getElementById(
"upiTab"
);


if(
!cashPanel ||
!upiPanel
){

return;

}


if(method==="upi"){

cashPanel.style.display=
"none";

upiPanel.style.display=
"block";

cashTab.classList.remove(
"active"
);

upiTab.classList.add(
"active"
);


const total=
Number(
orderData?.billTotal ??
orderData?.finalTotal ??
orderData?.billSubtotal ??
orderData?.total ??
0
);


if(total>0){

loadUPIPayment(total);

}

}
else{

cashPanel.style.display=
"block";

upiPanel.style.display=
"none";

cashTab.classList.add(
"active"
);

upiTab.classList.remove(
"active"
);

}

};


/* =========================================================
   SELECT PAYMENT
========================================================= */

window.selectPayment=
async function(method){

if(!currentUser){

alert(
"Please login first."
);

return;

}


if(!orderData){

return;

}


const billGenerated=
orderData.billGenerated===true ||
orderData.billStatus==="generated";


if(!billGenerated){

alert(
"The bill has not been generated yet."
);

return;

}


if(
orderData.paymentStatus==="paid"
){

return;

}


/* =====================================================
   CASH
===================================================== */

if(method==="cash"){

/*
   Prevent duplicate requests.
*/

if(
orderData.cashPaymentRequested===true
){

alert(
"💵 Cash collection has already been requested."
);

return;

}


const cashButton=
document.querySelector(
"#cashPanel .cash-request-button"
);


if(cashButton){

cashButton.innerHTML=
"⏳ Sending request...";

}


try{

const orderRef=
doc(
db,
"restaurants",
restaurantId,
"orders",
orderId
);


/*
   THIS IS THE IMPORTANT PART.

   These fields are written to Firestore.
   The Admin dashboard must listen for them.
*/

await updateDoc(
orderRef,
{

paymentMethod:
"cash",

paymentStatus:
"payment_selected",

paymentSelectedAt:
serverTimestamp(),


/*
   CASH ALERT FLAG
*/

cashPaymentRequested:
true,


/*
   TIME REQUEST WAS CREATED
*/

cashPaymentRequestedAt:
serverTimestamp(),


/*
   EXPLICIT ADMIN NOTIFICATION FLAG
*/

cashPaymentNotification:
true,


/*
   TIME ADMIN NOTIFICATION WAS CREATED
*/

cashPaymentNotificationAt:
serverTimestamp(),


/*
   HUMAN-READABLE STATUS
*/

cashPaymentStatus:
"waiting_for_collection",


updatedAt:
serverTimestamp()

}
);


/*
   Read the document again to verify
   that Firestore actually contains
   the cash request.
*/

const verifySnapshot=
await getDoc(orderRef);


if(
!verifySnapshot.exists()
){

throw new Error(
"Order could not be verified after update."
);

}


const verifiedData=
verifySnapshot.data();


if(
verifiedData.cashPaymentRequested!==true
){

throw new Error(
"Cash request was not saved to Firestore."
);

}


/*
   SUCCESS
*/

alert(
"💵 CASH COLLECTION REQUEST SENT!\n\n"+
"🔔 The restaurant has been notified.\n\n"+
"Please keep ₹"+
Number(
orderData.billTotal ??
orderData.finalTotal ??
orderData.total ??
0
).toFixed(2)+
" ready.\n\n"+
"A waiter will come to your table."
);


renderOrder();

return;

}
catch(error){

console.error(
"Cash payment error:",
error
);


if(cashButton){

cashButton.innerHTML=
"🔔 Request Cash Collection";

}


alert(
"❌ CASH REQUEST FAILED.\n\n"+
error.message
);


return;

}

}


/* =====================================================
   UPI
===================================================== */

if(method==="upi"){

try{

const restaurantRef=
doc(
db,

const restaurantSnapshot=

if(

alert(

alert(

}

};

}

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestampMillis(value){

if(!value){

return 0;

}


if(
typeof value.toMillis==="function"
){

return value.toMillis();

}


if(
value.seconds!==undefined
){

return Number(value.seconds)*1000;

}


if(
value instanceof Date
){

return value.getTime();

}


if(
typeof value==="string"
){

const parsed=
Date.parse(value);

return Number.isNaN(parsed)
?
0
:
parsed;

}


return 0;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}
