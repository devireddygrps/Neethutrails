<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Menu</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
            padding-bottom: 90px;
        }


        /* ================================
           HEADER
        ================================= */

        .header {

            background: #ff5722;

            color: white;

            padding: 20px;

            text-align: center;

        }


        .header h2 {

            margin-bottom: 5px;

        }


        .table-info {

            margin-top: 8px;

            font-size: 15px;

        }


        /* ================================
           STATUS
        ================================= */

        .status {

            text-align: center;

            padding: 15px;

            color: #666;

        }


        /* ================================
           MENU CONTAINER
        ================================= */

        .container {

            max-width: 900px;

            margin: auto;

            padding: 20px;

        }


        .menu-list {

            display: grid;

            gap: 18px;

        }


        /* ================================
           MENU CARD
        ================================= */

        .menu-card {

            background: white;

            padding: 18px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);

        }


        .menu-card h3 {

            margin-bottom: 8px;

            color: #333;

        }


        .category {

            display: inline-block;

            background: #fff3e0;

            color: #e65100;

            padding: 5px 9px;

            border-radius: 12px;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .description {

            color: #666;

            font-size: 14px;

            margin-bottom: 12px;

            line-height: 1.4;

        }


        .price {

            font-size: 19px;

            font-weight: bold;

            color: #ff5722;

            margin-bottom: 12px;

        }


        /* ================================
           QUANTITY
        ================================= */

        .quantity-row {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .quantity-row button {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 7px;

            background: #ff5722;

            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        .quantity {

            min-width: 30px;

            text-align: center;

            font-size: 17px;

            font-weight: bold;

        }


        /* ================================
           CART BAR
        ================================= */

        .cart-bar {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            background: white;

            padding: 15px;

            box-shadow:
                0 -3px 12px rgba(0,0,0,0.15);

            z-index: 1000;

        }


        .cart-inner {

            max-width: 900px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .cart-total {

            font-size: 18px;

            font-weight: bold;

        }


        .view-cart-btn {

            background: #ff5722;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

        }


        /* ================================
           CART MODAL
        ================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.55);

            z-index: 2000;

            padding: 20px;

            overflow-y: auto;

        }


        .modal-content {

            background: white;

            max-width: 600px;

            margin: 40px auto;

            padding: 22px;

            border-radius: 14px;

        }


        .modal-content h2 {

            margin-bottom: 15px;

        }


        .cart-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

        }


        .cart-item-name {

            font-weight: bold;

        }


        .cart-item-price {

            color: #555;

        }


        .cart-quantity {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .cart-quantity button {

            width: 30px;

            height: 30px;

            border: none;

            background: #ff5722;

            color: white;

            border-radius: 5px;

            cursor: pointer;

        }


        .instructions {

            width: 100%;

            min-height: 90px;

            margin-top: 15px;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            resize: vertical;

        }


        .modal-total {

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

        }


        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 18px;

        }


        .modal-buttons button {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            color: white;

            cursor: pointer;

            font-size: 15px;

        }


        .place-order-btn {

            background: #4caf50;

        }


        .close-btn {

            background: #333;

        }


        /* ================================
           EMPTY
        ================================= */

        .empty {

            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 12px;

            color: #666;

        }


        /* ================================
           ORDER SUCCESS
        ================================= */

        .success {

            background: white;

            padding: 30px;

            text-align: center;

            border-radius: 12px;

            margin-top: 20px;

        }


        .success h2 {

            color: #4caf50;

            margin-bottom: 10px;

        }


        .success .order-number {

            font-size: 22px;

            font-weight: bold;

            margin: 15px 0;

        }



        /* ================================
           CUSTOMER ORDER TRACKING
        ================================= */
        .order-panel {
            display: none;
            background: white;
            margin: 0 auto 20px;
            padding: 20px;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .order-panel h3 {
            margin-bottom: 12px;
        }

        .order-number-display {
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .flow {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 15px 0;
        }

        .flow-step {
            text-align: center;
            padding: 10px 4px;
            border-radius: 8px;
            background: #eee;
            color: #777;
            font-size: 12px;
        }

        .flow-step.active {
            background: #ff5722;
            color: white;
            font-weight: bold;
        }

        .flow-step.done {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
        }

        .customer-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .customer-actions button {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .waiter-btn {
            background: #2196f3;
        }

        .bill-btn {
            background: #00897b;
        }

        .bill-btn:disabled,
        .waiter-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .live-status {
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* ================================
           PAST ORDERS
        ================================= */

        .past-orders {
            max-width: 900px;
            margin: 0 auto 25px;
            padding: 0 20px;
        }

        .past-orders-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .past-orders-card h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .past-order-item {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .past-order-item:last-child {
            margin-bottom: 0;
        }

        .past-order-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .past-order-number {
            font-weight: bold;
            color: #333;
        }

        .past-order-status {
            padding: 4px 9px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: #eee;
            color: #555;
        }

        .past-order-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .past-order-status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .past-order-details {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .past-order-total {
            margin-top: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #ff5722;
        }

        .past-orders-empty {
            text-align: center;
            color: #777;
            padding: 10px 0;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .container {

                padding: 15px;

            }


            .cart-inner {

                flex-direction: row;

            }


            .modal-content {

                margin: 15px auto;

            }


            .cart-item {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <div class="header">

        <h2 id="restaurantName">
            🍽️ Restaurant Menu
        </h2>

        <div
            id="tableInfo"
            class="table-info"
        >
            🪑 Loading table...
        </div>

    </div>


    <!-- ================================
         STATUS
    ================================= -->

    <div
        id="status"
        class="status"
    >
        Loading menu...
    </div>

    <div id="orderPanel" class="order-panel">

        <h3>📦 My Order Status</h3>

        <div id="orderNumberDisplay" class="order-number-display"></div>

        <div id="liveOrderStatus" class="live-status">
            Waiting for order...
        </div>

        <div class="flow">
            <div id="step-new" class="flow-step">🆕<br>New</div>
            <div id="step-accepted" class="flow-step">🔵<br>Accepted</div>
            <div id="step-preparing" class="flow-step">👨‍🍳<br>Preparing</div>
            <div id="step-ready" class="flow-step">🟢<br>Ready</div>
            <div id="step-completed" class="flow-step">🚚<br>Delivered</div>
        </div>

        <div class="customer-actions">

            <button
                id="callWaiterBtn"
                class="waiter-btn"
                onclick="callWaiter()"
            >
                🔔 Call Waiter
            </button>

            <button
                id="requestBillBtn"
                class="bill-btn"
                onclick="requestBill()"
                disabled
            >
                🧾 Request Bill
            </button>

        </div>

        <div
            id="billMessage"
            style="margin-top:12px;text-align:center;color:#666;"
        ></div>

    </div>


    <!-- ================================
         PAST ORDERS
    ================================= -->

    <div id="pastOrders" class="past-orders">

        <div class="past-orders-card">

            <h3>🧾 My Past Orders</h3>

            <div id="pastOrdersList">
                <div class="past-orders-empty">
                    Login to view your past orders.
                </div>
            </div>

        </div>

    </div>


    <!-- ================================
         MENU
    ================================= -->

    <div class="container">

        <div
            id="menuList"
            class="menu-list"
        >
        </div>

    </div>


    <!-- ================================
         CART BAR
    ================================= -->

    <div class="cart-bar">

        <div class="cart-inner">

            <div
                id="cartTotal"
                class="cart-total"
            >
                Cart: ₹0.00
            </div>


            <button
                class="view-cart-btn"
                onclick="openCart()"
            >
                🛒 View Cart
            </button>

        </div>

    </div>


    <!-- ================================
         CART MODAL
    ================================= -->

    <div
        id="cartModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                🛒 Your Cart
            </h2>


            <div
                id="cartItems"
            >
            </div>


            <textarea
                id="instructions"
                class="instructions"
                placeholder="Special instructions (optional)"
            ></textarea>


            <div
                id="modalTotal"
                class="modal-total"
            >
                Total: ₹0.00
            </div>


            <div class="modal-buttons">

                <button
                    class="place-order-btn"
                    onclick="placeOrder()"
                >
                    ✅ Place Order
                </button>


                <button
                    class="close-btn"
                    onclick="closeCart()"
                >
                    Close
                </button>

            </div>

        </div>

    </div>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script type="module">


        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            query,
            where,
            doc,
            getDoc,
            onSnapshot,
            updateDoc,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);

        const auth =
            getAuth(app);

        let currentCustomer = null;
        let restaurantUpiId = "";
        let restaurantNameValue = "Restaurant";
        let currentOrderNumber = "";
        let currentPayableAmount = 0;
        let currentOrderId =
            sessionStorage.getItem("customerOrderId") || null;

        let unsubscribeOrder = null;


        /* =====================================
           CUSTOMER AUTHENTICATION
        ===================================== */

        onAuthStateChanged(
            auth,
            (user) => {

                if (!user) {
                    document.getElementById("status").textContent =
                        "Please login to continue.";

                    return;
                }

                currentCustomer = user;

                loadPastOrders();

                if (currentOrderId) {
                    listenToCurrentOrder();
                }
            }
        );

        /* =====================================
           READ QR PARAMETERS
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const restaurantId =
            urlParams.get(
                "restaurant"
            );


        const tableNumber =
            urlParams.get(
                "table"
            );


        /* =====================================
           CHECK RESTAURANT ID
        ===================================== */

        if (!restaurantId) {

            document.getElementById(
                "status"
            ).textContent =
                "Restaurant information is missing.";


            throw new Error(
                "Restaurant ID is missing from QR URL."
            );

        }


        /* =====================================
           SHOW TABLE
        ===================================== */

        document.getElementById(
            "tableInfo"
        ).textContent =
            tableNumber
            ? "🪑 Table " + tableNumber
            : "🪑 Table not specified";


        /* =====================================
           CART
        ===================================== */

        let cart = [];


        /* =====================================
           LOAD RESTAURANT
        ===================================== */

        async function loadRestaurant() {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();


                    if (
                        restaurant.restaurantName
                    ) {

                        restaurantNameValue =
                            String(
                                restaurant.restaurantName
                            );

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            "🍽️ " +
                            restaurantNameValue;

                    }

                    restaurantUpiId =
                        String(
                            restaurant.upiId ||
                            ""
                        ).trim();

                }

            }

            catch (error) {

                console.error(
                    "Restaurant loading error:",
                    error
                );

            }

        }


        /* =====================================
           LOAD MENU
        ===================================== */

        async function loadMenu() {

            const menuList =
                document.getElementById(
                    "menuList"
                );


            const status =
                document.getElementById(
                    "status"
                );


            try {

                const menuRef =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "menu"
                    );


                const snapshot =
                    await getDocs(
                        menuRef
                    );


                menuList.innerHTML = "";


                if (
                    snapshot.empty
                ) {

                    status.textContent =
                        "Menu is empty.";


                    menuList.innerHTML = `

                        <div class="empty">

                            <h3>
                                🍽️ Menu Empty
                            </h3>

                            <p>
                                No menu items are available right now.
                            </p>

                        </div>

                    `;

                    return;

                }


                status.textContent =
                    `${snapshot.size} menu item(s)`;


                snapshot.forEach(
                    (menuDoc) => {

                        const item =
                            menuDoc.data();


                        const itemId =
                            menuDoc.id;


                        const name =
                            item.name ||
                            item.foodName ||
                            "Food Item";


                        const description =
                            item.description ||
                            "";


                        const category =
                            item.category ||
                            "Food";


                        const price =
                            Number(
                                item.price || 0
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "menu-card";


                        card.innerHTML = `

                            <span class="category">

                                ${escapeHTML(
                                    category
                                )}

                            </span>


                            <h3>

                                ${escapeHTML(
                                    name
                                )}

                            </h3>


                            ${
                                description
                                ? `

                                    <div class="description">

                                        ${escapeHTML(
                                            description
                                        )}

                                    </div>

                                `
                                : ""
                            }


                            <div class="price">

                                ₹${price.toFixed(2)}

                            </div>


                            <div class="quantity-row">

                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        -1
                                    )"
                                >
                                    −
                                </button>


                                <span
                                    id="quantity-${itemId}"
                                    class="quantity"
                                >
                                    0
                                </span>


                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>

                        `;


                        menuList.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );


                status.textContent =
                    "Unable to load menu.";


                menuList.innerHTML = `

                    <div class="empty">

                        <h3>
                            ⚠️ Unable to Load Menu
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================
           CHANGE QUANTITY
        ===================================== */

        window.changeQuantity =
            async function(
                itemId,
                change
            ) {

                const existingIndex =
                    cart.findIndex(
                        item =>
                            item.id === itemId
                    );


                if (
                    existingIndex === -1
                ) {

                    if (
                        change <= 0
                    ) {
                        return;
                    }


                    try {

                        const itemRef =
                            doc(
                                db,
                                "restaurants",
                                restaurantId,
                                "menu",
                                itemId
                            );


                        const itemSnap =
                            await getDoc(
                                itemRef
                            );


                        if (
                            !itemSnap.exists()
                        ) {
                            return;
                        }


                        const item =
                            itemSnap.data();


                        cart.push({

                            id: itemId,

                            name:
                                item.name ||
                                item.foodName ||
                                "Food Item",

                            price:
                                Number(
                                    item.price || 0
                                ),

                            quantity: 1

                        });

                    }

                    catch (error) {

                        console.error(
                            "Item loading error:",
                            error
                        );

                        return;

                    }

                }

                else {

                    cart[
                        existingIndex
                    ].quantity += change;


                    if (
                        cart[
                            existingIndex
                        ].quantity <= 0
                    ) {

                        cart.splice(
                            existingIndex,
                            1
                        );

                    }

                }


                updateCartDisplay();

                updateMenuQuantity(
                    itemId
                );

            };


        /* =====================================
           UPDATE MENU QUANTITY
        ===================================== */

        function updateMenuQuantity(
            itemId
        ) {

            const quantityElement =
                document.getElementById(
                    "quantity-" +
                    itemId
                );


            if (!quantityElement) {
                return;
            }


            const item =
                cart.find(
                    item =>
                        item.id === itemId
                );


            quantityElement.textContent =
                item
                ? item.quantity
                : 0;

        }


        /* =====================================
           CART TOTAL
        ===================================== */

        function getCartTotal() {

            return cart.reduce(
                (
                    total,
                    item
                ) => {

                    return total +
                        (
                            Number(
                                item.price
                            ) *
                            Number(
                                item.quantity
                            )
                        );

                },
                0
            );

        }


        /* =====================================
           UPDATE CART BAR
        ===================================== */

        function updateCartDisplay() {

            const total =
                getCartTotal();


            const count =
                cart.reduce(
                    (
                        sum,
                        item
                    ) => {

                        return sum +
                            Number(
                                item.quantity
                            );

                    },
                    0
                );


            document.getElementById(
                "cartTotal"
            ).textContent =
                `Cart: ${count} item(s) • ₹${total.toFixed(2)}`;

        }


        /* =====================================
           OPEN CART
        ===================================== */

        window.openCart =
            function() {

                renderCart();

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "block";

            };


        /* =====================================
           CLOSE CART
        ===================================== */

        window.closeCart =
            function() {

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "none";

            };


        /* =====================================
           RENDER CART
        ===================================== */

        function renderCart() {

            const cartItems =
                document.getElementById(
                    "cartItems"
                );


            cartItems.innerHTML = "";


            if (
                cart.length === 0
            ) {

                cartItems.innerHTML = `

                    <div class="empty">

                        🛒 Your cart is empty.

                    </div>

                `;

            }

            else {

                cart.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "cart-item";


                        row.innerHTML = `

                            <div>

                                <div class="cart-item-name">

                                    ${escapeHTML(
                                        item.name
                                    )}

                                </div>


                                <div class="cart-item-price">

                                    ₹${Number(
                                        item.price
                                    ).toFixed(2)}

                                </div>

                            </div>


                            <div class="cart-quantity">

                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        -1
                                    )"
                                >
                                    −
                                </button>


                                <span>
                                    ${item.quantity}
                                </span>


                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>

                        `;


                        cartItems.appendChild(
                            row
                        );

                    }
                );

            }


            document.getElementById(
                "modalTotal"
            ).textContent =
                "Total: ₹" +
                getCartTotal().toFixed(2);

        }


        /* =====================================
           LOAD CUSTOMER PAST ORDERS
        ===================================== */

        async function loadPastOrders() {

            const list =
                document.getElementById(
                    "pastOrdersList"
                );

            if (!currentCustomer) {

                list.innerHTML = `
                    <div class="past-orders-empty">
                        Please login to view your past orders.
                    </div>
                `;

                return;
            }

            try {

                const ordersRef =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders"
                    );

                /*
                 * We filter only by customerUid.
                 * Sorting is done in JavaScript so Firestore
                 * does not require a composite index.
                 */

                const ordersQuery =
                    query(
                        ordersRef,
                        where(
                            "customerUid",
                            "==",
                            currentCustomer.uid
                        )
                    );

                const snapshot =
                    await getDocs(
                        ordersQuery
                    );

                const orders = [];

                snapshot.forEach(
                    (orderDoc) => {

                        const order =
                            orderDoc.data();

                        /*
                         * Do not show the currently active order
                         * in Past Orders.
                         */
                        if (
                            orderDoc.id === currentOrderId
                        ) {
                            return;
                        }

                        orders.push({
                            id: orderDoc.id,
                            ...order
                        });

                    }
                );

                orders.sort(
                    (a, b) => {

                        const aTime =
                            a.createdAt &&
                            typeof a.createdAt.toMillis === "function"
                                ? a.createdAt.toMillis()
                                : 0;

                        const bTime =
                            b.createdAt &&
                            typeof b.createdAt.toMillis === "function"
                                ? b.createdAt.toMillis()
                                : 0;

                        return bTime - aTime;

                    }
                );

                if (!orders.length) {

                    list.innerHTML = `
                        <div class="past-orders-empty">
                            No past orders yet.
                        </div>
                    `;

                    return;

                }

                list.innerHTML = "";

                orders.forEach(
                    (order) => {

                        const status =
                            String(
                                order.status ||
                                "new"
                            ).toLowerCase();

                        const statusText = {
                            new: "New",
                            accepted: "Accepted",
                            preparing: "Preparing",
                            ready: "Ready",
                            completed: "Delivered",
                            cancelled: "Cancelled"
                        }[status] || status;

                        const statusClass =
                            status === "completed"
                                ? "completed"
                                : status === "cancelled"
                                    ? "cancelled"
                                    : "";

                        const itemCount =
                            Array.isArray(order.items)
                                ? order.items.reduce(
                                    (sum, item) =>
                                        sum +
                                        Number(
                                            item.quantity || 0
                                        ),
                                    0
                                )
                                : 0;

                        let dateText =
                            "Date unavailable";

                        if (
                            order.createdAt &&
                            typeof order.createdAt.toDate === "function"
                        ) {

                            dateText =
                                order.createdAt
                                    .toDate()
                                    .toLocaleString(
                                        "en-IN",
                                        {
                                            dateStyle:
                                                "medium",
                                            timeStyle:
                                                "short"
                                        }
                                    );

                        }

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "past-order-item";

                        card.innerHTML = `

                            <div class="past-order-top">

                                <div class="past-order-number">
                                    ${escapeHTML(
                                        order.orderNumber ||
                                        order.id
                                    )}
                                </div>

                                <div
                                    class="past-order-status ${statusClass}"
                                >
                                    ${escapeHTML(
                                        statusText
                                    )}
                                </div>

                            </div>

                            <div class="past-order-details">

                                📅 ${escapeHTML(dateText)}
                                <br>

                                🪑 Table:
                                ${escapeHTML(
                                    order.tableNumber ||
                                    "N/A"
                                )}
                                <br>

                                🍽️ ${itemCount}
                                item(s)

                            </div>

                            <div class="past-order-total">

                                Total:
                                ₹${Number(
                                    order.billTotal ??
                                    order.finalTotal ??
                                    order.total ??
                                    0
                                ).toFixed(2)}

                            </div>

                        `;

                        list.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Past orders loading error:",
                    error
                );

                list.innerHTML = `
                    <div class="past-orders-empty">
                        Unable to load past orders.
                    </div>
                `;

            }

        }


        /* =====================================
           PLACE ORDER
        ===================================== */

        window.placeOrder =
            async function() {

                if (
                    cart.length === 0
                ) {

                    alert(
                        "Please add at least one item to the cart."
                    );

                    return;

                }


                const instructions =
                    document.getElementById(
                        "instructions"
                    ).value.trim();


                const total =
                    getCartTotal();


                try {

                    const orderItems =
                        cart.map(
                            item => ({

                                name:
                                    item.name,

                                price:
                                    Number(
                                        item.price
                                    ),

                                quantity:
                                    Number(
                                        item.quantity
                                    )

                            })
                        );


                    const ordersRef =
                        collection(
                            db,
                            "restaurants",
                            restaurantId,
                            "orders"
                        );


                    const orderNumber =
                        "ORD-" +
                        Date.now();


                    const orderData = {

                        orderNumber:
                            orderNumber,

                        tableNumber:
                            tableNumber ||
                            "N/A",

                        items:
                            orderItems,

                        total:
                            total,

                        instructions:
                            instructions,

                        status:
                            "new",

                        customerUid:
                            currentCustomer
                            ? currentCustomer.uid
                            : "",

                        paymentStatus:
                            "pending",

                        paymentMethod:
                            "upi",

                        restaurantUpiId:
                            restaurantUpiId,

                        createdAt:
                            serverTimestamp()

                    };


                    const newOrderRef =
                        await addDoc(
                            ordersRef,
                            orderData
                        );

                    currentOrderId =
                        newOrderRef.id;

                    currentOrderNumber =
                        orderNumber;

                    currentPayableAmount =
                        total;

                    sessionStorage.setItem(
                        "customerOrderId",
                        currentOrderId
                    );

                    document.getElementById(
                        "cartModal"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "menuList"
                    ).innerHTML = `

                        <div class="success">

                            <h2>
                                ✅ Order Placed!
                            </h2>

                            <p>
                                Your order has been sent to the restaurant.
                            </p>


                            <div class="order-number">

                                ${escapeHTML(
                                    orderNumber
                                )}

                            </div>


                            <p>
                                Table:
                                ${escapeHTML(
                                    tableNumber ||
                                    "N/A"
                                )}
                            </p>


                            <p style="margin-top:10px;">

                                Total:
                                ₹${total.toFixed(2)}

                            </p>

                        </div>

                    `;


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Order successfully placed.";


                    cart = [];


                    updateCartDisplay();

                    /*
                     * Refresh past orders after placing an order.
                     * The new order is excluded until it is no longer
                     * the current active order.
                     */
                    loadPastOrders();

                }

                catch (error) {

                    console.error(
                        "Order error:",
                        error
                    );


                    alert(
                        "Could not place order:\n\n" +
                        error.message
                    );

                }

            };


        /* =====================================
           LIVE CUSTOMER ORDER TRACKING
        ===================================== */

        function listenToCurrentOrder() {

            if (!currentCustomer || !currentOrderId) {
                return;
            }

            if (unsubscribeOrder) {
                unsubscribeOrder();
                unsubscribeOrder = null;
            }

            const orderRef =
                doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders",
                    currentOrderId
                );

            unsubscribeOrder =
                onSnapshot(
                    orderRef,
                    (snapshot) => {

                        if (!snapshot.exists()) {
                            document.getElementById(
                                "orderPanel"
                            ).style.display = "none";

                            return;
                        }

                        const order =
                            snapshot.data();

                        // Extra client-side safety check.
                        if (
                            order.customerUid &&
                            order.customerUid !== currentCustomer.uid
                        ) {
                            document.getElementById(
                                "status"
                            ).textContent =
                                "This order does not belong to this customer.";

                            return;
                        }

                        renderCustomerOrderStatus(
                            order
                        );
                    },
                    (error) => {

                        console.error(
                            "Order status listener error:",
                            error
                        );

                        document.getElementById(
                            "liveOrderStatus"
                        ).textContent =
                            "Unable to track order status.";

                        document.getElementById(
                            "billMessage"
                        ).textContent =
                            error.message;
                    }
                );
        }


        function renderCustomerOrderStatus(order) {

            const panel =
                document.getElementById(
                    "orderPanel"
                );

            panel.style.display = "block";

            document.getElementById(
                "orderNumberDisplay"
            ).textContent =
                "Order #" +
                (
                    order.orderNumber ||
                    currentOrderId.substring(0, 6)
                );

            const status =
                order.status || "new";

            const statusText = {
                new: "🆕 Order Received",
                accepted: "🔵 Order Accepted",
                preparing: "👨‍🍳 Preparing Your Order",
                ready: "🟢 Order Ready",
                completed: "🚚 Order Delivered",
                cancelled: "❌ Order Cancelled"
            };

            document.getElementById(
                "liveOrderStatus"
            ).textContent =
                statusText[status] ||
                "Order Status: " + status;

            const stages = [
                "new",
                "accepted",
                "preparing",
                "ready",
                "completed"
            ];

            const currentIndex =
                stages.indexOf(status);

            stages.forEach(
                (stage, index) => {

                    const element =
                        document.getElementById(
                            "step-" + stage
                        );

                    if (!element) {
                        return;
                    }

                    element.classList.remove(
                        "active",
                        "done"
                    );

                    if (
                        status === "cancelled"
                    ) {
                        return;
                    }

                    if (
                        index < currentIndex
                    ) {
                        element.classList.add(
                            "done"
                        );
                    }

                    if (
                        index === currentIndex
                    ) {
                        element.classList.add(
                            "active"
                        );
                    }
                }
            );

            const callWaiterBtn =
                document.getElementById(
                    "callWaiterBtn"
                );

            if (
                order.waiterCalled === true
            ) {
                callWaiterBtn.disabled = true;
                callWaiterBtn.textContent =
                    "✅ Waiter Called";
            } else {
                callWaiterBtn.disabled = false;
                callWaiterBtn.textContent =
                    "🔔 Call Waiter";
            }

            const billBtn =
                document.getElementById(
                    "requestBillBtn"
                );

            if (
                status === "completed" &&
                order.billRequested !== true
            ) {
                billBtn.disabled = false;
                billBtn.textContent =
                    "🧾 Request Bill";
            } else if (
                order.billRequested === true
            ) {
                billBtn.disabled = true;
                billBtn.textContent =
                    "✅ Bill Requested";
            } else {
                billBtn.disabled = true;
                billBtn.textContent =
                    "🧾 Request Bill";
            }

            const billMessage =
                document.getElementById(
                    "billMessage"
                );

            if (order.billGenerated) {

                const subtotal =
                    Number(
                        order.billSubtotal ??
                        order.subtotal ??
                        order.total ??
                        0
                    );

                const discount =
                    Number(
                        order.billDiscountAmount ??
                        order.discountAmount ??
                        0
                    );

                const total =
                    Number(
                        order.billTotal ??
                        order.finalTotal ??
                        order.total ??
                        0
                    );

                currentOrderNumber =
                    order.orderNumber ||
                    currentOrderNumber;

                currentPayableAmount =
                    total;

                const upiId =
                    String(
                        order.restaurantUpiId ||
                        restaurantUpiId ||
                        ""
                    ).trim();

                billMessage.innerHTML =
                    `
                    <div style="
                        background:#e8f5e9;
                        padding:15px;
                        border-radius:10px;
                        color:#155724;
                        text-align:left;
                    ">
                        <strong style="font-size:18px;">
                            🧾 Bill Generated
                        </strong>

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            margin-top:10px;
                        ">
                            <span>Subtotal</span>
                            <strong>₹${subtotal.toFixed(2)}</strong>
                        </div>

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            margin-top:6px;
                        ">
                            <span>Discount</span>
                            <strong>-₹${discount.toFixed(2)}</strong>
                        </div>

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            border-top:1px solid #b7d8bc;
                            margin-top:10px;
                            padding-top:10px;
                            font-size:20px;
                        ">
                            <strong>Total</strong>
                            <strong>₹${total.toFixed(2)}</strong>
                        </div>

                        ${
                            upiId
                            ? `
                                <div style="
                                    margin-top:15px;
                                    background:white;
                                    padding:12px;
                                    border-radius:8px;
                                    color:#333;
                                ">
                                    <strong>💳 Payment</strong>

                                    <div style="
                                        margin-top:6px;
                                        font-size:13px;
                                        color:#666;
                                    ">
                                        Pay directly to restaurant
                                    </div>

                                    <div style="
                                        margin-top:6px;
                                        font-weight:bold;
                                    ">
                                        UPI: ${escapeHTML(upiId)}
                                    </div>

                                    <button
                                        type="button"
                                        onclick="payBillViaUPI()"
                                        style="
                                            width:100%;
                                            margin-top:12px;
                                            padding:13px;
                                            border:none;
                                            border-radius:8px;
                                            background:#00897b;
                                            color:white;
                                            font-size:16px;
                                            font-weight:bold;
                                            cursor:pointer;
                                        "
                                    >
                                        💳 Pay ₹${total.toFixed(2)} Now
                                    </button>

                                    <div style="
                                        margin-top:8px;
                                        font-size:12px;
                                        color:#666;
                                    ">
                                        Your UPI app will open with the
                                        restaurant UPI ID and exact bill amount.
                                    </div>
                                </div>
                            `
                            : `
                                <div style="
                                    margin-top:15px;
                                    background:#fff3cd;
                                    padding:12px;
                                    border-radius:8px;
                                    color:#856404;
                                ">
                                    ⚠️ Restaurant UPI ID is not configured.
                                </div>
                            `
                        }
                    </div>
                    `;

                document.querySelector(
                    ".container"
                ).style.display = "none";

                document.querySelector(
                    ".cart-bar"
                ).style.display = "none";

                document.getElementById(
                    "status"
                ).textContent =
                    "Bill generated. Please complete payment.";
            } else if (
                order.billRequested
            ) {
                billMessage.textContent =
                    "Bill requested. Please wait for the restaurant.";
            } else if (
                status === "completed"
            ) {
                billMessage.textContent =
                    "Your order is delivered. You can request your bill.";
            } else {
                billMessage.textContent = "";
            }
        }


        /* =====================================
           CALL WAITER
        ===================================== */

        window.callWaiter =
            async function() {

                if (
                    !currentCustomer ||
                    !currentOrderId
                ) {
                    alert(
                        "Please place an order first."
                    );

                    return;
                }

                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders",
                        currentOrderId
                    );

                try {

                    await updateDoc(
                        orderRef,
                        {
                            waiterCalled:
                                true,
                            waiterRequestedAt:
                                serverTimestamp()
                        }
                    );

                } catch (error) {

                    console.error(
                        "Waiter request error:",
                        error
                    );

                    alert(
                        "Could not call waiter:\n\n" +
                        error.message
                    );
                }
            };


        /* =====================================
           PAY BILL VIA UPI
        ===================================== */

        window.payBillViaUPI =
            function() {

                const upiId =
                    String(
                        restaurantUpiId ||
                        ""
                    ).trim();

                if (!upiId) {
                    alert(
                        "The restaurant has not configured a UPI ID yet."
                    );
                    return;
                }

                if (
                    !currentOrderNumber ||
                    currentPayableAmount <= 0
                ) {
                    alert(
                        "Payment details are not available."
                    );
                    return;
                }

                const params =
                    new URLSearchParams({
                        pa: upiId,
                        pn:
                            restaurantNameValue ||
                            "Restaurant",
                        am:
                            currentPayableAmount
                                .toFixed(2),
                        cu: "INR",
                        tn:
                            "Order " +
                            currentOrderNumber
                    });

                const upiUrl =
                    "upi://pay?" +
                    params.toString();

                window.location.href =
                    upiUrl;
            };


        /* =====================================
           REQUEST BILL
        ===================================== */

        window.requestBill =
            async function() {

                if (
                    !currentCustomer ||
                    !currentOrderId
                ) {
                    alert(
                        "No active order found."
                    );

                    return;
                }

                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders",
                        currentOrderId
                    );

                try {

                    await updateDoc(
                        orderRef,
                        {
                            billRequested:
                                true,
                            billRequestedAt:
                                serverTimestamp()
                        }
                    );

                } catch (error) {

                    console.error(
                        "Bill request error:",
                        error
                    );

                    alert(
                        "Could not request bill:\n\n" +
                        error.message
                    );
                }
            };


        /* =====================================
           ESCAPE HTML
        ===================================== */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           INITIAL LOAD
        ===================================== */

        loadRestaurant();

        loadMenu();

        updateCartDisplay();


    </script>

</body>

</html>
