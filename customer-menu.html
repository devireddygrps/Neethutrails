<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Menu</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
        }


        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .header h2 {
            margin-bottom: 5px;
        }


        .table-info {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
        }


        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }


        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }


        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }


        .menu-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }


        .menu-card h3 {
            color: #333;
            margin-bottom: 7px;
        }


        .category {
            display: inline-block;
            background: #fff3e0;
            color: #e64a19;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
        }


        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }


        .price {
            font-size: 19px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 12px;
        }


        .add-btn {
            width: 100%;
            padding: 11px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }


        .add-btn:hover {
            background: #e64a19;
        }


        .unavailable {
            background: #ddd;
            color: #777;
            cursor: not-allowed;
        }


        .cart-box {
            position: sticky;
            bottom: 0;
            margin-top: 25px;
            background: white;
            padding: 18px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.15);
        }


        .cart-box h3 {
            margin-bottom: 10px;
        }


        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            gap: 10px;
        }


        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .quantity-controls button {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 5px;
            background: #ff5722;
            color: white;
            cursor: pointer;
        }


        .total {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }


        .order-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #00897b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }


        .order-btn:hover {
            background: #00695c;
        }


        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }


        @media (max-width: 650px) {

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h2 id="restaurantName">
            🍽️ Restaurant Menu
        </h2>

        <p>
            Order your favourite food
        </p>

        <div
            id="tableInfo"
            class="table-info"
        >
            🪑 Table --
        </div>

    </div>


    <div class="container">


        <div
            id="status"
            class="status"
        >
            Loading menu...
        </div>


        <div
            id="menuGrid"
            class="menu-grid"
        >
        </div>


        <!-- CART -->

        <div
            id="cartBox"
            class="cart-box"
            style="display:none;"
        >

            <h3>
                🛒 Your Order
            </h3>


            <div id="cartItems"></div>


            <div
                id="cartTotal"
                class="total"
            >
                Total: ₹0.00
            </div>


            <button
                class="order-btn"
                onclick="placeOrder()"
            >
                ✅ Place Order
            </button>

        </div>


    </div>


    <script type="module">


        /* =====================================
           FIREBASE
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            doc,
            getDoc,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);


        /* =====================================
           IMPORTANT
        ===================================== */

        /*
         * TEMPORARY RESTAURANT ID
         *
         * Replace this with the Firebase UID
         * of the restaurant while testing.
         */

        const restaurantId =
            "REPLACE_WITH_RESTAURANT_UID";


        /* =====================================
           TABLE NUMBER
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const tableNumber =
            urlParams.get("table");


        document.getElementById(
            "tableInfo"
        ).textContent =
            tableNumber
            ? "🪑 Table " + tableNumber
            : "🪑 Table not specified";


        /* =====================================
           CART
        ===================================== */

        let cart = [];


        /* =====================================
           LOAD RESTAURANT
        ===================================== */

        async function loadRestaurant() {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();


                    if (
                        restaurant.restaurantName
                    ) {

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            "🍽️ " +
                            restaurant.restaurantName;

                    }

                }

            }

            catch (error) {

                console.error(
                    "Restaurant error:",
                    error
                );

            }

        }


        /* =====================================
           LOAD MENU
        ===================================== */

        async function loadMenu() {

            const menuGrid =
                document.getElementById(
                    "menuGrid"
                );


            try {

                const menuRef =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "menu"
                    );


                const snapshot =
                    await getDocs(
                        menuRef
                    );


                menuGrid.innerHTML = "";


                if (snapshot.empty) {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "No menu items available.";


                    menuGrid.innerHTML = `

                        <div class="empty">

                            <h3>
                                🍽️ Menu Empty
                            </h3>

                            <p>
                                No food items are available yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                let count = 0;


                snapshot.forEach(
                    (menuDoc) => {

                        const item =
                            menuDoc.data();


                        /*
                         * Only show available items
                         */

                        if (
                            item.availability === false
                        ) {

                            return;

                        }


                        count++;


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "menu-card";


                        const price =
                            Number(
                                item.price || 0
                            );


                        card.innerHTML = `

                            <span class="category">

                                ${escapeHTML(
                                    item.category ||
                                    "Food"
                                )}

                            </span>


                            <h3>

                                ${escapeHTML(
                                    item.foodName ||
                                    "Food Item"
                                )}

                            </h3>


                            <div class="description">

                                ${escapeHTML(
                                    item.description ||
                                    "Delicious food."
                                )}

                            </div>


                            <div class="price">

                                ₹${price.toFixed(2)}

                            </div>


                            <button
                                class="add-btn"
                                onclick="addToCart(
                                    '${menuDoc.id}'
                                )"
                            >

                                ➕ Add to Order

                            </button>

                        `;


                        /*
                         * Store complete item
                         */

                        card.dataset.id =
                            menuDoc.id;


                        menuGrid.appendChild(
                            card
                        );


                        /*
                         * Keep item available
                         * for cart
                         */

                        menuItems[
                            menuDoc.id
                        ] = {

                            id:
                                menuDoc.id,

                            foodName:
                                item.foodName ||
                                "Food Item",

                            price:
                                price,

                            category:
                                item.category ||
                                "Food"

                        };

                    }
                );


                document.getElementById(
                    "status"
                ).textContent =
                    count +
                    " menu item(s) available";


                if (count === 0) {

                    menuGrid.innerHTML = `

                        <div class="empty">

                            <h3>
                                🍽️ No Available Items
                            </h3>

                            <p>
                                Please check again later.
                            </p>

                        </div>

                    `;

                }

            }

            catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "Error loading menu.";


                menuGrid.innerHTML = `

                    <div class="empty">

                        <h3>
                            ⚠️ Unable to Load Menu
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================
           MENU ITEMS MEMORY
        ===================================== */

        const menuItems = {};


        /* =====================================
           ADD TO CART
        ===================================== */

        window.addToCart =
            function(menuId) {

                const item =
                    menuItems[
                        menuId
                    ];


                if (!item) {

                    alert(
                        "Food item not found."
                    );

                    return;

                }


                const existing =
                    cart.find(
                        cartItem =>
                            cartItem.id ===
                            menuId
                    );


                if (existing) {

                    existing.quantity++;

                }

                else {

                    cart.push({

                        id:
                            item.id,

                        name:
                            item.foodName,

                        price:
                            item.price,

                        quantity:
                            1

                    });

                }


                updateCart();

            };


        /* =====================================
           UPDATE CART
        ===================================== */

        function updateCart() {

            const cartBox =
                document.getElementById(
                    "cartBox"
                );


            const cartItems =
                document.getElementById(
                    "cartItems"
                );


            if (cart.length === 0) {

                cartBox.style.display =
                    "none";

                return;

            }


            cartBox.style.display =
                "block";


            cartItems.innerHTML =
                "";


            let total = 0;


            cart.forEach(
                (item, index) => {

                    const itemTotal =
                        item.price *
                        item.quantity;


                    total += itemTotal;


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "cart-item";


                    row.innerHTML = `

                        <div>

                            <strong>
                                ${escapeHTML(
                                    item.name
                                )}
                            </strong>

                            <br>

                            ₹${item.price.toFixed(2)}

                        </div>


                        <div class="quantity-controls">

                            <button
                                onclick="changeQuantity(
                                    ${index},
                                    -1
                                )"
                            >
                                −
                            </button>


                            <strong>
                                ${item.quantity}
                            </strong>


                            <button
                                onclick="changeQuantity(
                                    ${index},
                                    1
                                )"
                            >
                                +
                            </button>

                        </div>


                        <strong>

                            ₹${itemTotal.toFixed(2)}

                        </strong>

                    `;


                    cartItems.appendChild(
                        row
                    );

                }
            );


            document.getElementById(
                "cartTotal"
            ).textContent =
                "Total: ₹" +
                total.toFixed(2);

        }


        /* =====================================
           CHANGE QUANTITY
        ===================================== */

        window.changeQuantity =
            function(
                index,
                change
            ) {

                cart[index].quantity +=
                    change;


                if (
                    cart[index].quantity <= 0
                ) {

                    cart.splice(
                        index,
                        1
                    );

                }


                updateCart();

            };


        /* =====================================
           PLACE ORDER
        ===================================== */

        window.placeOrder =
            async function() {

                if (
                    !tableNumber
                ) {

                    alert(
                        "Table number is missing."
                    );

                    return;

                }


                if (
                    cart.length === 0
                ) {

                    alert(
                        "Please add food items first."
                    );

                    return;

                }


                let total = 0;


                cart.forEach(
                    item => {

                        total +=
                            item.price *
                            item.quantity;

                    }
                );


                const orderItems =
                    cart.map(
                        item => ({

                            name:
                                item.name,

                            price:
                                item.price,

                            quantity:
                                item.quantity

                        })
                    );


                try {

                    const ordersRef =
                        collection(
                            db,
                            "restaurants",
                            restaurantId,
                            "orders"
                        );


                    await addDoc(
                        ordersRef,
                        {

                            tableNumber:
                                tableNumber,

                            items:
                                orderItems,

                            total:
                                total,

                            status:
                                "new",

                            instructions:
                                "",

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    alert(
                        "✅ Order placed successfully!"
                    );


                    cart = [];


                    updateCart();

                }

                catch (error) {

                    console.error(
                        "Order error:",
                        error
                    );


                    alert(
                        "Could not place order:\n\n" +
                        error.message
                    );

                }

            };


        /* =====================================
           SECURITY
        ===================================== */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           START
        ===================================== */

        loadRestaurant();

        loadMenu();

    </script>

</body>

</html>
