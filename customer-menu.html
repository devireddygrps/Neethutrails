<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding-bottom: 90px;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .table-info {
            margin-top: 8px;
            font-size: 15px;
        }

        .status {
            text-align: center;
            padding: 15px;
            color: #666;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .menu-list {
            display: grid;
            gap: 18px;
        }

        .menu-card,
        .success,
        .order-panel,
        .bill-panel {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .menu-card h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .category {
            display: inline-block;
            background: #fff3e0;
            color: #e65100;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 12px;
        }

        .quantity-row,
        .action-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-row button,
        .cart-quantity button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 7px;
            background: #ff5722;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity {
            min-width: 30px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
        }

        .cart-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        .cart-inner {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
        }

        button {
            cursor: pointer;
        }

        .view-cart-btn,
        .primary-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 600px;
            margin: 40px auto;
            padding: 22px;
            border-radius: 14px;
        }

        .modal-content h2 {
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-name {
            font-weight: bold;
        }

        .cart-item-price {
            color: #555;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cart-quantity button {
            width: 30px;
            height: 30px;
            border: none;
            background: #ff5722;
            color: white;
            border-radius: 5px;
        }

        .instructions {
            width: 100%;
            min-height: 90px;
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
        }

        .modal-total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }

        .place-order-btn {
            background: #4caf50;
        }

        .close-btn {
            background: #333;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        .success {
            text-align: center;
            margin-top: 20px;
        }

        .success h2 {
            color: #4caf50;
            margin-bottom: 10px;
        }

        .order-number {
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        .section-title {
            margin: 24px 0 10px;
        }

        .order-panel {
            display: none;
            margin-bottom: 18px;
        }

        .status-flow {
            display: grid;
            gap: 8px;
            margin: 15px 0;
        }

        .flow-step {
            padding: 10px 12px;
            border-radius: 8px;
            background: #eee;
            color: #777;
        }

        .flow-step.active {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
        }

        .flow-step.current {
            outline: 2px solid #ff5722;
        }

        .current-status {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .action-btn {
            flex: 1;
            min-width: 140px;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 15px;
        }

        .waiter-btn {
            background: #ff9800;
        }

        .bill-btn {
            background: #00897b;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .bill-panel {
            display: none;
            margin-bottom: 18px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
        }

        .bill-total {
            border-top: 1px solid #ddd;
            margin-top: 8px;
            padding-top: 10px;
            font-size: 19px;
            font-weight: bold;
        }

        .payment-btn {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .cart-inner {
                flex-direction: row;
            }

            .modal-content {
                margin: 15px auto;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-row,
            .modal-buttons {
                flex-direction: column;
            }

            .action-btn,
            .modal-buttons button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2 id="restaurantName">🍽️ Restaurant Menu</h2>
        <div id="tableInfo" class="table-info">🪑 Loading table...</div>
    </div>

    <div id="status" class="status">Checking customer login...</div>

    <div class="container">

        <div id="currentOrderPanel" class="order-panel">

            <h2>📦 My Current Order</h2>

            <div id="customerOrderNumber" class="order-number"></div>

            <div id="customerCurrentStatus" class="current-status">
                Loading order status...
            </div>

            <div class="status-flow">

                <div id="step-new" class="flow-step">
                    🆕 Order Received
                </div>

                <div id="step-accepted" class="flow-step">
                    🔵 Accepted
                </div>

                <div id="step-preparing" class="flow-step">
                    👨‍🍳 Preparing
                </div>

                <div id="step-ready" class="flow-step">
                    🟢 Ready
                </div>

                <div id="step-completed" class="flow-step">
                    🚚 Delivered
                </div>

            </div>

            <div class="action-row">

                <button
                    id="callWaiterBtn"
                    class="action-btn waiter-btn"
                    onclick="callWaiter()"
                >
                    🔔 Call Waiter
                </button>

                <button
                    id="requestBillBtn"
                    class="action-btn bill-btn"
                    onclick="requestBill()"
                    disabled
                >
                    🧾 Request Bill
                </button>

            </div>

            <div
                id="orderMessage"
                style="margin-top:12px;color:#666;"
            ></div>

        </div>


        <div id="generatedBill" class="bill-panel">

            <h2>🧾 Your Bill</h2>

            <div class="bill-row">
                <span>Subtotal</span>
                <strong id="billSubtotal">₹0.00</strong>
            </div>

            <div class="bill-row">
                <span>Discount</span>
                <strong id="billDiscount">₹0.00</strong>
            </div>

            <div class="bill-row bill-total">
                <span>Total</span>
                <strong id="billTotal">₹0.00</strong>
            </div>

            <button
                id="payBillBtn"
                class="payment-btn"
                onclick="payBill()"
                style="display:none;"
            >
                💳 Pay Bill
            </button>

        </div>


        <h2 class="section-title">🍽️ Menu</h2>

        <div id="menuList" class="menu-list"></div>

    </div>


    <div class="cart-bar">

        <div class="cart-inner">

            <div id="cartTotal" class="cart-total">
                Cart: ₹0.00
            </div>

            <button
                class="view-cart-btn"
                onclick="openCart()"
            >
                🛒 View Cart
            </button>

        </div>

    </div>


    <div id="cartModal" class="modal">

        <div class="modal-content">

            <h2>🛒 Your Cart</h2>

            <div id="cartItems"></div>

            <textarea
                id="instructions"
                class="instructions"
                placeholder="Special instructions (optional)"
            ></textarea>

            <div id="modalTotal" class="modal-total">
                Total: ₹0.00
            </div>

            <div class="modal-buttons">

                <button
                    class="place-order-btn"
                    onclick="placeOrder()"
                >
                    ✅ Place Order
                </button>

                <button
                    class="close-btn"
                    onclick="closeCart()"
                >
                    Close
                </button>

            </div>

        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            doc,
            getDoc,
            updateDoc,
            onSnapshot,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const restaurantId =
            urlParams.get("restaurant");

        const tableNumber =
            urlParams.get("table");


        if (!restaurantId) {

            document.getElementById("status").textContent =
                "Restaurant information is missing.";

            throw new Error(
                "Restaurant ID is missing from QR URL."
            );
        }


        document.getElementById("tableInfo").textContent =
            tableNumber
                ? "🪑 Table " + tableNumber
                : "🪑 Table not specified";


        let cart = [];

        let currentUser = null;

        let activeOrderId =
            sessionStorage.getItem(
                "activeOrderId"
            );

        let unsubscribeOrder = null;


        /*
         * AUTHENTICATION
         *
         * IMPORTANT:
         * The customer must really be authenticated before
         * an order can be created. This matches the Firestore
         * security rules.
         */

        onAuthStateChanged(
            auth,
            async (user) => {

                currentUser = user;

                if (!user) {

                    document.getElementById(
                        "status"
                    ).textContent =
                        "Please login to continue.";

                    const loginUrl =
                        "customer-login.html" +
                        "?restaurant=" +
                        encodeURIComponent(
                            restaurantId
                        ) +
                        "&table=" +
                        encodeURIComponent(
                            tableNumber || ""
                        );

                    window.location.href =
                        loginUrl;

                    return;
                }


                document.getElementById(
                    "status"
                ).textContent =
                    "Customer login verified. Loading menu...";


                await loadRestaurant();

                await loadMenu();


                if (activeOrderId) {

                    startOrderListener(
                        activeOrderId
                    );

                }
            }
        );


        async function loadRestaurant() {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );

                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );

                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();

                    if (
                        restaurant.restaurantName
                    ) {

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            "🍽️ " +
                            restaurant.restaurantName;
                    }
                }

            } catch (error) {

                console.error(
                    "Restaurant loading error:",
                    error
                );
            }
        }


        async function loadMenu() {

            const menuList =
                document.getElementById(
                    "menuList"
                );

            const status =
                document.getElementById(
                    "status"
                );

            try {

                const menuRef =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "menu"
                    );

                const snapshot =
                    await getDocs(
                        menuRef
                    );

                menuList.innerHTML = "";


                if (
                    snapshot.empty
                ) {

                    status.textContent =
                        "Menu is empty.";

                    menuList.innerHTML = `
                        <div class="empty">
                            <h3>🍽️ Menu Empty</h3>
                            <p>No menu items are available right now.</p>
                        </div>
                    `;

                    return;
                }


                status.textContent =
                    `${snapshot.size} menu item(s)`;


                snapshot.forEach(
                    (menuDoc) => {

                        const item =
                            menuDoc.data();

                        const itemId =
                            menuDoc.id;

                        const name =
                            item.name ||
                            item.foodName ||
                            "Food Item";

                        const description =
                            item.description ||
                            "";

                        const category =
                            item.category ||
                            "Food";

                        const price =
                            Number(
                                item.price || 0
                            );


                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "menu-card";


                        card.innerHTML = `

                            <span class="category">
                                ${escapeHTML(category)}
                            </span>

                            <h3>
                                ${escapeHTML(name)}
                            </h3>

                            ${
                                description
                                ? `
                                    <div class="description">
                                        ${escapeHTML(description)}
                                    </div>
                                `
                                : ""
                            }

                            <div class="price">
                                ₹${price.toFixed(2)}
                            </div>

                            <div class="quantity-row">

                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        -1
                                    )"
                                >
                                    −
                                </button>

                                <span
                                    id="quantity-${itemId}"
                                    class="quantity"
                                >
                                    0
                                </span>

                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>
                        `;


                        menuList.appendChild(
                            card
                        );
                    }
                );

            } catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );

                status.textContent =
                    "Unable to load menu.";

                menuList.innerHTML = `
                    <div class="empty">
                        <h3>⚠️ Unable to Load Menu</h3>
                        <p>${escapeHTML(error.message)}</p>
                    </div>
                `;
            }
        }


        window.changeQuantity =
            async function(
                itemId,
                change
            ) {

                const existingIndex =
                    cart.findIndex(
                        item =>
                            item.id === itemId
                    );


                if (
                    existingIndex === -1
                ) {

                    if (
                        change <= 0
                    ) {
                        return;
                    }


                    try {

                        const itemRef =
                            doc(
                                db,
                                "restaurants",
                                restaurantId,
                                "menu",
                                itemId
                            );

                        const itemSnap =
                            await getDoc(
                                itemRef
                            );


                        if (
                            !itemSnap.exists()
                        ) {
                            return;
                        }


                        const item =
                            itemSnap.data();


                        cart.push({

                            id:
                                itemId,

                            name:
                                item.name ||
                                item.foodName ||
                                "Food Item",

                            price:
                                Number(
                                    item.price || 0
                                ),

                            quantity:
                                1
                        });

                    } catch (error) {

                        console.error(
                            "Item loading error:",
                            error
                        );

                        alert(
                            "Could not add this item:\n\n" +
                            error.message
                        );

                        return;
                    }

                } else {

                    cart[
                        existingIndex
                    ].quantity += change;


                    if (
                        cart[
                            existingIndex
                        ].quantity <= 0
                    ) {

                        cart.splice(
                            existingIndex,
                            1
                        );
                    }
                }


                updateCartDisplay();

                updateMenuQuantity(
                    itemId
                );
            };


        function updateMenuQuantity(
            itemId
        ) {

            const quantityElement =
                document.getElementById(
                    "quantity-" +
                    itemId
                );


            if (!quantityElement) {
                return;
            }


            const item =
                cart.find(
                    item =>
                        item.id === itemId
                );


            quantityElement.textContent =
                item
                    ? item.quantity
                    : 0;
        }


        function getCartTotal() {

            return cart.reduce(
                (
                    total,
                    item
                ) => {

                    return total +
                        (
                            Number(
                                item.price
                            ) *
                            Number(
                                item.quantity
                            )
                        );

                },
                0
            );
        }


        function updateCartDisplay() {

            const total =
                getCartTotal();


            const count =
                cart.reduce(
                    (
                        sum,
                        item
                    ) => {

                        return sum +
                            Number(
                                item.quantity
                            );

                    },
                    0
                );


            document.getElementById(
                "cartTotal"
            ).textContent =
                `Cart: ${count} item(s) • ₹${total.toFixed(2)}`;
        }


        window.openCart =
            function() {

                renderCart();

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "block";
            };


        window.closeCart =
            function() {

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "none";
            };


        function renderCart() {

            const cartItems =
                document.getElementById(
                    "cartItems"
                );

            cartItems.innerHTML = "";


            if (
                cart.length === 0
            ) {

                cartItems.innerHTML = `
                    <div class="empty">
                        🛒 Your cart is empty.
                    </div>
                `;

            } else {

                cart.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.className =
                            "cart-item";


                        row.innerHTML = `

                            <div>

                                <div class="cart-item-name">
                                    ${escapeHTML(item.name)}
                                </div>

                                <div class="cart-item-price">
                                    ₹${Number(item.price).toFixed(2)}
                                </div>

                            </div>

                            <div class="cart-quantity">

                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        -1
                                    )"
                                >
                                    −
                                </button>

                                <span>
                                    ${item.quantity}
                                </span>

                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>
                        `;


                        cartItems.appendChild(
                            row
                        );
                    }
                );
            }


            document.getElementById(
                "modalTotal"
            ).textContent =
                "Total: ₹" +
                getCartTotal().toFixed(2);
        }


        /*
         * PLACE ORDER
         *
         * customerUid is now included.
         * This is required by the Firestore rules.
         */

        window.placeOrder =
            async function() {

                if (!currentUser) {

                    alert(
                        "Customer login has expired. Please login again."
                    );

                    return;
                }


                if (
                    cart.length === 0
                ) {

                    alert(
                        "Please add at least one item to the cart."
                    );

                    return;
                }


                /*
                 * Prevent accidentally creating another active order.
                 */

                if (activeOrderId) {

                    alert(
                        "You already have an active order. Please complete that order before placing another one."
                    );

                    return;
                }


                const instructions =
                    document.getElementById(
                        "instructions"
                    ).value.trim();


                const total =
                    getCartTotal();


                try {

                    const orderItems =
                        cart.map(
                            item => ({

                                name:
                                    item.name,

                                price:
                                    Number(
                                        item.price
                                    ),

                                quantity:
                                    Number(
                                        item.quantity
                                    )

                            })
                        );


                    const ordersRef =
                        collection(
                            db,
                            "restaurants",
                            restaurantId,
                            "orders"
                        );


                    const orderNumber =
                        "ORD-" +
                        Date.now();


                    const orderData = {

                        orderNumber:
                            orderNumber,

                        restaurantId:
                            restaurantId,

                        customerUid:
                            currentUser.uid,

                        customerPhone:
                            currentUser.phoneNumber ||
                            "",

                        tableNumber:
                            tableNumber ||
                            "N/A",

                        items:
                            orderItems,

                        subtotal:
                            total,

                        total:
                            total,

                        discountAmount:
                            0,

                        finalTotal:
                            total,

                        instructions:
                            instructions,

                        status:
                            "new",

                        billRequested:
                            false,

                        billGenerated:
                            false,

                        waiterCalled:
                            false,

                        createdAt:
                            serverTimestamp()
                    };


                    const orderRef =
                        await addDoc(
                            ordersRef,
                            orderData
                        );


                    /*
                     * Save the exact Firestore document ID.
                     */

                    activeOrderId =
                        orderRef.id;


                    sessionStorage.setItem(
                        "activeOrderId",
                        activeOrderId
                    );


                    document.getElementById(
                        "cartModal"
                    ).style.display =
                        "none";


                    cart = [];

                    updateCartDisplay();


                    document.getElementById(
                        "instructions"
                    ).value = "";


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Order successfully placed.";


                    document.getElementById(
                        "menuList"
                    ).innerHTML = `

                        <div class="success">

                            <h2>
                                ✅ Order Placed!
                            </h2>

                            <p>
                                Your order has been sent to the restaurant.
                            </p>

                            <div class="order-number">
                                ${escapeHTML(orderNumber)}
                            </div>

                            <p>
                                Table:
                                ${escapeHTML(
                                    tableNumber || "N/A"
                                )}
                            </p>

                            <p style="margin-top:10px;">
                                Total:
                                ₹${total.toFixed(2)}
                            </p>

                        </div>
                    `;


                    startOrderListener(
                        activeOrderId
                    );


                } catch (error) {

                    console.error(
                        "Order error:",
                        error
                    );


                    alert(
                        "Could not place order:\n\n" +
                        error.message
                    );
                }
            };


        /*
         * LIVE ORDER STATUS
         */

        function startOrderListener(
            orderId
        ) {

            if (
                unsubscribeOrder
            ) {

                unsubscribeOrder();

                unsubscribeOrder =
                    null;
            }


            if (!currentUser) {
                return;
            }


            const orderRef =
                doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders",
                    orderId
                );


            unsubscribeOrder =
                onSnapshot(
                    orderRef,
                    (snapshot) => {

                        if (
                            !snapshot.exists()
                        ) {

                            document.getElementById(
                                "orderMessage"
                            ).textContent =
                                "Order could not be found.";

                            return;
                        }


                        const order =
                            snapshot.data();


                        /*
                         * Extra client-side ownership check.
                         */

                        if (
                            order.customerUid &&
                            order.customerUid !==
                                currentUser.uid
                        ) {

                            document.getElementById(
                                "orderMessage"
                            ).textContent =
                                "This order does not belong to this customer.";

                            return;
                        }


                        showOrderPanel(
                            order,
                            orderId
                        );
                    },
                    (error) => {

                        console.error(
                            "Order listener error:",
                            error
                        );

                        document.getElementById(
                            "orderMessage"
                        ).textContent =
                            "Unable to receive live order updates: " +
                            error.message;
                    }
                );
        }


        function showOrderPanel(
            order,
            orderId
        ) {

            document.getElementById(
                "currentOrderPanel"
            ).style.display =
                "block";


            document.getElementById(
                "customerOrderNumber"
            ).textContent =
                "📦 " +
                (
                    order.orderNumber ||
                    orderId.substring(0, 8)
                );


            const status =
                order.status ||
                "new";


            document.getElementById(
                "customerCurrentStatus"
            ).textContent =
                getStatusText(
                    status
                );


            const flow = [
                "new",
                "accepted",
                "preparing",
                "ready",
                "completed"
            ];


            const currentIndex =
                flow.indexOf(
                    status
                );


            flow.forEach(
                (
                    step,
                    index
                ) => {

                    const element =
                        document.getElementById(
                            "step-" +
                            step
                        );


                    if (!element) {
                        return;
                    }


                    element.classList.remove(
                        "active",
                        "current"
                    );


                    if (
                        index <=
                        currentIndex
                    ) {

                        element.classList.add(
                            "active"
                        );
                    }


                    if (
                        index ===
                        currentIndex
                    ) {

                        element.classList.add(
                            "current"
                        );
                    }
                }
            );


            const requestBillBtn =
                document.getElementById(
                    "requestBillBtn"
                );


            if (
                status === "completed"
            ) {

                requestBillBtn.disabled =
                    false;

            } else {

                requestBillBtn.disabled =
                    true;
            }


            const waiterBtn =
                document.getElementById(
                    "callWaiterBtn"
                );


            if (
                order.waiterCalled
            ) {

                waiterBtn.disabled =
                    true;

                waiterBtn.textContent =
                    "✅ Waiter Called";

            } else {

                waiterBtn.disabled =
                    false;

                waiterBtn.textContent =
                    "🔔 Call Waiter";
            }


            if (
                order.billRequested
            ) {

                requestBillBtn.disabled =
                    true;

                requestBillBtn.textContent =
                    order.billGenerated
                        ? "✅ Bill Generated"
                        : "✅ Bill Requested";

            } else {

                requestBillBtn.textContent =
                    "🧾 Request Bill";
            }


            document.getElementById(
                "orderMessage"
            ).textContent =
                getCustomerMessage(
                    status,
                    order
                );


            if (
                order.billGenerated
            ) {

                showBill(
                    order
                );

            } else {

                document.getElementById(
                    "generatedBill"
                ).style.display =
                    "none";
            }


            /*
             * Keep the current order until it is paid later.
             * Payment integration will be added after this flow
             * is confirmed working.
             */
        }


        function getStatusText(
            status
        ) {

            if (
                status === "accepted"
            ) {
                return "🔵 Order Accepted";
            }

            if (
                status === "preparing"
            ) {
                return "👨‍🍳 Order is Preparing";
            }

            if (
                status === "ready"
            ) {
                return "🟢 Order is Ready";
            }

            if (
                status === "completed"
            ) {
                return "🚚 Order Delivered";
            }

            if (
                status === "cancelled"
            ) {
                return "❌ Order Cancelled";
            }

            return "🆕 Order Received";
        }


        function getCustomerMessage(
            status,
            order
        ) {

            if (
                status === "accepted"
            ) {
                return "Restaurant accepted your order.";
            }

            if (
                status === "preparing"
            ) {
                return "Your food is being prepared.";
            }

            if (
                status === "ready"
            ) {
                return "Your order is ready.";
            }

            if (
                status === "completed"
            ) {
                return order.billRequested
                    ? "Your order was delivered. Your bill request has been sent."
                    : "Your order was delivered. You can now request your bill.";
            }

            if (
                status === "cancelled"
            ) {
                return "The restaurant cancelled this order.";
            }

            return "Your order has been received by the restaurant.";
        }


        /*
         * CALL WAITER
         */

        window.callWaiter =
            async function() {

                if (
                    !currentUser ||
                    !activeOrderId
                ) {

                    alert(
                        "There is no active order."
                    );

                    return;
                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders",
                        activeOrderId
                    );


                try {

                    await updateDoc(
                        orderRef,
                        {

                            waiterCalled:
                                true,

                            waiterRequestedAt:
                                serverTimestamp()
                        }
                    );

                } catch (error) {

                    console.error(
                        "Waiter request error:",
                        error
                    );

                    alert(
                        "Could not call waiter:\n\n" +
                        error.message
                    );
                }
            };


        /*
         * REQUEST BILL
         */

        window.requestBill =
            async function() {

                if (
                    !currentUser ||
                    !activeOrderId
                ) {

                    alert(
                        "There is no active order."
                    );

                    return;
                }


                const orderRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId,
                        "orders",
                        activeOrderId
                    );


                try {

                    await updateDoc(
                        orderRef,
                        {

                            billRequested:
                                true,

                            billRequestedAt:
                                serverTimestamp()
                        }
                    );

                } catch (error) {

                    console.error(
                        "Bill request error:",
                        error
                    );

                    alert(
                        "Could not request bill:\n\n" +
                        error.message
                    );
                }
            };


        function showBill(
            order
        ) {

            const subtotal =
                Number(
                    order.billSubtotal ??
                    order.subtotal ??
                    order.total ??
                    0
                );


            const discount =
                Number(
                    order.billDiscountAmount ??
                    order.discountAmount ??
                    0
                );


            const total =
                Number(
                    order.billTotal ??
                    order.finalTotal ??
                    order.total ??
                    Math.max(
                        0,
                        subtotal - discount
                    )
                );


            document.getElementById(
                "generatedBill"
            ).style.display =
                "block";


            document.getElementById(
                "billSubtotal"
            ).textContent =
                "₹" +
                subtotal.toFixed(2);


            document.getElementById(
                "billDiscount"
            ).textContent =
                discount > 0
                    ? "-₹" +
                      discount.toFixed(2)
                    : "₹0.00";


            document.getElementById(
                "billTotal"
            ).textContent =
                "₹" +
                total.toFixed(2);


            /*
             * Payment is intentionally not activated yet.
             * Once the bill/status flow is confirmed, the
             * production UPI payment integration can be connected.
             */
        }


        window.payBill =
            function() {

                alert(
                    "Payment integration will be connected after the bill flow is confirmed."
                );
            };


        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        updateCartDisplay();

    </script>

</body>
</html>
