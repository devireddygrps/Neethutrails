<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Restaurant Menu</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f5f5;color:#333}
.header{background:#ff5722;color:#fff;padding:22px;text-align:center}
.header h1{margin:0 0 6px}
.container{max-width:800px;margin:20px auto;padding:15px}
.table{background:#fff3e0;color:#e65100;padding:12px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:18px}
.status{text-align:center;color:#666;margin:15px}
.menu{display:grid;gap:15px}
.item{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001}
.item h2{margin:0 0 7px}
.category{color:#ff5722;font-weight:bold;font-size:14px;margin-bottom:8px}
.description{color:#666;line-height:1.5;margin-bottom:10px}
.price{font-size:19px;font-weight:bold;margin-bottom:10px}
.badge{display:inline-block;padding:5px 10px;border-radius:15px;font-size:13px}
.available{background:#d4edda;color:#155724}
.unavailable{background:#f8d7da;color:#721c24}
.empty,.error{background:#fff;padding:25px;border-radius:12px;text-align:center}
.error{color:#c62828}
</style>
</head>
<body>
<div class="header"><h1>🍽️ Restaurant Menu</h1><div id="restaurantName">Loading...</div></div>
<div class="container">
<div id="tableInfo" class="table">Loading table...</div>
<div id="status" class="status">Checking login...</div>
<div id="menu" class="menu"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",
    authDomain: "restaurant-qr-ordering-fdf9b.firebaseapp.com",
    projectId: "restaurant-qr-ordering-fdf9b",
    storageBucket: "restaurant-qr-ordering-fdf9b.firebasestorage.app",
    messagingSenderId: "907571024375",
    appId: "1:907571024375:web:796894f82f2cae4d7b9ef2",
    measurementId: "G-G3Q89BDFF9"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const restaurantId=params.get("restaurantId");
const table=params.get("table");

const status=document.getElementById("status");
const menu=document.getElementById("menu");

if(!restaurantId || !table) {
    status.textContent="Invalid QR code: restaurant/table information is missing.";
    status.className="status error";
} else {
    document.getElementById("tableInfo").textContent="🪑 Table "+table;
}

onAuthStateChanged(auth, async user => {
    if(!restaurantId || !table) return;
    if(!user) {
        status.textContent="Please complete customer OTP login first.";
        const login=new URL("customer-login.html",location.href);
        login.searchParams.set("restaurantId",restaurantId);
        login.searchParams.set("table",table);
        setTimeout(()=>location.replace(login.href),800);
        return;
    }
    await loadRestaurant();
    await loadMenu();
});

async function loadRestaurant() {
    try {
        const snap=await getDoc(doc(db,"restaurants",restaurantId));
        if(snap.exists()) {
            const d=snap.data();
            document.getElementById("restaurantName").textContent=d.restaurantName||d.name||"Restaurant";
        } else {
            document.getElementById("restaurantName").textContent="Restaurant";
        }
    } catch(e) {
        console.error("Restaurant load:",e);
        document.getElementById("restaurantName").textContent="Restaurant";
    }
}

async function loadMenu() {
    status.textContent="Loading menu...";
    try {
        const snap=await getDocs(collection(db,"restaurants",restaurantId,"menu"));
        menu.innerHTML="";
        if(snap.empty) {
            status.textContent="No menu items found.";
            menu.innerHTML='<div class="empty"><h3>🍽️ Menu is empty</h3><p>Please check back later.</p></div>';
            return;
        }
        let count=0;
        snap.forEach(menuDoc => {
            const item=menuDoc.data();
            const available=item.availability==="available";
            if(!available) return;
            count++;
            const card=document.createElement("div");
            card.className="item";
            card.innerHTML=`
                <h2>${escapeHTML(item.foodName||"")}</h2>
                <div class="category">${escapeHTML(item.category||"")}</div>
                <div class="description">${escapeHTML(item.description||"No description")}</div>
                <div class="price">₹${Number(item.price||0).toFixed(2)}</div>
                <span class="badge available">🟢 Available</span>`;
            menu.appendChild(card);
        });
        status.textContent=count+" available menu item(s)";
        if(count===0) {
            menu.innerHTML='<div class="empty"><h3>🍽️ No items available</h3><p>Please check back later.</p></div>';
        }
    } catch(e) {
        console.error("Menu load:",e);
        status.textContent="Could not load menu.";
        menu.innerHTML='<div class="error"><h3>❌ Menu could not be loaded</h3><p>'+escapeHTML(e.message)+'</p></div>';
    }
}

function escapeHTML(v) {
    return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>
</body>
</html>
