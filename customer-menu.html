<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Menu</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    padding-bottom: 90px;
}

/* HEADER */

header {
    background: #ff5722;
    color: white;
    padding: 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

header h1 {
    margin-bottom: 5px;
}

header p {
    font-size: 14px;
}

/* TABLE */

.table-info {
    background: white;
    padding: 12px;
    margin: 12px 15px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    color: #ff5722;
}

/* CATEGORY TABS */

.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 15px;
    background: white;
    position: sticky;
    top: 78px;
    z-index: 15;
    border-bottom: 1px solid #ddd;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    flex-shrink: 0;
    padding: 9px 15px;
    border: none;
    border-radius: 20px;
    background: #eee;
    color: #333;
    font-size: 14px;
    cursor: pointer;
}

.tab.active {
    background: #ff5722;
    color: white;
}

/* CONTAINER */

.container {
    max-width: 600px;
    margin: auto;
    padding: 10px 15px;
}

/* CATEGORY */

.category {
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 21px;
    font-weight: bold;
}

/* MENU ITEM */

.item {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.item-name {
    font-size: 18px;
    font-weight: bold;
}

.price {
    font-weight: bold;
    color: #ff5722;
    white-space: nowrap;
}

.description {
    color: #777;
    font-size: 14px;
    margin-top: 6px;
}

.unavailable {
    color: #c62828;
    font-size: 13px;
    font-weight: bold;
    margin-top: 6px;
}

/* QUANTITY */

.controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}

.controls button {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: #ff5722;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.controls button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.quantity {
    font-size: 18px;
    font-weight: bold;
}

/* INSTRUCTIONS */

.instructions {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: none;
}

.instructions:disabled {
    background: #eee;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.error {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    color: #c62828;
}

.empty {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    color: #777;
}

/* ORDER STATUS */

.order-status {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.status-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.status-box {
    padding: 15px;
    border-radius: 10px;
    background: #fff3e0;
    color: #e65100;
    text-align: center;
    font-weight: bold;
}

/* CART */
