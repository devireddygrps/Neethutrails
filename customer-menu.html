<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Menu</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
            padding-bottom: 90px;
        }


        /* ================================
           HEADER
        ================================= */

        .header {

            background: #ff5722;

            color: white;

            padding: 20px;

            text-align: center;

        }


        .header h2 {

            margin-bottom: 5px;

        }


        .table-info {

            margin-top: 8px;

            font-size: 15px;

        }


        /* ================================
           STATUS
        ================================= */

        .status {

            text-align: center;

            padding: 15px;

            color: #666;

        }


        /* ================================
           MENU CONTAINER
        ================================= */

        .container {

            max-width: 900px;

            margin: auto;

            padding: 20px;

        }


        .menu-list {

            display: grid;

            gap: 18px;

        }


        /* ================================
           MENU CARD
        ================================= */

        .menu-card {

            background: white;

            padding: 18px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.1);

        }


        .menu-card h3 {

            margin-bottom: 8px;

            color: #333;

        }


        .category {

            display: inline-block;

            background: #fff3e0;

            color: #e65100;

            padding: 5px 9px;

            border-radius: 12px;

            font-size: 12px;

            margin-bottom: 8px;

        }


        .description {

            color: #666;

            font-size: 14px;

            margin-bottom: 12px;

            line-height: 1.4;

        }


        .price {

            font-size: 19px;

            font-weight: bold;

            color: #ff5722;

            margin-bottom: 12px;

        }


        /* ================================
           QUANTITY
        ================================= */

        .quantity-row {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .quantity-row button {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 7px;

            background: #ff5722;

            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        .quantity {

            min-width: 30px;

            text-align: center;

            font-size: 17px;

            font-weight: bold;

        }


        /* ================================
           CART BAR
        ================================= */

        .cart-bar {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            background: white;

            padding: 15px;

            box-shadow:
                0 -3px 12px rgba(0,0,0,0.15);

            z-index: 1000;

        }


        .cart-inner {

            max-width: 900px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .cart-total {

            font-size: 18px;

            font-weight: bold;

        }


        .view-cart-btn {

            background: #ff5722;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

        }


        /* ================================
           CART MODAL
        ================================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.55);

            z-index: 2000;

            padding: 20px;

            overflow-y: auto;

        }


        .modal-content {

            background: white;

            max-width: 600px;

            margin: 40px auto;

            padding: 22px;

            border-radius: 14px;

        }


        .modal-content h2 {

            margin-bottom: 15px;

        }


        .cart-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

        }


        .cart-item-name {

            font-weight: bold;

        }


        .cart-item-price {

            color: #555;

        }


        .cart-quantity {

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .cart-quantity button {

            width: 30px;

            height: 30px;

            border: none;

            background: #ff5722;

            color: white;

            border-radius: 5px;

            cursor: pointer;

        }


        .instructions {

            width: 100%;

            min-height: 90px;

            margin-top: 15px;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            resize: vertical;

        }


        .modal-total {

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

        }


        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 18px;

        }


        .modal-buttons button {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 8px;

            color: white;

            cursor: pointer;

            font-size: 15px;

        }


        .place-order-btn {

            background: #4caf50;

        }


        .close-btn {

            background: #333;

        }


        /* ================================
           EMPTY
        ================================= */

        .empty {

            background: white;

            padding: 35px;

            text-align: center;

            border-radius: 12px;

            color: #666;

        }


        /* ================================
           ORDER SUCCESS
        ================================= */

        .success {

            background: white;

            padding: 30px;

            text-align: center;

            border-radius: 12px;

            margin-top: 20px;

        }


        .success h2 {

            color: #4caf50;

            margin-bottom: 10px;

        }


        .success .order-number {

            font-size: 22px;

            font-weight: bold;

            margin: 15px 0;

        }


        /* ================================
           MOBILE
        ================================= */

        .customer-actions {
            max-width: 900px;
            margin: 0 auto 20px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            border: none;
            border-radius: 10px;
            padding: 13px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .waiter-btn { background: #6a1b9a; }
        .order-btn { background: #1565c0; }
        .bill-btn { background: #00897b; }
        .bill-box {
            display: none;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .bill-box h4 {
            margin-bottom: 10px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .bill-total {
            border-top: 1px solid #ddd;
            margin-top: 7px;
            padding-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .action-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }

        .order-panel {
            max-width: 900px;
            margin: 0 auto 20px;
            padding: 0 20px;
        }

        .order-card-live {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            display: none;
        }

        .order-card-live h3 { margin-bottom: 8px; }

        .live-status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: #f5f5f5;
            font-weight: bold;
        }

        .status-flow {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 12px;
        }

        .flow-step {
            text-align: center;
            padding: 8px 4px;
            border-radius: 8px;
            background: #eeeeee;
            font-size: 12px;
        }

        .flow-step.active {
            background: #d4edda;
            color: #155724;
            font-weight: bold;
        }

        .helper-text {
            color: #666;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {

            .container {

                padding: 15px;

            }


            .cart-inner {

                flex-direction: row;

            }


            .modal-content {

                margin: 15px auto;

            }


            .cart-item {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <div class="header">

        <h2 id="restaurantName">
            🍽️ Restaurant Menu
        </h2>

        <div
            id="tableInfo"
            class="table-info"
        >
            🪑 Loading table...
        </div>

    </div>


    <!-- ================================
         STATUS
    ================================= -->

    <div
        id="status"
        class="status"
    >
        Loading menu...
    </div>


    <!-- ================================
         CUSTOMER ACTIONS
    ================================= -->

    <div class="customer-actions">

        <button
            id="callWaiterBtn"
            class="action-btn waiter-btn"
            onclick="callWaiter()"
        >
            🔔 Call Waiter
        </button>

        <button
            class="action-btn order-btn"
            onclick="openCart()"
        >
            🛒 My Order
        </button>

    </div>


    <!-- ================================
         LIVE ORDER STATUS
    ================================= -->

    <div class="order-panel">

        <div id="liveOrderCard" class="order-card-live">

            <h3>🧾 My Current Order</h3>

            <div id="liveOrderNumber"></div>
            <div id="liveOrderTotal"></div>

            <div id="liveOrderStatus" class="live-status">
                Waiting for order...
            </div>

            <div class="status-flow">
                <div id="flow-new" class="flow-step">🆕 New</div>
                <div id="flow-accepted" class="flow-step">🔵 Accepted</div>
                <div id="flow-preparing" class="flow-step">👨‍🍳 Preparing</div>
                <div id="flow-ready" class="flow-step">🟢 Ready</div>
            </div>

            <div id="deliveredStep" class="flow-step" style="margin-top:6px;">🚚 Delivered</div>

            <button
                id="requestBillBtn"
                class="action-btn bill-btn"
                style="width:100%; margin-top:12px; display:none;"
                onclick="requestBill()"
            >
                🧾 Request Bill
            </button>

            <div id="billMessage" class="helper-text"></div>

            <div id="generatedBill" class="bill-box">
                <h4>🧾 Bill Generated</h4>
                <div id="billSubtotal" class="bill-row"></div>
                <div id="billDiscount" class="bill-row"></div>
                <div id="billTotal" class="bill-row bill-total"></div>
            </div>

        </div>

    </div>


    <!-- ================================
         MENU
    ================================= -->

    <div class="container">

        <div
            id="menuList"
            class="menu-list"
        >
        </div>

    </div>


    <!-- ================================
         CART BAR
    ================================= -->

    <div class="cart-bar">

        <div class="cart-inner">

            <div
                id="cartTotal"
                class="cart-total"
            >
                Cart: ₹0.00
            </div>


            <button
                class="view-cart-btn"
                onclick="openCart()"
            >
                🛒 View Cart
            </button>

        </div>

    </div>


    <!-- ================================
         CART MODAL
    ================================= -->

    <div
        id="cartModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>
                🛒 Your Cart
            </h2>


            <div
                id="cartItems"
            >
            </div>


            <textarea
                id="instructions"
                class="instructions"
                placeholder="Special instructions (optional)"
            ></textarea>


            <div
                id="modalTotal"
                class="modal-total"
            >
                Total: ₹0.00
            </div>


            <div class="modal-buttons">

                <button
                    class="place-order-btn"
                    onclick="placeOrder()"
                >
                    ✅ Place Order
                </button>


                <button
                    class="close-btn"
                    onclick="closeCart()"
                >
                    Close
                </button>

            </div>

        </div>

    </div>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script type="module">


        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            doc,
            getDoc,
            onSnapshot,
            updateDoc,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);


        /* =====================================
           READ QR PARAMETERS
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const restaurantId =
            urlParams.get(
                "restaurant"
            );


        const tableNumber =
            urlParams.get(
                "table"
            );


        /* =====================================
           CHECK RESTAURANT ID
        ===================================== */

        if (!restaurantId) {

            document.getElementById(
                "status"
            ).textContent =
                "Restaurant information is missing.";


            throw new Error(
                "Restaurant ID is missing from QR URL."
            );

        }


        /* =====================================
           SHOW TABLE
        ===================================== */

        document.getElementById(
            "tableInfo"
        ).textContent =
            tableNumber
            ? "🪑 Table " + tableNumber
            : "🪑 Table not specified";


        /* =====================================
           CART
        ===================================== */

        let cart = [];
        let currentOrderId = localStorage.getItem(
            "customerCurrentOrderId"
        );
        let currentOrderUnsubscribe = null;


        /* =====================================
           LOAD RESTAURANT
        ===================================== */

        async function loadRestaurant() {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();


                    if (
                        restaurant.restaurantName
                    ) {

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            "🍽️ " +
                            restaurant.restaurantName;

                    }

                }

            }

            catch (error) {

                console.error(
                    "Restaurant loading error:",
                    error
                );

            }

        }


        /* =====================================
           LOAD MENU
        ===================================== */

        async function loadMenu() {

            const menuList =
                document.getElementById(
                    "menuList"
                );


            const status =
                document.getElementById(
                    "status"
                );


            try {

                const menuRef =
                    collection(
                        db,
                        "restaurants",
                        restaurantId,
                        "menu"
                    );


                const snapshot =
                    await getDocs(
                        menuRef
                    );


                menuList.innerHTML = "";


                if (
                    snapshot.empty
                ) {

                    status.textContent =
                        "Menu is empty.";


                    menuList.innerHTML = `

                        <div class="empty">

                            <h3>
                                🍽️ Menu Empty
                            </h3>

                            <p>
                                No menu items are available right now.
                            </p>

                        </div>

                    `;

                    return;

                }


                status.textContent =
                    `${snapshot.size} menu item(s)`;


                snapshot.forEach(
                    (menuDoc) => {

                        const item =
                            menuDoc.data();


                        const itemId =
                            menuDoc.id;


                        const name =
                            item.name ||
                            item.foodName ||
                            "Food Item";


                        const description =
                            item.description ||
                            "";


                        const category =
                            item.category ||
                            "Food";


                        const price =
                            Number(
                                item.price || 0
                            );


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "menu-card";


                        card.innerHTML = `

                            <span class="category">

                                ${escapeHTML(
                                    category
                                )}

                            </span>


                            <h3>

                                ${escapeHTML(
                                    name
                                )}

                            </h3>


                            ${
                                description
                                ? `

                                    <div class="description">

                                        ${escapeHTML(
                                            description
                                        )}

                                    </div>

                                `
                                : ""
                            }


                            <div class="price">

                                ₹${price.toFixed(2)}

                            </div>


                            <div class="quantity-row">

                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        -1
                                    )"
                                >
                                    −
                                </button>


                                <span
                                    id="quantity-${itemId}"
                                    class="quantity"
                                >
                                    0
                                </span>


                                <button
                                    onclick="changeQuantity(
                                        '${itemId}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>

                        `;


                        menuList.appendChild(
                            card
                        );

                    }
                );

            }

            catch (error) {

                console.error(
                    "Menu loading error:",
                    error
                );


                status.textContent =
                    "Unable to load menu.";


                menuList.innerHTML = `

                    <div class="empty">

                        <h3>
                            ⚠️ Unable to Load Menu
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================
           CHANGE QUANTITY
        ===================================== */

        window.changeQuantity =
            async function(
                itemId,
                change
            ) {

                const existingIndex =
                    cart.findIndex(
                        item =>
                            item.id === itemId
                    );


                if (
                    existingIndex === -1
                ) {

                    if (
                        change <= 0
                    ) {
                        return;
                    }


                    try {

                        const itemRef =
                            doc(
                                db,
                                "restaurants",
                                restaurantId,
                                "menu",
                                itemId
                            );


                        const itemSnap =
                            await getDoc(
                                itemRef
                            );


                        if (
                            !itemSnap.exists()
                        ) {
                            return;
                        }


                        const item =
                            itemSnap.data();


                        cart.push({

                            id: itemId,

                            name:
                                item.name ||
                                item.foodName ||
                                "Food Item",

                            price:
                                Number(
                                    item.price || 0
                                ),

                            quantity: 1

                        });

                    }

                    catch (error) {

                        console.error(
                            "Item loading error:",
                            error
                        );

                        return;

                    }

                }

                else {

                    cart[
                        existingIndex
                    ].quantity += change;


                    if (
                        cart[
                            existingIndex
                        ].quantity <= 0
                    ) {

                        cart.splice(
                            existingIndex,
                            1
                        );

                    }

                }


                updateCartDisplay();

                updateMenuQuantity(
                    itemId
                );

            };


        /* =====================================
           UPDATE MENU QUANTITY
        ===================================== */

        function updateMenuQuantity(
            itemId
        ) {

            const quantityElement =
                document.getElementById(
                    "quantity-" +
                    itemId
                );


            if (!quantityElement) {
                return;
            }


            const item =
                cart.find(
                    item =>
                        item.id === itemId
                );


            quantityElement.textContent =
                item
                ? item.quantity
                : 0;

        }


        /* =====================================
           CART TOTAL
        ===================================== */

        function getCartTotal() {

            return cart.reduce(
                (
                    total,
                    item
                ) => {

                    return total +
                        (
                            Number(
                                item.price
                            ) *
                            Number(
                                item.quantity
                            )
                        );

                },
                0
            );

        }


        /* =====================================
           UPDATE CART BAR
        ===================================== */

        function updateCartDisplay() {

            const total =
                getCartTotal();


            const count =
                cart.reduce(
                    (
                        sum,
                        item
                    ) => {

                        return sum +
                            Number(
                                item.quantity
                            );

                    },
                    0
                );


            document.getElementById(
                "cartTotal"
            ).textContent =
                `Cart: ${count} item(s) • ₹${total.toFixed(2)}`;

        }


        /* =====================================
           OPEN CART
        ===================================== */

        window.openCart =
            function() {

                renderCart();

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "block";

            };


        /* =====================================
           CLOSE CART
        ===================================== */

        window.closeCart =
            function() {

                document.getElementById(
                    "cartModal"
                ).style.display =
                    "none";

            };


        /* =====================================
           RENDER CART
        ===================================== */

        function renderCart() {

            const cartItems =
                document.getElementById(
                    "cartItems"
                );


            cartItems.innerHTML = "";


            if (
                cart.length === 0
            ) {

                cartItems.innerHTML = `

                    <div class="empty">

                        🛒 Your cart is empty.

                    </div>

                `;

            }

            else {

                cart.forEach(
                    item => {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "cart-item";


                        row.innerHTML = `

                            <div>

                                <div class="cart-item-name">

                                    ${escapeHTML(
                                        item.name
                                    )}

                                </div>


                                <div class="cart-item-price">

                                    ₹${Number(
                                        item.price
                                    ).toFixed(2)}

                                </div>

                            </div>


                            <div class="cart-quantity">

                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        -1
                                    )"
                                >
                                    −
                                </button>


                                <span>
                                    ${item.quantity}
                                </span>


                                <button
                                    onclick="changeQuantity(
                                        '${item.id}',
                                        1
                                    )"
                                >
                                    +
                                </button>

                            </div>

                        `;


                        cartItems.appendChild(
                            row
                        );

                    }
                );

            }


            document.getElementById(
                "modalTotal"
            ).textContent =
                "Total: ₹" +
                getCartTotal().toFixed(2);

        }


        /* =====================================
           PLACE ORDER
        ===================================== */

        window.placeOrder =
            async function() {

                if (
                    cart.length === 0
                ) {

                    alert(
                        "Please add at least one item to the cart."
                    );

                    return;

                }


                const instructions =
                    document.getElementById(
                        "instructions"
                    ).value.trim();


                const total =
                    getCartTotal();


                try {

                    const orderItems =
                        cart.map(
                            item => ({

                                name:
                                    item.name,

                                price:
                                    Number(
                                        item.price
                                    ),

                                quantity:
                                    Number(
                                        item.quantity
                                    )

                            })
                        );


                    const ordersRef =
                        collection(
                            db,
                            "restaurants",
                            restaurantId,
                            "orders"
                        );


                    const orderNumber =
                        "ORD-" +
                        Date.now();


                    const orderData = {

                        orderNumber:
                            orderNumber,

                        tableNumber:
                            tableNumber ||
                            "N/A",

                        items:
                            orderItems,

                        total:
                            total,

                        instructions:
                            instructions,

                        status:
                            "new",

                        paymentStatus:
                            "pending",

                        billRequested:
                            false,

                        billGenerated:
                            false,

                        createdAt:
                            serverTimestamp()

                    };


                    const newOrderRef = await addDoc(
                        ordersRef,
                        orderData
                    );

                    currentOrderId = newOrderRef.id;
                    localStorage.setItem(
                        "customerCurrentOrderId",
                        currentOrderId
                    );
                    watchCurrentOrder(currentOrderId);


                    document.getElementById(
                        "cartModal"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "menuList"
                    ).innerHTML = `

                        <div class="success">

                            <h2>
                                ✅ Order Placed!
                            </h2>

                            <p>
                                Your order has been sent to the restaurant.
                            </p>


                            <div class="order-number">

                                ${escapeHTML(
                                    orderNumber
                                )}

                            </div>


                            <p>
                                Table:
                                ${escapeHTML(
                                    tableNumber ||
                                    "N/A"
                                )}
                            </p>


                            <p style="margin-top:10px;">

                                Total:
                                ₹${total.toFixed(2)}

                            </p>

                        </div>

                    `;


                    document.getElementById(
                        "status"
                    ).textContent =
                        "Order successfully placed.";


                    cart = [];


                    updateCartDisplay();

                }

                catch (error) {

                    console.error(
                        "Order error:",
                        error
                    );


                    alert(
                        "Could not place order:\n\n" +
                        error.message
                    );

                }

            };


        /* =====================================
           CUSTOMER WAITER CALL
        ===================================== */

        window.callWaiter = async function() {

            if (!restaurantId) {
                alert("Restaurant information is missing.");
                return;
            }

            const button = document.getElementById("callWaiterBtn");
            const originalText = button.textContent;

            button.disabled = true;
            button.textContent = "🔔 Calling...";

            try {

                const waiterRef = collection(
                    db,
                    "restaurants",
                    restaurantId,
                    "waiterCalls"
                );

                await addDoc(waiterRef, {
                    tableNumber: tableNumber || "N/A",
                    status: "requested",
                    createdAt: serverTimestamp()
                });

                button.textContent = "✅ Waiter Called";

                setTimeout(() => {
                    button.disabled = false;
                    button.textContent = originalText;
                }, 5000);

            } catch (error) {

                console.error("Waiter call error:", error);

                button.disabled = false;
                button.textContent = originalText;

                alert(
                    "Could not call the waiter:\n\n" +
                    error.message
                );
            }
        };


        /* =====================================
           LIVE ORDER STATUS
        ===================================== */

        function watchCurrentOrder(orderId) {

            if (currentOrderUnsubscribe) {
                currentOrderUnsubscribe();
                currentOrderUnsubscribe = null;
            }

            if (!orderId) {
                document.getElementById("liveOrderCard").style.display = "none";
                return;
            }

            const orderRef = doc(
                db,
                "restaurants",
                restaurantId,
                "orders",
                orderId
            );

            currentOrderUnsubscribe = onSnapshot(
                orderRef,
                (snap) => {

                    if (!snap.exists()) {
                        document.getElementById("liveOrderCard").style.display = "none";
                        return;
                    }

                    const order = snap.data();
                    renderLiveOrder(order, orderId);
                },
                (error) => {
                    console.error("Live order error:", error);
                }
            );
        }


        function renderLiveOrder(order, orderId) {

            const card = document.getElementById("liveOrderCard");
            card.style.display = "block";

            const status = order.status || "new";

            document.getElementById("liveOrderNumber").textContent =
                "Order: " + (order.orderNumber || orderId.substring(0, 6));

            const total = Number(
                order.finalTotal ??
                order.total ??
                0
            );

            document.getElementById("liveOrderTotal").textContent =
                "Total: ₹" + total.toFixed(2);

            const statusText = {
                new: "🆕 Order received",
                accepted: "🔵 Order accepted",
                preparing: "👨‍🍳 Your food is being prepared",
                ready: "🟢 Your order is ready",
                completed: "🚚 Order delivered",
                cancelled: "❌ Order cancelled"
            }[status] || "🆕 Order received";

            document.getElementById("liveOrderStatus").textContent = statusText;

            const flowOrder = [
                "new",
                "accepted",
                "preparing",
                "ready",
                "completed"
            ];

            const currentIndex = flowOrder.indexOf(status);

            document.querySelectorAll(".flow-step").forEach((el) => {
                el.classList.remove("active");
            });

            const stepIds = [
                "flow-new",
                "flow-accepted",
                "flow-preparing",
                "flow-ready",
                "deliveredStep"
            ];

            if (currentIndex >= 0) {
                stepIds.forEach((id, index) => {
                    if (index <= currentIndex) {
                        document.getElementById(id).classList.add("active");
                    }
                });
            }

            const requestBillBtn = document.getElementById("requestBillBtn");
            const billMessage = document.getElementById("billMessage");

            if (status === "completed") {
                requestBillBtn.style.display = "block";

                if (order.billRequested) {
                    requestBillBtn.disabled = true;
                    requestBillBtn.textContent = "✅ Bill Requested";

                    if (order.billGenerated) {
                        billMessage.textContent = "Your bill has been generated.";

                        const generatedBill =
                            document.getElementById("generatedBill");

                        generatedBill.style.display = "block";

                        const subtotal = Number(
                            order.billSubtotal ??
                            order.subtotal ??
                            order.total ??
                            0
                        );

                        const discount = Number(
                            order.billDiscountAmount ??
                            order.discountAmount ??
                            0
                        );

                        const total = Number(
                            order.billTotal ??
                            order.finalTotal ??
                            order.total ??
                            Math.max(0, subtotal - discount)
                        );

                        document.getElementById("billSubtotal").textContent =
                            "Subtotal: ₹" + subtotal.toFixed(2);

                        document.getElementById("billDiscount").textContent =
                            discount > 0
                                ? "Discount: -₹" + discount.toFixed(2)
                                : "Discount: ₹0.00";

                        document.getElementById("billTotal").textContent =
                            "Total: ₹" + total.toFixed(2);
                    } else {
                        billMessage.textContent =
                            "Bill requested. Please wait for the restaurant.";
                        document.getElementById("generatedBill").style.display =
                            "none";
                    }
                } else {
                    requestBillBtn.disabled = false;
                    requestBillBtn.textContent = "🧾 Request Bill";
                    billMessage.textContent =
                        "Order delivered. Request your bill when ready.";
                    document.getElementById("generatedBill").style.display =
                        "none";
                }
            } else {
                requestBillBtn.style.display = "none";
                billMessage.textContent = "";
            }
        }


        /* =====================================
           REQUEST BILL
        ===================================== */

        window.requestBill = async function() {

            if (!currentOrderId) {
                alert("No current order found.");
                return;
            }

            const button = document.getElementById("requestBillBtn");
            button.disabled = true;
            button.textContent = "🧾 Requesting...";

            try {

                const orderRef = doc(
                    db,
                    "restaurants",
                    restaurantId,
                    "orders",
                    currentOrderId
                );

                await updateDoc(orderRef, {
                    billRequested: true,
                    billRequestedAt: serverTimestamp()
                });

                button.textContent = "✅ Bill Requested";

            } catch (error) {

                console.error("Bill request error:", error);

                button.disabled = false;
                button.textContent = "🧾 Request Bill";

                alert(
                    "Could not request bill:\n\n" +
                    error.message
                );
            }
        };


        /* =====================================
           ESCAPE HTML
        ===================================== */

        function escapeHTML(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           INITIAL LOAD
        ===================================== */

        loadRestaurant();

        loadMenu();

        updateCartDisplay();

        if (currentOrderId) {
            watchCurrentOrder(currentOrderId);
        }


    </script>

</body>

</html>
