<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant QR Codes</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        .status {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .qr-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }

        .qr-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            text-align: center;
        }

        .qr-card h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .qr-image {
            width: 220px;
            height: 220px;
            max-width: 100%;
            margin: 10px auto 15px;
            display: block;
        }

        .qr-url {
            font-size: 12px;
            color: #777;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .download-btn {
            width: 100%;
            padding: 11px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .download-btn:hover {
            background: #388e3c;
        }

        .back-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #111;
        }

        .restaurant-name {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            color: #d32f2f;
        }

        @media (max-width: 600px) {

            .container {
                padding: 15px;
            }

            .qr-card {
                padding: 20px;
            }

            .qr-image {
                width: 200px;
                height: 200px;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h2>📱 Restaurant QR Codes</h2>

        <p>Generate QR codes for your tables</p>

    </div>


    <div class="container">


        <div
            id="status"
            class="status"
        >
            Loading restaurant...
        </div>


        <div
            id="restaurantName"
            class="restaurant-name"
        >
        </div>


        <div
            id="qrGrid"
            class="qr-grid"
        >
        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>


    </div>


    <script type="module">


        /* =================================
           FIREBASE IMPORTS
        ================================= */

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =================================
           FIREBASE CONFIG
        ================================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =================================
           INITIALIZE FIREBASE
        ================================= */

        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        /* =================================
           TABLE COUNT
        ================================= */

        const TOTAL_TABLES = 10;


        /* =================================
           CHECK LOGIN
        ================================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    await loadRestaurant(user.uid);

                }

                else {

                    alert(
                        "Please login first."
                    );

                    window.location.href =
                        "index.html";

                }

            }
        );


        /* =================================
           LOAD RESTAURANT
        ================================= */

        async function loadRestaurant(
            restaurantId
        ) {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                let restaurantName =
                    "My Restaurant";


                if (
                    restaurantSnap.exists()
                ) {

                    const data =
                        restaurantSnap.data();


                    restaurantName =
                        data.restaurantName ||
                        "My Restaurant";

                }


                document.getElementById(
                    "status"
                ).textContent =
                    "QR codes ready";


                document.getElementById(
                    "restaurantName"
                ).textContent =
                    "🏪 " + restaurantName;


                generateQRCodes(
                    restaurantId
                );

            }

            catch (error) {

                console.error(
                    "Error loading restaurant:",
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =
                    "";


                document.getElementById(
                    "qrGrid"
                ).innerHTML = `

                    <div class="error">

                        <h3>
                            ❌ Error
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>

                `;

            }

        }


        /* =================================
           GENERATE QR CODES
        ================================= */

        function generateQRCodes(
            restaurantId
        ) {

            const qrGrid =
                document.getElementById(
                    "qrGrid"
                );


            qrGrid.innerHTML = "";


            for (
                let table = 1;
                table <= TOTAL_TABLES;
                table++
            ) {

                const customerURL =
                    window.location.origin +
                    "/menu.html" +
                    "?restaurantId=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&table=" +
                    encodeURIComponent(
                        table
                    );


                const qrURL =
                    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
                    encodeURIComponent(
                        customerURL
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "qr-card";


                card.innerHTML = `

                    <h3>
                        🪑 Table ${table}
                    </h3>


                    <img
                        class="qr-image"
                        src="${qrURL}"
                        alt="QR Code for Table ${table}"
                    >


                    <div class="qr-url">
                        ${escapeHTML(
                            customerURL
                        )}
                    </div>


                    <button
                        class="download-btn"
                        onclick="downloadQR(
                            '${qrURL}',
                            ${table}
                        )"
                    >
                        ⬇️ Download QR
                    </button>

                `;


                qrGrid.appendChild(card);

            }

        }


        /* =================================
           DOWNLOAD QR
        ================================= */

        window.downloadQR =
            async function (
                qrURL,
                tableNumber
            ) {

                try {

                    const response =
                        await fetch(
                            qrURL
                        );


                    const blob =
                        await response.blob();


                    const imageURL =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        imageURL;


                    link.download =
                        "table-" +
                        tableNumber +
                        "-qr.png";


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    document.body.removeChild(
                        link
                    );


                    URL.revokeObjectURL(
                        imageURL
                    );

                }

                catch (error) {

                    console.error(
                        "QR download error:",
                        error
                    );


                    alert(
                        "Could not download QR code. " +
                        "You can right-click the QR image " +
                        "and save it instead."
                    );

                }

            };


        /* =================================
           SECURITY
        ================================= */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================
           BACK TO DASHBOARD
        ================================= */

        window.goBack =
            function () {

                window.location.href =
                    "dashboard.html";

            };


    </script>

</body>

</html>
