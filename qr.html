
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Table QR Codes</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
        }


        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .header h2 {
            margin-bottom: 5px;
        }


        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }


        .restaurant-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }


        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }


        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }


        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }


        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .qr-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            text-align: center;
        }


        .table-title {
            font-size: 22px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 15px;
        }


        .qr-image-container {
            width: 270px;
            height: 270px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
        }


        .qr-image {
            width: 250px;
            height: 250px;
        }


        .qr-url {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 7px;
            font-size: 12px;
            color: #555;
            word-break: break-all;
        }


        .download-btn {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }


        .download-btn:hover {
            background: #e64a19;
        }


        .back-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }


        .back-btn:hover {
            background: #111;
        }


        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }


            .qr-grid {
                grid-template-columns: 1fr;
            }


            .qr-image-container {
                width: 260px;
                height: 260px;
            }


            .qr-image {
                width: 240px;
                height: 240px;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h2>📱 Restaurant Table QR Codes</h2>

        <p>
            Generate QR codes for all tables
        </p>

    </div>


    <div class="container">


        <div
            id="restaurantName"
            class="restaurant-name"
        >
            Restaurant
        </div>


        <div class="description">

            Print one QR code and place it
            on each restaurant table.

        </div>


        <div
            id="loading"
            class="loading"
        >
            🔄 Checking restaurant login...
        </div>


        <div
            id="error"
            class="error"
            style="display:none;"
        >
        </div>


        <div
            id="qrGrid"
            class="qr-grid"
        >
        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>


    </div>


    <script type="module">


        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIGURATION
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        /* =====================================
           CUSTOMER LOGIN BASE URL
           
           IMPORTANT:
           
           QR codes now open customer-login.html
           instead of customer-menu.html.
        ===================================== */

        const baseLoginUrl =
            window.location.origin +
            "/Neethutrails/customer-login.html";


        /* =====================================
           RESTAURANT PROFILE NAME
        ===================================== */

        const savedProfile =
            localStorage.getItem(
                "restaurantProfile"
            );


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(
                        savedProfile
                    );


                if (
                    profile.restaurantName
                ) {

                    document.getElementById(
                        "restaurantName"
                    ).textContent =
                        profile.restaurantName;

                }

            }

            catch (error) {

                console.log(
                    "Profile could not be loaded."
                );

            }

        }


        /* =====================================
           CHECK LOGGED-IN RESTAURANT
        ===================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    showError(
                        "You are not logged in. Please login first."
                    );

                    return;

                }


                /*
                 * Firebase automatically gives
                 * us the restaurant owner's UID.
                 */

                const restaurantId =
                    user.uid;


                console.log(
                    "Restaurant UID:",
                    restaurantId
                );


                /*
                 * Load restaurant profile
                 */

                await loadRestaurantName(
                    restaurantId
                );


                /*
                 * Generate QR codes
                 */

                generateQRCodes(
                    restaurantId
                );

            }
        );


        /* =====================================
           LOAD RESTAURANT NAME FROM FIRESTORE
        ===================================== */

        async function loadRestaurantName(
            restaurantId
        ) {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();


                    if (
                        restaurant.restaurantName
                    ) {

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            restaurant.restaurantName;

                    }

                }

            }

            catch (error) {

                console.error(
                    "Restaurant profile error:",
                    error
                );

            }

        }


        /* =====================================
           GENERATE 10 QR CODES
        ===================================== */

        function generateQRCodes(
            restaurantId
        ) {

            const qrGrid =
                document.getElementById(
                    "qrGrid"
                );


            const loading =
                document.getElementById(
                    "loading"
                );


            qrGrid.innerHTML = "";


            /*
             * Hide loading message
             */

            loading.style.display =
                "none";


            /*
             * Generate Table 1 to Table 10
             */

            for (
                let tableNumber = 1;
                tableNumber <= 10;
                tableNumber++
            ) {


                /*
                 * IMPORTANT:
                 *
                 * QR now points to CUSTOMER LOGIN.
                 *
                 * The restaurant UID and table number
                 * are preserved in the URL.
                 *
                 * Example:
                 *
                 * customer-login.html
                 * ?restaurant=UID
                 * &table=1
                 */

                const tableUrl =
                    baseLoginUrl +
                    "?restaurant=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&table=" +
                    tableNumber;


                /*
                 * QR IMAGE
                 */

                const qrImageUrl =
                    "https://api.qrserver.com/v1/create-qr-code/" +
                    "?size=250x250&data=" +
                    encodeURIComponent(
                        tableUrl
                    );


                /*
                 * CREATE CARD
                 */

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "qr-card";


                card.innerHTML = `

                    <div class="table-title">

                        🪑 Table ${tableNumber}

                    </div>


                    <div class="qr-image-container">

                        <img
                            class="qr-image"
                            src="${qrImageUrl}"
                            alt="Table ${tableNumber} QR Code"
                        >

                    </div>


                    <div class="qr-url">

                        ${tableUrl}

                    </div>


                    <button
                        class="download-btn"
                        onclick="downloadQR(
                            '${qrImageUrl}',
                            ${tableNumber}
                        )"
                    >

                        📥 Download Table ${tableNumber} QR

                    </button>

                `;


                qrGrid.appendChild(
                    card
                );

            }

        }


        /* =====================================
           DOWNLOAD QR
        ===================================== */

        window.downloadQR =
            async function(
                imageUrl,
                tableNumber
            ) {

                try {

                    const response =
                        await fetch(
                            imageUrl
                        );


                    const blob =
                        await response.blob();


                    const imageURL =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        imageURL;


                    link.download =
                        "table-" +
                        tableNumber +
                        "-qr-code.png";


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    document.body.removeChild(
                        link
                    );


                    URL.revokeObjectURL(
                        imageURL
                    );

                }

                catch (error) {

                    console.error(
                        "QR download error:",
                        error
                    );


                    window.open(
                        imageUrl,
                        "_blank"
                    );

                }

            };


        /* =====================================
           SHOW ERROR
        ===================================== */

        function showError(
            message
        ) {

            document.getElementById(
                "loading"
            ).style.display =
                "none";


            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.style.display =
                "block";


            errorBox.textContent =
                message;

        }


        /* =====================================
           BACK TO DASHBOARD
        ===================================== */

        window.goBack =
            function() {

                window.location.href =
                    "dashboard.html";

            };


    </script>


</body>

</html>
