<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Table QR Codes</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
        }


        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .header h2 {
            margin-bottom: 5px;
        }


        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }


        .restaurant-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }


        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }


        /* QR GRID */

        .qr-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        /* QR CARD */

        .qr-card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.12);

            text-align: center;

        }


        .table-title {

            font-size: 22px;

            font-weight: bold;

            color: #ff5722;

            margin-bottom: 15px;

        }


        .qr-image-container {

            width: 270px;

            height: 270px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 2px solid #eee;

            border-radius: 10px;

            background: white;

        }


        .qr-image {

            width: 250px;

            height: 250px;

        }


        .qr-url {

            margin-top: 15px;

            padding: 10px;

            background: #f5f5f5;

            border-radius: 7px;

            font-size: 12px;

            color: #555;

            word-break: break-all;

        }


        .download-btn {

            width: 100%;

            padding: 11px;

            margin-top: 15px;

            background: #ff5722;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

        }


        .download-btn:hover {

            background: #e64a19;

        }


        .back-btn {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            background: #333;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }


        .back-btn:hover {

            background: #111;

        }


        @media (max-width: 700px) {

            .container {

                padding: 15px;

            }


            .qr-grid {

                grid-template-columns: 1fr;

            }


            .qr-image-container {

                width: 260px;

                height: 260px;

            }


            .qr-image {

                width: 240px;

                height: 240px;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h2>📱 Restaurant Table QR Codes</h2>

        <p>
            Generate QR codes for all tables
        </p>

    </div>



    <div class="container">


        <!-- RESTAURANT NAME -->

        <div
            id="restaurantName"
            class="restaurant-name"
        >

            Restaurant

        </div>


        <div class="description">

            Print one QR code and place it
            on each restaurant table.

        </div>



        <!-- QR CODES -->

        <div
            id="qrGrid"
            class="qr-grid"
        >

        </div>



        <!-- BACK -->

        <button
            class="back-btn"
            onclick="goBack()"
        >

            ← Back to Dashboard

        </button>


    </div>



    <script>


        /*
         * CUSTOMER MENU PAGE
         */

        const baseMenuUrl =
            window.location.origin +
            "/Neethutrails/customer-menu.html";



        /*
         * RESTAURANT PROFILE
         */

        const savedProfile =
            localStorage.getItem(
                "restaurantProfile"
            );


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(
                        savedProfile
                    );


                if (
                    profile.restaurantName
                ) {

                    document.getElementById(
                        "restaurantName"
                    ).textContent =
                        profile.restaurantName;

                }

            }

            catch (error) {

                console.log(
                    "Profile could not be loaded."
                );

            }

        }



        /*
         * QR GRID
         */

        const qrGrid =
            document.getElementById(
                "qrGrid"
            );



        /*
         * CREATE 10 TABLE QR CODES
         */

        for (
            let tableNumber = 1;
            tableNumber <= 10;
            tableNumber++
        ) {


            /*
             * TABLE-SPECIFIC URL
             */

            const tableUrl =
                baseMenuUrl +
                "?table=" +
                tableNumber;



            /*
             * CARD

             */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "qr-card";



            /*
             * QR IMAGE URL
             */

            const qrImageUrl =
                "https://api.qrserver.com/v1/create-qr-code/" +
                "?size=250x250&data=" +
                encodeURIComponent(
                    tableUrl
                );



            card.innerHTML = `

                <div class="table-title">

                    🪑 Table ${tableNumber}

                </div>


                <div class="qr-image-container">

                    <img
                        class="qr-image"
                        src="${qrImageUrl}"
                        alt="Table ${tableNumber} QR Code"
                    >

                </div>


                <div class="qr-url">

                    ${tableUrl}

                </div>


                <button
                    class="download-btn"
                    onclick="downloadQR(
                        '${qrImageUrl}',
                        ${tableNumber}
                    )"
                >

                    📥 Download Table ${tableNumber} QR

                </button>

            `;


            qrGrid.appendChild(
                card
            );

        }



        /*
         * DOWNLOAD QR CODE
         */

        async function downloadQR(
            imageUrl,
            tableNumber
        ) {

            try {

                const response =
                    await fetch(
                        imageUrl
                    );


                const blob =
                    await response.blob();


                const imageURL =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    imageURL;


                link.download =
                    "table-" +
                    tableNumber +
                    "-qr-code.png";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                URL.revokeObjectURL(
                    imageURL
                );

            }

            catch (error) {

                /*
                 * Fallback:
                 * Open QR image directly.
                 */

                window.open(
                    imageUrl,
                    "_blank"
                );

            }

        }



        /*
         * BACK TO DASHBOARD
         */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }

    </script>


</body>

</html>
