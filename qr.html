<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant QR Code</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
        }


        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .header h2 {
            margin-bottom: 5px;
        }


        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }


        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            text-align: center;
        }


        .card h3 {
            color: #333;
            margin-bottom: 10px;
        }


        .card p {
            color: #666;
            margin-bottom: 20px;
        }


        /* QR CODE */

        .qr-container {
            width: 280px;
            height: 280px;

            margin: 20px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            border: 2px solid #eee;

            border-radius: 10px;
        }


        .qr-container img {
            width: 250px;
            height: 250px;

            display: block;
        }


        .restaurant-name {
            font-size: 20px;
            font-weight: bold;

            color: #333;

            margin-top: 15px;
        }


        .menu-url {
            margin-top: 15px;

            padding: 12px;

            background: #f5f5f5;

            border-radius: 8px;

            font-size: 13px;

            color: #555;

            word-break: break-all;
        }


        .download-btn {
            width: 100%;

            padding: 13px;

            margin-top: 20px;

            background: #ff5722;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }


        .download-btn:hover {
            background: #e64a19;
        }


        .back-btn {
            width: 100%;

            padding: 13px;

            margin-top: 12px;

            background: #333;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }


        .back-btn:hover {
            background: #111;
        }


        .status {
            margin-top: 15px;

            color: #666;

            font-size: 14px;
        }


        @media (max-width: 600px) {

            .container {
                padding: 15px;
                margin: 15px auto;
            }


            .card {
                padding: 20px;
            }


            .qr-container {
                width: 270px;
                height: 270px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h2>📱 Restaurant QR Code</h2>

        <p>
            Scan to view restaurant menu
        </p>

    </div>



    <!-- MAIN -->

    <div class="container">

        <div class="card">


            <h3>
                🍽️ Your Restaurant QR Code
            </h3>


            <p>
                Customers can scan this QR code
                to open your restaurant menu.
            </p>



            <!-- QR CODE -->

            <div class="qr-container">

                <img
                    id="qrImage"
                    alt="Restaurant QR Code"
                >

            </div>



            <!-- RESTAURANT NAME -->

            <div
                id="restaurantName"
                class="restaurant-name"
            >
                Restaurant
            </div>



            <!-- MENU URL -->

            <div
                id="menuUrl"
                class="menu-url"
            >
                Loading...
            </div>



            <div
                id="status"
                class="status"
            >
                QR Code Ready
            </div>



            <!-- DOWNLOAD -->

            <button
                class="download-btn"
                onclick="downloadQR()"
            >

                📥 Download QR Code

            </button>



            <!-- BACK -->

            <button
                class="back-btn"
                onclick="goBack()"
            >

                ← Back to Dashboard

            </button>


        </div>

    </div>



    <script>


        /*
         * CUSTOMER MENU PAGE
         *
         * We will create this page later.
         */

        const menuUrl =
            window.location.origin +
            "/Neethutrails/customer-menu.html";



        /*
         * SHOW MENU URL
         */

        document.getElementById(
            "menuUrl"
        ).textContent = menuUrl;



        /*
         * CREATE QR CODE
         *
         * This uses an image-based QR service,
         * so no QR JavaScript library is required.
         */

        const qrImage =
            document.getElementById(
                "qrImage"
            );


        qrImage.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
            encodeURIComponent(menuUrl);



        /*
         * RESTAURANT NAME
         */

        const savedProfile =
            localStorage.getItem(
                "restaurantProfile"
            );


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(
                        savedProfile
                    );


                if (
                    profile.restaurantName
                ) {

                    document.getElementById(
                        "restaurantName"
                    ).textContent =
                        profile.restaurantName;

                }

            }

            catch (error) {

                console.log(
                    "Could not load restaurant profile."
                );

            }

        }



        /*
         * QR IMAGE ERROR
         */

        qrImage.onerror =
            function() {

                document.getElementById(
                    "status"
                ).textContent =
                    "QR Code could not be loaded.";

            };



        /*
         * QR IMAGE SUCCESS
         */

        qrImage.onload =
            function() {

                document.getElementById(
                    "status"
                ).textContent =
                    "✅ QR Code generated successfully.";

            };



        /*
         * DOWNLOAD QR
         */

        function downloadQR() {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                qrImage.src;


            link.download =
                "restaurant-qr-code.png";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }



        /*
         * BACK TO DASHBOARD
         */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


    </script>


</body>

</html>
