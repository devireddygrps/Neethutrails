<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Table QR Codes</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
        }


        .header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }


        .header h2 {
            margin-bottom: 5px;
        }


        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }


        .restaurant-name {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }


        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }


        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }


        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }


        .table-count-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            max-width: 500px;
            margin: 0 auto 25px;
        }

        .table-count-box label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .table-count-row {
            display: flex;
            gap: 10px;
        }

        .table-count-row input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .generate-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #ff5722;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #e64a19;
        }

        .count-help {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
        }

        .generated-title {
            text-align: center;
            margin: 10px 0 18px;
            color: #333;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .qr-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            text-align: center;
        }


        .table-title {
            font-size: 22px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 15px;
        }


        .qr-image-container {
            width: 270px;
            height: 270px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
        }


        .qr-image {
            width: 250px;
            height: 250px;
        }


        .qr-url {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 7px;
            font-size: 12px;
            color: #555;
            word-break: break-all;
        }


        .download-btn {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }


        .download-btn:hover {
            background: #e64a19;
        }


        .back-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }


        .back-btn:hover {
            background: #111;
        }


        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }


            .qr-grid {
                grid-template-columns: 1fr;
            }


            .qr-image-container {
                width: 260px;
                height: 260px;
            }


            .qr-image {
                width: 240px;
                height: 240px;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h2>📱 Restaurant Table QR Codes</h2>

        <p>
            Generate QR codes for all tables
        </p>

    </div>


    <div class="container">


        <div
            id="restaurantName"
            class="restaurant-name"
        >
            Restaurant
        </div>


        <div class="description">

            Print one QR code and place it
            on each restaurant table.

        </div>


        <div
            id="loading"
            class="loading"
        >
            🔄 Checking restaurant login...
        </div>


        <div
            id="error"
            class="error"
            style="display:none;"
        >
        </div>


        <div class="table-count-box">

            <label for="tableCount">
                Number of Tables
            </label>

            <div class="table-count-row">

                <input
                    id="tableCount"
                    type="number"
                    min="1"
                    max="200"
                    step="1"
                    placeholder="Example: 5"
                    inputmode="numeric"
                >

                <button
                    type="button"
                    class="generate-btn"
                    onclick="generateRequestedQRCodes()"
                >
                    Generate QRs
                </button>

            </div>

            <div class="count-help">
                Enter your table count.
            </div>

        </div>

        <div
            id="generatedTitle"
            class="generated-title"
            style="display:none;"
        ></div>

        <div
            id="qrGrid"
            class="qr-grid"
        >
        </div>


        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back to Dashboard
        </button>


    </div>


    <script type="module">


        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            doc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /* =====================================
           FIREBASE CONFIGURATION
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        /* =====================================
           CUSTOMER MENU BASE URL
        ===================================== */

        const baseMenuUrl =
            window.location.origin +
            "/Neethutrails/customer-menu.html";


        /* =====================================
           RESTAURANT PROFILE NAME
        ===================================== */

        const savedProfile =
            localStorage.getItem(
                "restaurantProfile"
            );


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(
                        savedProfile
                    );


                if (
                    profile.restaurantName
                ) {

                    document.getElementById(
                        "restaurantName"
                    ).textContent =
                        profile.restaurantName;

                }

            }

            catch (error) {

                console.log(
                    "Profile could not be loaded."
                );

            }

        }


        let loggedInRestaurantId = "";


        /* =====================================
           CHECK LOGGED-IN RESTAURANT
        ===================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    showError(
                        "You are not logged in. Please login first."
                    );

                    return;

                }


                /*
                 * THIS IS THE IMPORTANT PART
                 *
                 * Firebase automatically gives
                 * us the restaurant owner's UID.
                 */

                const restaurantId =
                    user.uid;


                console.log(
                    "Restaurant UID:",
                    restaurantId
                );


                /*
                 * Load restaurant profile
                 */

                await loadRestaurantName(
                    restaurantId
                );


                /*
                 * Generate QR codes
                 */

                loggedInRestaurantId =
                    restaurantId;

                document.getElementById(
                    "loading"
                ).textContent =
                    "✅ Login verified. Enter your number of tables above.";

                document.getElementById(
                    "tableCount"
                ).focus();

            }
        );


        /* =====================================
           LOAD RESTAURANT NAME FROM FIRESTORE
        ===================================== */

        async function loadRestaurantName(
            restaurantId
        ) {

            try {

                const restaurantRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const restaurantSnap =
                    await getDoc(
                        restaurantRef
                    );


                if (
                    restaurantSnap.exists()
                ) {

                    const restaurant =
                        restaurantSnap.data();


                    if (
                        restaurant.restaurantName
                    ) {

                        document.getElementById(
                            "restaurantName"
                        ).textContent =
                            restaurant.restaurantName;

                    }

                }

            }

            catch (error) {

                console.error(
                    "Restaurant profile error:",
                    error
                );

            }

        }


        /* =====================================
           GENERATE REQUESTED QR CODES
        ===================================== */

        function generateQRCodes(
            restaurantId,
            tableCount
        ) {

            const qrGrid =
                document.getElementById(
                    "qrGrid"
                );

            const loading =
                document.getElementById(
                    "loading"
                );

            const generatedTitle =
                document.getElementById(
                    "generatedTitle"
                );

            qrGrid.innerHTML = "";

            loading.style.display =
                "none";

            generatedTitle.style.display =
                "block";

            generatedTitle.textContent =
                `Generated ${tableCount} table QR code(s)`;


            /*
             * Generate exactly the requested number.
             *
             * Example:
             * 5 = Table 1, Table 2, Table 3, Table 4, Table 5.
             *
             * Every QR is different because its URL contains
             * the restaurant UID and its own table number.
             */

            for (
                let tableNumber = 1;
                tableNumber <= tableCount;
                tableNumber++
            ) {

                const tableUrl =
                    baseMenuUrl +
                    "?restaurant=" +
                    encodeURIComponent(
                        restaurantId
                    ) +
                    "&table=" +
                    encodeURIComponent(
                        tableNumber
                    );


                const qrImageUrl =
                    "https://api.qrserver.com/v1/create-qr-code/" +
                    "?size=250x250&data=" +
                    encodeURIComponent(
                        tableUrl
                    );


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "qr-card";


                card.innerHTML = `

                    <div class="table-title">
                        🪑 Table ${tableNumber}
                    </div>

                    <div class="qr-image-container">

                        <img
                            class="qr-image"
                            src="${qrImageUrl}"
                            alt="Table ${tableNumber} QR Code"
                        >

                    </div>

                    <div class="qr-url">
                        ${tableUrl}
                    </div>

                    <button
                        class="download-btn"
                        onclick="downloadQR(
                            '${qrImageUrl}',
                            ${tableNumber}
                        )"
                    >
                        📥 Download Table ${tableNumber} QR
                    </button>

                `;


                qrGrid.appendChild(
                    card
                );

            }

        }


        /* =====================================
           GENERATE BUTTON
        ===================================== */

        window.generateRequestedQRCodes =
            function () {

                if (!loggedInRestaurantId) {

                    alert(
                        "Please login first."
                    );

                    return;

                }


                const input =
                    document.getElementById(
                        "tableCount"
                    );


                const tableCount =
                    Number(
                        input.value
                    );


                if (
                    !Number.isInteger(
                        tableCount
                    ) ||
                    tableCount < 1 ||
                    tableCount > 200
                ) {

                    alert(
                        "Please enter a valid number of tables between 1 and 200."
                    );

                    input.focus();

                    return;

                }


                generateQRCodes(
                    loggedInRestaurantId,
                    tableCount
                );

            };


        /* =====================================
           DOWNLOAD QR
        ===================================== */




        window.downloadQR =
            async function(
                imageUrl,
                tableNumber
            ) {

                try {

                    const response =
                        await fetch(
                            imageUrl
                        );


                    const blob =
                        await response.blob();


                    const imageURL =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        imageURL;


                    link.download =
                        "table-" +
                        tableNumber +
                        "-qr-code.png";


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    document.body.removeChild(
                        link
                    );


                    URL.revokeObjectURL(
                        imageURL
                    );

                }

                catch (error) {

                    console.error(
                        "QR download error:",
                        error
                    );


                    window.open(
                        imageUrl,
                        "_blank"
                    );

                }

            };


        /* =====================================
           SHOW ERROR
        ===================================== */

        function showError(
            message
        ) {

            document.getElementById(
                "loading"
            ).style.display =
                "none";


            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.style.display =
                "block";


            errorBox.textContent =
                message;

        }


        /* =====================================
           BACK TO DASHBOARD
        ===================================== */

        window.goBack =
            function() {

                window.location.href =
                    "dashboard.html";

            };


    </script>


</body>

</html>
