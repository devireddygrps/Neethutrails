<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Restaurant QR Codes</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f5f5f5;color:#333}
.header{background:#ff5722;color:#fff;padding:20px;text-align:center}
.container{max-width:1000px;margin:25px auto;padding:20px}
.status,.restaurant{text-align:center;margin-bottom:15px}
.restaurant{font-size:22px;font-weight:bold}
.notice{background:#fff3e0;padding:12px;border-radius:10px;text-align:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;padding:20px;border-radius:15px;box-shadow:0 3px 12px #0002;text-align:center}
.qr{width:220px;height:220px;max-width:100%;display:block;margin:10px auto 15px}
.url{font-size:12px;color:#666;word-break:break-all;margin-bottom:12px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#4caf50;color:#fff;font-size:15px;cursor:pointer}
.back{margin-top:20px;background:#333}
.error{background:#fff;padding:20px;border-radius:10px;color:#c62828;text-align:center}
</style>
</head>
<body>
<div class="header"><h2>📱 Restaurant QR Codes</h2><p>Customer Login + OTP + Menu</p></div>
<div class="container">
<div id="status" class="status">Checking restaurant login...</div>
<div id="restaurant" class="restaurant"></div>
<div class="notice">Each new QR opens <b>customer-login.html</b>, then OTP verification, then the correct restaurant/table menu.</div>
<div id="grid" class="grid"></div>
<button class="back" onclick="location.href='dashboard.html'">← Back to Dashboard</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",
    authDomain: "restaurant-qr-ordering-fdf9b.firebaseapp.com",
    projectId: "restaurant-qr-ordering-fdf9b",
    storageBucket: "restaurant-qr-ordering-fdf9b.firebasestorage.app",
    messagingSenderId: "907571024375",
    appId: "1:907571024375:web:796894f82f2cae4d7b9ef2",
    measurementId: "G-G3Q89BDFF9"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const TOTAL_TABLES=10;

onAuthStateChanged(auth, async user => {
    if(!user) {
        document.getElementById("status").textContent="Please login first. Redirecting...";
        setTimeout(()=>location.href="index.html",800);
        return;
    }
    await loadRestaurant(user.uid);
});

async function loadRestaurant(restaurantId) {
    try {
        const snap=await getDoc(doc(db,"restaurants",restaurantId));
        let name="My Restaurant";
        if(snap.exists()) {
            const data=snap.data();
            name=data.restaurantName || data.name || name;
        }
        document.getElementById("restaurant").textContent="🏪 "+name;
        document.getElementById("status").textContent="QR codes ready";
        generateQRCodes(restaurantId);
    } catch(e) {
        console.error(e);
        document.getElementById("status").textContent="Could not load restaurant.";
        document.getElementById("grid").innerHTML='<div class="error">'+escapeHTML(e.message)+'</div>';
    }
}

function generateQRCodes(restaurantId) {
    const grid=document.getElementById("grid");
    grid.innerHTML="";
    const loginURL=new URL("customer-login.html",window.location.href).href;

    for(let table=1; table<=TOTAL_TABLES; table++) {
        const customerURL=loginURL+
            "?restaurantId="+encodeURIComponent(restaurantId)+
            "&table="+encodeURIComponent(table);

        const qrURL="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+
            encodeURIComponent(customerURL);

        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <h3>🪑 Table ${table}</h3>
            <img class="qr" src="${qrURL}" alt="Table ${table} QR">
            <div class="url">${escapeHTML(customerURL)}</div>
            <button>⬇️ Download QR</button>`;
        card.querySelector("button").onclick=()=>downloadQR(qrURL,table);
        grid.appendChild(card);
    }
}

async function downloadQR(url,table) {
    try {
        const response=await fetch(url);
        const blob=await response.blob();
        const objectURL=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=objectURL;
        a.download=`table-${table}-customer-login-qr.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(objectURL);
    } catch(e) {
        alert("Download failed. Right-click the QR image and save it instead.");
    }
}

function escapeHTML(v) {
    return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>
</body>
</html>
