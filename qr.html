<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant QR Code</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .qr-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            text-align: center;
        }

        .qr-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .qr-card p {
            color: #666;
            margin-bottom: 20px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        #qrcode img {
            margin: auto;
        }

        .restaurant-name {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: #333;
        }

        .url-box {
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
            color: #555;
        }

        .download-btn {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #e64a19;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #111;
        }

        .error {
            color: #d32f2f;
            margin-top: 15px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 15px;
            }

            .qr-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <div class="header">

        <h2>📱 Restaurant QR Code</h2>

        <p>Scan to view restaurant menu</p>

    </div>


    <div class="container">

        <div class="qr-card">

            <h3>🍽️ Your Restaurant QR Code</h3>

            <p>
                Customers can scan this QR code
                to open your restaurant menu.
            </p>


            <div id="qrcode"></div>


            <div
                id="restaurantName"
                class="restaurant-name"
            >
                Restaurant
            </div>


            <div
                id="menuUrl"
                class="url-box"
            >
                Loading menu URL...
            </div>


            <button
                class="download-btn"
                onclick="downloadQR()"
            >
                📥 Download QR Code
            </button>


            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <!-- QR Code Library -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <script>

        /*
         * CUSTOMER MENU URL
         *
         * This is the page customers will open
         * after scanning the QR code.
         *
         * We will connect this to your Firebase
         * restaurant/menu system in the next step.
         */

        const menuUrl =
            window.location.origin +
            "/Neethutrails/customer-menu.html";


        /*
         * Show URL
         */

        document.getElementById(
            "menuUrl"
        ).textContent = menuUrl;


        /*
         * Generate QR Code
         */

        const qrContainer =
            document.getElementById(
                "qrcode"
            );


        new QRCode(
            qrContainer,
            {
                text: menuUrl,
                width: 220,
                height: 220
            }
        );


        /*
         * Restaurant Name
         */

        const savedProfile =
            localStorage.getItem(
                "restaurantProfile"
            );


        if (savedProfile) {

            try {

                const profile =
                    JSON.parse(
                        savedProfile
                    );


                if (
                    profile.restaurantName
                ) {

                    document.getElementById(
                        "restaurantName"
                    ).textContent =
                        profile.restaurantName;

                }

            }

            catch (error) {

                console.log(
                    "Profile could not be loaded."
                );

            }

        }


        /*
         * DOWNLOAD QR CODE
         */

        function downloadQR() {

            const qrImage =
                document.querySelector(
                    "#qrcode img"
                );


            if (!qrImage) {

                alert(
                    "QR code is not ready yet."
                );

                return;

            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                qrImage.src;


            link.download =
                "restaurant-qr-code.png";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }


        /*
         * BACK TO DASHBOARD
         */

        function goBack() {

            window.location.href =
                "dashboard.html";

        }

    </script>

</body>

</html>
