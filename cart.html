<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Restaurant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    padding-bottom: 30px;
}

header {
    background: #ff5722;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 5px;
}

header p {
    font-size: 14px;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.table-info {
    background: white;
    padding: 14px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    color: #ff5722;
    margin-bottom: 15px;
}

.cart-card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.item-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.item-name {
    font-size: 18px;
    font-weight: bold;
}

.item-category {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

.item-price {
    color: #ff5722;
    font-weight: bold;
    white-space: nowrap;
}

.item-details {
    margin-top: 12px;
    color: #555;
    font-size: 14px;
}

.instruction {
    margin-top: 8px;
    background: #fff8f4;
    padding: 8px;
    border-radius: 7px;
    font-size: 13px;
}

.total-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-top: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
}

.total-price {
    color: #ff5722;
}

.place-btn,
.status-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #ff5722;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.place-btn:hover,
.status-btn:hover {
    background: #e64a19;
}

.place-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.back-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    color: #777;
}

.success {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.success-icon {
    font-size: 50px;
    margin-bottom: 10px;
}

.order-id {
    margin-top: 15px;
    background: #fff3e0;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    color: #e65100;
    word-break: break-all;
}

.status-btn {
    font-size: 16px;
}

</style>
</head>

<body>

<header>
    <h1 id="restaurantName">Restaurant</h1>
    <p>Your Cart</p>
</header>

<div class="container">

    <div id="tableInfo" class="table-info">
        Loading table...
    </div>

    <div id="cartContainer">
        <div class="empty">
            Loading cart...
        </div>
    </div>

</div>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    doc,
    getDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
    getAuth
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const restaurantId =
    params.get("restaurantId");


const table =
    params.get("table");


/* =====================================================
   ELEMENTS
===================================================== */

const restaurantName =
    document.getElementById(
        "restaurantName"
    );


const tableInfo =
    document.getElementById(
        "tableInfo"
    );


const cartContainer =
    document.getElementById(
        "cartContainer"
    );


/* =====================================================
   CART
===================================================== */

let cartItems = [];


/* =====================================================
   CHECK INFORMATION
===================================================== */

if (
    !restaurantId ||
    !table
) {

    cartContainer.innerHTML = `

        <div class="empty">

            ❌ Invalid restaurant or table information.

        </div>

    `;

}
else {

    tableInfo.textContent =
        "🪑 Table " + table;

    loadRestaurant();

    loadCart();

}


/* =====================================================
   LOAD RESTAURANT
===================================================== */

async function loadRestaurant() {

    try {

        const restaurantRef =
            doc(
                db,
                "restaurants",
                restaurantId
            );


        const snapshot =
            await getDoc(
                restaurantRef
            );


        if (
            snapshot.exists()
        ) {

            const data =
                snapshot.data();


            restaurantName.textContent =
                data.restaurantName ||
                data.name ||
                "Restaurant";

        }

    }
    catch(error) {

        console.error(
            "Restaurant loading error:",
            error
        );

    }

}


/* =====================================================
   LOAD CART
===================================================== */

function loadCart() {

    try {

        const savedCart =
            localStorage.getItem(
                "restaurantCart"
            );


        if (!savedCart) {

            showEmptyCart();

            return;

        }


        cartItems =
            JSON.parse(
                savedCart
            );


        if (
            !Array.isArray(cartItems) ||
            cartItems.length === 0
        ) {

            showEmptyCart();

            return;

        }


        renderCart();

    }
    catch(error) {

        console.error(
            "Cart loading error:",
            error
        );

        showEmptyCart();

    }

}


/* =====================================================
   EMPTY CART
===================================================== */

function showEmptyCart() {

    cartContainer.innerHTML = `

        <div class="empty">

            🛒 Your cart is empty.

            <br><br>

            Please go back and add some items.

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Menu
            </button>

        </div>

    `;

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart() {

    cartContainer.innerHTML = "";

    let total = 0;


    cartItems.forEach(
        item => {

            const quantity =
                Number(
                    item.quantity || 0
                );


            const price =
                Number(
                    item.price || 0
                );


            const itemTotal =
                quantity * price;


            total += itemTotal;


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "cart-card";


            card.innerHTML = `

                <div class="item-top">

                    <div>

                        <div class="item-name">

                            ${escapeHTML(
                                item.name
                            )}

                        </div>

                        <div class="item-category">

                            ${escapeHTML(
                                item.category || ""
                            )}

                        </div>

                    </div>

                    <div class="item-price">

                        ₹${itemTotal}

                    </div>

                </div>


                <div class="item-details">

                    ₹${price} × ${quantity}

                </div>


                ${
                    item.instruction
                    ?
                    `
                    <div class="instruction">

                        📝 ${escapeHTML(
                            item.instruction
                        )}

                    </div>
                    `
                    :
                    ""
                }

            `;


            cartContainer.appendChild(
                card
            );

        }
    );


    const totalCard =
        document.createElement(
            "div"
        );


    totalCard.className =
        "total-card";


    totalCard.innerHTML = `

        <div class="total-row">

            <span>
                Total
            </span>

            <span class="total-price">

                ₹${total}

            </span>

        </div>


        <button
            class="place-btn"
            id="placeOrderBtn"
        >

            🍽️ Place Order

        </button>


        <button
            class="back-btn"
            onclick="goBack()"
        >

            ← Back to Menu

        </button>

    `;


    cartContainer.appendChild(
        totalCard
    );


    document
        .getElementById(
            "placeOrderBtn"
        )
        .onclick =
            () => placeOrder(total);

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder(total) {

    const placeButton =
        document.getElementById(
            "placeOrderBtn"
        );


    if (
        !restaurantId ||
        !table ||
        !cartItems.length
    ) {

        alert(
            "Unable to place order."
        );

        return;

    }


    /* ---------------------------------------------
       CHECK LOGIN
    --------------------------------------------- */

    const user =
        auth.currentUser;


    if (!user) {

        alert(
            "Please login before placing your order."
        );

        return;

    }


    const confirmOrder =
        confirm(
            "Are you sure you want to place this order?"
        );


    if (!confirmOrder) {

        return;

    }


    try {

        placeButton.disabled =
            true;


        placeButton.textContent =
            "⏳ Placing Order...";


        /* -----------------------------------------
           ORDER DATA
        ----------------------------------------- */

        const orderData = {

            restaurantId:
                restaurantId,

            customerUid:
                user.uid,

            table:
                table,

            items:
                cartItems.map(
                    item => ({

                        itemId:
                            item.id || "",

                        name:
                            item.name || "",

                        category:
                            item.category || "",

                        price:
                            Number(
                                item.price || 0
                            ),

                        quantity:
                            Number(
                                item.quantity || 0
                            ),

                        instruction:
                            item.instruction || ""

                    })
                ),

            total:
                Number(total),

            status:
                "received",

            paymentStatus:
                "unpaid",

            paymentMethod:
                "",

            billStatus:
                "not_generated",

            waiterRequested:
                false,

            waiterRequestedAt:
                null,

            billRequested:
                false,

            billRequestedAt:
                null,

            createdAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()

        };


        /* -----------------------------------------
           SAVE ORDER
        ----------------------------------------- */

        const ordersRef =
            collection(
                db,
                "restaurants",
                restaurantId,
                "orders"
            );


        const orderReference =
            await addDoc(
                ordersRef,
                orderData
            );


        const orderId =
            orderReference.id;


        console.log(
            "Order created:",
            orderId
        );


        /* -----------------------------------------
           SAVE ORDER INFORMATION
        ----------------------------------------- */

        localStorage.setItem(
            "currentOrderId",
            orderId
        );


        localStorage.setItem(
            "currentRestaurantId",
            restaurantId
        );


        localStorage.setItem(
            "currentTable",
            table
        );


        /* -----------------------------------------
           CLEAR CART
        ----------------------------------------- */

        localStorage.removeItem(
            "restaurantCart"
        );


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        showOrderSuccess(
            orderId
        );

    }
    catch(error) {

        console.error(
            "Order error:",
            error
        );


        alert(
            "❌ Unable to place order.\n\n" +
            error.message
        );


        placeButton.disabled =
            false;


        placeButton.textContent =
            "🍽️ Place Order";

    }

}


/* =====================================================
   ORDER SUCCESS
===================================================== */

function showOrderSuccess(orderId) {

    cartContainer.innerHTML = `

        <div class="success">

            <div class="success-icon">
                ✅
            </div>


            <h2>
                Order Placed!
            </h2>


            <p
                style="
                    margin-top:10px;
                    color:#666;
                "
            >

                Your order has been sent
                to the restaurant.

            </p>


            <div class="order-id">

                Order ID

                <br><br>

                ${escapeHTML(
                    orderId
                )}

            </div>


            <p
                style="
                    margin-top:15px;
                    color:#777;
                    font-size:14px;
                "
            >

                Table ${escapeHTML(table)}

            </p>


            <button
                class="status-btn"
                onclick="openOrderStatus()"
            >

                📋 View Order Status

            </button>

        </div>

    `;

}


/* =====================================================
   OPEN ORDER STATUS
===================================================== */

window.openOrderStatus =
    function() {

        const savedOrderId =
            localStorage.getItem(
                "currentOrderId"
            );


        const url =
            "order-status.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&table=" +
            encodeURIComponent(
                table
            ) +
            "&orderId=" +
            encodeURIComponent(
                savedOrderId
            );


        window.location.href =
            url;

    };


/* =====================================================
   BACK TO MENU
===================================================== */

window.goBack =
    function() {

        window.location.href =
            "customer-menu.html" +
            "?restaurantId=" +
            encodeURIComponent(
                restaurantId
            ) +
            "&table=" +
            encodeURIComponent(
                table
            );

    };


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>

</body>
</html>
