<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Menu Item</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .card h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .help-text {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 12px;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #e64a19;
        }

        .save-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #loginStatus {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <h2>🍽️ Add Menu Item</h2>

        <p>Restaurant Menu Management</p>

    </div>


    <div class="container">

        <div class="card">

            <h3>Add Food Item</h3>

            <div id="loginStatus">
                Checking restaurant login...
            </div>


            <!-- Food Name -->

            <div class="form-group">

                <label for="foodName">
                    Food Name
                </label>

                <input
                    type="text"
                    id="foodName"
                    placeholder="Example: Chicken Biryani"
                >

            </div>


            <!-- Main Category -->

            <div class="form-group">

                <label for="category">
                    Main Category
                </label>

                <select id="category">

                    <option value="">
                        Select main category
                    </option>

                    <option value="Biryanis">
                        🍚 Biryanis
                    </option>

                    <option value="Main Course">
                        🍽️ Main Course
                    </option>

                    <option value="Starters">
                        🥗 Starters
                    </option>

                    <option value="Signature Items">
                        ⭐ Signature Items
                    </option>

                    <option value="Chinese">
                        🥢 Chinese
                    </option>

                    <option value="Fast Food">
                        🍔 Fast Food
                    </option>

                    <option value="Desserts">
                        🍰 Desserts
                    </option>

                    <option value="Beverages">
                        🥤 Beverages
                    </option>

                    <option value="Others">
                        📋 Others
                    </option>

                </select>

            </div>


            <!-- Subcategory -->

            <div class="form-group">

                <label for="subcategory">
                    Subcategory
                </label>

                <select id="subcategory">

                    <option value="">
                        Select subcategory
                    </option>

                </select>

                <span class="help-text">
                    Choose the main category first. The available subcategories will appear here.
                </span>

            </div>


            <!-- Custom Subcategory -->

            <div
                class="form-group"
                id="customSubcategoryGroup"
                style="display:none;"
            >

                <label for="customSubcategory">
                    Custom Subcategory
                </label>

                <input
                    type="text"
                    id="customSubcategory"
                    placeholder="Example: Special Chicken Biryani"
                >

            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Example: Spicy chicken biryani served with raita"
                ></textarea>

            </div>


            <!-- Price -->

            <div class="form-group">

                <label for="price">
                    Price (₹)
                </label>

                <input
                    type="number"
                    id="price"
                    placeholder="Example: 250"
                    min="0"
                    step="0.01"
                >

            </div>


            <!-- Availability -->

            <div class="form-group">

                <label for="availability">
                    Availability
                </label>

                <select id="availability">

                    <option value="available">
                        Available
                    </option>

                    <option value="unavailable">
                        Unavailable
                    </option>

                </select>

            </div>


            <!-- Save -->

            <button
                class="save-btn"
                id="saveBtn"
                onclick="saveMenuItem()"
                disabled
            >
                💾 Save Menu Item
            </button>


            <!-- Back -->

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        // Firebase configuration

        const firebaseConfig = {

            apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        // Initialize Firebase

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);

        const db =
            getFirestore(app);


        let currentUser = null;


        // =====================================
        // SUBCATEGORY DATA
        // =====================================

        const subcategories = {

            "Biryanis": [
                "Chicken Biryani",
                "Mutton Biryani",
                "Veg Biryani",
                "Egg Biryani",
                "Fish Biryani",
                "Prawn Biryani",
                "Special Biryani"
            ],

            "Main Course": [
                "Chicken",
                "Mutton",
                "Seafood",
                "Vegetarian",
                "Rice & Noodles",
                "Breads",
                "Gravies"
            ],

            "Starters": [
                "Chicken Starters",
                "Mutton Starters",
                "Seafood Starters",
                "Veg Starters",
                "Tandoori",
                "Kebabs"
            ],

            "Signature Items": [
                "Chef Special",
                "Restaurant Special",
                "Signature Biryani",
                "Signature Starter",
                "Signature Main Course",
                "House Special"
            ],

            "Chinese": [
                "Noodles",
                "Fried Rice",
                "Manchurian",
                "Chinese Starters",
                "Chinese Main Course"
            ],

            "Fast Food": [
                "Burgers",
                "Sandwiches",
                "Pizza",
                "Rolls",
                "Fries",
                "Wraps"
            ],

            "Desserts": [
                "Ice Cream",
                "Cakes",
                "Indian Sweets",
                "Puddings",
                "Special Desserts"
            ],

            "Beverages": [
                "Hot Beverages",
                "Cold Beverages",
                "Juices",
                "Milkshakes",
                "Mocktails",
                "Soft Drinks"
            ],

            "Others": [
                "Special Items",
                "Combos",
                "Extras",
                "Sides"
            ]

        };


        // =====================================
        // LOAD SUBCATEGORIES
        // =====================================

        document
            .getElementById("category")
            .addEventListener(
                "change",
                function () {

                    const category =
                        this.value;

                    const subcategorySelect =
                        document.getElementById(
                            "subcategory"
                        );

                    const customGroup =
                        document.getElementById(
                            "customSubcategoryGroup"
                        );

                    const customInput =
                        document.getElementById(
                            "customSubcategory"
                        );


                    subcategorySelect.innerHTML = `

                        <option value="">
                            Select subcategory
                        </option>

                    `;


                    customGroup.style.display =
                        "none";

                    customInput.value = "";


                    if (
                        !category ||
                        !subcategories[category]
                    ) {

                        return;

                    }


                    subcategories[category]
                        .forEach(
                            function (subcategory) {

                                const option =
                                    document.createElement(
                                        "option"
                                    );

                                option.value =
                                    subcategory;

                                option.textContent =
                                    subcategory;

                                subcategorySelect
                                    .appendChild(
                                        option
                                    );

                            }
                        );


                    const customOption =
                        document.createElement(
                            "option"
                        );

                    customOption.value =
                        "__custom__";

                    customOption.textContent =
                        "➕ Add Custom Subcategory";

                    subcategorySelect
                        .appendChild(
                            customOption
                        );

                }
            );


        // =====================================
        // CUSTOM SUBCATEGORY
        // =====================================

        document
            .getElementById("subcategory")
            .addEventListener(
                "change",
                function () {

                    const customGroup =
                        document.getElementById(
                            "customSubcategoryGroup"
                        );

                    const customInput =
                        document.getElementById(
                            "customSubcategory"
                        );


                    if (
                        this.value ===
                        "__custom__"
                    ) {

                        customGroup.style.display =
                            "block";

                        customInput.focus();

                    }

                    else {

                        customGroup.style.display =
                            "none";

                        customInput.value =
                            "";

                    }

                }
            );


        // =====================================
        // CHECK LOGIN
        // =====================================

        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    currentUser =
                        user;

                    document.getElementById(
                        "loginStatus"
                    ).textContent =
                        "✅ Restaurant owner logged in";

                    document.getElementById(
                        "saveBtn"
                    ).disabled =
                        false;

                    console.log(
                        "Restaurant UID:",
                        user.uid
                    );

                }

                else {

                    currentUser =
                        null;

                    document.getElementById(
                        "loginStatus"
                    ).textContent =
                        "❌ Please login first";

                    document.getElementById(
                        "saveBtn"
                    ).disabled =
                        true;

                    alert(
                        "Please login using the restaurant login page."
                    );

                    window.location.href =
                        "index.html";

                }

            }
        );


        // =====================================
        // SAVE MENU ITEM
        // =====================================

        window.saveMenuItem =
            async function () {

                if (!currentUser) {

                    alert(
                        "Restaurant owner is not logged in."
                    );

                    return;

                }


                const foodName =
                    document
                    .getElementById(
                        "foodName"
                    )
                    .value
                    .trim();


                const category =
                    document
                    .getElementById(
                        "category"
                    )
                    .value;


                const selectedSubcategory =
                    document
                    .getElementById(
                        "subcategory"
                    )
                    .value;


                const customSubcategory =
                    document
                    .getElementById(
                        "customSubcategory"
                    )
                    .value
                    .trim();


                const description =
                    document
                    .getElementById(
                        "description"
                    )
                    .value
                    .trim();


                const price =
                    document
                    .getElementById(
                        "price"
                    )
                    .value;


                const availability =
                    document
                    .getElementById(
                        "availability"
                    )
                    .value;


                // =====================================
                // VALIDATION
                // =====================================

                if (
                    foodName === ""
                ) {

                    alert(
                        "Please enter food name."
                    );

                    return;

                }


                if (
                    category === ""
                ) {

                    alert(
                        "Please select a main category."
                    );

                    return;

                }


                if (
                    selectedSubcategory === ""
                ) {

                    alert(
                        "Please select a subcategory."
                    );

                    return;

                }


                if (
                    selectedSubcategory ===
                    "__custom__" &&
                    customSubcategory === ""
                ) {

                    alert(
                        "Please enter the custom subcategory."
                    );

                    return;

                }


                if (
                    price === "" ||
                    Number(price) < 0
                ) {

                    alert(
                        "Please enter a valid price."
                    );

                    return;

                }


                const finalSubcategory =
                    selectedSubcategory ===
                    "__custom__"
                    ? customSubcategory
                    : selectedSubcategory;


                const restaurantId =
                    currentUser.uid;


                const menuItem = {

                    restaurantId:
                        restaurantId,

                    foodName:
                        foodName,

                    /*
                     * Main category used by
                     * customer-menu.html
                     */
                    category:
                        category,

                    /*
                     * Subcategory used by
                     * customer-menu.html
                     */
                    subcategory:
                        finalSubcategory,

                    /*
                     * Also save subCategory for
                     * compatibility with any
                     * existing code.
                     */
                    subCategory:
                        finalSubcategory,

                    description:
                        description,

                    price:
                        Number(price),

                    availability:
                        availability,

                    createdAt:
                        serverTimestamp()

                };


                try {

                    const menuCollection =
                        collection(
                            db,
                            "restaurants",
                            restaurantId,
                            "menu"
                        );


                    const documentReference =
                        await addDoc(
                            menuCollection,
                            menuItem
                        );


                    console.log(
                        "Menu Item ID:",
                        documentReference.id
                    );


                    alert(
                        "✅ Menu item saved successfully!"
                    );


                    // =====================================
                    // CLEAR FORM
                    // =====================================

                    document.getElementById(
                        "foodName"
                    ).value = "";


                    document.getElementById(
                        "category"
                    ).value = "";


                    document.getElementById(
                        "subcategory"
                    ).innerHTML = `

                        <option value="">
                            Select subcategory
                        </option>

                    `;


                    document.getElementById(
                        "customSubcategory"
                    ).value = "";


                    document.getElementById(
                        "customSubcategoryGroup"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "description"
                    ).value = "";


                    document.getElementById(
                        "price"
                    ).value = "";


                    document.getElementById(
                        "availability"
                    ).value =
                        "available";

                }

                catch (error) {

                    console.error(
                        "Firestore Error:",
                        error
                    );


                    alert(
                        "❌ Error saving menu item:\n\n" +
                        error.message
                    );

                }

            };


        // =====================================
        // BACK BUTTON
        // =====================================

        window.goBack =
            function () {

                window.location.href =
                    "dashboard.html";

            };

    </script>

</body>

</html>
