<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }


        .login-card {

            width: 100%;
            max-width: 420px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);

        }


        h2 {

            text-align: center;

            margin-bottom: 8px;

            color: #333;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 15px;

        }


        input:focus {

            outline: none;

            border-color: #ff5722;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #ff5722;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #e64a19;

        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        .otp-section {

            display: none;

        }


        .status {

            text-align: center;

            margin-top: 15px;

            color: #666;

            font-size: 14px;

        }


        .restaurant-info {

            text-align: center;

            margin-bottom: 20px;

            background: #fff3e0;

            padding: 12px;

            border-radius: 8px;

            color: #e65100;

        }


        .recaptcha-container {

            margin: 15px 0;

            display: flex;

            justify-content: center;

        }

    </style>

</head>


<body>


    <div class="login-card">

        <h2>
            📱 Customer Login
        </h2>


        <p class="subtitle">
            Verify your mobile number to continue
        </p>


        <div
            id="restaurantInfo"
            class="restaurant-info"
        >
            Loading...
        </div>


        <!-- PHONE SECTION -->

        <div id="phoneSection">

            <label for="phoneNumber">
                Mobile Number
            </label>


            <input
                id="phoneNumber"
                type="tel"
                placeholder="+91 9876543210"
                autocomplete="tel"
            >


            <div
                id="recaptcha-container"
                class="recaptcha-container"
            >
            </div>


            <button
                id="sendOtpBtn"
            >
                📲 Send OTP
            </button>

        </div>


        <!-- OTP SECTION -->

        <div
            id="otpSection"
            class="otp-section"
        >

            <label for="otp">
                Enter OTP
            </label>


            <input
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                autocomplete="one-time-code"
            >


            <button
                id="verifyOtpBtn"
            >
                ✅ Verify OTP
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
        </div>

    </div>



    <script type="module">


        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            RecaptchaVerifier,
            signInWithPhoneNumber
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app =
            initializeApp(
                firebaseConfig
            );


        const auth =
            getAuth(app);


        /* =====================================
           READ QR PARAMETERS
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const restaurantId =
            urlParams.get(
                "restaurant"
            );


        const tableNumber =
            urlParams.get(
                "table"
            );


        /* =====================================
           CHECK QR
        ===================================== */

        if (!restaurantId) {

            document.getElementById(
                "restaurantInfo"
            ).textContent =
                "Restaurant information is missing.";

            document.getElementById(
                "sendOtpBtn"
            ).disabled = true;

            throw new Error(
                "Restaurant ID missing from QR URL."
            );

        }


        document.getElementById(
            "restaurantInfo"
        ).textContent =
            tableNumber
            ? `🪑 Table ${tableNumber}`
            : "🍽️ Restaurant";


        /* =====================================
           ELEMENTS
        ===================================== */

        const phoneInput =
            document.getElementById(
                "phoneNumber"
            );


        const otpInput =
            document.getElementById(
                "otp"
            );


        const sendOtpBtn =
            document.getElementById(
                "sendOtpBtn"
            );


        const verifyOtpBtn =
            document.getElementById(
                "verifyOtpBtn"
            );


        const status =
            document.getElementById(
                "status"
            );


        /* =====================================
           RECAPTCHA
        ===================================== */

        let confirmationResult = null;


        let recaptchaVerifier;


        try {

            recaptchaVerifier =
                new RecaptchaVerifier(
                    auth,
                    "recaptcha-container",
                    {

                        size: "normal",

                        callback: () => {

                            status.textContent =
                                "reCAPTCHA verified.";

                        },

                        "expired-callback": () => {

                            status.textContent =
                                "reCAPTCHA expired. Please verify again.";

                        }

                    }
                );


            await recaptchaVerifier.render();

        }

        catch (error) {

            console.error(
                "reCAPTCHA error:",
                error
            );


            status.textContent =
                "Could not load reCAPTCHA.";

        }


        /* =====================================
           SEND OTP
        ===================================== */

        sendOtpBtn.addEventListener(
            "click",
            async () => {

                const phoneNumber =
                    phoneInput.value.trim();


                if (!phoneNumber) {

                    alert(
                        "Please enter your mobile number."
                    );

                    return;

                }


                if (
                    !phoneNumber.startsWith("+")
                ) {

                    alert(
                        "Please enter the number with country code.\n\nExample:\n+91 9876543210"
                    );

                    return;

                }


                sendOtpBtn.disabled = true;


                status.textContent =
                    "Sending OTP...";


                try {

                    confirmationResult =
                        await signInWithPhoneNumber(
                            auth,
                            phoneNumber,
                            recaptchaVerifier
                        );


                    status.textContent =
                        "OTP sent successfully. Please check your phone.";


                    document.getElementById(
                        "phoneSection"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "otpSection"
                    ).style.display =
                        "block";


                    otpInput.focus();

                }

                catch (error) {

                    console.error(
                        "OTP error:",
                        error
                    );


                    status.textContent =
                        "Could not send OTP.";


                    alert(
                        "Could not send OTP:\n\n" +
                        error.message
                    );


                    sendOtpBtn.disabled = false;

                }

            }
        );


        /* =====================================
           VERIFY OTP
        ===================================== */

        verifyOtpBtn.addEventListener(
            "click",
            async () => {

                const otp =
                    otpInput.value.trim();


                if (!confirmationResult) {

                    alert(
                        "Please request an OTP first."
                    );

                    return;

                }


                if (
                    otp.length !== 6
                ) {

                    alert(
                        "Please enter the 6-digit OTP."
                    );

                    return;

                }


                verifyOtpBtn.disabled = true;


                status.textContent =
                    "Verifying OTP...";


                try {

                    const result =
                        await confirmationResult.confirm(
                            otp
                        );


                    const user =
                        result.user;


                    console.log(
                        "Customer logged in:",
                        user.uid
                    );


                    /*
                     * Save basic login information
                     * temporarily for the next step.
                     */

                    sessionStorage.setItem(
                        "customerUid",
                        user.uid
                    );


                    sessionStorage.setItem(
                        "customerPhone",
                        user.phoneNumber || ""
                    );


                    sessionStorage.setItem(
                        "restaurantId",
                        restaurantId
                    );


                    sessionStorage.setItem(
                        "tableNumber",
                        tableNumber || ""
                    );


                    status.textContent =
                        "Login successful!";


                    /*
                     * Go back to the menu.
                     */

                    window.location.href =
                        "customer-menu.html" +
                        "?restaurant=" +
                        encodeURIComponent(
                            restaurantId
                        ) +
                        "&table=" +
                        encodeURIComponent(
                            tableNumber || ""
                        );

                }

                catch (error) {

                    console.error(
                        "OTP verification error:",
                        error
                    );


                    status.textContent =
                        "Invalid OTP.";


                    alert(
                        "OTP verification failed:\n\n" +
                        error.message
                    );


                    verifyOtpBtn.disabled =
                        false;

                }

            }
        );


    </script>


</body>

</html>
