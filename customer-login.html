<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff5722;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff5722;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .otp-section {
            display: none;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .restaurant-info {
            text-align: center;
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 12px;
            border-radius: 8px;
            color: #e65100;
        }

        .recaptcha-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #2e7d32;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <h2>
            📱 Customer Login
        </h2>

        <p class="subtitle">
            Verify your mobile number to continue
        </p>

        <div
            id="restaurantInfo"
            class="restaurant-info"
        >
            Loading...
        </div>


        <!-- PHONE SECTION -->

        <div id="phoneSection">

            <label for="phoneNumber">
                Mobile Number
            </label>

            <input
                id="phoneNumber"
                type="tel"
                placeholder="9876543210 or +919876543210"
                autocomplete="tel"
                inputmode="tel"
            >

            <div
                id="recaptcha-container"
                class="recaptcha-container"
            ></div>

            <button
                id="sendOtpBtn"
                type="button"
            >
                📲 Send OTP
            </button>

        </div>


        <!-- OTP SECTION -->

        <div
            id="otpSection"
            class="otp-section"
        >

            <label for="otp">
                Enter OTP
            </label>

            <input
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                autocomplete="one-time-code"
            >

            <button
                id="verifyOtpBtn"
                type="button"
            >
                ✅ Verify OTP
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </div>


    <script type="module">

        /* =====================================
           FIREBASE IMPORTS
        ===================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getAuth,
            RecaptchaVerifier,
            signInWithPhoneNumber
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


        /* =====================================
           FIREBASE CONFIG
        ===================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        /* =====================================
           INITIALIZE FIREBASE
        ===================================== */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        /* =====================================
           READ QR PARAMETERS
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const restaurantId =
            urlParams.get("restaurant");

        const tableNumber =
            urlParams.get("table");


        /* =====================================
           ELEMENTS
        ===================================== */

        const restaurantInfo =
            document.getElementById("restaurantInfo");

        const phoneInput =
            document.getElementById("phoneNumber");

        const otpInput =
            document.getElementById("otp");

        const sendOtpBtn =
            document.getElementById("sendOtpBtn");

        const verifyOtpBtn =
            document.getElementById("verifyOtpBtn");

        const status =
            document.getElementById("status");

        const phoneSection =
            document.getElementById("phoneSection");

        const otpSection =
            document.getElementById("otpSection");


        /* =====================================
           CHECK QR PARAMETERS
        ===================================== */

        if (!restaurantId) {

            restaurantInfo.textContent =
                "Restaurant information is missing.";

            sendOtpBtn.disabled = true;

            status.textContent =
                "Please scan the restaurant QR code again.";

            status.className =
                "status error";

        } else {

            restaurantInfo.textContent =
                tableNumber
                    ? `🪑 Table ${tableNumber}`
                    : "🍽️ Restaurant";

        }


        /* =====================================
           VARIABLES
        ===================================== */

        let confirmationResult = null;

        let recaptchaVerifier = null;

        let recaptchaWidgetId = null;


        /* =====================================
           SHOW STATUS
        ===================================== */

        function showStatus(message, type = "") {

            status.textContent = message;

            status.className =
                "status" +
                (type ? ` ${type}` : "");

        }


        /* =====================================
           NORMALIZE INDIAN PHONE NUMBER
        ===================================== */

        function normalizeIndianPhoneNumber(value) {

            let phone =
                value.trim();

            /*
             * Remove spaces, hyphens and brackets.
             *
             * Examples:
             *
             * 9876543210
             * +91 9876543210
             * +91-9876543210
             * +91 (9876543210)
             */

            phone =
                phone.replace(
                    /[\s\-()]/g,
                    ""
                );


            /*
             * 10 digit Indian number
             *
             * 9876543210
             *
             * becomes
             *
             * +919876543210
             */

            if (/^[6-9]\d{9}$/.test(phone)) {

                return "+91" + phone;

            }


            /*
             * +91 followed by 10 digits
             */

            if (/^\+91[6-9]\d{9}$/.test(phone)) {

                return phone;

            }


            return null;

        }


        /* =====================================
           RESET RECAPTCHA
        ===================================== */

        async function resetRecaptcha() {

            try {

                if (recaptchaVerifier) {

                    recaptchaVerifier.clear();

                    recaptchaVerifier = null;

                    recaptchaWidgetId = null;

                }

            } catch (error) {

                console.warn(
                    "Could not clear reCAPTCHA:",
                    error
                );

            }


            /*
             * Re-create reCAPTCHA.
             */

            try {

                recaptchaVerifier =
                    new RecaptchaVerifier(
                        auth,
                        "recaptcha-container",
                        {

                            size: "normal",

                            callback: () => {

                                showStatus(
                                    "reCAPTCHA verified."
                                );

                            },

                            "expired-callback": () => {

                                showStatus(
                                    "reCAPTCHA expired. Please verify again.",
                                    "error"
                                );

                            },

                            "error-callback": () => {

                                showStatus(
                                    "reCAPTCHA error. Please try again.",
                                    "error"
                                );

                            }

                        }
                    );


                recaptchaWidgetId =
                    await recaptchaVerifier.render();


            } catch (error) {

                console.error(
                    "reCAPTCHA initialization error:",
                    error
                );

                showStatus(
                    "Could not load reCAPTCHA. Please refresh the page.",
                    "error"
                );

            }

        }


        /* =====================================
           INITIALIZE RECAPTCHA
        ===================================== */

        if (restaurantId) {

            await resetRecaptcha();

        }


        /* =====================================
           SEND OTP
        ===================================== */

        sendOtpBtn.addEventListener(
            "click",
            async () => {

                if (!restaurantId) {

                    showStatus(
                        "Restaurant information is missing.",
                        "error"
                    );

                    return;

                }


                /*
                 * Normalize the number.
                 */

                const phoneNumber =
                    normalizeIndianPhoneNumber(
                        phoneInput.value
                    );


                /*
                 * Validate the number BEFORE
                 * calling Firebase.
                 */

                if (!phoneNumber) {

                    showStatus(
                        "Enter a valid Indian mobile number.\nExample: 9876543210 or +919876543210",
                        "error"
                    );

                    phoneInput.focus();

                    return;

                }


                /*
                 * Display the normalized number
                 * so the user knows what will be used.
                 */

                phoneInput.value =
                    phoneNumber;


                sendOtpBtn.disabled = true;

                showStatus(
                    "Sending OTP..."
                );


                try {

                    /*
                     * Make sure reCAPTCHA exists.
                     */

                    if (!recaptchaVerifier) {

                        await resetRecaptcha();

                    }


                    /*
                     * Send OTP.
                     */

                    confirmationResult =
                        await signInWithPhoneNumber(
                            auth,
                            phoneNumber,
                            recaptchaVerifier
                        );


                    /*
                     * OTP successfully sent.
                     */

                    showStatus(
                        "OTP sent successfully. Please check your phone.",
                        "success"
                    );


                    phoneSection.style.display =
                        "none";

                    otpSection.style.display =
                        "block";

                    otpInput.value = "";

                    otpInput.focus();


                } catch (error) {

                    console.error(
                        "Firebase OTP error:",
                        error
                    );


                    /*
                     * IMPORTANT:
                     * Show the actual Firebase error code.
                     */

                    const errorCode =
                        error?.code ||
                        "unknown-error";

                    const errorMessage =
                        error?.message ||
                        "Unknown Firebase error.";


                    showStatus(
                        `Firebase error: ${errorCode}`,
                        "error"
                    );


                    alert(
                        "Could not send OTP.\n\n" +
                        "Firebase error code:\n" +
                        errorCode +
                        "\n\n" +
                        "Message:\n" +
                        errorMessage
                    );


                    sendOtpBtn.disabled =
                        false;


                    /*
                     * reCAPTCHA tokens are often
                     * unusable after a failed request.
                     *
                     * Completely reset it.
                     */

                    await resetRecaptcha();

                }

            }
        );


        /* =====================================
           VERIFY OTP
        ===================================== */

        verifyOtpBtn.addEventListener(
            "click",
            async () => {

                const otp =
                    otpInput.value.trim();


                if (!confirmationResult) {

                    showStatus(
                        "Please request an OTP first.",
                        "error"
                    );

                    return;

                }


                /*
                 * OTP must contain exactly
                 * six digits.
                 */

                if (!/^\d{6}$/.test(otp)) {

                    showStatus(
                        "Please enter the 6-digit OTP.",
                        "error"
                    );

                    otpInput.focus();

                    return;

                }


                verifyOtpBtn.disabled =
                    true;

                showStatus(
                    "Verifying OTP..."
                );


                try {

                    const result =
                        await confirmationResult.confirm(
                            otp
                        );


                    const user =
                        result.user;


                    console.log(
                        "Customer logged in:",
                        user.uid
                    );


                    /*
                     * Save customer information.
                     */

                    sessionStorage.setItem(
                        "customerUid",
                        user.uid
                    );


                    sessionStorage.setItem(
                        "customerPhone",
                        user.phoneNumber || ""
                    );


                    /*
                     * Preserve QR information.
                     */

                    sessionStorage.setItem(
                        "restaurantId",
                        restaurantId
                    );


                    sessionStorage.setItem(
                        "tableNumber",
                        tableNumber || ""
                    );


                    showStatus(
                        "Login successful! Opening menu...",
                        "success"
                    );


                    /*
                     * IMPORTANT:
                     *
                     * customer-menu.html is NOT changed.
                     *
                     * We simply redirect to it with
                     * the original QR parameters.
                     */

                    const menuUrl =
                        "customer-menu.html" +
                        "?restaurant=" +
                        encodeURIComponent(
                            restaurantId
                        ) +
                        "&table=" +
                        encodeURIComponent(
                            tableNumber || ""
                        );


                    window.location.href =
                        menuUrl;


                } catch (error) {

                    console.error(
                        "OTP verification error:",
                        error
                    );


                    /*
                     * Show actual Firebase error code.
                     */

                    const errorCode =
                        error?.code ||
                        "unknown-error";

                    const errorMessage =
                        error?.message ||
                        "Unknown Firebase error.";


                    showStatus(
                        `Firebase error: ${errorCode}`,
                        "error"
                    );


                    alert(
                        "OTP verification failed.\n\n" +
                        "Firebase error code:\n" +
                        errorCode +
                        "\n\n" +
                        "Message:\n" +
                        errorMessage
                    );


                    verifyOtpBtn.disabled =
                        false;

                    otpInput.focus();

                }

            }
        );


        /* =====================================
           ALLOW ENTER TO SEND OTP
        ===================================== */

        phoneInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendOtpBtn.click();

                }

            }
        );


        /* =====================================
           ALLOW ENTER TO VERIFY OTP
        ===================================== */

        otpInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    event.preventDefault();

                    verifyOtpBtn.click();

                }

            }
        );

    </script>

</body>

</html>
