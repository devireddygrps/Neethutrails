<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Customer Login - OTP</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(
        135deg,
        #fff7f2,
        #ffe5d8
    );
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    padding:28px 24px;
    border-radius:18px;
    box-shadow:0 8px 30px #0002;
}

.logo{
    text-align:center;
    font-size:45px;
}

h1{
    text-align:center;
    margin:8px 0;
    color:#222;
}

.sub{
    text-align:center;
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
}

.table{
    background:#fff3ec;
    color:#d84315;
    text-align:center;
    padding:10px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:bold;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 7px;
}

.row{
    display:flex;
    gap:8px;
}

.code{
    width:75px;
    padding:13px 8px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#f7f7f7;
    text-align:center;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#ff5722;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#ff5722;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

button:disabled{
    background:#aaa;
}

.secondary{
    background:#eee;
    color:#333;
    margin-top:10px;
}

#otpSection{
    display:none;
}

#nameSection{
    display:none;
}

.otp{
    text-align:center;
    letter-spacing:8px;
    font-size:22px;
    font-weight:bold;
}

.status{
    min-height:22px;
    text-align:center;
    margin-top:14px;
    font-size:14px;
    line-height:1.4;
}

.error{
    color:#c62828;
}

.success{
    color:#2e7d32;
}

.info{
    color:#666;
}

#recaptcha-container{
    display:flex;
    justify-content:center;
}

.customer-note{
    background:#fff8f4;
    padding:12px;
    border-radius:8px;
    color:#666;
    font-size:13px;
    margin-top:12px;
    line-height:1.5;
}

</style>
</head>

<body>

<main class="card">

<div class="logo">🍽️</div>

<h1>Customer Login</h1>

<p class="sub">
Enter your mobile number to continue to the restaurant menu.
</p>

<div id="tableInfo" class="table">
Checking QR...
</div>


<!-- ==============================
     MOBILE
============================== -->

<section id="mobileSection">

<label for="mobile">
Mobile Number
</label>

<div class="row">

<div class="code">
+91
</div>

<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
autocomplete="tel"
placeholder="10-digit mobile number"
>

</div>

<button id="send">
Send OTP
</button>

<div id="recaptcha-container"></div>

</section>


<!-- ==============================
     OTP
============================== -->

<section id="otpSection">

<label for="otp">
Enter OTP
</label>

<input
id="otp"
class="otp"
type="tel"
inputmode="numeric"
maxlength="6"
autocomplete="one-time-code"
placeholder="••••••"
>

<button id="verify">
Verify OTP
</button>

<button
id="change"
class="secondary"
>
Change Mobile Number
</button>

</section>


<!-- ==============================
     CUSTOMER NAME
============================== -->

<section id="nameSection">

<label for="customerName">
Your Good Name
</label>

<input
id="customerName"
type="text"
maxlength="80"
autocomplete="name"
placeholder="Enter your name"
>

<div class="customer-note">

Your name will be saved with your restaurant orders so the restaurant can identify your order.

</div>

<button id="continueBtn">
Continue to Menu
</button>

</section>


<div id="status" class="status info"></div>

</main>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

    authDomain:
        "restaurant-qr-ordering-fdf9b.firebaseapp.com",

    projectId:
        "restaurant-qr-ordering-fdf9b",

    storageBucket:
        "restaurant-qr-ordering-fdf9b.firebasestorage.app",

    messagingSenderId:
        "907571024375",

    appId:
        "1:907571024375:web:796894f82f2cae4d7b9ef2",

    measurementId:
        "G-G3Q89BDFF9"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ==========================================
   URL
========================================== */

const params =
    new URLSearchParams(
        location.search
    );

const restaurantId =
    params.get("restaurantId");

const table =
    params.get("table");


/* ==========================================
   ELEMENTS
========================================== */

const tableInfo =
    document.getElementById(
        "tableInfo"
    );

const mobileSection =
    document.getElementById(
        "mobileSection"
    );

const otpSection =
    document.getElementById(
        "otpSection"
    );

const nameSection =
    document.getElementById(
        "nameSection"
    );

const mobile =
    document.getElementById(
        "mobile"
    );

const otp =
    document.getElementById(
        "otp"
    );

const customerName =
    document.getElementById(
        "customerName"
    );

const send =
    document.getElementById(
        "send"
    );

const verify =
    document.getElementById(
        "verify"
    );

const change =
    document.getElementById(
        "change"
    );

const continueBtn =
    document.getElementById(
        "continueBtn"
    );

const status =
    document.getElementById(
        "status"
    );


/* ==========================================
   QR CHECK
========================================== */

if(
    !restaurantId ||
    !table
){

    tableInfo.textContent =
        "❌ Invalid QR code";

    send.disabled =
        true;

    setStatus(
        "This QR code is missing restaurant or table information.",
        "error"
    );

}
else{

    tableInfo.textContent =
        "🪑 Table " + table;

}


/* ==========================================
   STATUS
========================================== */

function setStatus(
    msg,
    type="info"
){

    status.textContent =
        msg;

    status.className =
        "status " + type;

}


/* ==========================================
   RECAPTCHA
========================================== */

let verifier =
    null;

let confirmation =
    null;

let verifiedMobile =
    "";


function createRecaptcha(){

    if(verifier)
        return;

    verifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:"invisible",

                callback:()=>{
                    console.log(
                        "reCAPTCHA verified"
                    );
                },

                "expired-callback":()=>{
                    setStatus(
                        "reCAPTCHA expired. Try again.",
                        "error"
                    );
                }
            }
        );

    verifier
        .render()
        .catch(console.error);
}


if(
    restaurantId &&
    table
){

    createRecaptcha();

}


/* ==========================================
   SEND OTP
========================================== */

send.onclick =
async function(){

    const number =
        mobile.value.trim();

    if(
        !/^[6-9]\d{9}$/.test(number)
    ){

        setStatus(
            "Enter a valid 10-digit Indian mobile number.",
            "error"
        );

        return;

    }

    send.disabled =
        true;

    setStatus(
        "Sending OTP...",
        "info"
    );

    try{

        createRecaptcha();

        confirmation =
            await signInWithPhoneNumber(
                auth,
                "+91" + number,
                verifier
            );

        verifiedMobile =
            number;

        mobileSection.style.display =
            "none";

        otpSection.style.display =
            "block";

        otp.focus();

        setStatus(
            "OTP sent successfully. Enter the 6-digit OTP.",
            "success"
        );

    }
    catch(e){

        console.error(e);

        send.disabled =
            false;

        if(verifier){

            try{
                verifier.clear();
            }
            catch(_){}

            verifier =
                null;

        }

        createRecaptcha();

        setStatus(
            firebaseError(e),
            "error"
        );

    }

};


/* ==========================================
   VERIFY OTP
========================================== */

verify.onclick =
async function(){

    const code =
        otp.value.trim();

    if(
        !/^\d{6}$/.test(code)
    ){

        setStatus(
            "Enter the 6-digit OTP.",
            "error"
        );

        return;

    }

    if(!confirmation){

        setStatus(
            "Please request a new OTP.",
            "error"
        );

        return;

    }

    verify.disabled =
        true;

    setStatus(
        "Verifying OTP...",
        "info"
    );

    try{

        const result =
            await confirmation.confirm(
                code
            );

        const user =
            result.user;

        /*
         Firebase Auth now knows the
         verified phone number.
        */

        const phone =
            user.phoneNumber ||
            ("+91" + verifiedMobile);

        verifiedMobile =
            phone.replace(
                "+91",
                ""
            );


        /*
         Show name section.
        */

        otpSection.style.display =
            "none";

        nameSection.style.display =
            "block";

        customerName.focus();

        setStatus(
            "OTP verified. Please enter your name.",
            "success"
        );

    }
    catch(e){

        console.error(e);

        verify.disabled =
            false;

        setStatus(
            firebaseError(e),
            "error"
        );

    }

};


/* ==========================================
   SAVE CUSTOMER
========================================== */

continueBtn.onclick =
async function(){

    const name =
        customerName.value.trim();

    if(
        name.length < 2
    ){

        setStatus(
            "Please enter your name.",
            "error"
        );

        customerName.focus();

        return;

    }

    const user =
        auth.currentUser;

    if(!user){

        setStatus(
            "Login session expired. Please login again.",
            "error"
        );

        return;

    }

    continueBtn.disabled =
        true;

    continueBtn.textContent =
        "Saving...";

    setStatus(
        "Saving your details...",
        "info"
    );


    try{

        const phone =
            user.phoneNumber ||
            ("+91" + verifiedMobile);


        /*
         Save customer profile.

         Path:

         restaurants
           restaurantId
             customers
               user.uid
        */

        const customerRef =
            doc(
                db,
                "restaurants",
                restaurantId,
                "customers",
                user.uid
            );


        await setDoc(
            customerRef,
            {

                uid:
                    user.uid,

                name:
                    name,

                mobile:
                    phone,

                phoneNumber:
                    phone,

                restaurantId:
                    restaurantId,

                lastTable:
                    table,

                updatedAt:
                    serverTimestamp(),

                createdAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        /*
         Save locally as well so
         cart/order pages can access
         customer information.
        */

        localStorage.setItem(
            "customerName",
            name
        );

        localStorage.setItem(
            "customerMobile",
            phone
        );

        localStorage.setItem(
            "customerUid",
            user.uid
        );


        setStatus(
            "Login successful. Opening menu...",
            "success"
        );


        /*
         Go to menu.
        */

        const menuURL =
            new URL(
                "customer-menu.html",
                location.href
            );


        menuURL.searchParams.set(
            "restaurantId",
            restaurantId
        );

        menuURL.searchParams.set(
            "table",
            table
        );


        setTimeout(
            ()=>{
                location.replace(
                    menuURL.href
                );
            },
            500
        );

    }
    catch(e){

        console.error(e);

        continueBtn.disabled =
            false;

        continueBtn.textContent =
            "Continue to Menu";

        setStatus(
            "Unable to save customer details.\n" +
            (e?.message || ""),
            "error"
        );

    }

};


/* ==========================================
   CHANGE NUMBER
========================================== */

change.onclick =
function(){

    confirmation =
        null;

    otp.value =
        "";

    otpSection.style.display =
        "none";

    mobileSection.style.display =
        "block";

    send.disabled =
        false;

    setStatus("");

    mobile.focus();

};


/* ==========================================
   FIREBASE ERROR
========================================== */

function firebaseError(e){

    const c =
        e?.code || "";

    const messages = {

        "auth/invalid-phone-number":
            "Invalid mobile number.",

        "auth/too-many-requests":
            "Too many attempts. Please wait and try again.",

        "auth/quota-exceeded":
            "SMS quota exceeded. Please try later.",

        "auth/billing-not-enabled":
            "Firebase billing is not enabled for Phone Authentication.",

        "auth/invalid-verification-code":
            "Incorrect OTP.",

        "auth/code-expired":
            "OTP expired. Request a new OTP.",

        "auth/captcha-check-failed":
            "reCAPTCHA failed. Refresh and try again.",

        "auth/operation-not-allowed":
            "Phone Authentication is not enabled in Firebase."

    };

    return (
        messages[c] ||
        e?.message ||
        "Unable to continue."
    );

}

</script>

</body>
</html>
