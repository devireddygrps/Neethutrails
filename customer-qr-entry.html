<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.12);
            text-align: center;
            max-width: 360px;
            width: calc(100% - 40px);
        }
        .icon { font-size: 42px; margin-bottom: 12px; }
        h2 { margin: 0 0 8px; }
        p { color: #666; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🍽️</div>
        <h2>Opening Restaurant</h2>
        <p>Please wait while we take you to customer login...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const restaurant = params.get("restaurant");
        const table = params.get("table");

        if (!restaurant) {
            document.querySelector(".box").innerHTML =
                "<div class='icon'>⚠️</div>" +
                "<h2>Invalid QR Code</h2>" +
                "<p>Restaurant information is missing from this QR code.</p>";
        } else {
            const loginParams = new URLSearchParams();
            loginParams.set("restaurant", restaurant);

            if (table) {
                loginParams.set("table", table);
            }

            loginParams.set("return", "customer-menu.html");

            window.location.replace(
                "customer-login.html?" + loginParams.toString()
            );
        }
    </script>
</body>
</html>
