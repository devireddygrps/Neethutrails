<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .header {
            background: #ff5722;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h2 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 25px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .profile-card h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #e64a19;
        }

        .save-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .back-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #111;
        }

        #loginStatus {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 15px;
            }

            .profile-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🏪 Restaurant Profile</h2>
        <p>Restaurant Information</p>
    </div>

    <div class="container">

        <div class="profile-card">

            <h3>Enter Restaurant Details</h3>

            <div id="loginStatus">
                Checking restaurant login...
            </div>

            <div class="form-group">

                <label for="restaurantName">
                    Restaurant Name
                </label>

                <input
                    type="text"
                    id="restaurantName"
                    placeholder="Enter restaurant name"
                >

            </div>

            <div class="form-group">

                <label for="restaurantType">
                    Restaurant Type
                </label>

                <select id="restaurantType">

                    <option value="">
                        Select restaurant type
                    </option>

                    <option value="Restaurant">
                        Restaurant
                    </option>

                    <option value="Cafe">
                        Cafe
                    </option>

                    <option value="Bakery">
                        Bakery
                    </option>

                    <option value="Fast Food">
                        Fast Food
                    </option>

                    <option value="Hotel">
                        Hotel
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter restaurant address"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="phone">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter contact number"
                >

            </div>

            <div class="form-group">

                <label for="openingTime">
                    Opening Time
                </label>

                <input
                    type="time"
                    id="openingTime"
                >

            </div>

            <div class="form-group">

                <label for="closingTime">
                    Closing Time
                </label>

                <input
                    type="time"
                    id="closingTime"
                >

            </div>

            <button
                class="save-btn"
                id="saveBtn"
                onclick="saveProfile()"
                disabled
            >
                💾 Save Restaurant Profile
            </button>

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        // Firebase Configuration
        const firebaseConfig = {

            apiKey: "AIzaSyAqhxdr_vaqwGup-lXmefwQFxMJErawlvw",

            authDomain:
                "restaurant-qr-ordering-fdf9b.firebaseapp.com",

            projectId:
                "restaurant-qr-ordering-fdf9b",

            storageBucket:
                "restaurant-qr-ordering-fdf9b.firebasestorage.app",

            messagingSenderId:
                "907571024375",

            appId:
                "1:907571024375:web:796894f82f2cae4d7b9ef2",

            measurementId:
                "G-G3Q89BDFF9"

        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        let currentUser = null;


        // Check Firebase Login
        onAuthStateChanged(auth, async (user) => {

            if (user) {

                currentUser = user;

                document.getElementById("loginStatus").textContent =
                    "✅ Restaurant owner logged in";

                document.getElementById("saveBtn").disabled = false;

                console.log("Logged in UID:", user.uid);

                // Load existing restaurant profile
                await loadProfile();

            } else {

                currentUser = null;

                document.getElementById("loginStatus").textContent =
                    "❌ Please login first";

                document.getElementById("saveBtn").disabled = true;

                alert("Please login using the restaurant login page.");

                window.location.href = "index.html";

            }

        });


        // Save Restaurant Profile
        window.saveProfile = async function () {

            if (!currentUser) {

                alert("Restaurant owner is not logged in.");

                return;

            }


            const restaurantName =
                document
                .getElementById("restaurantName")
                .value
                .trim();


            const restaurantType =
                document
                .getElementById("restaurantType")
                .value;


            const address =
                document
                .getElementById("address")
                .value
                .trim();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const openingTime =
                document
                .getElementById("openingTime")
                .value;


            const closingTime =
                document
                .getElementById("closingTime")
                .value;


            // Validation
            if (restaurantName === "") {

                alert("Please enter restaurant name.");

                return;

            }


            if (restaurantType === "") {

                alert("Please select restaurant type.");

                return;

            }


            if (address === "") {

                alert("Please enter restaurant address.");

                return;

            }


            if (phone === "") {

                alert("Please enter contact number.");

                return;

            }


            if (openingTime === "") {

                alert("Please select opening time.");

                return;

            }


            if (closingTime === "") {

                alert("Please select closing time.");

                return;

            }


            // Restaurant ID = Firebase Authentication UID
            const restaurantId = currentUser.uid;


            const profileData = {

                restaurantName: restaurantName,

                restaurantType: restaurantType,

                address: address,

                phone: phone,

                openingTime: openingTime,

                closingTime: closingTime,

                ownerUid: restaurantId

            };


            try {

                await setDoc(

                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    ),

                    profileData,

                    { merge: true }

                );


                alert(
                    "✅ Restaurant profile saved to Firebase!"
                );


                console.log(
                    "Restaurant saved successfully."
                );

                console.log(
                    "Restaurant ID:",
                    restaurantId
                );


            } catch (error) {

                console.error(
                    "Firestore Error:",
                    error
                );


                alert(
                    "❌ Error saving profile:\n\n" +
                    error.message
                );

            }

        };


        // Load Existing Profile
        async function loadProfile() {

            if (!currentUser) {
                return;
            }


            const restaurantId =
                currentUser.uid;


            try {

                const profileRef =
                    doc(
                        db,
                        "restaurants",
                        restaurantId
                    );


                const profileSnapshot =
                    await getDoc(profileRef);


                if (profileSnapshot.exists()) {

                    const data =
                        profileSnapshot.data();


                    document.getElementById(
                        "restaurantName"
                    ).value =
                        data.restaurantName || "";


                    document.getElementById(
                        "restaurantType"
                    ).value =
                        data.restaurantType || "";


                    document.getElementById(
                        "address"
                    ).value =
                        data.address || "";


                    document.getElementById(
                        "phone"
                    ).value =
                        data.phone || "";


                    document.getElementById(
                        "openingTime"
                    ).value =
                        data.openingTime || "";


                    document.getElementById(
                        "closingTime"
                    ).value =
                        data.closingTime || "";


                    console.log(
                        "Existing profile loaded."
                    );

                }

            } catch (error) {

                console.error(
                    "Error loading profile:",
                    error
                );

            }

        }


        // Back to Dashboard
        window.goBack = function () {

            window.location.href =
                "dashboard.html";

        };

    </script>

</body>
</html>
